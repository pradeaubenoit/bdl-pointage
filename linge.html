<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Linge">
<title>BdL Linge — Pointage clients</title>
<style>
  :root {
    --fond: #E8EDF0;
    --encre: #1D2B34;
    --doux: #5B6B75;
    --carte: #FFFFFF;
    --accent: #0F6E8A;
    --ok: #2E7D4F;
    --alerte: #B3412B;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--fond);
    color: var(--encre);
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
    -webkit-user-select: none; user-select: none;
  }
  header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    display: flex; align-items: center; gap: 16px;
    padding: 14px 24px; background: var(--encre); color: #fff;
  }
  header h1 { margin: 0; font-size: 26px; font-weight: 700; flex: 1; }
  #retour {
    display: none; font-size: 22px; padding: 12px 22px; border: 0;
    border-radius: 10px; background: #fff; color: var(--encre); font-weight: 600;
  }
  #operateur {
    font-size: 18px; padding: 10px 16px; border: 1px solid #ffffff55;
    border-radius: 10px; background: transparent; color: #fff;
  }
  #jourBtn {
    font-size: 18px; padding: 10px 16px; border: 1px solid #ffffff55; border-radius: 10px;
    background: transparent; color: #fff; font-weight: 600;
  }
  #bandeauJour {
    display: none; padding: 14px 24px; background: #E8891A; color: #fff;
    font-size: 22px; font-weight: 800; text-align: center;
  }
  #fondJour {
    display: none; position: fixed; inset: 0; background: rgba(29,43,52,.5);
    align-items: center; justify-content: center; padding: 20px; z-index: 30;
  }
  #fondClient {
    display: none; position: fixed; inset: 0; background: rgba(29,43,52,.5);
    align-items: center; justify-content: center; padding: 20px; z-index: 30;
  }
  #panneauJour, .panneauClient { background: #fff; border-radius: 16px; width: 100%; max-width: 520px; max-height: 90vh; overflow: auto; padding: 18px; }
  #panneauJour h2, .panneauClient h2 { margin: 0 0 12px; font-size: 22px; }
  .choixJour {
    display: block; width: 100%; margin-bottom: 10px; padding: 18px; border-radius: 12px;
    border: 2px solid #C5D0D6; background: #fff; color: var(--encre); font-size: 22px; font-weight: 600; text-align: left;
  }
  .choixJour.actif { border-color: var(--accent); background: #E3EEF2; }
  #statut { font-size: 18px; padding: 8px 14px; border-radius: 10px; background: var(--ok); }
  #statut.attente { background: var(--alerte); }
  main { padding: 24px 24px 140px; }
  #etat { font-size: 20px; color: var(--doux); margin: 0 0 16px; }
  #etat.erreur { color: var(--alerte); font-weight: 600; }
  .grille {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  }
  .tuile {
    min-height: 110px; padding: 18px; border: 0; border-radius: 14px;
    background: var(--carte); color: var(--encre);
    font-size: 26px; font-weight: 700; text-align: left;
    border-left: 8px solid var(--accent);
  }
  .tuile:active { background: #D4E6EC; }
  .tuile { position: relative; }
  .retirer {
    position: absolute; top: 8px; right: 8px; width: 44px; height: 44px; border-radius: 10px;
    border: 0; background: #0000000d; color: var(--doux); font-size: 26px; line-height: 1;
  }
  .tuile.alave { background: #FBEFDF; border-left-color: #C26A12; }
  .tuile .badge-lave { display: inline-block; margin-top: 8px; font-size: 17px; font-weight: 700; color: #C26A12; }
  .vide-jour { grid-column: 1 / -1; font-size: 22px; color: var(--doux); margin: 4px 0 8px; }
  .tuile.ajout {
    background: transparent; border: 3px dashed #9DB3BC; border-left: 3px dashed #9DB3BC;
    color: var(--doux); font-weight: 600;
  }
  .ajout-article {
    width: 100%; min-height: 72px; margin-top: 4px; border: 3px dashed #9DB3BC; border-radius: 12px;
    background: transparent; color: var(--doux); font-size: 22px; font-weight: 600;
  }
  .article {
    display: flex; align-items: center; gap: 14px; min-height: 88px; padding: 10px 16px 10px 22px;
    background: var(--carte); border-radius: 12px; margin-bottom: 12px;
  }
  .article .nom { flex: 1; font-size: 24px; }
  .article .deja { margin-top: 4px; font-size: 17px; font-weight: 600; color: var(--accent); }
  .article .deja:empty { display: none; }
  .tuile .deja-tuile { display: block; margin-top: 8px; font-size: 17px; font-weight: 600; color: var(--doux); }
  .article.rempli { outline: 3px solid var(--accent); }
  .pm {
    width: 68px; height: 68px; border: 0; border-radius: 12px;
    background: var(--fond); color: var(--encre); font-size: 34px; font-weight: 700;
  }
  .pm:active { background: #CBD6DC; }
  .qte {
    width: 110px; height: 68px; text-align: center; font-size: 30px; font-weight: 700;
    border: 2px solid #C5D0D6; border-radius: 12px; color: var(--encre);
  }
  #barre {
    display: none; position: fixed; left: 0; right: 0; bottom: 0;
    padding: 16px 24px calc(16px + env(safe-area-inset-bottom, 0px));
    background: var(--carte); box-shadow: 0 -2px 12px rgba(29,43,52,.15);
  }
  .qte::-webkit-outer-spin-button, .qte::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .qte { -moz-appearance: textfield; appearance: textfield; }
  #valider {
    width: 100%; height: 84px; border: 0; border-radius: 14px;
    background: var(--accent); color: #fff; font-size: 30px; font-weight: 700;
  }
  #valider:disabled { background: #9DB3BC; }
  #toast {
    position: fixed; left: 50%; top: 110px; transform: translateX(-50%);
    padding: 18px 28px; border-radius: 14px; background: var(--ok); color: #fff;
    font-size: 22px; font-weight: 600; display: none; z-index: 10; max-width: 90%;
  }
  #toast.erreur { background: var(--alerte); }
</style>
</head>
<body>
<header>
  <button id="retour" onclick="afficherClients()">← Clients</button>
  <h1 id="titre">Choisir un client</h1>
  <button id="jourBtn" onclick="ouvrirJours()">Journée : …</button>
  <span id="statut">Tout est envoyé</span>
  <button id="operateur" onclick="changerOperateur()">Opérateur ?</button>
</header>
<div id="bandeauJour" onclick="choisirJour(null)"></div>
<div id="fondClient" onclick="if (event.target === this) fermerChoixClient()">
  <div class="panneauClient">
    <h2>Ajouter un client à cette journée</h2>
    <div id="listeClients"></div>
  </div>
</div>
<div id="fondJour" onclick="if (event.target === this) fermerJours()">
  <div id="panneauJour">
    <h2>Pour quelle journée ?</h2>
    <div id="listeJours"></div>
  </div>
</div>
<main>
  <div id="etat">Chargement du catalogue…</div>
  <div id="zone"></div>
</main>
<div id="barre"><button id="valider" onclick="valider()">Valider</button></div>
<div id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxxHYpmiuhfyoKgzPmAwDtuuyxNx-uOalpohNT7p6Zrl2BPFnOGd0P-Q7_iNHVSTQc/exec';
const CLE_FILE = 'linge_file';
const CLE_CAT  = 'linge_catalogue';
const CLE_OP   = 'linge_operateur';

let catalogue = [];
let clientCourant = null;
let quantites = {};
let envoiEnCours = false;

/* ---------- Stockage local (protégé) ---------- */
function lire(cle, defaut) {
  try { const v = localStorage.getItem(cle); return v ? JSON.parse(v) : defaut; }
  catch (e) { return defaut; }
}
function ecrire(cle, valeur) {
  try { localStorage.setItem(cle, JSON.stringify(valeur)); } catch (e) {}
}

/* ---------- Catalogue ---------- */
async function chargerCatalogue() {
  const etat = document.getElementById('etat');
  const enCache = lire(CLE_CAT, null);
  if (enCache && !catalogue.length) { catalogue = enCache; etat.textContent = ''; afficherClients(); }
  try {
    const rep = await fetch(API_URL + '?action=catalogue');
    const data = await rep.json();
    if (!data.ok) throw new Error(data.error || 'Réponse invalide');
    catalogue = data.catalogue;
    ecrire(CLE_CAT, catalogue);
    etat.className = ''; etat.textContent = '';
    if (!clientCourant) afficherClients();
  } catch (err) {
    if (!enCache) {
      etat.className = 'erreur';
      etat.textContent = 'Catalogue introuvable (' + err.message + '). Vérifie le réseau puis recharge la page.';
    }
  }
}

/* ---------- Écrans ---------- */
function afficherClients() {
  clientCourant = null; quantites = {};
  document.getElementById('titre').textContent = 'Choisir un client';
  document.getElementById('retour').style.display = 'none';
  document.getElementById('barre').style.display = 'none';
  const zone = document.getElementById('zone');
  zone.className = 'grille'; zone.innerHTML = '';
  const duJour = clientsDuJour();
  const liste = duJour || catalogue;
  if (duJour && !duJour.length) {
    const p = document.createElement('p');
    p.className = 'vide-jour';
    p.textContent = 'Aucun client prévu pour cette journée. Touchez « + Ajouter un client ».';
    zone.appendChild(p);
  }
  const laves = lavesDuJourAtelier();
  const aSaisir = c => laves.has(cleNom(c.client)) && totalJourClient(c.client) === 0;
  const tries = liste.slice().sort((a, b) => (aSaisir(b) - aSaisir(a)) || a.client.localeCompare(b.client, 'fr'));
  const nbASaisir = tries.filter(aSaisir).length;
  if (nbASaisir) document.getElementById('titre').textContent = 'Choisir un client — ' + nbASaisir + ' lavé' + (nbASaisir > 1 ? 's' : '') + ' à saisir';
  tries.forEach(c => {
    const b = document.createElement('button');
    b.className = 'tuile' + (aSaisir(c) ? ' alave' : '');
    b.innerHTML = '<span class="nom-tuile"></span><span class="deja-tuile"></span>';
    b.querySelector('.nom-tuile').textContent = c.client;
    const tot = totalJourClient(c.client);
    const etiquette = jourChoisi ? libelleJour(jourChoisi).charAt(0).toUpperCase() + libelleJour(jourChoisi).slice(1) : 'Aujourd\'hui';
    b.querySelector('.deja-tuile').textContent = tot ? etiquette + ' : ' + tot + ' pièce' + (tot > 1 ? 's' : '') : '';
    if (estAjoutManuel(c.client) && totalJourClient(c.client) === 0) {
      const x = document.createElement('span');
      x.className = 'retirer';
      x.textContent = '×';
      x.onclick = ev => { ev.stopPropagation(); retirerDuJour(c.client); };
      b.appendChild(x);
    }
    if (aSaisir(c)) {
      const badge = document.createElement('span');
      badge.className = 'badge-lave';
      badge.textContent = 'Lavé, à saisir';
      b.appendChild(badge);
    }
    b.onclick = () => afficherArticles(c);
    zone.appendChild(b);
  });
  if (duJour && duJour.length < catalogue.length) {
    const ajout = document.createElement('button');
    ajout.className = 'tuile ajout';
    ajout.textContent = '+ Ajouter un client';
    ajout.onclick = ouvrirChoixClient;
    zone.appendChild(ajout);
  }
  const nouveau = document.createElement('button');
  nouveau.className = 'tuile ajout';
  nouveau.textContent = '+ Nouveau client';
  nouveau.onclick = nouveauClient;
  zone.appendChild(nouveau);
}

function afficherArticles(c, garder) {
  clientCourant = c;
  if (!garder) quantites = {};
  document.getElementById('titre').textContent = c.client;
  document.getElementById('retour').style.display = 'block';
  document.getElementById('barre').style.display = 'block';
  const zone = document.getElementById('zone');
  zone.className = ''; zone.innerHTML = '';
  c.articles.forEach(a => {
    const ligne = document.createElement('div');
    ligne.className = 'article';
    ligne.innerHTML =
      '<div class="nom"><div class="lib"></div><div class="deja"></div></div>' +
      '<button class="pm moins">−</button>' +
      '<input class="qte" type="number" inputmode="numeric" min="0" placeholder="0">' +
      '<button class="pm plus">+</button>';
    ligne.querySelector('.lib').textContent = a;
    ligne.dataset.article = a;
    majDeja(ligne, c.client, a);
    const champ = ligne.querySelector('.qte');
    const maj = v => {
      v = Math.max(0, Math.floor(Number(v) || 0));
      quantites[a] = v;
      champ.value = v ? v : '';
      ligne.classList.toggle('rempli', v > 0);
      majBouton();
    };
    ligne.querySelector('.moins').onclick = () => maj((quantites[a] || 0) - 1);
    ligne.querySelector('.plus').onclick  = () => maj((quantites[a] || 0) + 1);
    champ.oninput = () => maj(champ.value);
    if (quantites[a]) maj(quantites[a]);
    zone.appendChild(ligne);
  });
  const ajout = document.createElement('button');
  ajout.className = 'ajout-article';
  ajout.textContent = '+ Ajouter un article';
  ajout.onclick = nouvelArticle;
  zone.appendChild(ajout);
  majBouton();  chargerJour();
}

function majBouton() {
  const n = Object.values(quantites).filter(q => q > 0).length;
  const b = document.getElementById('valider');
  b.disabled = n === 0;
  b.textContent = n ? 'Valider (' + n + ' article' + (n > 1 ? 's' : '') + ')' : 'Valider';
}

/* ---------- Opérateur ---------- */
function afficherOperateur() {
  const op = lire(CLE_OP, '');
  document.getElementById('operateur').textContent = op ? op : 'Opérateur ?';
}
function changerOperateur() {
  const nom = prompt('Prénom de la personne qui saisit :', lire(CLE_OP, ''));
  if (nom !== null && nom.trim()) { ecrire(CLE_OP, nom.trim()); afficherOperateur(); }
  return lire(CLE_OP, '');
}

/* ---------- Ajout au catalogue (protégé par code) ---------- */
let codeResponsable = '';

function demanderCode() {
  if (codeResponsable) return codeResponsable;
  const c = prompt('Code responsable :');
  if (c && c.trim()) codeResponsable = c.trim();
  return codeResponsable;
}

async function envoyerAjout(client, article) {
  const code = demanderCode();
  if (!code) return false;
  try {
    const rep = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'ajouterCatalogue', code: code, client: client, article: article })
    });
    const data = await rep.json();
    if (!data.ok) {
      if (data.error === 'Code incorrect') codeResponsable = '';
      toast(data.error || 'Ajout refusé', true);
      return false;
    }
    toast('Ajouté : ' + data.client + ' — ' + data.article);
    await chargerCatalogue();
    return data.client;
  } catch (err) {
    toast('Ajout impossible sans réseau. Réessaie quand le voyant est vert.', true);
    return false;
  }
}

async function nouveauClient() {
  const client = prompt('Nom du nouveau client :');
  if (!client || !client.trim()) return;
  const article = prompt('Premier article pour ' + client.trim() + ' :');
  if (!article || !article.trim()) return;
  const nom = await envoyerAjout(client, article);
  if (nom) {
    ajouterClientAuJour(nom);
    const c = catalogue.find(x => x.client === nom);
    if (c) afficherArticles(c);
  }
}

async function nouvelArticle() {
  if (!clientCourant) return;
  const article = prompt('Nouvel article pour ' + clientCourant.client + ' :');
  if (!article || !article.trim()) return;
  const nom = await envoyerAjout(clientCourant.client, article);
  if (nom) {
    const c = catalogue.find(x => x.client === nom);
    if (c) afficherArticles(c, true);
  }
}

/* ---------- Détail des saisies du jour ---------- */
const CLE_JOUR = 'linge_jour2';
let jourRecap = lire(CLE_JOUR, { date: '', saisies: [] });

function isoLocal(d) {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function heureLocale(d) {
  const p = n => String(n).padStart(2, '0');
  return p(d.getHours()) + ':' + p(d.getMinutes());
}

/* ---------- Journée choisie (null = aujourd'hui) ---------- */
let jourChoisi = null;
const NOMS_J = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];

function jourCourant() { return jourChoisi || isoLocal(new Date()); }
function dateDe(iso) { const [a, m, j] = iso.split('-').map(Number); return new Date(a, m - 1, j, 12); }
function libelleJour(iso) {
  const d = dateDe(iso);
  const p = n => String(n).padStart(2, '0');
  return NOMS_J[d.getDay()] + ' ' + p(d.getDate()) + '/' + p(d.getMonth() + 1);
}
function majJourAffiche() {
  const auj = isoLocal(new Date());
  const iso = jourCourant();
  const lib = libelleJour(iso);
  document.getElementById('jourBtn').textContent = 'Journée : ' + (iso === auj ? 'aujourd\'hui' : lib);
  const b = document.getElementById('bandeauJour');
  if (iso !== auj) {
    b.textContent = 'Saisie pour ' + lib.toUpperCase() + ' — toucher ici pour revenir à aujourd\'hui';
    b.style.display = 'block';
  } else {
    b.style.display = 'none';
  }
}
function ouvrirJours() {
  const liste = document.getElementById('listeJours');
  liste.innerHTML = '';
  const auj = new Date();
  for (let i = -2; i <= 7; i++) {
    const d = new Date(auj.getFullYear(), auj.getMonth(), auj.getDate() + i, 12);
    const iso = isoLocal(d);
    const b = document.createElement('button');
    b.className = 'choixJour' + (iso === jourCourant() ? ' actif' : '');
    let lib = libelleJour(iso);
    lib = lib.charAt(0).toUpperCase() + lib.slice(1);
    if (i === 0) lib += ' (aujourd\'hui)';
    if (i === 1) lib += ' (demain)';
    if (i === -1) lib += ' (hier)';
    b.textContent = lib;
    b.onclick = () => { choisirJour(i === 0 ? null : iso); fermerJours(); };
    liste.appendChild(b);
  }
  document.getElementById('fondJour').style.display = 'flex';
}
function fermerJours() { document.getElementById('fondJour').style.display = 'none'; }
function choisirJour(iso) {
  jourChoisi = iso;
  majJourAffiche();
  jourRecap = { date: '', saisies: [] };
  if (clientCourant) afficherArticles(clientCourant, true); else afficherClients();
  chargerJour();
  chargerListeJour();
}
function jourDeLigne(l) { return l.date || isoLocal(new Date(l.horodatage)); }

/* ---------- Clients prévus pour la journée ---------- */
const CLE_LISTES = 'linge_listes_jour';
const CLE_AJOUTS = 'linge_ajouts_jour';
function cleNom(s) { return String(s || '').trim().replace(/\s+/g, ' ').toLowerCase(); }

// Journée type + clients saisis ou créés ce jour (fourni par le serveur), mis en cache.
async function chargerListeJour() {
  const date = jourCourant();
  try {
    const rep = await fetch(API_URL + '?action=tableau&mode=jour&periode=' + date);
    const data = await rep.json();
    if (!data.ok || date !== jourCourant()) return;
    const listes = lire(CLE_LISTES, {});
    listes[date] = { noms: data.clients.map(c => c.client), laves: data.clients.filter(c => c.lave).map(c => c.client) };
    Object.keys(listes).forEach(d => { if (d < isoLocal(new Date(Date.now() - 7 * 864e5))) delete listes[d]; });
    ecrire(CLE_LISTES, listes);
    if (!clientCourant) afficherClients();
  } catch (e) {}
}

// null = liste inconnue (hors-ligne sans cache) : on montre tout le catalogue.
function clientsDuJour() {
  const date = jourCourant();
  const listes = lire(CLE_LISTES, {});
  if (!listes[date]) return null;
  const noms = new Set((Array.isArray(listes[date]) ? listes[date] : listes[date].noms).map(cleNom));
  (lire(CLE_AJOUTS, {})[date] || []).forEach(n => noms.add(cleNom(n)));
  lire(CLE_FILE, []).forEach(l => { if (jourDeLigne(l) === date) noms.add(cleNom(l.client)); });
  return catalogue.filter(c => noms.has(cleNom(c.client)));
}

function lavesDuJourAtelier() {
  const l = lire(CLE_LISTES, {})[jourCourant()];
  return new Set(l && !Array.isArray(l) ? l.laves.map(cleNom) : []);
}

// Ajouté à la main sur cet appareil, et pas fourni par le serveur (journée type, lavé, saisi, créé).
function estAjoutManuel(nom) {
  const date = jourCourant();
  const ajouts = lire(CLE_AJOUTS, {})[date] || [];
  if (!ajouts.some(n => cleNom(n) === cleNom(nom))) return false;
  const l = lire(CLE_LISTES, {})[date];
  const serveur = l ? (Array.isArray(l) ? l : l.noms) : [];
  return !serveur.some(n => cleNom(n) === cleNom(nom));
}

async function retirerDuJour(nom) {
  const code = demanderCode();
  if (!code) return;
  try {
    const rep = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'verifierCode', code: code }) });
    const data = await rep.json();
    if (!data.ok) { codeResponsable = ''; toast(data.error || 'Code incorrect', true); return; }
  } catch (e) {
    toast('Vérification impossible sans réseau.', true);
    return;
  }
  const date = jourCourant();
  const ajouts = lire(CLE_AJOUTS, {});
  ajouts[date] = (ajouts[date] || []).filter(n => cleNom(n) !== cleNom(nom));
  ecrire(CLE_AJOUTS, ajouts);
  toast(nom + ' retiré de la journée');
  afficherClients();
}

function ajouterClientAuJour(nom) {
  const date = jourCourant();
  const ajouts = lire(CLE_AJOUTS, {});
  ajouts[date] = ajouts[date] || [];
  if (!ajouts[date].some(n => cleNom(n) === cleNom(nom))) ajouts[date].push(nom);
  ecrire(CLE_AJOUTS, ajouts);
}

function ouvrirChoixClient() {
  const presents = new Set((clientsDuJour() || []).map(c => cleNom(c.client)));
  const liste = document.getElementById('listeClients');
  liste.innerHTML = '';
  catalogue.filter(c => !presents.has(cleNom(c.client))).forEach(c => {
    const b = document.createElement('button');
    b.className = 'choixJour';
    b.textContent = c.client;
    b.onclick = () => { fermerChoixClient(); ajouterClientAuJour(c.client); afficherArticles(c); };
    liste.appendChild(b);
  });
  document.getElementById('fondClient').style.display = 'flex';
}
function fermerChoixClient() { document.getElementById('fondClient').style.display = 'none'; }

async function chargerJour() {
  const date = jourCourant();
  try {
    const rep = await fetch(API_URL + '?action=detailJour&date=' + date);
    const data = await rep.json();
    if (!data.ok || date !== jourCourant()) return;
    jourRecap = { date: date, saisies: data.saisies || [] };
    ecrire(CLE_JOUR, jourRecap);
    rafraichirDeja();
  } catch (e) {}
}

// Ajoute localement une ligne qui vient d'être envoyée, en attendant le prochain rechargement.
function ajouterAuJour(l) {
  const d = new Date(l.horodatage);
  const date = jourCourant();
  if (jourDeLigne(l) !== date) return;
  if (jourRecap.date !== date) return;
  jourRecap.saisies.push({ client: l.client, article: l.article, quantite: Number(l.quantite || 0), heure: heureLocale(d) });
  ecrire(CLE_JOUR, jourRecap);
}

// Toutes les saisies du jour pour un client et un article : envoyées + en attente d'envoi.
function entreesJour(client, article) {
  const date = jourCourant();
  const liste = [];
  if (jourRecap.date === date) {
    jourRecap.saisies.forEach(x => {
      if (x.client === client && x.article === article) liste.push({ q: x.quantite, h: x.heure, attente: false });
    });
  }
  lire(CLE_FILE, []).forEach(l => {
    const d = new Date(l.horodatage);
    if (l.client === client && l.article === article && jourDeLigne(l) === date) {
      liste.push({ q: Number(l.quantite || 0), h: heureLocale(d), attente: true });
    }
  });
  return liste.sort((a, b) => a.h.localeCompare(b.h));
}

function dejaSaisi(client, article) {
  return entreesJour(client, article).reduce((t, x) => t + x.q, 0);
}

function totalJourClient(client) {
  const c = catalogue.find(x => x.client === client);
  if (!c) return 0;
  return c.articles.reduce((t, a) => t + dejaSaisi(client, a), 0);
}

function majDeja(ligne, client, article) {
  const e = entreesJour(client, article);
  if (!e.length) { ligne.querySelector('.deja').textContent = ''; return; }
  const total = e.reduce((t, x) => t + x.q, 0);
  const morceaux = e.map(x => x.q + ' (' + x.h + (x.attente ? ', en attente' : '') + ')');
  ligne.querySelector('.deja').textContent =
    'Déjà saisi : ' + morceaux.join(' + ') + (e.length > 1 ? ' = ' + total : '');
}

function rafraichirDeja() {
  if (clientCourant) {
    document.querySelectorAll('.article').forEach(l => majDeja(l, clientCourant.client, l.dataset.article));
  } else if (catalogue.length) {
    afficherClients();
  }
}

/* ---------- Validation : file locale puis envoi ---------- */
function nouvelId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

function valider() {
  let op = lire(CLE_OP, '');
  if (!op) op = changerOperateur();
  if (!op) return;
  const maintenant = new Date().toISOString();
  const lignes = Object.entries(quantites)
    .filter(([, q]) => q > 0)
    .map(([article, quantite]) => ({
      id: nouvelId(), horodatage: maintenant, date: jourCourant(),
      client: clientCourant.client, article, quantite, operateur: op
    }));
  if (!lignes.length) return;
  ecrire(CLE_FILE, lire(CLE_FILE, []).concat(lignes));
  toast('Enregistré : ' + clientCourant.client + ', ' + lignes.length + ' article' + (lignes.length > 1 ? 's' : '') +
    (jourChoisi ? ' — pour ' + libelleJour(jourChoisi) : ''));
  afficherClients();
  majStatut();
  envoyer();
}

async function envoyer() {
  if (envoiEnCours) return;
  const file = lire(CLE_FILE, []);
  if (!file.length) { majStatut(); return; }
  envoiEnCours = true;
  const op = file[0].operateur;
  const lot = file.filter(l => l.operateur === op).slice(0, 50);
  try {
    const rep = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'saisir', operateur: op, lignes: lot })
    });
    const data = await rep.json();
    if (!data.ok) throw new Error(data.error || 'Refus du serveur');
    const envoyes = new Set(lot.map(l => l.id));
    ecrire(CLE_FILE, lire(CLE_FILE, []).filter(l => !envoyes.has(l.id)));
    lot.forEach(l => ajouterAuJour(l));
    envoiEnCours = false;
    majStatut();
    if (lire(CLE_FILE, []).length) envoyer();
  } catch (err) {
    envoiEnCours = false;
    majStatut();
  }
}

function majStatut() {
  const n = lire(CLE_FILE, []).length;
  const s = document.getElementById('statut');
  s.className = n ? 'attente' : '';
  s.textContent = n ? n + ' en attente d\'envoi' : 'Tout est envoyé';
}

function toast(msg, erreur) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = erreur ? 'erreur' : '';
  t.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.style.display = 'none'; }, 2500);
}

/* ---------- Écran toujours allumé (si l'appareil le permet) ---------- */
let verrouEcran = null;
async function garderEcranAllume() {
  try {
    if ('wakeLock' in navigator && !document.hidden) {
      verrouEcran = await navigator.wakeLock.request('screen');
    }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) garderEcranAllume(); });
garderEcranAllume();

/* ---------- Catalogue rafraîchi toutes les 10 minutes ---------- */
setInterval(chargerCatalogue, 10 * 60 * 1000);
setInterval(chargerJour, 2 * 60 * 1000);
setInterval(chargerListeJour, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { majJourAffiche(); chargerJour(); chargerListeJour(); } });

/* ---------- Relances automatiques ---------- */
setInterval(envoyer, 30000);
window.addEventListener('online', envoyer);
document.addEventListener('visibilitychange', () => { if (!document.hidden) envoyer(); });

afficherOperateur();
majJourAffiche();
chargerJour();
chargerListeJour();
majStatut();
chargerCatalogue();
envoyer();
</script>

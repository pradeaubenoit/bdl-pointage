<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Linge">
<title>BdL Linge — Pointage clients</title>
<style>
  :root {
    --fond: #E8EDF0;
    --encre: #1D2B34;
    --doux: #5B6B75;
    --carte: #FFFFFF;
    --accent: #0F6E8A;
    --ok: #2E7D4F;
    --alerte: #B3412B;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--fond);
    color: var(--encre);
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
    -webkit-user-select: none; user-select: none;
  }
  header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    display: flex; align-items: center; gap: 16px;
    padding: 14px 24px; background: var(--encre); color: #fff;
  }
  header h1 { margin: 0; font-size: 26px; font-weight: 700; flex: 1; }
  #retour {
    display: none; font-size: 22px; padding: 12px 22px; border: 0;
    border-radius: 10px; background: #fff; color: var(--encre); font-weight: 600;
  }
  #operateur {
    font-size: 18px; padding: 10px 16px; border: 1px solid #ffffff55;
    border-radius: 10px; background: transparent; color: #fff;
  }
  #jourBtn {
    font-size: 18px; padding: 10px 16px; border: 1px solid #ffffff55; border-radius: 10px;
    background: transparent; color: #fff; font-weight: 600;
  }
  #bandeauJour {
    display: none; padding: 14px 24px; background: #E8891A; color: #fff;
    font-size: 22px; font-weight: 800; text-align: center;
  }
  #fondJour {
    display: none; position: fixed; inset: 0; background: rgba(29,43,52,.5);
    align-items: center; justify-content: center; padding: 20px; z-index: 30;
  }
  #fondClient {
    display: none; position: fixed; inset: 0; background: rgba(29,43,52,.5);
    align-items: center; justify-content: center; padding: 20px; z-index: 30;
  }
  #panneauJour, .panneauClient { background: #fff; border-radius: 16px; width: 100%; max-width: 520px; max-height: 90vh; overflow: auto; padding: 18px; }
  #panneauJour h2, .panneauClient h2 { margin: 0 0 12px; font-size: 22px; }
  .choixJour {
    display: block; width: 100%; margin-bottom: 10px; padding: 18px; border-radius: 12px;
    border: 2px solid #C5D0D6; background: #fff; color: var(--encre); font-size: 22px; font-weight: 600; text-align: left;
  }
  .choixJour.actif { border-color: var(--accent); background: #E3EEF2; }
  #statut { font-size: 18px; padding: 8px 14px; border-radius: 10px; background: var(--ok); }
  #statut.attente { background: var(--alerte); }
  main { padding: 24px 24px 140px; }
  #etat { font-size: 20px; color: var(--doux); margin: 0 0 16px; }
  #etat.erreur { color: var(--alerte); font-weight: 600; }
  .grille {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  }
  .tuile {
    min-height: 110px; padding: 18px; border: 0; border-radius: 14px;
    background: var(--carte); color: var(--encre);
    font-size: 26px; font-weight: 700; text-align: left;
    border-left: 8px solid var(--accent);
  }
  .tuile.ajout { border-left-width: 3px; }
  .tuile:active { background: #D4E6EC; }
  /* Gris = prévu, rien de lavé ni saisi. Bleu = déjà saisi. */
  .tuile.attente { background: #F1F3F4; color: #6B7A83; border-left-color: #B8C2C8; }
  .tuile.saisi { border-left-color: var(--accent); }
  .tuile { position: relative; }
  .retirer {
    position: absolute; top: 8px; right: 8px; width: 44px; height: 44px; border-radius: 10px;
    border: 0; background: #0000000d; color: var(--doux); font-size: 26px; line-height: 1;
  }
  .tuile.alave { background: #FBEFDF; border-left-color: #C26A12; }
  .tuile .badge-lave { display: inline-block; margin-top: 8px; font-size: 17px; font-weight: 700; color: #C26A12; }
  .tuile .sortie { display: block; margin-top: 6px; font-size: 17px; font-weight: 600; color: var(--doux); }
  .tuile.alave .sortie { color: #8A4A0C; font-size: 19px; font-weight: 800; }
  .tuile.pret { background: #FBEAF2; border-left-color: #C2578F; }
  .tuile.partiel { background: #FDF3E7; border-left-color: #C26A12; }
  .mini-termine { display: block; margin-top: 6px; font-size: 15px; font-weight: 800; color: #B23A77; }
  .tuile.partiel .mini-termine { color: #8A4A0C; }
  .tuile .bascule {
    display: block; margin-top: 12px; padding: 10px 12px; border-radius: 10px;
    border: 2px solid #C26A12; background: #fff; color: #8A4A0C;
    font-size: 17px; font-weight: 700; text-align: center;
  }
  .tuile.reporte { background: #EEEAF7; border-left-color: #6B4FA8; }
  .tuile.reporte .bascule { border-color: #6B4FA8; background: #6B4FA8; color: #fff; }
  .tuile .badge-report { display: inline-block; margin-top: 8px; font-size: 17px; font-weight: 700; color: #6B4FA8; }
  .avis-lecture { margin: 0 0 16px; padding: 14px 18px; border-radius: 12px; background: #FBEFDF; color: #8A4A0C; font-size: 19px; font-weight: 700; }
  #recherche { grid-column: 1 / -1; width: 100%; padding: 16px 18px; font-size: 22px; border: 2px solid #C5D0D6; border-radius: 12px; background: #fff; color: var(--encre); -webkit-user-select: text; user-select: text; }
  .vide-jour { grid-column: 1 / -1; font-size: 22px; color: var(--doux); margin: 4px 0 8px; }
  .tuile.ajout {
    background: transparent; border: 3px dashed #9DB3BC; border-left: 3px dashed #9DB3BC;
    color: var(--doux); font-weight: 600;
  }
  .ajout-article {
    width: 100%; min-height: 72px; margin-top: 4px; border: 3px dashed #9DB3BC; border-radius: 12px;
    background: transparent; color: var(--doux); font-size: 22px; font-weight: 600;
  }
  .article {
    display: flex; align-items: center; gap: 14px; min-height: 88px; padding: 10px 16px 10px 22px;
    background: var(--carte); border-radius: 12px; margin-bottom: 12px;
  }
  .article .nom { flex: 1; font-size: 24px; }
  .article .deja { margin-top: 4px; font-size: 17px; font-weight: 600; color: var(--accent); }
  .article .deja:empty { display: none; }
  .tuile .deja-tuile { display: block; margin-top: 8px; font-size: 17px; font-weight: 600; color: var(--doux); }
  .article.rempli { outline: 3px solid var(--accent); }
  .pm {
    width: 68px; height: 68px; border: 0; border-radius: 12px;
    background: var(--fond); color: var(--encre); font-size: 34px; font-weight: 700;
  }
  .pm:active { background: #CBD6DC; }
  .qte {
    width: 110px; height: 68px; text-align: center; font-size: 30px; font-weight: 700;
    border: 2px solid #C5D0D6; border-radius: 12px; color: var(--encre);
  }
  #barre {
    display: none; position: fixed; left: 0; right: 0; bottom: 0;
    padding: 16px 24px calc(16px + env(safe-area-inset-bottom, 0px));
    background: var(--carte); box-shadow: 0 -2px 12px rgba(29,43,52,.15);
  }
  .qte::-webkit-outer-spin-button, .qte::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .qte { -moz-appearance: textfield; appearance: textfield; }
  #valider {
    width: 100%; height: 84px; border: 0; border-radius: 14px;
    background: var(--accent); color: #fff; font-size: 30px; font-weight: 700;
  }
  #valider:disabled { background: #9DB3BC; }
  #termine {
    width: 100%; height: 60px; border: 2px solid #2F6FB3; border-radius: 14px;
    background: #EAF2FB; color: #2F6FB3; font-size: 21px; font-weight: 700; margin-bottom: 10px;
  }
  #termine.fini { background: #F6E0EC; border-color: #C2578F; color: #B23A77; }
  #toast {
    position: fixed; left: 50%; top: 110px; transform: translateX(-50%);
    padding: 18px 28px; border-radius: 14px; background: var(--ok); color: #fff;
    font-size: 22px; font-weight: 600; display: none; z-index: 300; max-width: 90%;
  }
  #toast.erreur { background: var(--alerte); }
  /* Messages du bureau : écran bloquant tant que ce n'est pas traité */
  #fondMsg { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(120,20,20,.92);
    align-items: center; justify-content: center; padding: 24px; }
  #panneauMsg { background: #fff; border-radius: 18px; width: 100%; max-width: 760px; max-height: 92vh; overflow: auto; padding: 22px 26px; }
  #panneauMsg h2 { margin: 0 0 6px; font-size: 30px; color: #8a1a12; }
  #panneauMsg .sous { color: #555; font-size: 18px; margin-bottom: 14px; }
  .msg { border: 2px solid #e5c7c4; border-radius: 14px; padding: 16px 18px; margin: 12px 0; }
  .msg .tete { font-size: 17px; color: #8a1a12; font-weight: 700; margin-bottom: 6px; }
  .msg .txt { font-size: 24px; margin-bottom: 14px; white-space: pre-wrap; }
  .msg .bts { display: flex; gap: 10px; flex-wrap: wrap; }
  .msg button { font-size: 20px; padding: 14px 18px; border-radius: 12px; border: 2px solid #8a1a12; background: #fff; color: #8a1a12; font-weight: 700; }
  .msg button.plein { background: #2e7d32; border-color: #2e7d32; color: #fff; }
  #bandeauCorr { display: none; background: #8a1a12; color: #fff;
    padding: 14px 18px; font-size: 20px; font-weight: 700; align-items: center; gap: 14px; justify-content: space-between; }
  #bandeauCorr button { font-size: 20px; padding: 12px 18px; border: 0; border-radius: 12px; background: #2e7d32; color: #fff; font-weight: 700; }
</style>
</head>
<body>
<header>
  <button id="retour" onclick="afficherClients()">← Clients</button>
  <h1 id="titre">Choisir un client</h1>
  <button id="jourBtn" onclick="ouvrirJours()">Journée : …</button>
  <span id="statut">Tout est envoyé</span>
  <button id="operateur" onclick="changerOperateur()">Opérateur ?</button>
  <button id="tablette" onclick="changerTablette()">Tablette ?</button>
</header>
<div id="bandeauJour" onclick="choisirJour(null)"></div>
<div id="bandeauCorr"><span id="txtCorr"></span><button onclick="corrigeFini()">✓ C'est corrigé</button></div>
<div id="fondClient" onclick="if (event.target === this) fermerChoixClient()">
  <div class="panneauClient">
    <h2>Ajouter un client à cette journée</h2>
    <div id="listeClients"></div>
  </div>
</div>
<div id="fondJour" onclick="if (event.target === this) fermerJours()">
  <div id="panneauJour">
    <h2>Pour quelle journée ?</h2>
    <div id="listeJours"></div>
  </div>
</div>
<main>
  <div id="etat">Chargement du catalogue…</div>
  <div id="zone"></div>
</main>
<div id="barre"><button id="termine" onclick="basculerTermine()">✓ Marquer ma partie terminée</button><button id="valider" onclick="valider()">Valider</button></div>
<div id="toast"></div>
<div id="fondMsg"><div id="panneauMsg">
  <h2>⚠ Message du bureau</h2>
  <div class="sous">À traiter avant de continuer la saisie.</div>
  <div id="listeMsg"></div>
</div></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxxHYpmiuhfyoKgzPmAwDtuuyxNx-uOalpohNT7p6Zrl2BPFnOGd0P-Q7_iNHVSTQc/exec';
const CLE_FILE = 'linge_file';
const CLE_CAT  = 'linge_catalogue';
const CLE_OP   = 'linge_operateur';

let catalogue = [];
let clientCourant = null;
let quantites = {};
let envoiEnCours = false;

/* ---------- Stockage local (protégé) ---------- */
function lire(cle, defaut) {
  try { const v = localStorage.getItem(cle); return v ? JSON.parse(v) : defaut; }
  catch (e) { return defaut; }
}
function ecrire(cle, valeur) {
  try { localStorage.setItem(cle, JSON.stringify(valeur)); } catch (e) {}
}

/* ---------- Catalogue ---------- */
async function chargerCatalogue() {
  const etat = document.getElementById('etat');
  const enCache = lire(CLE_CAT, null);
  if (enCache && !catalogue.length) { catalogue = enCache; etat.textContent = ''; afficherClients(); }
  try {
    const rep = await fetch(API_URL + '?action=catalogue');
    const data = await rep.json();
    if (!data.ok) throw new Error(data.error || 'Réponse invalide');
    catalogue = data.catalogue;
    ecrire(CLE_CAT, catalogue);
    etat.className = ''; etat.textContent = '';
    if (!clientCourant) afficherClients();
  } catch (err) {
    if (!enCache) {
      etat.className = 'erreur';
      etat.textContent = 'Catalogue introuvable (' + err.message + '). Vérifie le réseau puis recharge la page.';
    }
  }
}

/* ---------- Écrans ---------- */
function afficherClients() {
  if (finReport()) return;
  clientCourant = null; quantites = {};
  document.getElementById('titre').textContent = 'Choisir un client';
  document.getElementById('retour').style.display = 'none';
  document.getElementById('barre').style.display = 'none';
  const zone = document.getElementById('zone');
  zone.className = 'grille'; zone.innerHTML = '';
  // Recherche : filtre les tuiles par nom (sans tenir compte des accents ni des majuscules).
  const champR = document.createElement('input');
  champR.type = 'search'; champR.id = 'recherche'; champR.placeholder = '🔍 Rechercher un client…';
  champR.value = recherche;
  champR.oninput = () => { recherche = champR.value; filtrerTuiles(); };
  zone.appendChild(champR);
  const duJour = clientsDuJour();
  const liste = duJour || catalogue;
  if (duJour && !duJour.length) {
    const p = document.createElement('p');
    p.className = 'vide-jour';
    p.textContent = 'Aucun client prévu pour cette journée. Touchez « + Ajouter un client ».';
    zone.appendChild(p);
  }
  lotFiltre = null;
  const laves = lavesDuJourAtelier();
  const laveVide = c => laves.has(cleNom(c.client)) && totalJourClient(c.client) === 0;
  // Journée terminée : ce qui n'a pas été saisi n'est plus « à saisir » (gris si rien, bleu si saisi).
  const journeeFinie = jourCourant() < isoLocal(new Date());
  const sorties = sortiesDuJour();
  const suites = listeCache().suites || {};
  const etiquette = jourChoisi ? libelleJour(jourChoisi).charAt(0).toUpperCase() + libelleJour(jourChoisi).slice(1) : 'Aujourd\'hui';

  // Une tuile par client ; deux si le client a été relavé (2ᵉ livraison) après l'heure de bascule.
  const items = [];
  liste.forEach(c => {
    const L = lot2De(c.client);
    if (!L) {
      // Saisi sur le jour suivant après son lavage (bouton oublié, ou correction dans le tableur) : violet automatique.
      const auto = !reportDe(c.client) && laveVide(c) && dejaSaisiLendemain(c.client);
      const cible = reportDe(c.client) || (auto ? (((listeCache().suitesDate || {})[cleNom(c.client)]) || lendemain(jourCourant())) : null);
      const orange = !journeeFinie && laveVide(c) && !cible;
      items.push({ c, lot: 0, cible, auto, orange, tot: totalJourClient(c.client, null) });
    } else {
      const avant = { mode: 'avant', cut: L.limite || L.depuis }, apres = { mode: 'apres', cut: L.limite || L.depuis, fin: L.l3 ? L.l3.limite : null };
      items.push({ c, lot: 1, cible: null, orange: false, tot: totalJourClient(c.client, avant) });
      const tot2 = totalJourClient(c.client, apres);
      const dejaDemain = (suites[cleNom(c.client)] || '') > jourCourant() + ' ' + hhmmSec(L.depuis);
      const auto = !reportDe(c.client) && tot2 === 0 && dejaDemain;
      const cible = reportDe(c.client) || (auto ? (((listeCache().suitesDate || {})[cleNom(c.client)]) || lendemain(jourCourant())) : null);
      const orange = !journeeFinie && tot2 === 0 && !cible;
      items.push({ c, lot: 2, cible, auto, orange, tot: tot2, filtre: apres, depuis: hhmmSec(L.depuis) });
      if (L.l3) {
        const apres3 = { mode: 'apres', cut: L.l3.limite };
        const tot3 = totalJourClient(c.client, apres3);
        const cible3 = L.l3.reporte || null;
        items.push({ c, lot: 3, cible: cible3, auto: false, orange: !journeeFinie && tot3 === 0 && !cible3, tot: tot3, filtre: apres3, depuis: hhmmSec(L.l3.depuis) });
      }
    }
  });
  // Livraison suivante : linge lavé aujourd'hui mais marqué dans le plan pour la prochaine livraison (ex. peignoirs du samedi pour lundi).
  Object.keys(listeCache().suivants || {}).forEach(k => {
    const S = listeCache().suivants[k];
    const c = liste.find(x => cleNom(x.client) === k) || catalogue.find(x => cleNom(x.client) === k);
    if (!c || !S || !S.date) return;
    // Pas encore de jour choisi : orange, il faut répondre « Livré le… ? » (on n'impose plus le jour suivant).
    // Coupée en deux (✂) : une tuile par jour de livraison (2ᵉ, 3ᵉ livraison).
    const jours = S.choisi ? (S.dates && S.dates.length ? S.dates : [S.date]) : [null];
    jours.forEach((j, idx) => {
      const n = j ? ((S.dejaPar && S.dejaPar[j] != null) ? S.dejaPar[j] : (idx === 0 ? (S.deja || 0) : 0)) : 0;
      items.push({ c, lot: 0, suiv: S, suivJour: j, suivIdx: idx, suivNb: jours.length, cible: null, orange: !journeeFinie && (!j || !(n > 0)), tot: n });
    });
  });
  // Rappels : 2ᵉ / 3ᵉ livraisons d'hier soir pas encore saisies (à saisir sur aujourd'hui).
  if (!journeeFinie && jourCourant() === isoLocal(new Date())) {
    (listeCache().rappels || []).forEach(r => {
      const c = catalogue.find(x => cleNom(x.client) === cleNom(r.client));
      if (!c) return;
      if (totalJourClient(c.client, null) > 0) return;   // saisi aujourd'hui : c'est fait
      // Même client relavé hier soir ET lavé ce matin : c'est UNE livraison -> une seule tuile, une seule saisie
      const ex = items.find(it => it.lot === 0 && !it.suiv && !it.rappel && cleNom(it.c.client) === cleNom(c.client));
      if (ex) { ex.rappelAussi = r; ex.orange = true; return; }
      items.push({ c, lot: 0, rappel: r, cible: null, orange: true, tot: 0 });
    });
  }
  const premiere = it => ((sorties[cleNom(it.c.client)] || [])[0]) || '99:99';
  items.sort((a, b) => (b.orange - a.orange)
    || (a.orange && b.orange ? premiere(a).localeCompare(premiere(b)) : 0)
    || a.c.client.localeCompare(b.c.client, 'fr') || a.lot - b.lot);
  const nbASaisir = items.filter(it => it.orange).length;
  if (nbASaisir) document.getElementById('titre').textContent = 'Choisir un client — ' + nbASaisir + ' lavé' + (nbASaisir > 1 ? 's' : '') + ' à saisir';

  items.forEach(it => {
    const c = it.c, cible = it.cible, tot = it.tot;
    const b = document.createElement('button');
    const etat = it.orange || cible ? '' : (tot > 0 ? ' saisi' : ' attente');
    b.className = 'tuile' + (it.orange ? ' alave' : '') + (cible ? ' reporte' : '') + etat;
    b.innerHTML = '<span class="nom-tuile"></span><span class="deja-tuile"></span>';
    b.querySelector('.nom-tuile').textContent = c.client + (it.lot === 2 ? ' — 2ᵉ livraison' : it.lot === 3 ? ' — 3ᵉ livraison' : '');
    b.querySelector('.deja-tuile').textContent = tot ? etiquette + ' : ' + tot + ' pièce' + (tot > 1 ? 's' : '') : '';
    if (it.suiv) {
      // 📦 « livraison suivante » du Plan : une 2ᵉ livraison dont on choisit le jour (« Livré le… ? »).
      const S = it.suiv, jour = it.suivJour, choisi = !!jour, lib = choisi ? libelleJour(jour) : '';
      b.className = 'tuile ' + (choisi ? 'reporte' : 'alave');
      b.querySelector('.nom-tuile').textContent = c.client + ' — ' + (it.suivIdx + 2) + 'ᵉ livraison' + (it.suivNb > 1 ? ' (' + lib + ')' : '');
      b.querySelector('.deja-tuile').textContent = choisi && it.tot ? 'Saisi sur ' + lib + ' : ' + it.tot + ' pièce' + (it.tot > 1 ? 's' : '') : '';
      const badge = document.createElement('span');
      badge.className = it.orange ? 'badge-lave' : 'sortie';
      badge.textContent = (S.articles && S.articles.length ? S.articles.join(', ') + ' · ' : '') + (S.depuis != null ? 'lavé à ' + hhmmSec(S.depuis) + ' · ' : '') + (choisi ? 'à saisir sur ' + lib : 'à saisir');
      b.appendChild(badge);
      const bas = document.createElement('span');
      bas.className = 'bascule';
      bas.textContent = choisi ? '✓ Livré ' + lib + ' — changer' : 'Livré le… ?';
      bas.onclick = ev => { ev.stopPropagation(); choisirJourSuivant(c, false, it.suivIdx); };
      b.appendChild(bas);
      b.onclick = () => choisi ? ouvrirReporte(c, jour) : choisirJourSuivant(c, true, 0);
      b.dataset.nom = sansAccent(c.client);
      zone.appendChild(b);
      return;
    }
    if (it.rappel) {
      const r = it.rappel, jourV = NOMS_J[dateDe(r.veille).getDay()];
      b.querySelector('.nom-tuile').textContent = c.client + ' — ' + (r.lot === 3 ? '3ᵉ' : '2ᵉ') + ' livraison de ' + jourV;
      const badge = document.createElement('span');
      badge.className = 'badge-lave';
      badge.textContent = 'Relavé ' + jourV + ' à ' + r.depuis + ', à saisir';
      b.appendChild(badge);
      b.onclick = () => saisieDuJour() ? demanderLivraison(it) : afficherArticles(c, false, null);
      b.dataset.nom = sansAccent(c.client);
      zone.appendChild(b);
      return;
    }
    if (it.lot === 0 && estAjoutManuel(c.client) && tot === 0) {
      const x = document.createElement('span');
      x.className = 'retirer';
      x.textContent = '×';
      x.onclick = ev => { ev.stopPropagation(); retirerDuJour(c.client); };
      b.appendChild(x);
    }
    const hs = sorties[cleNom(c.client)];
    if (hs && hs.length && it.lot !== 1) {
      const so = document.createElement('span');
      so.className = 'sortie';
      so.textContent = 'Sortie séchoir ~' + (it.lot >= 2 ? hs.filter(h => h >= it.depuis) : hs).join(' · ');
      b.appendChild(so);
    }
    if (it.lot === 1) {
      const so = document.createElement('span');
      so.className = 'sortie';
      so.textContent = 'Livraison du matin';
      b.appendChild(so);
    }
    if (it.orange) {
      const badge = document.createElement('span');
      badge.className = 'badge-lave';
      if (it.rappelAussi) {
        const jv = NOMS_J[dateDe(it.rappelAussi.veille).getDay()];
        badge.textContent = 'Relavé ' + jv + ' à ' + it.rappelAussi.depuis + ' + lavé ce matin : tout ensemble, à saisir';
      } else badge.textContent = it.lot >= 2 ? 'Relavé à ' + it.depuis + ', à saisir' : 'Lavé, à saisir';
      b.appendChild(badge);
    }
    if (cible) {
      const badge = document.createElement('span');
      badge.className = 'badge-report';
      badge.textContent = (it.auto ? 'Saisi sur ' : 'Saisie sur ') + libelleJour(cible);
      b.appendChild(badge);
    }
    const veille = it.lot === 0 ? laveLe(c.client) : null;
    if (veille && laveVide(c)) {
      const lv = document.createElement('span');
      lv.className = 'sortie';
      lv.textContent = 'Lavé ' + libelleJour(veille);
      b.insertBefore(lv, b.querySelector('.deja-tuile').nextSibling);
    }
    if ((cible && !it.auto) || (it.orange && !veille)) {
      const bas = document.createElement('span');
      bas.className = 'bascule';
      const mot = motLivraison(jourCourant());
      bas.textContent = cible ? '✓ Livré ' + libelleJour(cible) + ' — annuler' : 'Livré le… ?';
      bas.onclick = ev => { ev.stopPropagation(); if (cible) { if (it.lot === 3) reporterLot3(c.client, null); else basculerReport(c.client); } else choisirDateLivraison(c.client, it.lot); };
      b.appendChild(bas);
    }
    if (cible) {
      const chg = document.createElement('span');
      chg.className = 'bascule';
      chg.style.color = '#6B4FA8';
      chg.textContent = '📅 Changer le jour de livraison';
      chg.onclick = ev => { ev.stopPropagation(); changerJourClient(c, cible); };
      b.appendChild(chg);
    }
    if (it.lot === 1) b.onclick = () => afficherArticles(c, false, { mode: 'avant', cut: lot2De(c.client).limite || lot2De(c.client).depuis, lecture: true });
    else if (cible && tot > 0) b.onclick = () => choisirOuvertureReporte(it);
    else if (cible) b.onclick = () => ouvrirReporte(c, cible);
    else if (saisieDuJour()) b.onclick = () => demanderLivraison(it);
    else b.onclick = () => afficherArticles(c, false, it.filtre);
    if (!c.articles.length) {
      const att = document.createElement('span');
      att.className = 'sortie';
      att.textContent = '⏳ En attente du bureau';
      b.appendChild(att);
    }
    b.dataset.nom = sansAccent(c.client);
    zone.appendChild(b);
  });
  if (duJour && duJour.length < catalogue.length) {
    const ajout = document.createElement('button');
    ajout.className = 'tuile ajout';
    ajout.textContent = '+ Ajouter un client';
    ajout.onclick = ouvrirChoixClient;
    zone.appendChild(ajout);
  }
  const nouveau = document.createElement('button');
  nouveau.className = 'tuile ajout';
  nouveau.textContent = '+ Nouveau client';
  nouveau.onclick = nouveauClient;
  zone.appendChild(nouveau);
  const chariot = document.createElement('button');
  chariot.className = 'tuile ajout';
  chariot.textContent = '🧺 Chariot sans saisie';
  chariot.onclick = chariotSansSaisie;
  zone.appendChild(chariot);
  const vidage = document.createElement('button');
  vidage.className = 'tuile ajout';
  vidage.textContent = '↩ Chariot vidé / regroupé';
  vidage.onclick = chariotVide;
  zone.appendChild(vidage);
  filtrerTuiles();
  chargerPartiesServeur();
}

let recherche = '';
function sansAccent(t) { return String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim(); }
function filtrerTuiles() {
  const q = sansAccent(recherche);
  const zone = document.getElementById('zone');
  // retire les tuiles « recherche catalogue » ajoutées au coup d'avant
  zone.querySelectorAll('.tuile[data-extra]').forEach(t => t.remove());
  const dejaVisible = new Set();
  zone.querySelectorAll('.tuile[data-nom]').forEach(t => {
    t.style.display = !q || t.dataset.nom.includes(q) ? '' : 'none';
    dejaVisible.add(t.dataset.nom);
  });
  // Recherche élargie : on peut ouvrir N'IMPORTE QUEL client du catalogue, même sans saisie (ex. Pont au mur), pour voir/vérifier ses chariots
  if (q && q.length >= 2) {
    catalogue.forEach(c => {
      const n = sansAccent(c.client);
      if (!n.includes(q) || dejaVisible.has(n)) return;
      dejaVisible.add(n);
      const b = document.createElement('button');
      b.className = 'tuile attente'; b.dataset.nom = n; b.dataset.extra = '1';
      b.innerHTML = '<span class="nom-tuile"></span><span class="deja-tuile">pas de saisie — ouvrir pour voir ses chariots</span>';
      b.querySelector('.nom-tuile').textContent = c.client;
      b.onclick = () => afficherArticles(c, false, null);
      zone.appendChild(b);
    });
  }
}

function afficherArticles(c, garder, filtre) {

      '<button class="pm plus">+</button>';

      v = Math.max(0, Math.floor(Number(v) || 0));

/* ---------- « Ma partie terminée » pour un client (par tablette) ---------- */
let partiesFinies = {};
function cleFinie(client) { return jourCourant() + '|' + sansAccent(client); }
function majBoutonTermine() {
  const b = document.getElementById('termine');
  if (!b || !clientCourant) return;
  const fini = !!partiesFinies[cleFinie(clientCourant.client)];
  b.textContent = fini ? '✓ Ma partie est terminée — toucher pour annuler' : '✓ Marquer ma partie terminée';
  b.classList.toggle('fini', fini);
}
async function basculerTermine() {
  if (!clientCourant) return;
  const tab = tabletteCourante();
  if (!tab) { alert('Règle d\'abord la tablette en haut (bouton « Tablette ? ») : Partie haute ou Partie basse.'); changerTablette(); return; }
  const k = cleFinie(clientCourant.client);
  const etaitFini = !!partiesFinies[k];
  if (!etaitFini && !confirm('Marquer TA partie (' + tab + ') terminée pour « ' + clientCourant.client + ' » ?\n\nLa facturation pourra alors valider ce client.')) return;
  try {
    const rep = await fetch(API_URL, { method: 'POST',
      body: JSON.stringify({ action: etaitFini ? 'partieAnnuler' : 'partieTerminee', date: jourCourant(), client: clientCourant.client, tablette: tab }) });
    const data = await rep.json();
    if (!data || !data.ok) throw new Error((data && data.error) || 'Refus du serveur');
    partiesFinies[k] = !etaitFini;
    majBoutonTermine();
    toast(etaitFini ? 'Terminé annulé : ' + clientCourant.client : '✓ Partie terminée : ' + clientCourant.client);
  } catch (e) { toast('Impossible : ' + (e.message || e), true); }
}

/* ---------- Repère « terminé » sur la grille des clients (lu depuis l'API) ---------- */
let partiesTuiles = {};
async function chargerPartiesServeur() {
  try {
    const rep = await fetch(API_URL + '?action=tableau&mode=jour&periode=' + encodeURIComponent(jourCourant()));
    const data = await rep.json();
    if (!data || !data.ok || !Array.isArray(data.clients)) return;
    const m = {};
    data.clients.forEach(c => { m[sansAccent(c.client)] = { termine: !!c.termine, parties: c.parties || {} }; });
    partiesTuiles = m;
    appliquerPartiesTuiles();
  } catch (e) {}
}
function appliquerPartiesTuiles() {
  document.querySelectorAll('#zone .tuile[data-nom]').forEach(b => {
    b.classList.remove('pret', 'partiel');
    const vieux = b.querySelector('.mini-termine'); if (vieux) vieux.remove();
    const info = partiesTuiles[b.dataset.nom];
    if (!info) return;
    const ks = Object.keys(info.parties || {});
    const partiel = !info.termine && ks.some(t => info.parties[t] === 'termine');
    if (!info.termine && !partiel) return;
    b.classList.add(info.termine ? 'pret' : 'partiel');
    const s = document.createElement('span');
    s.className = 'mini-termine';
    s.textContent = info.termine ? '✓ terminé' : '◐ une partie finie';
    b.appendChild(s);
  });
}

/* ---------- Détail des saisies du jour ---------- */
const CLE_JOUR = 'linge_jour2';
let jourRecap = lire(CLE_JOUR, { date: '', saisies: [] });

function isoLocal(d) {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function heureLocale(d) {
  const p = n => String(n).padStart(2, '0');
  return p(d.getHours()) + ':' + p(d.getMinutes());
}

/* ---------- Journée choisie (null = aujourd'hui) ---------- */
let jourChoisi = null;
const NOMS_J = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];

function jourCourant() { return jourChoisi || isoLocal(new Date()); }
function dateDe(iso) { const [a, m, j] = iso.split('-').map(Number); return new Date(a, m - 1, j, 12); }
function libelleJour(iso) {
  const d = dateDe(iso);
  const p = n => String(n).padStart(2, '0');
  return NOMS_J[d.getDay()] + ' ' + p(d.getDate()) + '/' + p(d.getMonth() + 1);
}
function majJourAffiche() {
  const auj = isoLocal(new Date());
  const iso = jourCourant();
  const lib = libelleJour(iso);
  document.getElementById('jourBtn').textContent = 'Journée : ' + (iso === auj ? 'aujourd\'hui' : lib);
  const b = document.getElementById('bandeauJour');
  if (iso !== auj) {
    b.textContent = 'Saisie pour ' + lib.toUpperCase() + ' — toucher ici pour revenir à aujourd\'hui';
    b.style.display = 'block';
  } else {
    b.style.display = 'none';
  }
}
function ouvrirJours() {
  document.querySelector('#panneauJour h2').textContent = 'Pour quelle journée ?';
  const liste = document.getElementById('listeJours');
  liste.innerHTML = '';
  const auj = new Date();
  for (let i = -10; i <= 7; i++) {   // jusqu'à 10 jours en arrière : au-delà d'hier, code responsable (rattrapage d'un oubli)
    const d = new Date(auj.getFullYear(), auj.getMonth(), auj.getDate() + i, 12);
    const iso = isoLocal(d);
    const b = document.createElement('button');
    b.className = 'choixJour' + (iso === jourCourant() ? ' actif' : '');
    let lib = libelleJour(iso);
    lib = lib.charAt(0).toUpperCase() + lib.slice(1);
    if (i === 0) lib += ' (aujourd\'hui)';
    if (i === 1) lib += ' (demain)';
    if (i === -1) lib += ' (hier)';
    if (i < -1) { lib = '🔒 ' + lib; b.style.opacity = '.75'; }
    b.textContent = lib;
    b.onclick = async () => {
      if (i < -1) {   // jour passé : rattrapage réservé au responsable
        if (!confirm('Saisir pour ' + libelleJour(iso) + ' (jour passé) ?\n\nÀ utiliser seulement pour rattraper un oubli. Le code responsable est demandé.')) return;
        const code = demanderCode(); if (!code) return;
        try {
          const rep = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'verifierCode', code: code }) });
          const data = await rep.json();
          if (!data.ok) { codeResponsable = ''; toast('Code incorrect', true); return; }
        } catch (e) { toast('Pas de réseau : impossible de vérifier le code.', true); return; }
      }
      choisirJour(i === 0 ? null : iso); fermerJours();
    };
    liste.appendChild(b);
  }
  document.getElementById('fondJour').style.display = 'flex';
}
function fermerJours() { document.getElementById('fondJour').style.display = 'none'; }
function choisirJour(iso) {
  jourAvantReport = undefined;
  jourChoisi = iso;
  majJourAffiche();
  jourRecap = { date: '', saisies: [] };
  if (clientCourant) afficherArticles(clientCourant, true); else afficherClients();
  chargerJour();
  chargerListeJour();
}
function jourDeLigne(l) { return l.date || isoLocal(new Date(l.horodatage)); }

/* ---------- Livré demain : la saisie d'un client lavé part sur le jour de livraison ----------
   Le choix est enregistré sur le serveur, pour que le bureau le voie aussi. */
let jourAvantReport;   // journée à retrouver après une saisie reportée

// Jour de livraison : le lendemain, sauf le dimanche -> lundi (un lavé du samedi part le lundi).
function lendemain(iso) {
  const d = dateDe(iso);
  d.setDate(d.getDate() + 1);
  if (d.getDay() === 0) d.setDate(d.getDate() + 1);
  return isoLocal(d);
}
function motLivraison(iso) {
  const c = lendemain(iso);
  const demain = dateDe(iso); demain.setDate(demain.getDate() + 1);
  return c === isoLocal(demain) ? 'demain' : NOMS_J[dateDe(c).getDay()];
}
function listeCache() { const l = lire(CLE_LISTES, {})[jourCourant()]; return (l && !Array.isArray(l)) ? l : {}; }
function reportDe(nom) { return (listeCache().reports || {})[cleNom(nom)] || null; }
let lotFiltre = null;   // saisie en cours limitée à un lot (2ᵉ livraison)
function lot2De(nom) { return (listeCache().lots2 || {})[cleNom(nom)] || null; }
function hhmmSec(t) { const p = n => String(n).padStart(2, '0'); return p(Math.floor(t / 3600)) + ':' + p(Math.floor((t % 3600) / 60)); }

function laveLe(nom) { return (listeCache().reportesDe || {})[cleNom(nom)] || null; }

// Lavé ce jour et déjà saisi sur le jour de livraison suivant, après ce lavage : rien à faire ici.
function dejaSaisiLendemain(nom) {
  const l = listeCache();
  const df = (l.dernierFait || {})[cleNom(nom)];
  const suite = (l.suites || {})[cleNom(nom)];
  if (df == null || !suite) return false;
  const p = n => String(n).padStart(2, '0');
  return suite > jourCourant() + ' ' + p(Math.floor(df / 3600)) + ':' + p(Math.floor((df % 3600) / 60));
}

// Client déjà saisi, relavé après l'heure de bascule (14 h) et après sa dernière saisie du jour :
// il repasse en orange. Renvoie l'heure du lavage (« 15:20 ») ou null.
function relave(nom) {
  const l = listeCache();
  const df = (l.dernierFait || {})[cleNom(nom)];
  if (df == null || df < (l.bascule || 14) * 3600) return null;
  if (totalJourClient(nom) === 0) return null;
  const date = jourCourant();
  const enSec = h => { const [a, b] = String(h || '').split(':').map(Number); return (a || 0) * 3600 + (b || 0) * 60; };
  let derniere = -1;
  if (jourRecap.date === date) {
    jourRecap.saisies.forEach(x => {
      if (cleNom(x.client) === cleNom(nom) && x.le === date) derniere = Math.max(derniere, enSec(x.heure));
    });
  }
  lire(CLE_FILE, []).forEach(x => {
    const d = new Date(x.horodatage);
    if (cleNom(x.client) === cleNom(nom) && jourDeLigne(x) === date && isoLocal(d) === date) {
      derniere = Math.max(derniere, d.getHours() * 3600 + d.getMinutes() * 60);
    }
  });
  if (df <= derniere) return null;
  const p = n => String(n).padStart(2, '0');
  const h = p(Math.floor(df / 3600)) + ':' + p(Math.floor((df % 3600) / 60));
  // Déjà saisi sur le jour de livraison suivant, après ce lavage : rien à faire ici.
  const suite = (l.suites || {})[cleNom(nom)];
  if (suite && suite > date + ' ' + h) return null;
  return h;
}

function joursSuivant(c) { const S = (listeCache().suivants || {})[cleNom(c.client)] || {}; return S.choisi ? (S.dates && S.dates.length ? S.dates.slice() : [S.date]) : []; }
async function enregistrerJoursSuivant(c, jours, ouvrirIso) {

  // Ressorti sans avoir rien saisi sur le jour de livraison : on annule ce choix (sinon la tuile reste violette pour rien).
  let annuler = null;

  jourRecap = { date: '', saisies: [] };

  chargerListeJour();
  afficherClients();
  return true;
}

/* ---------- Clients prévus pour la journée ---------- */
const CLE_LISTES = 'linge_listes_jour';
const CLE_AJOUTS = 'linge_ajouts_jour';
function cleNom(s) { return String(s || '').trim().replace(/\s+/g, ' ').toLowerCase(); }

// Journée type + clients saisis ou créés ce jour (fourni par le serveur), mis en cache.
async function chargerListeJour() {
  const date = jourCourant();
  try {
    const rep = await fetch(API_URL + '?action=tableau&mode=jour&periode=' + date);
    const data = await rep.json();
    if (!data.ok || date !== jourCourant()) return;
    const listes = lire(CLE_LISTES, {});
    const sorties = {};
    const reports = {}, reportesDe = {}, dernierFait = {}, suites = {}, suitesDate = {}, lots2 = {}, suivants = {};
    data.clients.forEach(c => {
      if (c.dernierFait != null) dernierFait[cleNom(c.client)] = c.dernierFait;
      if (c.suite) suites[cleNom(c.client)] = c.suite;
      if (c.suiteDate) suitesDate[cleNom(c.client)] = c.suiteDate;
      if (c.sorties && c.sorties.length) sorties[cleNom(c.client)] = c.sorties;
      if (c.reporte) reports[cleNom(c.client)] = c.reporte;
      if (c.lot2) { lots2[cleNom(c.client)] = { depuis: c.lot2.depuis, limite: c.lot2.limite || c.lot2.depuis, l3: c.lot3 ? { depuis: c.lot3.depuis, limite: c.lot3.limite, reporte: c.lot3.reporte || null } : null }; if (c.lot2.reporte) reports[cleNom(c.client)] = c.lot2.reporte; }
      if (c.reporteDe) reportesDe[cleNom(c.client)] = c.reporteDe;
      if (c.suivant) suivants[cleNom(c.client)] = c.suivant;
    });
    listes[date] = { noms: data.clients.map(c => c.client), laves: data.clients.filter(c => c.lave).map(c => c.client),
      sorties: sorties, reports: reports, reportesDe: reportesDe, dernierFait: dernierFait, suites: suites, suitesDate: suitesDate, lots2: lots2, suivants: suivants, bascule: data.bascule || 14 };
    Object.keys(listes).forEach(d => { if (d < isoLocal(new Date(Date.now() - 7 * 864e5))) delete listes[d]; });
    ecrire(CLE_LISTES, listes);
    if (!clientCourant) afficherClients();
    if (date === isoLocal(new Date())) chargerRappelsVeille(date);
  } catch (e) {}
}

// Jour de lavage précédent (la veille ; le samedi si l'on est lundi).
function veilleDe(iso) {
  const d = dateDe(iso);
  d.setDate(d.getDate() - 1);
  if (d.getDay() === 0) d.setDate(d.getDate() - 1);
  return isoLocal(d);
}

// 2ᵉ / 3ᵉ livraisons lavées hier soir, ni saisies, ni « Livré le… », ni saisies depuis :
// elles remontent en orange sur la journée d'aujourd'hui.
async function chargerRappelsVeille(date) {
  const veille = veilleDe(date);
  try {
    const rep = await fetch(API_URL + '?action=tableau&mode=jour&periode=' + veille);
    const data = await rep.json();
    if (!data.ok || date !== jourCourant()) return;
    const rappels = [];
    data.clients.forEach(c => {
      const deja = t => !!(c.suite && c.suite > veille + ' ' + hhmmSec(t));
      if (c.lot2 && !(c.lot2.total > 0) && !c.lot2.reporte && !deja(c.lot2.depuis)) {
        rappels.push({ client: c.client, lot: 2, depuis: hhmmSec(c.lot2.depuis), veille: veille });
      }
      if (c.lot3 && !(c.lot3.total > 0) && !c.lot3.reporte && !deja(c.lot3.depuis)) {
        rappels.push({ client: c.client, lot: 3, depuis: hhmmSec(c.lot3.depuis), veille: veille });
      }
    });
    const listes = lire(CLE_LISTES, {});
    if (!listes[date] || Array.isArray(listes[date])) return;
    listes[date].rappels = rappels;
    ecrire(CLE_LISTES, listes);
    if (!clientCourant) afficherClients();
  } catch (e) {}
}

// null = liste inconnue (hors-ligne sans cache) : on montre tout le catalogue.
function clientsDuJour() {
  const date = jourCourant();
  const listes = lire(CLE_LISTES, {});
  if (!listes[date]) return null;
  const noms = new Set((Array.isArray(listes[date]) ? listes[date] : listes[date].noms).map(cleNom));
  (lire(CLE_AJOUTS, {})[date] || []).forEach(n => noms.add(cleNom(n)));
  lire(CLE_FILE, []).forEach(l => { if (jourDeLigne(l) === date) noms.add(cleNom(l.client)); });
  return catalogue.filter(c => noms.has(cleNom(c.client)));
}

function sortiesDuJour() {
  const l = lire(CLE_LISTES, {})[jourCourant()];
  return (l && !Array.isArray(l) && l.sorties) || {};
}

function lavesDuJourAtelier() {
  const l = lire(CLE_LISTES, {})[jourCourant()];
  return new Set(l && !Array.isArray(l) ? l.laves.map(cleNom) : []);
}

// Ajouté à la main sur cet appareil, et pas fourni par le serveur (journée type, lavé, saisi, créé).
function estAjoutManuel(nom) {
  const date = jourCourant();
  const ajouts = lire(CLE_AJOUTS, {})[date] || [];
  if (!ajouts.some(n => cleNom(n) === cleNom(nom))) return false;
  const l = lire(CLE_LISTES, {})[date];
  const serveur = l ? (Array.isArray(l) ? l : l.noms) : [];
  return !serveur.some(n => cleNom(n) === cleNom(nom));
}

// Ajoute localement une ligne qui vient d'être envoyée, en attendant le prochain rechargement.
function ajouterAuJour(l) {
  const d = new Date(l.horodatage);
  const date = jourCourant();
  if (jourDeLigne(l) !== date) return;
  if (jourRecap.date !== date) return;
  jourRecap.saisies.push({ client: l.client, article: l.article, quantite: Number(l.quantite || 0), heure: heureLocale(d), le: isoLocal(d) });
  ecrire(CLE_JOUR, jourRecap);
}

// Toutes les saisies du jour pour un client et un article : envoyées + en attente d'envoi.
// filtre : null = tout ; { mode: 'apres' | 'avant', cut: secondes } = 2ᵉ livraison / livraison du matin
function entreesJour(client, article, filtre = lotFiltre) {
  const date = jourCourant();
  const liste = [];
  if (jourRecap.date === date) {
    jourRecap.saisies.forEach(x => {
      if (x.client === client && x.article === article) liste.push({ q: x.quantite, h: x.heure, le: x.le || '', attente: false, id: x.id || null, chariot: x.chariot || '' });
    });
  }
  lire(CLE_FILE, []).forEach(l => {
    const d = new Date(l.horodatage);
    if (l.client === client && l.article === article && jourDeLigne(l) === date) {
      liste.push({ q: Number(l.quantite || 0), h: heureLocale(d), le: isoLocal(d), attente: true, id: l.id || null, chariot: l.chariot || '' });
    }
  });
  const res = filtre ? liste.filter(e => {
    const [a, b] = e.h.split(':').map(Number);
    const apresCut = e.le === date && (a * 3600 + b * 60) >= filtre.cut;
    return filtre.mode === 'apres' ? apresCut && !(filtre.fin != null && e.le === date && (a * 3600 + b * 60) >= filtre.fin) : !apresCut;
  }) : liste;
  return res.sort((a, b) => a.h.localeCompare(b.h));
}

function dejaSaisi(client, article, filtre = lotFiltre) {
  return entreesJour(client, article, filtre).reduce((t, x) => t + x.q, 0);
}

function totalJourClient(client, filtre = lotFiltre) {
  const c = catalogue.find(x => x.client === client);
  if (!c) return 0;
  return c.articles.reduce((t, a) => t + dejaSaisi(client, a, filtre), 0);
}

function majDeja(ligne, client, article) {
  const e = entreesJour(client, article);
  const el = ligne.querySelector('.deja');
  if (!e.length) { el.textContent = ''; return; }
  const total = e.reduce((t, x) => t + x.q, 0);
  const morceaux = e.map(x => '<span style="white-space:nowrap">' + x.q + ' (' + x.h + (x.attente ? ', en attente' : '') + ')' +
    (x.chariot ? ' <a href="#" data-ch="' + rollEsc(x.chariot) + '" title="Ouvrir ce chariot pour corriger" style="text-decoration:none;color:#1f5fa8;font-weight:800;display:inline-block;padding:3px 10px;margin:0 2px;border:1px solid #b9d0ea;border-radius:8px;background:#eef4fb">' + rollEsc(x.chariot) + '</a>' : '') +
    (x.id ? ' <a href="#" data-del="' + x.id + '" data-att="' + (x.attente ? 1 : 0) + '" title="Supprimer cette saisie" style="text-decoration:none;color:#c62828">🗑</a>' : '') + '</span>');
  el.innerHTML = 'Déjà saisi : ' + morceaux.join(' + ') + (e.length > 1 ? ' = ' + total : '');
  el.querySelectorAll('[data-del]').forEach(a => a.onclick = ev => { ev.preventDefault(); supprimerSaisie(a.dataset.del, a.dataset.att === '1'); });
  el.querySelectorAll('[data-ch]').forEach(a => a.onclick = ev => { ev.preventDefault(); ouvrirChariotDepuisAtelier(a.dataset.ch); });
}

// 🗑 Supprimer une saisie (corriger une erreur de pointage) : en attente = local ; envoyée = via l'API
async function supprimerSaisie(id, attente) {
  if (!confirm('Supprimer cette saisie ?')) return;
  if (attente) {
    ecrire(CLE_FILE, lire(CLE_FILE, []).filter(l => String(l.id) !== String(id)));
    rafraichirDeja();
    toast('Saisie supprimée');
    return;
  }
  try {

  if (!f) { f = document.createElement('div'); f.id = 'fondRoll'; f.style.cssText = 'position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px'; document.body.appendChild(f); }
  f.innerHTML = '<div style="background:#fff;border-radius:18px;padding:18px 20px;width:100%;max-width:520px">Chargement…</div>'; f.style.display = 'flex';
  let saisies = [];
  try {
    const rep = await fetch(API_URL + '?action=detailJour&date=' + cibleActuelle);
    const data = await rep.json();
    saisies = (data.saisies || []).filter(s => cleNom(s.client) === cleNom(c.client) && s.le && s.heure);
  } catch (e) { toast('Pas de réseau : réessayez.', true); f.style.display = 'none'; return; }
  if (!saisies.length) { toast('Aucune saisie de ' + c.client + ' le ' + libelleJour(cibleActuelle) + '.', true); f.style.display = 'none'; return; }
  const G = {}; saisies.forEach(s => { const k = s.le + ' ' + s.heure; (G[k] = G[k] || { le: s.le, heure: s.heure, l: [] }).l.push(s); });
  const groupes = Object.keys(G).sort().map(k => G[k]);
  const jj = iso => iso.slice(8, 10) + '/' + iso.slice(5, 7);
  const txtG = g => g.l.map(s => s.article + ' ' + s.quantite).join(', ');
  const auj = isoLocal(new Date()), jours = [];
  if (cibleActuelle !== auj) jours.push(auj);
  const d0 = dateDe(auj);
  for (let i = 1; jours.length < 7 && i <= 12; i++) { const d = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate() + i, 12); const iso = isoLocal(d); if (d.getDay() !== 0 && iso !== cibleActuelle && jours.indexOf(iso) < 0) jours.push(iso); }
  const bt = 'width:100%;margin-top:8px;font-size:17px;padding:12px;border-radius:12px;font-weight:700;';
  f.innerHTML = '<div style="background:#fff;border-radius:18px;padding:18px 20px;width:100%;max-width:520px;max-height:90vh;overflow:auto">' +
    '<div style="font-size:22px;font-weight:800">📅 Changer le jour — ' + rollEsc(c.client) + '</div>' +
    '<div style="color:#555;margin:4px 0 10px">Actuellement livré le <b>' + rollEsc(libelleJour(cibleActuelle)) + '</b>. Tout ce linge partira sur le jour que vous choisissez.</div>' +
    groupes.map(g => '<div style="border:1px solid #dde2e7;border-radius:10px;padding:8px 10px;margin-top:6px;font-size:15px"><b>saisi le ' + jj(g.le) + ' à ' + rollEsc(g.heure) + '</b><br><span style="color:#555">' + rollEsc(txtG(g)) + '</span></div>').join('') +
    '<div style="font-weight:700;margin-top:12px">Livrer plutôt le :</div>' +
    jours.map(j => '<button data-j="' + j + '" style="' + bt + 'border:2px solid #6B4FA8;color:#6B4FA8;background:#fff">' + rollEsc(libelleJour(j)) + (j === auj ? ' (aujourd\'hui)' : '') + '</button>').join('') +
    '<button id="cjX" style="' + bt + 'border:2px solid #999;background:#fff">Annuler</button></div>';
  document.getElementById('cjX').onclick = () => { f.style.display = 'none'; };
  f.querySelectorAll('[data-j]').forEach(b => b.onclick = async () => {
    const cible = b.dataset.j;
    if (!confirm('Déplacer tout le linge de ' + c.client + '\ndu ' + libelleJour(cibleActuelle) + ' vers le ' + libelleJour(cible) + ' ?')) return;
    const code = demanderCode(); if (!code) return;
    let data;
    try {
      const rep = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'changerJourClient', code: code, client: c.client, date: cibleActuelle, cible: cible }) });
      data = await rep.json();
    } catch (e) { toast('Pas de réseau : réessayez.', true); return; }
    if (!data || !data.ok) { if (data && data.error === 'Code incorrect') codeResponsable = ''; toast((data && data.error) || 'Refusé', true); return; }
    const nb = data.deplacees || 0;
    toast('📅 ' + c.client + ' déplacé au ' + libelleJour(cible) + ' (' + nb + ' ligne' + (nb > 1 ? 's' : '') + (data.bls ? ' · BL suivi' : '') + ')');
    f.style.display = 'none';
    chargerJour(); chargerListeJour();
  });
}
async function reporterChariot(c, x) {
  const f = document.getElementById('fondRoll');
  const date = jourCourant();
  const bt = 'width:100%;margin-top:8px;font-size:17px;padding:12px;border-radius:12px;font-weight:700;';
  if (jourRecap.date !== date) { toast('Liste du jour pas encore chargée : réessayez dans un instant.', true); chargerJour(); return; }
  // contenu du chariot (sans l'étiquette 📅)
  const cont = {};
  String(x.note || '').split(',').forEach(m => { const y = m.trim().match(/^(.*\S)\s+(\d+(?:[.,]\d+)?)$/); if (y && !/^📅/.test(y[1])) cont[sansAccent(y[1])] = (cont[sansAccent(y[1])] || 0) + Number(y[2].replace(',', '.')); });
  // saisies du jour pour ce client, regroupées par moment de saisie
  const G = {};
  jourRecap.saisies.filter(s => cleNom(s.client) === cleNom(c.client) && s.le && s.heure).forEach(s => {
    const k = s.le + ' ' + s.heure; (G[k] = G[k] || { le: s.le, heure: s.heure, l: [] }).l.push(s);
  });
  const groupes = Object.keys(G).sort().map(k => G[k]);
  const egal = g => { const m = {}; g.l.forEach(s => { m[sansAccent(s.article)] = (m[sansAccent(s.article)] || 0) + Number(s.quantite || 0); });
    const a = Object.keys(m), b = Object.keys(cont); return a.length === b.length && a.every(k => cont[k] === m[k]); };
  const txtG = g => g.l.map(s => s.article + ' ' + s.quantite).join(', ');
  const jj = iso => iso.slice(8, 10) + '/' + iso.slice(5, 7);
  if (!groupes.length) { toast('Aucune saisie trouvée pour ce client ce jour-là.', true); return; }
  const sel = {}; groupes.forEach((g, i) => { if (egal(g)) sel[i] = 1; });
  // jours proposés : les 7 prochains jours de livraison (sans le dimanche), sauf le jour actuel
  const jours = []; const d0 = dateDe(date);
  for (let i = 1; jours.length < 6 && i <= 10; i++) { const d = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate() + i, 12); if (d.getDay() !== 0) jours.push(isoLocal(d)); }
  f.innerHTML = '<div style="background:#fff;border-radius:18px;padding:18px 20px;width:100%;max-width:520px;max-height:90vh;overflow:auto">' +
    '<div style="font-size:22px;font-weight:800">📅 Reporter ' + rollEsc(x.numero) + ' — ' + rollEsc(c.client) + '</div>' +
    '<div style="color:#555;margin:4px 0 8px">Dans le chariot : <b>' + rollEsc(avecTag('', x.note) || '—') + '</b></div>' +
    '<div style="font-weight:700">Quelle saisie part avec ce chariot ?</div>' +
    groupes.map((g, i) => '<label style="display:flex;gap:10px;align-items:flex-start;border:1px solid #dde2e7;border-radius:10px;padding:8px 10px;margin-top:6px;font-size:16px"><input type="checkbox" data-g="' + i + '"' + (sel[i] ? ' checked' : '') + ' style="width:22px;height:22px;margin-top:2px">' +
      '<span><b>saisi le ' + jj(g.le) + ' à ' + rollEsc(g.heure) + '</b>' + (egal(g) ? ' <span style="color:#2e7d32;font-weight:700">= contenu du chariot</span>' : '') + '<br><span style="color:#555">' + rollEsc(txtG(g)) + '</span></span></label>').join('') +
    '<div style="font-weight:700;margin-top:12px">Livrer ce linge le :</div>' +
    jours.map(j => '<button data-j="' + j + '" style="' + bt + 'border:2px solid #6B4FA8;color:#6B4FA8;background:#fff">' + rollEsc(libelleJour(j)) + '</button>').join('') +
    '<button id="rcX" style="' + bt + 'border:2px solid #999;background:#fff">Annuler</button></div>';
  f.style.display = 'flex';
  document.getElementById('rcX').onclick = () => chariotsClient(c);
  f.querySelectorAll('[data-g]').forEach(cb => cb.onchange = () => { if (cb.checked) sel[cb.dataset.g] = 1; else delete sel[cb.dataset.g]; });
  f.querySelectorAll('[data-j]').forEach(b => b.onclick = async () => {
    const cible = b.dataset.j, choisis = Object.keys(sel).map(i => groupes[+i]);
    if (!choisis.length) { toast('Coche la saisie qui part avec ce chariot.', true); return; }
    if (!confirm('Reporter au ' + libelleJour(cible) + ' :\n\n' + choisis.map(g => '• saisi le ' + jj(g.le) + ' à ' + g.heure + ' : ' + txtG(g)).join('\n') +
      '\n\nCes quantités quittent le bon du ' + libelleJour(date) + ' et vont sur celui du ' + libelleJour(cible) + '.\nLe chariot ' + x.numero + ' sera marqué 📅 ' + jj(cible) + '.')) return;
    const code = demanderCode(); if (!code) return;
    let n = 0;
    try {
      for (const g of choisis) {
        const rep = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'deplacerSaisie', code: code, client: c.client, date: date, le: g.le, heure: g.heure, cible: cible }) });
        const data = await rep.json();
        if (!data.ok) { if (data.error === 'Code incorrect') codeResponsable = ''; toast(data.error || 'Refusé', true); if (!n) return; break; }
        n += data.deplacees || 0;
      }
    } catch (e) { toast('Pas de réseau : réessayez.', true); return; }
    // étiquette du chariot : 📅 nouveau jour (le chauffeur ne le chargera pas avant)
    try {
      const id = await rollIdentite(x.numero);
      if (id) await rollRpc('roll_scan', { p_numero: x.numero, p_personne: id.id, p_code: id.code, p_etape: 'rempli', p_client: c.client, p_note: avecTag('📅 ' + jj(cible), x.note) });
    } catch (e) {}
    toast('📅 ' + x.numero + ' reporté au ' + libelleJour(cible) + ' (' + n + ' ligne' + (n > 1 ? 's' : '') + ' de saisie déplacée' + (n > 1 ? 's' : '') + ')');
    f.style.display = 'none';
    chargerJour(); chargerListeJour();
  });
}

// Corriger le contenu d'un chariot prêt (quantités fausses) directement à l'atelier : le chariot reste le même, seul son contenu change.
async function corrigerQuantites(c, x, camion) {
  if (camion) { try { const inf = await rollRpc('roll_info', { p_numero: x.numero }); x = Object.assign({}, x, { note: noteDeRoll(inf) }); } catch (e) {} }
  const f = document.getElementById('fondRoll');
  const lignes = [];
  String(x.note || '').split(',').forEach(m => { const y = m.trim().match(/^(.*\S)\s+(\d+(?:[.,]\d+)?)$/); if (y) lignes.push({ a: y[1], q: y[2].replace(',', '.') }); });
  (c.articles || []).forEach(a => { if (!lignes.some(l => sansAccent(l.a) === sansAccent(a))) lignes.push({ a: a, q: '' }); });   // articles du client absents du chariot
  const champ = 'width:110px;font-size:24px;font-weight:700;text-align:center;padding:8px;border:2px solid #ccd;border-radius:10px';
  f.innerHTML = '<div style="background:#fff;border-radius:18px;padding:18px 20px;width:100%;max-width:520px;max-height:90vh;overflow:auto">' +
    '<div style="font-size:22px;font-weight:800">✎ ' + rollEsc(x.numero) + ' — ' + rollEsc(c.client) + '</div>' +
    '<div style="color:#555;margin:4px 0 10px">Corrigez la quantité <b>réelle</b> de chaque article dans ce chariot. La <b>facture de ce chariot</b> suit automatiquement.</div>' +
    lignes.map((l, i) => '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #eef0f2"><span style="font-size:18px;font-weight:600">' + rollEsc(l.a) +
      (Number(l.q) > 0 ? '<div style="font-size:14px;color:#2e7d32;font-weight:700">actuellement : ' + rollEsc(l.q) + '</div>' : '') + '</span>' +
      '<input data-q="' + i + '" type="number" inputmode="numeric" value="' + (Number(l.q) > 0 ? rollEsc(l.q) : '') + '" placeholder="0" style="' + champ + '"></div>').join('') +
    '<button id="cqOk" style="width:100%;margin-top:14px;font-size:20px;padding:14px;border-radius:12px;border:none;background:#2e7d32;color:#fff;font-weight:800">✓ Enregistrer le contenu</button>' +
    '<button id="cqX" style="width:100%;margin-top:8px;font-size:18px;padding:12px;border-radius:12px;border:2px solid #999;background:#fff;font-weight:700">Annuler</button></div>';
  f.style.display = 'flex';
  document.getElementById('cqX').onclick = () => chariotsClient(c);
  document.getElementById('cqOk').onclick = async () => {
    const ajouts = lignes.map((l, i) => {
      const av = Number(String(l.q).replace(',', '.')) || 0;
      const raw = String(f.querySelector('[data-q="' + i + '"]').value).trim();
      const nv = raw === '' ? av : (Number(raw.replace(',', '.')) || 0);   // vide = on ne touche pas
      return { a: l.a, av: av, nv: nv, add: nv - av };
    });
    if (!ajouts.some(e => e.add)) { toast('Rien de changé.', true); return; }
    const total = avecTag(tagPour(x.note), ajouts.map(e => e.nv > 0 ? e.a + ' ' + e.nv : '').filter(Boolean).join(', '));
    const resume = ajouts.filter(e => e.add).map(e => e.a + ' : ' + e.av + ' → ' + e.nv).join(', ');
    if (!confirm(x.numero + ' (' + c.client + ') : ' + resume + '\n\nContiendra : ' + (total || '— vide —') + '\nAvant : ' + (x.note || '—'))) return;
    const id = camion ? await idBureau(x.numero) : await rollIdentite(x.numero); if (!id) return;
    try {
      const r = camion ? await rollRpc('roll_contenu', { p_numero: x.numero, p_personne: id.id, p_code: id.code, p_note: total })
                       : await rollRpc('roll_scan', { p_numero: x.numero, p_personne: id.id, p_code: id.code, p_etape: 'rempli', p_client: c.client, p_note: total });
      if (!r || !r.ok) { if (!camion && /code/i.test((r && r.error) || '')) { try { localStorage.removeItem(CLE_ROLL_ID); } catch (e) {} } toast((r && r.error) || 'Refusé', true); return; }
      // Facturation : on réécrit UNIQUEMENT les lignes rattachées à CE chariot (colonne I). Les saisies sans chariot (anciennes) ne sont pas touchées ici.
      const changes = ajouts.filter(e => e.add);
      let faitsFact = 0, orphelins = 0;
      for (const e of changes) {
        const liees = saisiesDuChariot(c.client, e.a, x.numero);
        if (!liees.length) { orphelins++; continue; }
        let pend = lire(CLE_FILE, []);
        for (const o of liees) {
          if (o.attente) { pend = pend.filter(l => String(l.id) !== String(o.id)); }
          else {
            if (jourRecap && Array.isArray(jourRecap.saisies)) jourRecap.saisies = jourRecap.saisies.filter(s => String(s.id) !== String(o.id));
            try { await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'supprimerSaisie', id: o.id }) }); } catch (er) {}
          }
        }
        ecrire(CLE_FILE, pend);
        if (jourRecap) ecrire(CLE_JOUR, jourRecap);
        if (e.nv > 0) {
          const sais = { id: nouvelId(), horodatage: new Date().toISOString(), date: jourCourant(), client: c.client, article: e.a, quantite: e.nv, operateur: (lire(CLE_OP, '') || 'correction chariot'), chariot: x.numero };
          ecrire(CLE_FILE, lire(CLE_FILE, []).concat([sais]));
        }
        faitsFact++;
      }
      rafraichirDeja();
      envoyer();
      toast('🧺 ' + x.numero + ' corrigé : ' + (total || 'vide') + (faitsFact ? ' · facture mise à jour' : '') + (orphelins ? ' · ' + orphelins + ' sans rattachement → 🗑 à l\'atelier' : ''));
      chariotsClient(c);
    } catch (e) { toast('Pas de réseau : réessayez.', true); }
  };
}
async function deplacerLinge(c, ancien, contenu, question) {
  const v = prompt(question); if (!v || !v.trim()) return;
  const cible = numRoll(v);
  if (cible === ancien) { toast('C\'est le même chariot.', true); return; }
  let info; try { info = await rollRpc('roll_info', { p_numero: cible }); } catch (e) { toast('Pas de réseau.', true); return; }
  if (!info || info.ok === false) { toast((info && info.error) || 'Chariot inconnu', true); return; }
  // chariot oublié au tunnel (noté sale / repris / chez le client) mais physiquement vide à l'atelier : on le régularise
  const INC = { sale: 'incident : non vidé au tunnel (oubli du laveur)', retour: 'incident : pas déchargé ni vidé (oubli chauffeur + laveur)', client: 'incident : noté chez le client, retrouvé à l\'atelier' };
  let incident = '';
  if (INC[info.etat]) {
    const ou = { sale: 'sale, pas passé au tunnel', retour: 'repris chez « ' + (info.client || '?') + ' », pas déchargé', client: 'chez « ' + (info.client || '?') + ' »' }[info.etat];
    if (!confirm(cible + ' est noté « ' + ou + ' ».\n\nS\'il est bien ici, vide, à l\'atelier : OK pour le noter vidé et l\'utiliser.')) return;
    incident = INC[info.etat]; info = Object.assign({}, info, { etat: 'bdl', client: null, note: '', derniers: [] });
  }
  if (info.etat !== 'pret' && info.etat !== 'bdl') {
    // chariot déjà chargé / livré : on peut quand même compléter son contenu (code Bureau), sans changer son état
    if (ancien || !info.client || sansAccent(info.client) !== sansAccent(c.client)) { toast(cible + ' n\'est plus à l\'atelier (chargé ou livré).', true); return; }
    const deja2 = noteDeRoll(info);
    const total2 = fusionContenu(deja2, contenu);
    if (!confirm(cible + ' est déjà parti de l\'atelier (chargé ou livré).\n\nAjouter ce linge à son contenu quand même ?\n\n' + cible + ' (' + c.client + ') contiendra :\n' + (total2 || '—') + '\n\nAvant : ' + (deja2 || '—'))) return;
    try {
      // d'abord avec le code de l'atelier ; si Supabase le refuse : code Bureau
      let id2 = await rollIdentite(cible), r = id2 ? await rollRpc('roll_contenu', { p_numero: cible, p_personne: id2.id, p_code: id2.code, p_note: total2 }) : null;
      if (!r || !r.ok) { id2 = await idBureau(cible); if (!id2) return; r = await rollRpc('roll_contenu', { p_numero: cible, p_personne: id2.id, p_code: id2.code, p_note: total2 }); }
      if (!r || !r.ok) { toast((r && r.error) || 'Refusé', true); return; }
      toast('🧺 ' + cible + ' : ' + total2);
      chariotsClient(c);
    } catch (e) { toast('Correction impossible (fonction roll_contenu absente ?)', true); }
    return;
  }
  if (info.etat === 'pret' && info.client && sansAccent(info.client) !== sansAccent(c.client)) { toast(cible + ' est rempli pour « ' + info.client + ' ».', true); return; }
  // linge du jour : s'il est déjà sur ce chariot, on ne l'additionne pas une 2ᵉ fois
  const deja = info.etat === 'pret' ? noteDeRoll(info) : '';
  let total = fusionContenu(deja, contenu);
  if (!ancien && deja) {
    const ch = prompt(cible + ' contient déjà : ' + deja + '\n\n1 = REMPLACER par le linge du jour (' + contenu + ')\n2 = AJOUTER le linge du jour à ce contenu\n\nTapez 1 ou 2 :');
    if (ch === '1') total = contenu; else if (ch !== '2') return;
  }
  if (!confirm((ancien ? 'Déplacer le linge de ' + ancien + ' vers ' + cible : 'Mettre ce linge dans ' + cible) + ' ?\n\n' + cible + ' (' + c.client + ') contiendra :\n' + (total || '—') + (ancien ? '\n\n' + ancien + ' redevient vide et libre.' : ''))) return;
  const id = await rollIdentite(cible); if (!id) return;   // chariot encore à l'atelier : le code de la personne de l'atelier suffit
  try {
    if (incident) { const r0 = await rollRpc('roll_scan', { p_numero: cible, p_personne: id.id, p_code: id.code, p_etape: 'vide', p_client: null, p_note: incident }); if (!r0 || !r0.ok) { toast(cible + ' : ' + ((r0 && r0.error) || 'refusé'), true); return; } }
    const r1 = await rollRpc('roll_scan', { p_numero: cible, p_personne: id.id, p_code: id.code, p_etape: 'rempli', p_client: c.client, p_note: total });
    if (!r1 || !r1.ok) { if (/code/i.test((r1 && r1.error) || '')) { try { localStorage.removeItem(CLE_ROLL_ID); } catch (e) {} } toast((r1 && r1.error) || 'Refusé', true); return; }
    if (ancien) {
      const r2 = await rollRpc('roll_scan', { p_numero: ancien, p_personne: id.id, p_code: id.code, p_etape: 'vide', p_client: null, p_note: 'n° corrigé : linge déplacé dans ' + cible });
      if (!r2 || !r2.ok) { toast('Linge mis dans ' + cible + '. ' + ancien + ' : ' + ((r2 && r2.error) || 'refusé') + ' → à vider au tunnel.', true); chariotsClient(c); return; }
    }
    toast('🧺 ' + cible + ' : ' + total);
    chariotsClient(c);
  } catch (e) { toast('Pas de réseau : réessayez.', true); }
}
async function rollIdentite(numero) {
  let id = lire(CLE_ROLL_ID, null);
  const opNom = sansAccent(lire(CLE_OP, '') || '');
  if (id && opNom && !sansAccent(id.nom).includes(opNom) && !opNom.includes(sansAccent(id.nom))) { try { localStorage.removeItem(CLE_ROLL_ID); } catch (e) {} id = null; }   // la personne a changé
  if (id) return id;
  const info = await rollRpc('roll_info', { p_numero: numero });
  const ps = ((info && info.personnes) || []).filter(p => /atelier|bureau/.test(p.role || ''));
  if (!ps.length) { toast('Aucune personne « Atelier » dans les rolls (page bureau → Personnes).', true); return null; }
  const op = String(lire(CLE_OP, '') || '').toLowerCase();
  let p = ps.find(x => String(x.nom).toLowerCase() === op) || (ps.length === 1 ? ps[0] : null);
  if (!p) { const n = prompt('Rolls — qui utilise cette tablette ?\n' + ps.map((x, i) => (i + 1) + '. ' + x.nom).join('\n') + '\n\nTapez le numéro :'); p = ps[(parseInt(n) || 0) - 1]; if (!p) return null; }
  const code = prompt('Rolls — code à 4 chiffres de « ' + p.nom + ' » (une seule fois sur cette tablette) :');
  if (!code) return null;
  id = { id: p.id, nom: p.nom, code: code.trim() };
  ecrire(CLE_ROLL_ID, id);
  // La personne choisie devient aussi « qui saisit » (bouton en haut à droite) : plus de redemande à chaque chariot
  if (sansAccent(lire(CLE_OP, '') || '') !== sansAccent(p.nom)) { ecrire(CLE_OP, p.nom); try { afficherOperateur(); } catch (e) {} }
  return id;
}
async function rollEnvoyer(x, essai) {
  essai = essai || 0;
  try {
    const id = await rollIdentite(x.numero);
    if (!id) { ecrire(CLE_ROLL_FILE, lire(CLE_ROLL_FILE, []).concat([x])); return; }
    if (x.avant) {   // remise à zéro du chariot (oubli du laveur…) avant de le remplir
      const r0 = await rollRpc('roll_scan', { p_numero: x.numero, p_personne: id.id, p_code: id.code, p_etape: 'vide', p_client: null, p_note: x.avant });
      if (r0 && r0.ok) { x.avant = null; toast('⚠ ' + x.numero + ' : incident noté (chariot pas libéré au tunnel)'); }
    }
    if (x.pour === undefined) x.pour = pourLivraison(x.client);   // calculé une fois (le chariot peut partir plus tard s'il n'y a pas de réseau)
    const note = x.pour ? avecTag(x.pour, x.contenu) : x.contenu;
    const r = await rollRpc('roll_scan', { p_numero: x.numero, p_personne: id.id, p_code: id.code, p_etape: 'rempli', p_client: x.client, p_note: note || null });
    if (!r.ok) {
      if (/code/i.test(r.error || '')) {
        try { localStorage.removeItem(CLE_ROLL_ID); } catch (e) {}
        // Code faux : on le redemande TOUT DE SUITE (2 essais de plus), sinon le chariot attend et sera redemandé au prochain démarrage
        if (essai < 2) { alert('Rolls : code incorrect. Retapez-le.'); return rollEnvoyer(x, essai + 1); }
        toast('Rolls : code incorrect. Le chariot ' + x.numero + ' attend : le code sera redemandé.', true);
        ecrire(CLE_ROLL_FILE, lire(CLE_ROLL_FILE, []).concat([x])); return;
      }
      toast('Chariot ' + x.numero + ' : ' + r.error, true); return;
    }
    toast('🧺 ' + x.numero + ' : rempli pour ' + x.client + (x.pour ? ' (' + x.pour + ')' : ''));
  } catch (e) {
    ecrire(CLE_ROLL_FILE, lire(CLE_ROLL_FILE, []).concat([x]));   // sans réseau : on réessaiera
  }
}
async function rollRenvoyer(demander) {
  const file = lire(CLE_ROLL_FILE, []); if (!file.length) return;
  if (!lire(CLE_ROLL_ID, null)) {
    if (!demander) return;
    // au démarrage : des chariots attendent (code faux, pas de réseau) → on demande le code pour les envoyer
    alert('Rolls : ' + file.length + ' chariot' + (file.length > 1 ? 's attendent' : ' attend') + ' d\'être enregistré' + (file.length > 1 ? 's' : '') + ' (' + file.map(x => x.numero + ' ' + x.client).join(', ') + ').\n\nTapez le code pour les envoyer.');
  }
  ecrire(CLE_ROLL_FILE, []);
  for (const x of file) await rollEnvoyer(x);
}
setInterval(() => rollRenvoyer(false), 60 * 1000);
setTimeout(() => rollRenvoyer(true), 4000);

function toast(msg, erreur) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = erreur ? 'erreur' : '';
  t.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.style.display = 'none'; }, 2500);
}

/* ---------- Écran toujours allumé (si l'appareil le permet) ---------- */
let verrouEcran = null;
async function garderEcranAllume() {
  try {
    if ('wakeLock' in navigator && !document.hidden) {
      verrouEcran = await navigator.wakeLock.request('screen');
    }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) garderEcranAllume(); });
garderEcranAllume();

/* ---------- Catalogue rafraîchi toutes les 10 minutes ---------- */
setInterval(chargerCatalogue, 10 * 60 * 1000);
setInterval(chargerJour, 2 * 60 * 1000);
setInterval(chargerListeJour, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { majJourAffiche(); chargerJour(); chargerListeJour(); } });

/* ---------- Relances automatiques ---------- */
setInterval(envoyer, 30000);
window.addEventListener('online', envoyer);
document.addEventListener('visibilitychange', () => { if (!document.hidden) envoyer(); });

/* ---------- Messages du bureau (bloquants) ---------- */
let messagesBureau = [], msgEnCorrection = null;
async function chargerMessages() {
  try {
    const rep = await fetch(API_URL + '?action=messages');
    const d = await rep.json();
    if (!d.ok) return;
    messagesBureau = d.messages || [];
    afficherMessages();
  } catch (e) {}
}
function afficherMessages() {
  const fond = document.getElementById('fondMsg');
  const aTraiter = messagesBureau.filter(m => !msgEnCorrection || m.id !== msgEnCorrection.id);
  if (msgEnCorrection || !aTraiter.length) { fond.style.display = 'none'; return; }
  const l = document.getElementById('listeMsg');
  l.innerHTML = '';
  aTraiter.forEach(m => {
    const d = document.createElement('div'); d.className = 'msg';
    const sujet = (m.client ? m.client : 'Général') + (m.journee ? ' — ' + libelleJour(m.journee) : '');
    d.innerHTML = '<div class="tete"></div><div class="txt"></div><div class="bts"></div>';
    d.querySelector('.tete').textContent = sujet + ' · ' + (m.de || 'Bureau') + ' · ' + m.le;
    d.querySelector('.txt').textContent = m.texte;
    const bts = d.querySelector('.bts');
    if (m.client) {
      const b1 = document.createElement('button'); b1.className = 'plein'; b1.textContent = '✎ Aller corriger';
      b1.onclick = () => allerCorriger(m); bts.appendChild(b1);
    } else {
      const b0 = document.createElement('button'); b0.className = 'plein'; b0.textContent = '✓ C\'est fait';
      b0.onclick = () => repondreMsg(m, 'corrigé', ''); bts.appendChild(b0);
    }
    const b2 = document.createElement('button'); b2.textContent = '💬 Répondre';
    b2.onclick = () => { const t = prompt('Réponse au bureau :'); if (t && t.trim()) repondreMsg(m, 'répondu', t.trim()); };
    bts.appendChild(b2);
    l.appendChild(d);
  });
  fond.style.display = 'flex';
}
function allerCorriger(m) {
  msgEnCorrection = m;
  document.getElementById('fondMsg').style.display = 'none';
  const auj = isoLocal(new Date());
  if (m.journee && m.journee !== jourCourant()) choisirJour(m.journee === auj ? null : m.journee);
  const c = catalogue.find(x => cleNom(x.client) === cleNom(m.client));
  if (c) afficherArticles(c, false, null);
  document.getElementById('txtCorr').textContent = 'Correction demandée : ' + m.client + (m.journee ? ' (' + libelleJour(m.journee) + ')' : '') + ' — « ' + m.texte + ' »';
  document.getElementById('bandeauCorr').style.display = 'flex';
}
function corrigeFini() {
  const m = msgEnCorrection; if (!m) return;
  repondreMsg(m, 'corrigé', '');
}
async function repondreMsg(m, etat, reponse) {
  const par = lire(CLE_OP, '') || 'Atelier';
  try {
    const rep = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'messageRepondre', id: m.id, etat: etat, reponse: reponse, par: par }) });
    const d = await rep.json();
    if (!d.ok) throw new Error(d.error || 'Refus du serveur');
  } catch (e) { toast('Impossible d\'envoyer la réponse (réseau ?). Réessaie.', true); return; }
  messagesBureau = messagesBureau.filter(x => x.id !== m.id);
  if (msgEnCorrection && msgEnCorrection.id === m.id) { msgEnCorrection = null; document.getElementById('bandeauCorr').style.display = 'none'; }
  toast('Merci, le bureau est prévenu.');
  afficherMessages();
}
setInterval(chargerMessages, 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) chargerMessages(); });
chargerMessages();

afficherOperateur();
afficherTablette();
majJourAffiche();
chargerJour();
chargerListeJour();
majStatut();
chargerCatalogue();
envoyer();
</script>

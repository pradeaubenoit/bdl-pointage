<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Signaler une panne — BdL</title>
<meta name="theme-color" content="#c62828">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--rouge:#c62828;--rouge2:#fdecec;--vert:#2e7d32;--vert2:#e6f4e7;--bleu:#1f5fa8;--txt:#1d2430;--doux:#6b7280;--ligne:#e3e6ea;--bg:#f4f5f7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{background:var(--rouge);color:#fff;padding:14px 16px;font-weight:700;font-size:18px}
main{max-width:560px;margin:0 auto;padding:14px 16px 40px}
.carte{background:#fff;border:1px solid var(--ligne);border-radius:14px;padding:16px;margin-bottom:14px}
.machine{font-size:24px;font-weight:800}
.chemin{color:var(--doux);font-size:14px;margin-top:2px}
label{display:block;font-size:14px;color:var(--doux);margin:14px 0 6px;font-weight:600}
input,textarea{font:inherit;width:100%;border:1px solid var(--ligne);border-radius:10px;padding:12px;background:#fff;color:inherit}
textarea{min-height:110px;resize:vertical}
.puces{display:flex;flex-wrap:wrap;gap:8px}
.puce{border:1px solid var(--ligne);background:#fff;border-radius:22px;padding:10px 14px;font:inherit;font-size:16px}
.puce.on{background:var(--rouge);border-color:var(--rouge);color:#fff}
.arret{display:flex;align-items:center;gap:12px;padding:14px;border:2px solid var(--ligne);border-radius:12px;margin-top:14px;cursor:pointer;font-weight:600}
.arret input{width:26px;height:26px}
.arret.on{border-color:var(--rouge);background:var(--rouge2);color:var(--rouge)}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:18px;font:inherit;font-size:20px;font-weight:800;margin-top:16px;cursor:pointer}
.btn.r{background:var(--rouge);color:#fff}.btn.g{background:#fff;border:1px solid var(--ligne);font-size:17px;font-weight:600;padding:14px}
.btn:disabled{opacity:.5}
.ok{text-align:center}.ok .grand{font-size:56px}.ok h2{margin:6px 0}
.deja{background:#fff8e1;border-color:#f3d27a}
.deja li{margin:4px 0}
.etiq{color:var(--doux);font-size:14px}
.dem{border-top:1px solid var(--ligne);padding:10px 0 4px;margin-top:8px}
.et{font-weight:700;margin:4px 0}.et.ok{color:var(--vert)}.et.cours{color:var(--bleu)}.et.att{color:#b26a00}
#apercu{max-width:100%;border-radius:10px;margin-top:8px;display:none}
</style>
</head>
<body>
<header>⚠ Signaler une panne — Blanchisserie du Limousin</header>
<main id="main"><div class="carte">Chargement…</div></main>
<input type="file" id="fPh" accept="image/*" capture="environment" style="display:none">
<script>
var sb=supabase.createClient('https://wjaesphordfjzavnptpu.supabase.co','sb_publishable_5mm_jnRkeRucn-VSNc6nhA_Htc6PBk8');
var CODE=(new URLSearchParams(location.search).get('m')||'').trim();
var M=null, photo=null, envoiEnCours=false;
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function lire(k){try{return localStorage.getItem(k)||'';}catch(e){return '';}}
function ecrire(k,v){try{localStorage.setItem(k,v);}catch(e){}}
var MOTIFS=['Fuite','Bruit anormal','Bloqué / ne démarre pas','Casse','Problème électrique','Linge abîmé','Autre'];

function mesDemandes(){try{return JSON.parse(localStorage.getItem('mes_demandes')||'[]');}catch(e){return [];}}
function ajouterDemande(n){var l=mesDemandes().filter(function(x){return x!==n;});l.unshift(n);try{localStorage.setItem('mes_demandes',JSON.stringify(l.slice(0,20)));}catch(e){}}
var SUIVI=[];
function bt(n){return 'BT-'+String(n||0).padStart(4,'0');}
function jourH(d){if(!d)return '';var x=new Date(d);return x.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})+' à '+x.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}
function etatDemande(b){
  if(b.statut==='Terminé')return '<div class="et ok">✅ Réparé le '+jourH(b.fin)+(b.intervenant?' par '+esc(b.intervenant):'')+'</div>'+(b.rapport?'<div class="etiq">'+esc(b.rapport)+'</div>':'');
  if(b.statut==='En cours')return '<div class="et cours">🔧 Réparation en cours'+(b.intervenant?' ('+esc(b.intervenant)+')':'')+'</div>';
  if(b.statut==='Attente pièce')return '<div class="et att">⏳ En attente d\'une pièce</div>';
  if(b.statut==='En pause')return '<div class="et att">⏸ Commencé, à terminer</div>';
  return '<div class="et att">🕓 Reçue, pas encore prise en charge</div>';
}
async function charger(){
  var t=[];
  if(CODE)t.push(sb.rpc('gmao_machine_publique',{p_code:CODE}).then(function(r){if(!r.error)M=r.data;}).catch(function(){}));
  var mes=mesDemandes();
  if(mes.length)t.push(sb.rpc('gmao_suivi_publique',{p_numeros:mes}).then(function(r){if(!r.error)SUIVI=r.data||[];}).catch(function(){}));
  await Promise.all(t);
  formulaire();
}
function blocSuivi(){
  if(!SUIVI.length)return '';
  return '<div class="carte"><b>📋 Mes demandes</b>'+SUIVI.slice(0,5).map(function(b){return '<div class="dem"><div><b>'+bt(b.numero)+'</b> · '+esc(b.titre)+' <span class="etiq">· '+jourH(b.le)+'</span></div>'+etatDemande(b)+'</div>';}).join('')+'</div>';
}
function formulaire(){
  var h='';
  if(M)h+='<div class="carte"><div class="etiq">Machine</div><div class="machine">'+esc(M.nom)+'</div><div class="chemin">'+esc(M.chemin)+' · '+esc(M.code)+'</div></div>';
  else h+='<div class="carte"><div class="etiq">Machine</div>'+(CODE?'<div class="machine" style="font-size:18px">Code « '+esc(CODE)+' » non reconnu</div>':'')+'<label>Où est le problème ? (machine, endroit)</label><input id="ou" placeholder="ex. séchoir 2, tapis sortie TR1…"></div>';
  if(M&&M.repares&&M.repares.length)h+='<div class="carte"><b>✅ Réparé récemment sur cette machine :</b>'+M.repares.map(function(b){return '<div class="dem"><div><b>'+bt(b.numero)+'</b> · '+esc(b.titre)+'</div><div class="et ok">Réparé le '+jourH(b.fin)+(b.intervenant?' par '+esc(b.intervenant):'')+'</div>'+(b.rapport?'<div class="etiq">'+esc(b.rapport)+'</div>':'')+'</div>';}).join('')+'</div>';
  if(M&&M.ouverts&&M.ouverts.length)h+='<div class="carte deja"><b>Déjà signalé sur cette machine :</b><ul>'+M.ouverts.map(function(b){return '<li>BT-'+String(b.numero).padStart(4,'0')+' · '+esc(b.titre)+' <span class="etiq">('+esc(b.statut)+')</span></li>';}).join('')+'</ul><div class="etiq">Si c\'est le même problème, inutile de refaire une demande.</div></div>';
  if(!CODE&&SUIVI.length){$('main').innerHTML=blocSuivi()+'<div class="etiq" style="text-align:center">Pour signaler une nouvelle panne, scanne l\'étiquette de la machine.</div>';return;}
  h=blocSuivi()+h;
  h+='<div class="carte"><label>Que se passe-t-il ?</label><div class="puces" id="motifs">'+MOTIFS.map(function(m){return '<button class="puce" type="button">'+esc(m)+'</button>';}).join('')+'</div>'+
    '<label>Explique en quelques mots</label><textarea id="txt" placeholder="Ce que tu vois, ce que tu entends, depuis quand…"></textarea>'+
    '<div class="arret" id="arret"><input type="checkbox" id="cbA"> ⛔ La machine est ARRÊTÉE</div>'+
    '<button class="btn g" id="bPh" type="button">📷 Prendre une photo</button><img id="apercu">'+
    '<label>Ton prénom</label><input id="nom" value="'+esc(lire('demande_nom'))+'" placeholder="Prénom">'+
    '<button class="btn r" id="env">Envoyer la demande</button></div>';
  $('main').innerHTML=h;
  var motif='';
  $('motifs').onclick=function(e){var b=e.target.closest('.puce');if(!b)return;document.querySelectorAll('.puce').forEach(function(x){x.classList.toggle('on',x===b);});motif=b.textContent;};
  $('arret').onclick=function(e){if(e.target.id!=='cbA')$('cbA').checked=!$('cbA').checked;$('arret').classList.toggle('on',$('cbA').checked);};
  $('bPh').onclick=function(){$('fPh').value='';$('fPh').click();};
  $('fPh').onchange=async function(){var f=this.files[0];if(!f)return;$('bPh').textContent='⏳ Envoi de la photo…';
    try{photo=await envoyerPhoto(f);$('bPh').textContent='✅ Photo ajoutée (toucher pour changer)';$('apercu').src=photo;$('apercu').style.display='block';}
    catch(e){photo=null;$('bPh').textContent='📷 Prendre une photo';alert('La photo n\'a pas pu être envoyée. Tu peux envoyer la demande sans photo.');}};
  $('env').onclick=async function(){
    if(envoiEnCours)return;
    var txt=$('txt').value.trim(),nom=$('nom').value.trim(),ou=$('ou')?$('ou').value.trim():'';
    if(!motif&&!txt){alert('Choisis ce qui se passe ou écris quelques mots.');return;}
    if(!nom){alert('Indique ton prénom.');$('nom').focus();return;}
    ecrire('demande_nom',nom);
    var titre=(motif&&motif!=='Autre'?motif:(txt.split('\n')[0].slice(0,60)||'Problème'))+(ou?' — '+ou:'');
    envoiEnCours=true;$('env').disabled=true;$('env').textContent='Envoi…';
    try{
      var r=await sb.rpc('gmao_demande_publique',{p_code:CODE||null,p_nom:nom,p_titre:titre,p_description:(ou?'Lieu : '+ou+'\n':'')+txt,p_arret:$('cbA').checked,p_photo:photo});
      if(r.error)throw r.error;
      var n=r.data&&r.data.numero;if(n)ajouterDemande(n);
      $('main').innerHTML='<div class="carte ok"><div class="grand">✅</div><h2>Demande envoyée</h2><p>N° <b>BT-'+String(n||0).padStart(4,'0')+'</b><br>Le service maintenance est prévenu.</p>'+($('cbA')&&$('cbA').checked?'<p style="color:var(--rouge);font-weight:700">Machine arrêtée : la demande est marquée URGENTE.</p>':'')+'<p class="etiq">Pour savoir quand c\'est réparé : rescanne l\'étiquette, ou ouvre ce lien plus tard :</p><a class="btn g" style="text-decoration:none;text-align:center;color:inherit" href="'+location.pathname+'">📋 Suivre mes demandes</a><button class="btn g" onclick="location.reload()">Faire une autre demande</button></div>';
    }catch(e){envoiEnCours=false;$('env').disabled=false;$('env').textContent='Envoyer la demande';alert('Envoi impossible (réseau ?). Réessaie dans un instant.');}
  };
}
async function envoyerPhoto(file){
  var img=await new Promise(function(ok,ko){var i=new Image();i.onload=function(){ok(i);};i.onerror=ko;i.src=URL.createObjectURL(file);});
  var k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  var blob=await new Promise(function(ok){c.toBlob(ok,'image/jpeg',0.8);});
  var nom='demandes/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
  var r=await sb.storage.from('gmao').upload(nom,blob,{contentType:'image/jpeg'});if(r.error)throw r.error;
  return sb.storage.from('gmao').getPublicUrl(nom).data.publicUrl;
}
charger();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BdL Linge — Relevés clients</title>
<style>
  :root {
    --fond: #F2F4F5;
    --encre: #1D2B34;
    --doux: #5B6B75;
    --trait: #D9E0E4;
    --carte: #FFFFFF;
    --accent: #0F6E8A;
    --ok: #2E7D4F;
    --ok-fond: #E6F2EA;
    --orange: #C26A12;
    --orange-fond: #FBEFDF;
    --alerte: #B3412B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fond); color: var(--encre);
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; font-size: 15px;
  }
  header {
    background: var(--encre); color: #fff; padding: 14px 28px;
    display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 20px; font-weight: 700; flex: 1; }
  .onglets { display: flex; gap: 6px; }
  .onglets button {
    border: 0; padding: 9px 18px; border-radius: 8px; font-size: 15px; font-weight: 600;
    background: transparent; color: #C9D4DA; cursor: pointer;
  }
  .onglets button.actif { background: #fff; color: var(--encre); }
  #nom { border: 1px solid #ffffff55; background: transparent; color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 14px; cursor: pointer; }

  .outils {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 14px 28px; background: var(--carte); border-bottom: 1px solid var(--trait);
  }
  .outils input { font-size: 15px; padding: 7px 10px; border: 1px solid var(--trait); border-radius: 8px; }
  .outils .espace { flex: 1; }
  .btn {
    border: 1px solid var(--trait); background: var(--carte); color: var(--encre);
    padding: 8px 14px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .btn.principal { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.fleche { padding: 8px 12px; }
  #diffuser { display: none; }

  main { padding: 20px 28px 48px; }
  .bandeau { display: flex; align-items: baseline; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
  #titre { font-size: 18px; font-weight: 700; }
  #compteur {
    font-size: 22px; font-weight: 800; padding: 8px 16px; border-radius: 10px;
    background: var(--orange-fond); color: var(--orange);
  }
  #compteur.fini { background: var(--ok-fond); color: var(--ok); }
  #etat { color: var(--doux); }
  #etat.erreur { color: var(--alerte); font-weight: 600; }
  #attente { display: none; margin-bottom: 14px; padding: 10px 14px; border-radius: 8px; background: #FFF6D6; color: #6B5300; font-weight: 600; }

  .grille { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
  .tuile {
    position: relative; min-height: 104px; padding: 14px 16px; border-radius: 12px; cursor: pointer;
    background: var(--carte); border: 2px solid var(--trait); border-left: 8px solid var(--accent);
    text-align: left; font: inherit; color: inherit;
  }
  .tuile:hover { border-color: var(--accent); }
  .tuile .nom { font-size: 20px; font-weight: 700; text-transform: capitalize; padding-right: 26px; }
  .tuile .info { margin-top: 8px; color: var(--doux); font-size: 15px; }
  .tuile .badge { display: inline-block; margin-top: 8px; font-size: 13px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
  .tuile.pointe { background: var(--ok-fond); border-color: #B9DCC5; border-left-color: var(--ok); }
  .tuile.pointe .nom::before { content: "✓ "; color: var(--ok); }
  .tuile.vide { background: var(--orange-fond); border-left-color: var(--orange); }
  .tuile.vide .badge { background: #fff; color: var(--orange); }
  .tuile.nouveau .badge { background: #E3EEF2; color: var(--accent); }
  .tuile.vide.nouveau .badge { background: #fff; color: var(--orange); }
  .tuile.retire { opacity: .45; text-decoration: line-through; }
  .tuile.saisi { background: #EAF2FB; border-left-color: #2F6FB3; }
  .tuile.saisi .badge { background: #fff; color: #2F6FB3; }
  .tuile.absent { background: #F2F4F5; border-left-color: #B8C2C8; opacity: .6; }
  .tuile.absent .badge { background: #fff; color: var(--doux); }
  .legende { display: flex; gap: 16px; flex-wrap: wrap; margin: -6px 0 14px; color: var(--doux); font-size: 14px; }
  .legende span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .legende .l-orange::before { background: var(--orange); }
  .legende .l-bleu::before { background: #2F6FB3; }
  .legende .l-vert::before { background: var(--ok); }
  .legende .l-gris::before { background: #B8C2C8; }
  .tuile.ajoute { border-style: dashed; }
  .tuile.ajoute .badge { background: #FFF6D6; color: #6B5300; }
  #compteur:empty { display: none; }
  #fondAjout {
    display: none; position: fixed; inset: 0; background: rgba(29,43,52,.45);
    align-items: center; justify-content: center; padding: 20px; z-index: 20;
  }
  #panneauAjout { background: var(--carte); border-radius: 14px; width: 100%; max-width: 520px; max-height: 90vh; display: flex; flex-direction: column; }
  #panneauAjout h2 { margin: 0; padding: 16px 20px; font-size: 19px; border-bottom: 3px solid var(--accent); }
  #listeAjout { overflow: auto; padding: 8px 20px; }
  #listeAjout label { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--trait); font-size: 17px; text-transform: capitalize; cursor: pointer; }
  #listeAjout input { width: 22px; height: 22px; }
  .croix {
    position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 6px;
    border: 0; background: transparent; color: var(--doux); font-size: 20px; cursor: pointer; line-height: 1;
  }
  .croix:hover { background: #0001; }
  .vide-liste { color: var(--doux); font-style: italic; }

  #fond {
    display: none; position: fixed; inset: 0; background: rgba(29,43,52,.45);
    align-items: center; justify-content: center; padding: 20px; z-index: 20;
  }
  #panneau { background: var(--carte); border-radius: 14px; width: 100%; max-width: 460px; max-height: 90vh; overflow: auto; }
  #panneau h2 { margin: 0; padding: 16px 20px; font-size: 20px; text-transform: capitalize; border-bottom: 3px solid var(--accent); }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 9px 20px; border-bottom: 1px solid var(--trait); }
  td.q { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; width: 90px; }
  tr.total td { font-weight: 800; background: #F7F9FA; }
  .actions { display: flex; gap: 10px; padding: 16px 20px; }
  .actions .btn { flex: 1; padding: 12px; }
  .actions .ok { background: var(--ok); border-color: var(--ok); color: #fff; }

  .impression { display: none; }
  @media print {
    header, .outils, .bandeau, #attente, .grille, #fond { display: none !important; }
    body { background: #fff; }
    .impression { display: block; }
    .impression h2 { font-size: 18px; margin: 0 0 12px; }
    .impression section { break-inside: avoid; margin-bottom: 14px; border: 1px solid #999; }
    .impression h3 { margin: 0; padding: 6px 10px; font-size: 15px; text-transform: capitalize; border-bottom: 1px solid #999; }
    .impression td { padding: 4px 10px; border-bottom: 1px solid #ddd; }
  }
</style>
</head>
<body>
<header>
  <h1>BdL Linge — Relevés clients</h1>
  <div class="onglets">
    <button id="ongletJour" class="actif" onclick="choisirMode('jour')">Jour</button>
    <button id="ongletMois" onclick="choisirMode('mois')">Mois</button>
  </div>
  <button id="nom" onclick="changerNom()">Qui pointe ?</button>
</header>

<div class="outils">
  <button class="btn fleche" onclick="decaler(-1)">◀</button>
  <input id="periode" type="date" onchange="charger()">
  <button class="btn fleche" onclick="decaler(1)">▶</button>
  <button class="btn" onclick="allerAujourdhui()">Aujourd'hui</button>
  <button class="btn" onclick="charger()">Actualiser</button>
  <span class="espace"></span>
  <button class="btn" id="diffuser" onclick="diffuser()">Diffuser ce jour</button>
  <button class="btn" onclick="exporterCSV()">Export CSV</button>
  <button class="btn principal" onclick="window.print()">Imprimer</button>
</div>

<main>
  <div class="bandeau">
    <span id="titre"></span>
    <span id="compteur"></span>
    <span id="etat">Chargement…</span>
  </div>
  <div id="legende" class="legende"></div>
  <div id="attente"></div>
  <div id="zone" class="grille"></div>
  <div class="impression" id="impression"></div>
</main>

<div id="fondAjout" onclick="if (event.target === this) fermerAjout()">
  <div id="panneauAjout">
    <h2>Ajouter à la journée type</h2>
    <div id="listeAjout"></div>
    <div class="actions">
      <button class="btn" onclick="toutCocher()">Tout cocher</button>
      <button class="btn" onclick="fermerAjout()">Annuler</button>
      <button class="btn ok" onclick="validerAjout()">Ajouter</button>
    </div>
  </div>
</div>

<div id="fond" onclick="if (event.target === this) fermer()">
  <div id="panneau">
    <h2 id="pNom"></h2>
    <table id="pTable"></table>
    <div class="actions">
      <button class="btn" onclick="fermer()">Fermer</button>
      <button class="btn ok" id="pBouton"></button>
    </div>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxxHYpmiuhfyoKgzPmAwDtuuyxNx-uOalpohNT7p6Zrl2BPFnOGd0P-Q7_iNHVSTQc/exec';
const CLE_NOM = 'linge_bureau_nom';
let mode = 'jour';
let tableau = null;
let retires = new Set();
let ajoutes = [];
let codeResponsable = '';

/* ---------- Utilitaires ---------- */
function p2(n) { return String(n).padStart(2, '0'); }
function isoJour(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
function lireNom() { try { return localStorage.getItem(CLE_NOM) || ''; } catch (e) { return ''; } }
function ecrireNom(n) { try { localStorage.setItem(CLE_NOM, n); } catch (e) {} }
function cle(s) { return String(s || '').trim().replace(/\s+/g, ' ').toLowerCase(); }

function afficherNom() { document.getElementById('nom').textContent = lireNom() || 'Qui pointe ?'; }
function changerNom() {
  const n = prompt('Ton prénom (il sera noté sur chaque pointage) :', lireNom());
  if (n !== null && n.trim()) { ecrireNom(n.trim()); afficherNom(); }
  return lireNom();
}

/* ---------- Période ---------- */
function choisirMode(m) {
  mode = m;
  document.getElementById('ongletJour').classList.toggle('actif', m === 'jour');
  document.getElementById('ongletMois').classList.toggle('actif', m === 'mois');
  document.getElementById('diffuser').style.display = m === 'jour' ? 'inline-block' : 'none';
  allerAujourdhui();
}

function allerAujourdhui() {
  const champ = document.getElementById('periode');
  const auj = isoJour(new Date());
  champ.type = mode === 'jour' ? 'date' : 'month';
  champ.value = mode === 'jour' ? auj : auj.slice(0, 7);
  charger();
}

function decaler(sens) {
  const champ = document.getElementById('periode');
  if (!champ.value) return;
  if (mode === 'jour') {
    const [a, m, j] = champ.value.split('-').map(Number);
    champ.value = isoJour(new Date(a, m - 1, j + sens));
  } else {
    const [a, m] = champ.value.split('-').map(Number);
    const d = new Date(a, m - 1 + sens, 1);
    champ.value = d.getFullYear() + '-' + p2(d.getMonth() + 1);
  }
  charger();
}

function libelle() {
  if (!tableau) return '';
  if (mode === 'jour') {
    const [a, m, j] = tableau.periode.split('-');
    return tableau.jour.charAt(0).toUpperCase() + tableau.jour.slice(1) + ' ' + j + '/' + m + '/' + a;
  }
  const [a, m] = tableau.periode.split('-');
  const nom = new Date(Number(a), Number(m) - 1, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
  return 'Mois de ' + nom;
}

/* ---------- Chargement ---------- */
async function charger() {
  const v = document.getElementById('periode').value;
  if (!v) return;
  retires = new Set();
  ajoutes = [];
  const etat = document.getElementById('etat');
  etat.className = ''; etat.textContent = 'Chargement…';
  try {
    const rep = await fetch(API_URL + '?action=tableau&mode=' + mode + '&periode=' + v);
    const data = await rep.json();
    if (!data.ok) throw new Error(data.error || 'Réponse invalide');
    tableau = data;
    afficher();
    etat.textContent = 'mis à jour à ' + new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  } catch (err) {
    tableau = null;
    document.getElementById('zone').innerHTML = '';
    document.getElementById('compteur').textContent = '';
    etat.className = 'erreur';
    etat.textContent = 'Impossible de charger (' + err.message + ').';
  }
}

/* ---------- Affichage ---------- */
function avecPlan() { return mode === 'jour' && tableau && tableau.planOk; }
// Journée terminée : un client lavé mais jamais saisi n'est plus « à saisir », il passe en gris.
function journeeFinie() { return mode === 'jour' && tableau && tableau.periode < isoJour(new Date()); }

// pointe (vert) · oubli (orange) · saisi (bleu) · absent (gris)
function etat(c) {
  if (c.pointe) return 'pointe';
  if (avecPlan()) {
    if (c.recu) return 'saisi';
    if (c.lave && !journeeFinie()) return 'oubli';
    return 'absent';
  }
  return c.recu ? 'saisi' : 'oubli';
}

function compte(c) {
  if (retires.has(cle(c.client)) && !c.recu) return false;
  if (avecPlan()) return (c.lave && !journeeFinie()) || c.recu || c.pointe;
  return true;
}

function afficher() {
  document.getElementById('titre').textContent = libelle();
  const zone = document.getElementById('zone');
  zone.innerHTML = '';
  const clients = listeAffichee().slice().sort((a, b) =>
    ((etat(a) === 'absent') - (etat(b) === 'absent')) || a.client.localeCompare(b.client, 'fr'));

  const leg = document.getElementById('legende');
  leg.innerHTML = mode === 'jour'
    ? (avecPlan()
        ? '<span class="l-orange">Lavé, rien saisi</span><span class="l-bleu">Saisi, à pointer</span><span class="l-vert">Pointé</span><span class="l-gris">Pas lavé aujourd\'hui</span>'
        : '<span class="l-orange">Rien reçu de l\'atelier</span><span class="l-bleu">Saisi, à pointer</span><span class="l-vert">Pointé</span> · plan de travail injoignable, couleurs selon la journée type')
    : '';

  const aCompter = clients.filter(compte);
  const reste = aCompter.filter(c => !c.pointe).length;
  const cpt = document.getElementById('compteur');
  cpt.textContent = aCompter.length
    ? (reste ? 'Reste à pointer : ' + reste + ' / ' + aCompter.length : 'Tout est pointé ✓ (' + aCompter.length + ')')
    : '';
  cpt.className = reste ? '' : 'fini';

  majAttente();

  if (!clients.length) {
    zone.innerHTML = '<p class="vide-liste">' + (mode === 'jour'
      ? 'Aucun client attendu ni saisi ce jour. Quand l\'atelier aura saisi, utilise « Diffuser ce jour » pour enregistrer la journée type.'
      : 'Aucun client.') + '</p>';
    return;
  }

  clients.forEach(c => {
    const k = cle(c.client);
    const t = document.createElement('div');
    t.className = 'tuile';
    const et = etat(c);
    if (et === 'pointe') t.classList.add('pointe');
    else if (et === 'oubli') t.classList.add('vide');
    else if (et === 'saisi') t.classList.add('saisi');
    else t.classList.add('absent');
    if (mode === 'jour' && !c.attendu && !c.ajoute) t.classList.add('nouveau');
    if (c.ajoute) t.classList.add('ajoute');
    if (retires.has(k)) t.classList.add('retire');

    let html = '<div class="nom"></div><div class="info">' +
      (c.recu ? c.total + ' pièce' + (c.total > 1 ? 's' : '') : 'Aucune pièce') + '</div>';
    if (c.ajoute) html += '<span class="badge">À diffuser</span>';
    else if (et === 'oubli' && c.reporteDe) html += '<span class="badge">Lavé le ' + c.reporteDe.slice(8, 10) + '/' + c.reporteDe.slice(5, 7) + ', rien saisi</span>';
    else if (et === 'oubli') html += '<span class="badge">' + (avecPlan() ? 'Lavé, rien saisi' : 'Rien reçu de l\'atelier') + '</span>';
    else if (et === 'absent') html += '<span class="badge">' + (c.lave ? 'Lavé, rien saisi' : 'Pas lavé aujourd\'hui') + '</span>';
    else if (avecPlan() && c.recu && !c.lave && !c.pointe) html += '<span class="badge">Non vu au lavage</span>';
    else if (mode === 'jour' && !c.attendu) html += '<span class="badge">Nouveau ce jour</span>';
    t.innerHTML = html;
    t.querySelector('.nom').textContent = c.client;

    if (mode === 'jour' && (c.attendu || c.ajoute)) {
      const x = document.createElement('button');
      x.className = 'croix';
      x.title = retires.has(k) ? 'Garder dans la journée type' : 'Retirer de la journée type';
      x.textContent = retires.has(k) ? '↺' : '×';
      x.onclick = ev => {
        ev.stopPropagation();
        if (c.ajoute) { ajoutes = ajoutes.filter(n => cle(n) !== k); afficher(); }
        else basculerRetrait(k);
      };
      t.appendChild(x);
    }
    t.onclick = () => ouvrir(c);
    zone.appendChild(t);
  });

  afficherImpression();
}

function majAttente() {
  const div = document.getElementById('attente');
  if (mode !== 'jour' || !tableau) { div.style.display = 'none'; return; }
  const ajouts = tableau.clients.filter(c => !c.attendu && c.recu && !retires.has(cle(c.client))).map(c => c.client).concat(ajoutes);
  const retraits = tableau.clients.filter(c => retires.has(cle(c.client))).map(c => c.client);
  if (!ajouts.length && !retraits.length) { div.style.display = 'none'; return; }
  const parts = [];
  if (ajouts.length) parts.push('à ajouter : ' + ajouts.join(', '));
  if (retraits.length) parts.push('à retirer : ' + retraits.join(', '));
  div.textContent = 'Journée type du ' + tableau.jour + ' non diffusée — ' + parts.join(' · ');
  div.style.display = 'block';
}

function basculerRetrait(k) {
  if (retires.has(k)) retires.delete(k); else retires.add(k);
  afficher();
}

/* ---------- Détail et pointage ---------- */
function ouvrir(c) {
  document.getElementById('pNom').textContent = c.client;
  const t = document.getElementById('pTable');
  t.innerHTML = '';
  if (!c.articles.length) {
    const tr = t.insertRow(); const td = tr.insertCell();
    td.colSpan = 2; td.className = 'vide-liste'; td.textContent = 'Aucune saisie de l\'atelier sur cette période.';
  }
  c.articles.forEach(a => {
    const tr = t.insertRow();
    tr.insertCell().textContent = a.article;
    const q = tr.insertCell(); q.className = 'q'; q.textContent = a.quantite;
  });
  if (c.articles.length) {
    const tr = t.insertRow(); tr.className = 'total';
    tr.insertCell().textContent = 'Total pièces';
    const q = tr.insertCell(); q.className = 'q'; q.textContent = c.total;
  }
  const b = document.getElementById('pBouton');
  b.textContent = c.pointe ? 'Annuler le pointage' : 'Marquer comme saisi ✓';
  b.className = c.pointe ? 'btn' : 'btn ok';
  b.onclick = () => pointer(c);
  document.getElementById('fond').style.display = 'flex';
}

function fermer() { document.getElementById('fond').style.display = 'none'; }

async function pointer(c) {
  let nom = lireNom();
  if (!nom) nom = changerNom();
  if (!nom) return;
  const fait = !c.pointe;
  fermer();
  c.pointe = fait;
  afficher();
  try {
    const rep = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'pointer', periode: tableau.periode, client: c.client, fait: fait, par: nom })
    });
    const data = await rep.json();
    if (!data.ok) throw new Error(data.error || 'Refus du serveur');
  } catch (err) {
    c.pointe = !fait;
    afficher();
    alert('Le pointage n\'a pas pu être enregistré (' + err.message + '). Vérifie la connexion et réessaie.');
  }
}

/* ---------- Ajout manuel de clients à la journée ---------- */
let catalogueClients = [];

function listeAffichee() {
  if (!tableau) return [];
  const extra = ajoutes.map(n => ({ client: n, attendu: false, ajoute: true, articles: [], total: 0, recu: false, pointe: false }));
  // Lavé ce jour mais livré (et saisi) le jour suivant : il est compté sur le jour de livraison.
  const gardes = tableau.clients.filter(c => !(c.reporte && !c.recu && !c.pointe));
  return gardes.concat(extra).sort((a, b) => a.client.localeCompare(b.client, 'fr'));
}

async function ouvrirAjout() {
  if (!tableau) return;
  const liste = document.getElementById('listeAjout');
  liste.innerHTML = '<p class="vide-liste">Chargement…</p>';
  document.getElementById('fondAjout').style.display = 'flex';
  try {
    const rep = await fetch(API_URL + '?action=catalogue');
    const data = await rep.json();
    if (!data.ok) throw new Error(data.error || 'Réponse invalide');
    catalogueClients = data.catalogue.map(c => c.client);
  } catch (err) {
    liste.innerHTML = '<p class="vide-liste">Catalogue introuvable (' + err.message + ').</p>';
    return;
  }
  const presents = new Set(listeAffichee().map(c => cle(c.client)));
  const dispo = catalogueClients.filter(n => !presents.has(cle(n))).sort((a, b) => a.localeCompare(b, 'fr'));
  liste.innerHTML = '';
  if (!dispo.length) { liste.innerHTML = '<p class="vide-liste">Tous les clients du catalogue sont déjà dans cette journée.</p>'; return; }
  dispo.forEach(n => {
    const l = document.createElement('label');
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.value = n;
    l.appendChild(cb); l.appendChild(document.createTextNode(n));
    liste.appendChild(l);
  });
}

function toutCocher() {
  const cases = document.querySelectorAll('#listeAjout input');
  const tous = Array.from(cases).every(c => c.checked);
  cases.forEach(c => { c.checked = !tous; });
}

function fermerAjout() { document.getElementById('fondAjout').style.display = 'none'; }

function validerAjout() {
  document.querySelectorAll('#listeAjout input:checked').forEach(c => {
    if (!ajoutes.some(n => cle(n) === cle(c.value))) ajoutes.push(c.value);
  });
  fermerAjout();
  afficher();
}

/* ---------- Diffusion de la journée type ---------- */
async function diffuser() {
  if (!tableau || mode !== 'jour') return;
  const liste = tableau.clients.filter(c => (c.attendu || c.recu) && !retires.has(cle(c.client))).map(c => c.client).concat(ajoutes);
  const ajouts = tableau.clients.filter(c => !c.attendu && c.recu && !retires.has(cle(c.client))).map(c => c.client).concat(ajoutes);
  const retraits = tableau.clients.filter(c => c.attendu && retires.has(cle(c.client))).map(c => c.client);
  let msg = 'Diffuser comme journée type de tous les ' + tableau.jour + 's ?\n\n' +
    'Clients retenus (' + liste.length + ') : ' + (liste.join(', ') || 'aucun') + '\n';
  msg += '\nAjouts : ' + (ajouts.join(', ') || 'aucun');
  msg += '\nRetraits : ' + (retraits.join(', ') || 'aucun');
  if (!confirm(msg)) return;
  if (!codeResponsable) {
    const c = prompt('Code responsable :');
    if (!c || !c.trim()) return;
    codeResponsable = c.trim();
  }
  try {
    const rep = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'diffuser', code: codeResponsable, date: tableau.periode, clients: liste })
    });
    const data = await rep.json();
    if (!data.ok) {
      if (data.error === 'Code incorrect') codeResponsable = '';
      throw new Error(data.error || 'Refus du serveur');
    }
    alert('Journée type du ' + data.jour + ' enregistrée : ' + data.clients.length + ' client(s).');
    charger();
  } catch (err) {
    alert('Diffusion impossible : ' + err.message);
  }
}

/* ---------- Export et impression ---------- */
function exporterCSV() {
  if (!tableau || !tableau.clients.some(c => c.articles.length)) { alert('Rien à exporter sur cette période.'); return; }
  const lignes = [['Client', 'Article', 'Quantité', 'Pointé']];
  tableau.clients.forEach(c => c.articles.forEach(a => lignes.push([c.client, a.article, a.quantite, c.pointe ? 'oui' : 'non'])));
  const csv = lignes.map(l => l.map(x => '"' + String(x).replace(/"/g, '""') + '"').join(';')).join('\r\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'linge-' + mode + '-' + tableau.periode + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

function afficherImpression() {
  const z = document.getElementById('impression');
  z.innerHTML = '';
  const h = document.createElement('h2'); h.textContent = libelle(); z.appendChild(h);
  tableau.clients.filter(c => c.articles.length).forEach(c => {
    const s = document.createElement('section');
    const t = document.createElement('h3'); t.textContent = c.client + (c.pointe ? ' ✓' : ''); s.appendChild(t);
    const tab = document.createElement('table');
    c.articles.forEach(a => { const r = tab.insertRow(); r.insertCell().textContent = a.article; const q = r.insertCell(); q.className = 'q'; q.textContent = a.quantite; });
    const r = tab.insertRow(); r.className = 'total'; r.insertCell().textContent = 'Total'; const q = r.insertCell(); q.className = 'q'; q.textContent = c.total;
    s.appendChild(tab); z.appendChild(s);
  });
}

afficherNom();
choisirMode('jour');

/* ---------- Mise à jour automatique ---------- */
// Toutes les 60 s et au retour sur la page, sauf si une action est en cours
// (fenêtre ouverte, retraits ou ajouts pas encore diffusés).
function actualiserSiLibre() {
  if (document.hidden) return;
  if (document.getElementById('fond').style.display === 'flex') return;
  const fa = document.getElementById('fondAjout');
  if (fa && fa.style.display === 'flex') return;
  if (retires.size || (typeof ajoutes !== 'undefined' && ajoutes.length)) return;
  const y = window.scrollY;
  charger().then(() => window.scrollTo(0, y));
}
setInterval(actualiserSiLibre, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) actualiserSiLibre(); });

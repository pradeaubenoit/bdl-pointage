<style>
:root{
  --bg:#f4f5f7;--carte:#fff;--txt:#1d2430;--doux:#6b7280;--ligne:#e3e6ea;

}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:var(--bleu);text-decoration:none}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;border:1px solid var(--ligne);border-radius:8px;padding:9px 10px;background:#fff;width:100%}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:12px;color:var(--doux);margin:10px 0 3px}
header{position:sticky;top:0;z-index:20;background:#16324f;color:#fff;display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap}
header h1{font-size:17px;margin:0 10px 0 0;white-space:nowrap}
nav{display:flex;gap:4px;overflow-x:auto;flex:1}
nav a{color:#cfe0f3;padding:7px 11px;border-radius:8px;white-space:nowrap;font-size:14px}
nav a.on{background:#fff;color:#16324f;font-weight:600}
#qui{font-size:12px;color:#cfe0f3;white-space:nowrap}
main{max-width:1100px;margin:0 auto;padding:14px 16px 90px}
.carte{background:var(--carte);border:1px solid var(--ligne);border-radius:12px;padding:14px;margin-bottom:12px}
.carte h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.carte h2 .d{margin-left:auto}
h1.titre{font-size:20px;margin:4px 0 12px}
.btn{border:1px solid var(--ligne);background:#fff;border-radius:8px;padding:8px 12px;font-weight:500}
.btn.p{background:var(--bleu);border-color:var(--bleu);color:#fff}
.btn.r{background:var(--rouge);border-color:var(--rouge);color:#fff}
.btn.v{background:var(--vert);border-color:var(--vert);color:#fff}
.btn.l{border:none;background:none;color:var(--bleu);padding:4px 6px}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.5}
.gros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.gros .btn{flex:1;min-width:200px;padding:16px;font-size:17px;border-radius:12px}
.tuiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.tuile{background:#fff;border:1px solid var(--ligne);border-radius:12px;padding:12px;display:block;color:var(--txt)}
.tuile b{display:block;font-size:26px}
.tuile span{font-size:13px;color:var(--doux)}
.tuile.alerte b{color:var(--rouge)}
.ligne{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--ligne);color:var(--txt)}
.ligne:last-child{border-bottom:none}
.ligne:hover{background:#fafbfc}
.ligne .g{flex:1;min-width:0}
.ligne .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.ligne .s{font-size:12.5px;color:var(--doux);overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--gris2);color:#444;white-space:nowrap}
.b-rouge{background:var(--rouge2);color:var(--rouge)}.b-vert{background:var(--vert2);color:var(--vert)}
.b-orange{background:var(--orange2);color:var(--orange)}.b-bleu{background:var(--bleu2);color:var(--bleu)}
.pt{display:inline-block;width:9px;height:9px;border-radius:50%;background:#bbb;flex:none}
.pt.Critique{background:var(--rouge)}.pt.Haute{background:var(--orange)}.pt.Normale{background:#4a90d9}.pt.Basse{background:#9bb}
.grille{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:640px){.grille{grid-template-columns:1fr}.gros .btn{min-width:100%}}
.rech{position:relative;margin-bottom:10px}
.rech input{padding-left:34px;font-size:16px}
.rech:before{content:"🔎";position:absolute;left:10px;top:9px;font-size:15px}
.puces{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.puce{border:1px solid var(--ligne);background:#fff;border-radius:20px;padding:5px 12px;font-size:13px}

.chemin a{color:var(--doux);text-decoration:underline dotted}
.photo{width:100%;max-height:260px;object-fit:contain;border-radius:10px;background:#f0f1f3}
.mini{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#eef0f2;flex:none}
.fil .msg{padding:9px 11px;border-radius:10px;background:#f6f7f9;margin-bottom:8px}
.fil .msg.sys{background:none;font-size:12.5px;color:var(--doux);padding:2px 4px}
.fil .msg .q{font-size:12px;color:var(--doux);margin-bottom:3px}

.stats{display:flex;gap:16px;flex-wrap:wrap}

.vide{color:var(--doux);font-style:italic;padding:8px 4px}
.etiq{font-size:12px;color:var(--doux)}
#fond{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto}
#fond.on{display:flex}
#boite{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.25)}

.liste-choix{max-height:55vh;overflow:auto;margin-top:8px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#16324f;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;display:none}
table.imp{width:100%;border-collapse:collapse;font-size:13px}
table.imp td,table.imp th{border-bottom:1px solid var(--ligne);padding:5px;text-align:left;vertical-align:top}
table.imp tr.ex{opacity:.45}
.warn{color:var(--orange);font-size:12px}
#login{max-width:360px;margin:70px auto}
.grosbt{display:flex;gap:10px;margin-top:14px}
.btn.o{background:var(--orange);border-color:var(--orange);color:#fff}
.chrono.rouge{background:var(--rouge2);color:var(--rouge)}
.barre{height:8px;background:rgba(0,0,0,.08);border-radius:5px;margin-top:8px;overflow:hidden}.barre>div{height:100%;background:var(--vert);border-radius:5px}
.chrono .barre>div{background:var(--orange)}.chrono.rouge .barre>div,.barre.rouge>div{background:var(--rouge)}.barre.gros{height:14px;margin:4px 0 8px}
.alerte{background:var(--rouge2);color:var(--rouge);padding:8px 10px;border-radius:8px;margin-bottom:8px}
.check{display:flex;flex-direction:column;gap:6px}
.ck{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--ligne);border-radius:10px;cursor:pointer;font-size:16px;user-select:none}
.ck .bx{width:28px;height:28px;border:2px solid #9aa3ad;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none}
.ck.ok{background:var(--vert2);border-color:#b7dcb9}.ck.ok .bx{background:var(--vert);border-color:var(--vert)}.ck.ok .g{text-decoration:line-through;color:#4b6b4d}
.grosbt .btn{flex:1;padding:18px 10px;font-size:19px;border-radius:12px;font-weight:700}
.chrono{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--orange2);color:#7a4300;font-size:15px}
@media(max-width:640px){header h1{font-size:15px}#qui{display:none}main{padding:10px 10px 80px}h1.titre{font-size:18px}}
</style>
</head>

<script>
/* =====================================================================
   GMAO BdL — v1
   ===================================================================== */
var VERSION='v6.1';
var SB_URL='https://wjaesphordfjzavnptpu.supabase.co';
var SB_KEY='sb_publishable_5mm_jnRkeRucn-VSNc6nhA_Htc6PBk8';
var sb=supabase.createClient(SB_URL,SB_KEY);
var USER=null, NOM='';
var EQ=[], EQID={}, MOD=[], MODID={}, ART=[], ARTID={}, LIENS=[], PREV=[], PART=[], MES=[], MESID={}, DERN={}, V2=true, SRC=[], SRCA={}, V4=true, PERS=[], STATS={}, V6=true;

/* ---------- outils ---------- */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();}
function compact(s){return norm(s).replace(/[^a-z0-9]/g,'');}
function correspond(q,hay){
  var w=norm(q).split(' ').filter(Boolean); if(!w.length)return true;
  var h=norm(hay), hc=compact(hay);
  return w.every(function(x){
    if(h.indexOf(x)>=0)return true;
    var xc=compact(x); if(xc&&hc.indexOf(xc)>=0)return true;
    if(x.length>3){var r=x.replace(/(s|x|es)$/,''); if(h.indexOf(r)>=0)return true;}
    return false;
  });
}
/* les meilleurs résultats d'abord : nom qui contient la recherche entière, puis tous les mots dans le nom */
function trier(t,l,prim){
  if(!t||!prim)return l;var qn=norm(t),qc=compact(t);
  function sc(x){var n=norm(prim(x)),c=compact(prim(x));if(c===qc)return 0;if(n.indexOf(qn)>=0||c.indexOf(qc)>=0)return 1;if(correspond(t,prim(x)))return 2;return 3;}
  return l.map(function(x,i){return [sc(x),i,x];}).sort(function(a,b){return a[0]-b[0]||a[1]-b[1];}).map(function(a){return a[2];});
}
function toast(t){var e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(function(){e.style.display='none';},2600);}
function erreur(e){console.error(e);toast('⚠ '+((e&&e.message)||e||'Erreur'));}
function fmtD(d){if(!d)return'';var x=new Date(d);return x.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'});}
function fmtDH(d){if(!d)return'';var x=new Date(d);return x.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})+' '+x.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}
function auj(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function ajoutJours(iso,n){var d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function joursEntre(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);}
function minutesDepuis(d){return Math.max(0,Math.round((Date.now()-new Date(d))/60000));}
function qrTel(){
  var url=location.href;
  ouvrir('<h3>📱 Ouvrir sur le téléphone</h3><div class="etiq">Vise ce code avec l\'appareil photo du téléphone. Première fois : connecte-toi avec le même e-mail et mot de passe, puis dans Safari « Partager → Sur l\'écran d\'accueil » pour avoir l\'icône GMAO.</div><div id="qr" style="display:flex;justify-content:center;margin:14px 0"></div><div class="etiq" style="word-break:break-all">'+esc(url)+'</div><div class="actions"><button class="btn" onclick="fermer()">Fermer</button></div>');
  function dessiner(){new QRCode($('qr'),{text:url,width:220,height:220});}
  if(window.QRCode)dessiner();else{var sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';sc.onload=dessiner;sc.onerror=function(){$('qr').textContent='(QR indisponible — ouvre le lien ci-dessous sur le téléphone)';};document.head.appendChild(sc);}
}
function numBT(n){return 'BT-'+String(n||0).padStart(4,'0');}
function nb(v){var x=parseFloat(String(v).replace(',','.'));return isNaN(x)?null:x;}
function val(id){var e=$(id);return e?e.value.trim():'';}

/* ---------- données ---------- */
async function q(p){var r=await p;if(r.error)throw r.error;return r.data;}
async function chargerTout(){
  var r=await Promise.all([
    q(sb.from('gmao_equipements').select('*').order('code')),
    q(sb.from('gmao_modeles').select('*').order('nom')),
    q(sb.from('gmao_articles').select('*').order('designation')),
    q(sb.from('gmao_liens').select('*')),
    q(sb.from('gmao_preventifs').select('*'))
  ]);
  EQ=r[0];MOD=r[1];ART=r[2];LIENS=r[3];PREV=r[4];
  try{
    var r2=await Promise.all([q(sb.from('gmao_partenaires').select('*').order('nom')),q(sb.from('gmao_mesures').select('*').order('nom')),q(sb.from('gmao_releves').select('mesure_id,valeur,le').order('le',{ascending:false}).limit(5000))]);
    PART=r2[0];MES=r2[1];DERN={};r2[2].forEach(function(x){if(!DERN[x.mesure_id])DERN[x.mesure_id]=x;});V2=true;
  }catch(e){V2=false;PART=[];MES=[];DERN={};}
  MESID={};MES.forEach(function(m){MESID[m.id]=m;});
  try{SRC=await q(sb.from('gmao_sources').select('*'));V4=true;}catch(e){SRC=[];V4=false;}
  try{PERS=await q(sb.from('gmao_personnes').select('*').order('nom'));V6=true;
    STATS={};(await q(sb.from('gmao_interventions').select('preventif_id,duree_min,valide_le').eq('statut','Terminé'))).forEach(function(b){if(b.preventif_id&&b.valide_le&&b.duree_min){var x=STATS[b.preventif_id]=STATS[b.preventif_id]||{n:0,t:0};x.n++;x.t+=+b.duree_min;}});
    Object.keys(STATS).forEach(function(k){STATS[k].moy=Math.round(STATS[k].t/STATS[k].n);});
  }catch(e){PERS=[];STATS={};V6=false;}
  SRCA={};SRC.forEach(function(x){(SRCA[x.article_id]=SRCA[x.article_id]||[]).push(x);});
  EQID={};EQ.forEach(function(e){EQID[e.id]=e;});
  MODID={};MOD.forEach(function(m){MODID[m.id]=m;});
  ARTID={};ART.forEach(function(a){ARTID[a.id]=a;});
}
function chemin(e,sep){var p=[],x=e,g=0;while(x&&g++<20){p.unshift(x.nom);x=EQID[x.parent_id];}return p.join(sep||' › ');}
function cheminLiens(e){var p=[],x=EQID[e.parent_id],g=0;while(x&&g++<20){p.unshift('<a href="#eq/'+x.id+'">'+esc(x.nom)+'</a>');x=EQID[x.parent_id];}return p.join(' › ');}
function enfants(id){return EQ.filter(function(e){return e.parent_id===id;});}
function descendants(id){var out=[],pile=[id];while(pile.length){var c=pile.pop();enfants(c).forEach(function(e){out.push(e.id);pile.push(e.id);});}return out;}
function hayEq(e){var m=MODID[e.modele_id];return [e.code,e.nom,chemin(e),e.marque,e.num_serie,e.emplacement,e.famille,m?m.nom:''].join(' ');}
function primEq(e){return e.nom+' '+e.code;}
function primArt(a){return [a.designation,a.ref,a.ref_fabricant,a.ref_fournisseur].concat((SRCA[a.id]||[]).map(function(x){return x.ref||'';})).join(' ');}
function hayArt(a){return [a.ref,a.designation,a.ref_fabricant,a.ref_fournisseur,a.fournisseur,a.emplacement,a.motscles,a.notes].concat((SRCA[a.id]||[]).map(function(x){return x.partenaire+' '+(x.ref||'');})).join(' ');}
/* pièces d'un équipement : liées au modèle + liées directement */
function piecesDe(e){
  var out=[];LIENS.forEach(function(l){
    if(l.equipement_id===e.id)out.push({l:l,via:'directe'});
    else if(e.modele_id&&l.modele_id===e.modele_id)out.push({l:l,via:'modele'});
  });return out.filter(function(x){return ARTID[x.l.article_id];});
}
/* où est utilisée une pièce : liste d'équipements */
function ouUtilise(artId){
  var res=[];LIENS.filter(function(l){return l.article_id===artId;}).forEach(function(l){
    if(l.equipement_id&&EQID[l.equipement_id])res.push({e:EQID[l.equipement_id],l:l});
    if(l.modele_id)EQ.filter(function(e){return e.modele_id===l.modele_id;}).forEach(function(e){res.push({e:e,l:l,m:MODID[l.modele_id]});});
  });return res;
}

/* ---------- photos ---------- */
function choisirPhoto(){return new Promise(function(res){var f=$('filePhoto');f.value='';f.onchange=function(){res(f.files[0]||null);};f.click();});}
async function envoyerPhoto(file){
  var img=await new Promise(function(ok,ko){var i=new Image();i.onload=function(){ok(i);};i.onerror=ko;i.src=URL.createObjectURL(file);});
  var max=1600,w=img.width,h=img.height,k=Math.min(1,max/Math.max(w,h));
  var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  var blob=await new Promise(function(ok){c.toBlob(ok,'image/jpeg',0.82);});
  var nom=Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
  var r=await sb.storage.from('gmao').upload(nom,blob,{contentType:'image/jpeg'});
  if(r.error)throw r.error;
  return sb.storage.from('gmao').getPublicUrl(nom).data.publicUrl;
}
function zoom(url){ouvrir('<img src="'+esc(url)+'" style="width:100%;border-radius:10px"><div class="actions"><button class="btn" onclick="fermer()">Fermer</button></div>');}

/* ---------- fenêtres ---------- */
function ouvrir(html){$('boite').innerHTML=html;$('fond').classList.add('on');}
function fermer(){$('fond').classList.remove('on');$('boite').innerHTML='';}
$('fond').addEventListener('click',function(e){if(e.target.id==='fond')fermer();});
function demander(titre,defaut,aide){
  return new Promise(function(res){
    ouvrir('<h3>'+esc(titre)+'</h3>'+(aide?'<div class="etiq">'+esc(aide)+'</div>':'')+
      '<input id="dm-v" value="'+esc(defaut==null?'':defaut)+'"><div class="actions"><button class="btn" id="dm-a">Annuler</button><button class="btn p" id="dm-o">OK</button></div>');
    var i=$('dm-v');setTimeout(function(){i.focus();i.select();},50);
    $('dm-a').onclick=function(){fermer();res(null);};
    $('dm-o').onclick=function(){var v=i.value;fermer();res(v);};
    i.onkeydown=function(e){if(e.key==='Enter')$('dm-o').click();};
  });
}
/* Sélecteur avec recherche tolérante */
function choisir(o){

    var m=MESID[p.mesure_id],d=DERN[p.mesure_id],u=m?(m.unite||''):'',per=+p.periodicite_valeur||0;

    var reste=(+p.dernier_valeur)+per-(+d.valeur);
    if(reste<=0)return {cls:'b-rouge',txt:(reste<0?'dépassé de '+fmtN(-reste):'atteint')+''+' '+u,ordre:reste/(per||1),aFaire:true};
    if(reste<=per*0.1)return {cls:'b-orange',txt:'encore '+fmtN(reste)+' '+u,ordre:reste/(per||1),aFaire:true};
    return {cls:'b-vert',txt:'encore '+fmtN(reste)+' '+u,ordre:reste/(per||1),aFaire:false};
  }
  var e=echeance(p);if(!e)return {cls:'b-orange',txt:'jamais fait',ordre:-1,aFaire:true};
  var j=joursEntre(auj(),e),per2=p.periodicite_jours||30;

/* ---------- chronomètre : somme des périodes « en cours » (reprend après une pause) ---------- */
function tempsPasse(msgs){
  var total=0,cur=null;
  msgs.filter(function(m){return m.auteur==='•';}).sort(function(a,b){return a.cree_le<b.cree_le?-1:1;}).forEach(function(m){
    var t=m.texte||'',d=new Date(m.cree_le).getTime();
    var start=/▶/.test(t)||/statut → En cours/.test(t);
    var stop=/[⏸■]/.test(t)||(/statut → /.test(t)&&!/statut → En cours/.test(t))||/bon terminé/.test(t);
    if(start&&cur===null)cur=d;else if(stop&&cur!==null){total+=d-cur;cur=null;}
  });
  return {min:Math.round((total+(cur!==null?Date.now()-cur:0))/60000),cur:cur};
}
function fmtMin(m){m=Math.round(m||0);if(m<60)return m+' min';return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0');}
/* liste à cocher dans la description : lignes « ☐ … » / « ☑ … » */
function lignesCheck(desc){return String(desc||'').split('\n').map(function(l,i){var m=l.match(/^\s*([☐☑])\s?(.*)$/);return m?{i:i,fait:m[1]==='☑',txt:m[2]}:{i:i,txt:l,libre:true};});}

function uniques(l){var s={},o=[];l.forEach(function(x){x=(x||'').trim();var k=norm(x);if(x&&!s[k]){s[k]=1;o.push(x);}});return o.sort(function(a,b){return a.localeCompare(b,'fr');});}

/* Lier une pièce à une machine ou un modèle (depuis l'un ou l'autre côté) */
async function lierPiece(ctx){
  var art=ctx.article, cibleEq=ctx.equipement, cibleMod=ctx.modele;
  if(!art){
    art=await choisir({titre:'Quelle pièce ?',items:ART,hay:hayArt,prim:primArt,rendu:renduArt,creer:'Nouvelle pièce'});
    if(!art)return;
    if(art==='__creer__'){art=await creerArticleRapide();if(!art)return;}
  }
  if(!cibleEq&&!cibleMod){cibleEq=await choisirEq('Sur quelle machine ?');if(!cibleEq)return;}
  var surModele=!!cibleMod;
  if(cibleEq&&cibleEq.modele_id&&MODID[cibleEq.modele_id]){
    var m=MODID[cibleEq.modele_id], nbm=EQ.filter(function(x){return x.modele_id===m.id;}).length;
    surModele=await new Promise(function(res){
      ouvrir('<h3>Lier « '+esc(art.designation)+' »</h3><p>'+esc(cibleEq.nom)+' est du modèle <b>'+esc(m.nom)+'</b> ('+nbm+' machine'+(nbm>1?'s':'')+').</p>'+
        '<div class="actions" style="flex-direction:column;align-items:stretch"><button class="btn p" id="lpM">À toutes les machines '+esc(m.nom)+' (conseillé)</button><button class="btn" id="lpE">Seulement à '+esc(cibleEq.nom)+'</button><button class="btn l" id="lpA">Annuler</button></div>');
      $('lpM').onclick=function(){fermer();res(true);};$('lpE').onclick=function(){fermer();res(false);};$('lpA').onclick=function(){fermer();res(null);};
    });
    if(surModele===null)return;
    if(surModele)cibleMod=m;
  }
  var rep=await demander('Repère / usage (facultatif)','','ex. courroie ventilateur, côté gauche, quantité montée…');
  if(rep===null)return;
  var lien={article_id:art.id,repere:rep||null,quantite:1};
  if(surModele)lien.modele_id=cibleMod.id;else lien.equipement_id=cibleEq.id;
  try{var r=await q(sb.from('gmao_liens').insert(lien).select());LIENS.push(r[0]);toast('✓ Pièce liée');route();}catch(x){erreur(x);}
}

/* Éléments qui ne sont pas des machines : décochés par défaut */
function exclureParDefaut(r){
  var c=norm(r.code),n=norm(r.nom),f=norm(r.famille);
  if(/^(la courtine)$/.test(c))return 'site';
  if(/tachygraphe|^carte |^cf$|^vds$/.test(c)||/vdo dlk/.test(n)||/^carte /.test(n))return 'chronotachygraphe';
  if(/matin|am$/.test(c)&&/manutention|sechage repassage/.test(f))return 'personne / équipe';
  if(/^(production|ma|mg)$/.test(c))return 'pseudo-équipement';
  if(/poubelle/.test(n))return 'poubelle';
  if(/^allee /.test(n))return 'allée';
  return '';
}
/* Parents ambigus dans DIMO (même nom pour plusieurs équipements) */
var PARENT_FORCE={'VA12':'EMTAE1','VA13':'EMTAE1','VA16':'EMTAE1','A25':'EMTAE2','VA20':'EMTAE2','VA26':'EMTAE2','ebmpapst 4314':'AEEMX'};
var MODELE_PROPOSE={'1.S1':'Kannegiesser D60','4.S4':'Kannegiesser D60','2.S2':'Kannegiesser D120','3.S3':'Kannegiesser D120','B30':'Sfere BM cercleuse semi-auto','CSA2':'Sfere BM cercleuse semi-auto','40022-T10':'Fradin tapis de convoyage','T12':'Fradin tapis de convoyage'};
function propre(s){s=String(s||'').replace(/\s+/g,' ').trim();s=s.replace(/transportt/gi,'transport').replace(/\bpalie\b/gi,'partie');return s?s.charAt(0).toUpperCase()+s.slice(1):'';}
function etatPropre(s){var n=norm(s);return {'en service':'En service','degrade':'Dégradé','en reparation':'En réparation','hors service':'Hors service'}[n]||'En service';}
function lireCSV(txt){
  var sep=(txt.split('\n')[0].match(/;/g)||[]).length>=(txt.split('\n')[0].match(/,/g)||[]).length?';':',';
  var rows=[],row=[],cur='',inq=false;
  for(var i=0;i<txt.length;i++){var ch=txt[i];
    if(inq){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++;}else inq=false;}else cur+=ch;}
    else if(ch==='"')inq=true;else if(ch===sep){row.push(cur);cur='';}else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';}else if(ch!=='\r')cur+=ch;}
  if(cur||row.length){row.push(cur);rows.push(row);}
  var h=rows.shift().map(function(x){return x.replace(/^﻿/,'').trim();});
  return rows.filter(function(r){return r.some(function(x){return x.trim();});}).map(function(r){var o={};h.forEach(function(k,i){o[k]=r[i]||'';});return o;});
}

  $('iZ').innerHTML='<div class="carte"><b>2.</b> '+R.length+' pièces trouvées. DIMO ne donne pas les machines de chaque pièce : j\'en ai reconnu <b>'+R.filter(function(r){return r.lien;}).length+'</b> (pompe à graisse tunnel, chaîne tunnel, CFM2, navette…). Les autres, tu les lieras au fil de l\'eau depuis la fiche machine.<br>'+
    '<span class="etiq">Le stock mini n\'est pas dans l\'export : les pièces « en alerte » dans DIMO reçoivent un mini de 1 (à ajuster).</span>'+
    '<div class="actions"><button class="btn p" id="iGo">Importer '+n+' pièces ('+nl+' liens machine)</button></div></div>'+
    '<div class="carte" style="overflow-x:auto"><table class="imp"><tr><th></th><th>Réf.</th><th>Désignation</th><th>Stock</th><th>Emplacement</th><th>Fournisseur</th><th>Machine</th></tr>'+
    R.map(function(r,i){return '<tr class="'+(r.inclus?'':'ex')+'"><td><input type="checkbox" data-i="'+i+'" style="width:auto"'+(r.inclus?' checked':'')+'></td><td>'+esc(r.ref)+'</td><td>'+esc(r.designation)+(r.alerte?' <span class="badge b-orange">alerte</span>':'')+r.warn.map(function(w){return '<div class="warn">'+esc(w)+'</div>';}).join('')+'</td><td>'+r.stock+' '+esc(r.unite)+'</td><td>'+esc(r.emplacement)+'</td><td>'+esc(r.fournisseur)+'</td><td>'+
      (r.lien?'<label style="display:flex;gap:5px;margin:0;color:var(--txt);font-size:13px"><input type="checkbox" data-l="'+i+'" style="width:auto"'+(r.lier?' checked':'')+'>'+esc(r.lien.modele?'modèle '+r.lien.modele.nom:r.lien.equipement.nom)+'</label>':'')+'</td></tr>';}).join('')+'</table></div>';
  document.querySelectorAll('#iZ [data-i]').forEach(function(c){c.onchange=function(){R[+c.dataset.i].inclus=c.checked;afficherPieces();};});
  document.querySelectorAll('#iZ [data-l]').forEach(function(c){c.onchange=function(){R[+c.dataset.l].lier=c.checked;afficherPieces();};});
  $('iGo').onclick=importerPieces;
}
async function importerPieces(){
  var R=IMP.pieces.filter(function(r){return r.inclus;});if(!R.length)return;
  $('iGo').disabled=true;$('iGo').textContent='Import en cours…';
  try{
    R.forEach(function(r){r.id=crypto.randomUUID();});
    var pl=R.map(function(r){return {id:r.id,ref:r.ref,designation:r.designation||r.ref,unite:r.unite,stock:r.stock,stock_mini:r.stock_mini,emplacement:r.emplacement||null,fournisseur:r.fournisseur||null};});
    for(var i=0;i<pl.length;i+=100)await q(sb.from('gmao_articles').insert(pl.slice(i,i+100)));
    var li=R.filter(function(r){return r.lien&&r.lier;}).map(function(r){var o={article_id:r.id,quantite:1};if(r.lien.modele)o.modele_id=r.lien.modele.id;else o.equipement_id=r.lien.equipement.id;return o;});
    if(li.length)await q(sb.from('gmao_liens').insert(li));
    await chargerTout();toast('✓ '+pl.length+' pièces importées');aller('articles');
  }catch(x){$('iGo').disabled=false;$('iGo').textContent='Réessayer';erreur(x);}
}

/* ---------- Import partenaires / mesures DIMO ---------- */
function vrai(v){return /^(true|oui|1|x)$/i.test(String(v||'').trim());}
function preparerPartenaires(L){
  if(!V2)return pasV2();
  var vus={},liste=[];
  L.forEach(function(o){var n=propre(o['Nom']);if(!n)return;var k=norm(n),x=vus[k];
    if(!x){x=vus[k]={code:String(o['Code']||'').trim(),nom:n,fournisseur:false,constructeur:false,sous_traitant:false,inclus:true,warn:[]};liste.push(x);}
    else x.warn.push('doublon DIMO fusionné');
    x.fournisseur=x.fournisseur||vrai(o['Fournisseur']);x.constructeur=x.constructeur||vrai(o['Constructeur']);x.sous_traitant=x.sous_traitant||vrai(o['Sous-traitant']);
    if(PART.some(function(p){return norm(p.nom)===k;})){x.inclus=false;x.warn.push('déjà dans la GMAO');}
  });
  IMP={part:liste};
  function aff(){var n=liste.filter(function(r){return r.inclus;}).length;
    $('iZ').innerHTML='<div class="carte"><b>2.</b> '+liste.length+' partenaires (doublons fusionnés : radiospare, wiltec…). Tu ajouteras les téléphones et e-mails dans chaque fiche.<div class="actions"><button class="btn p" id="iGo">Importer '+n+' partenaires</button></div></div>'+
      '<div class="carte" style="overflow-x:auto"><table class="imp"><tr><th></th><th>Nom</th><th>Rôles</th><th>Remarques</th></tr>'+liste.map(function(r,i){return '<tr class="'+(r.inclus?'':'ex')+'"><td><input type="checkbox" data-i="'+i+'" style="width:auto"'+(r.inclus?' checked':'')+'></td><td>'+esc(r.nom)+'</td><td>'+esc(rolesPart(r).join(', '))+'</td><td>'+r.warn.map(function(w){return '<div class="warn">'+esc(w)+'</div>';}).join('')+'</td></tr>';}).join('')+'</table></div>';
    document.querySelectorAll('#iZ [data-i]').forEach(function(c){c.onchange=function(){liste[+c.dataset.i].inclus=c.checked;aff();};});
    $('iGo').onclick=async function(){this.disabled=true;try{var pl=liste.filter(function(r){return r.inclus;}).map(function(r){return {code:r.code,nom:r.nom,fournisseur:r.fournisseur,constructeur:r.constructeur,sous_traitant:r.sous_traitant};});
      if(pl.length)await q(sb.from('gmao_partenaires').insert(pl));await chargerTout();toast('✓ '+pl.length+' partenaires importés');aller('partenaires');}catch(x){this.disabled=false;erreur(x);}};
  }
  aff();
}
function preparerMesures(L){
  if(!V2)return pasV2();
  var cles=Object.keys(L[0]);
  var kNom=cles.find(function(k){return /^(nom|d[ée]signation|libell[ée]|mesure)/i.test(k);})||cles.find(function(k){return /code/i.test(k);})||cles[0];
  var kEq=cles.find(function(k){return /quipement/i.test(k);}), kVal=cles.find(function(k){return /valeur|relev/i.test(k);});
  var liste=L.map(function(o){
    var eqTxt=String(o[kEq]||'').trim(),code=eqTxt.split(' - ')[0].trim(),e=code?EQ.find(function(x){return norm(x.code)===norm(code);}):null;
    var r={nom:propre(o[kNom]),unite:unitePropre(o['Unité']||''),type:propre(o['Type']),eqTxt:eqTxt,e:e,valeur:kVal?nbFr(o[kVal]):null,inclus:true,warn:[]};
    if(r.unite==='pce')r.unite='unités';
    if(eqTxt&&!e)r.warn.push('machine « '+eqTxt+' » absente du parc');
    if(MES.some(function(m){return norm(m.nom)===norm(r.nom)&&m.equipement_id===(e?e.id:null);})){r.inclus=false;r.warn.push('déjà dans la GMAO');}
    return r;}).filter(function(r){return r.nom;});
  function aff(){var n=liste.filter(function(r){return r.inclus;}).length;
    $('iZ').innerHTML='<div class="carte"><b>2.</b> '+liste.length+' compteurs trouvés. Ceux rattachés à une personne ou une machine non importée resteront sans machine (tu pourras les rattacher ou les décocher).<div class="actions"><button class="btn p" id="iGo">Importer '+n+' compteurs</button></div></div>'+
      '<div class="carte" style="overflow-x:auto"><table class="imp"><tr><th></th><th>Compteur</th><th>Unité</th><th>Machine</th><th>Remarques</th></tr>'+liste.map(function(r,i){return '<tr class="'+(r.inclus?'':'ex')+'"><td><input type="checkbox" data-i="'+i+'" style="width:auto"'+(r.inclus?' checked':'')+'></td><td>'+esc(r.nom)+'</td><td>'+esc(r.unite)+'</td><td>'+(r.e?esc(chemin(r.e)):'')+'</td><td>'+r.warn.map(function(w){return '<div class="warn">'+esc(w)+'</div>';}).join('')+'</td></tr>';}).join('')+'</table></div>';
    document.querySelectorAll('#iZ [data-i]').forEach(function(c){c.onchange=function(){liste[+c.dataset.i].inclus=c.checked;aff();};});
    $('iGo').onclick=async function(){this.disabled=true;try{
      var R=liste.filter(function(r){return r.inclus;});R.forEach(function(r){r.id=crypto.randomUUID();});
      if(R.length)await q(sb.from('gmao_mesures').insert(R.map(function(r){return {id:r.id,nom:r.nom,unite:r.unite,type:r.type||'Compteur',equipement_id:r.e?r.e.id:null,notes:r.e||!r.eqTxt?null:'DIMO : '+r.eqTxt};})));
      var rv=R.filter(function(r){return r.valeur;}).map(function(r){return {mesure_id:r.id,valeur:r.valeur,auteur:'Import DIMO'};});
      if(rv.length)await q(sb.from('gmao_releves').insert(rv));
      await chargerTout();toast('✓ '+R.length+' compteurs importés');aller('compteurs');}catch(x){this.disabled=false;erreur(x);}};
  }
  aff();
}


/* =====================================================================
   FOURNISSEURS D'UNE PIÈCE, DOUBLONS, FUSION
   ===================================================================== */
function piecesDuPart(x){var k=norm(x.nom);return ART.filter(function(a){return (SRCA[a.id]||[]).some(function(s){return norm(s.partenaire)===k;})||(!V4&&norm(a.fournisseur)===k);});}
function sigArt(a){
  var d=norm(a.designation).replace(/[()]/g,' ');
  var mots=d.split(/[^a-z0-9]+/).filter(Boolean);
  var premier=(mots.find(function(m){return !/\d/.test(m)&&m.length>2;})||'').replace(/(s|x)$/,'');
  return {premier:premier,nums:(d.match(/\d+/g)||[]).map(Number),c:compact(a.designation)};
}
function sousSuite(c,l){if(c.length<2||c.length>l.length)return false;for(var i=0;i+c.length<=l.length;i++){var ok=true;for(var j=0;j<c.length;j++)if(l[i+j]!==c[j]){ok=false;break;}if(ok)return true;}return false;}
function memePiece(a,b){
  if(a.id&&a.id===b.id)return false;
  var sa=sigArt(a),sb2=b._sig||(b._sig=sigArt(b));
  var ra=compact(a.ref),rb=compact(b.ref);
  if(ra.length>=4&&/\d/.test(ra)&&sb2.c.indexOf(ra)>=0)return true;
  if(rb.length>=4&&/\d/.test(rb)&&sa.c.indexOf(rb)>=0)return true;
  if(compact(a.ref_fabricant)&&compact(a.ref_fabricant)===compact(b.ref_fabricant))return true;
  if(sa.premier&&sa.premier===sb2.premier){var c=sa.nums.length<=sb2.nums.length?[sa.nums,sb2.nums]:[sb2.nums,sa.nums];if(sousSuite(c[0],c[1]))return true;}
  return false;
}
function lireIgnores(){try{return JSON.parse(localStorage.getItem('gmao_pas_doublon')||'{}');}catch(e){return {};}}
function cleP(x,y){return x<y?x+'|'+y:y+'|'+x;}
function similaires(a){var ig=lireIgnores();return ART.filter(function(b){return b.id!==a.id&&!ig[cleP(a.id,b.id)]&&memePiece(a,b);});}
function paireDoublons(){
  var ig=lireIgnores(),out=[];
  for(var i=0;i<ART.length;i++)for(var j=i+1;j<ART.length;j++){var a=ART[i],b=ART[j];if(!ig[cleP(a.id,b.id)]&&memePiece(a,b))out.push([a,b]);}
  return out;
}
VUES.doublons=async function(){
  var P=paireDoublons();
  function fo(a){return esc((SRCA[a.id]||[]).map(function(x){return x.partenaire;}).join(', '));}

    (P.length?P.map(function(p,i){return '<div class="carte"><div class="ligne">'+renduArt(p[0])+'<span class="etiq">'+fo(p[0])+'</span></div><div class="ligne">'+renduArt(p[1])+'<span class="etiq">'+fo(p[1])+'</span></div>'+
      '<div class="actions"><button class="btn l sm" data-ign="'+i+'" style="margin-right:auto">Pas la même pièce</button><button class="btn sm" data-g="'+i+'|1">Fusionner (garder le nom du bas)</button><button class="btn p sm" data-g="'+i+'|0">Fusionner (garder le nom du haut)</button></div></div>';}).join(''):'<div class="carte vide">Aucun doublon détecté. 👍</div>');
  document.querySelectorAll('[data-g]').forEach(function(b){b.onclick=function(){var t=b.dataset.g.split('|'),p=P[+t[0]],k=+t[1];fusionner(p[k].id,p[1-k].id,'doublons');};});
  document.querySelectorAll('[data-ign]').forEach(function(b){b.onclick=function(){var p=P[+b.dataset.ign],ig=lireIgnores();ig[cleP(p[0].id,p[1].id)]=1;try{localStorage.setItem('gmao_pas_doublon',JSON.stringify(ig));}catch(e){}route();};});
};
async function fusionner(garder,suppr,retour){
  var a=ARTID[garder],b=ARTID[suppr];if(!a||!b)return;
  if(!confirm('Fusionner « '+b.designation+' » ('+(b.ref||'sans réf.')+', stock '+(+b.stock||0)+') DANS « '+a.designation+' » ('+(a.ref||'sans réf.')+', stock '+(+a.stock||0)+') ?\n\nStock total : '+((+a.stock||0)+(+b.stock||0))+'. Fournisseurs, machines et historique regroupés. La 2e fiche disparaît.'))return;
  try{await q(sb.rpc('gmao_fusionner',{p_garder:garder,p_suppr:suppr}));await chargerTout();toast('✓ Pièces fusionnées');if(retour)route();else aller('art/'+garder);}catch(x){erreur(x);}
}

/* =====================================================================
   PLANNING : qui fait quoi, et est-ce que ça tient dans la journée ?
   ===================================================================== */
var jourPlan=null;
function pasV6(){$('main').innerHTML='<div class="carte"><b>Il faut d\'abord installer la mise à jour de la base.</b><br>Lance le fichier <code>gmao-installation-4.sql</code> dans Supabase (SQL Editor → + → Run).</div>';}
function restant(b){var p=+b.temps_prevu_min||0;return p?Math.max(0,p-(+b.duree_min||0)):0;}
VUES.planning=async function(){
  if(!V6)return pasV6();
  var j=jourPlan||auj();
  var ouverts=await q(sb.from('gmao_interventions').select('*').neq('statut','Terminé').order('cree_le'));
  var jour=new Date(j+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  var html='<h1 class="titre">Planning</h1><div class="carte" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn" id="pjM">◀</button><input type="date" id="pjD" value="'+j+'" style="width:auto"><button class="btn" id="pjP">▶</button><b style="text-transform:capitalize">'+jour+'</b>'+(j!==auj()?'<button class="btn l sm" id="pjA">aujourd\'hui</button>':'')+'</div>';
  var actifs=PERS.filter(function(p){return p.actif!==false;});
  if(!actifs.length)html+='<div class="carte" style="background:var(--bleu2)">Ajoute d\'abord les personnes de l\'équipe maintenance avec leur temps disponible par jour (en bas de la page).</div>';
  actifs.forEach(function(p){
    var l=ouverts.filter(function(b){return norm(b.assigne_a)===norm(p.nom)&&(b.prevu_le===j||(j===auj()&&b.prevu_le&&b.prevu_le<j));});
    var charge=l.reduce(function(s,b){return s+restant(b);},0), cap=+p.capacite_min||420, sansT=l.filter(function(b){return !b.temps_prevu_min;}).length;
    var pc=Math.min(100,charge/cap*100), trop=charge>cap;
    html+='<div class="carte"><h2>👷 '+esc(p.nom)+'<span class="d etiq">'+fmtMin(charge)+' / '+fmtMin(cap)+'</span></h2>'+
      '<div class="barre gros'+(trop?' rouge':'')+'"><div style="width:'+pc+'%"></div></div>'+
      (trop?'<div class="alerte">⚠ Trop de tâches pour cette journée : <b>+'+fmtMin(charge-cap)+'</b>. Décale un bon à un autre jour ou confie-le à quelqu\'un d\'autre.</div>':(l.length?'<div class="etiq" style="margin:6px 0">Encore '+fmtMin(cap-charge)+' de disponible.</div>':''))+
      (sansT?'<div class="etiq" style="color:var(--orange)">'+sansT+' bon'+(sansT>1?'s':'')+' sans temps prévu (non compté'+(sansT>1?'s':'')+')</div>':'')+
      (l.length?l.map(ligneBonPlan).join(''):'<div class="vide">Rien de prévu.</div>')+'</div>';
  });
  var retard=ouverts.filter(function(b){return b.prevu_le&&b.prevu_le<auj()&&!b.assigne_a;});
  if(retard.length)html+='<div class="carte" style="border-color:var(--rouge)"><h2>⏰ Prévus un jour passé, pas terminés</h2>'+retard.map(ligneBonPlan).join('')+'</div>';
  var nonPl=ouverts.filter(function(b){return !b.prevu_le||!b.assigne_a;});
  html+='<div class="carte"><h2>📥 À planifier ('+nonPl.length+')</h2>'+(nonPl.length?nonPl.map(ligneBonPlan).join(''):'<div class="vide">Tout est planifié.</div>')+'</div>';
  var prevSansBon=PREV.filter(function(p){return p.actif&&infoPrev(p).aFaire&&!ouverts.some(function(b){return b.preventif_id===p.id;});});
  if(prevSansBon.length)html+='<div class="carte"><h2>🗓 Préventifs dus, pas encore lancés</h2>'+prevSansBon.map(lignePrev).join('')+'</div>';
  html+='<div class="carte"><h2>Équipe maintenance <button class="btn sm d" id="peN">+ Personne</button></h2>'+(PERS.length?PERS.map(function(p){return '<div class="ligne" style="cursor:pointer" data-pe="'+p.id+'"><div class="g"><div class="t">'+esc(p.nom)+(p.actif===false?' <span class="etiq">(inactif)</span>':'')+'</div><div class="s">'+fmtMin(p.capacite_min||420)+' disponibles par jour</div></div><span class="etiq">✎</span></div>';}).join(''):'<div class="vide">Personne pour l\'instant.</div>')+'</div>';
  $('main').innerHTML=html;
  function changeJ(n){jourPlan=n;route();}
  $('pjD').onchange=function(){changeJ(this.value||auj());};
  $('pjM').onclick=function(){changeJ(ajoutJours(j,-1));};$('pjP').onclick=function(){changeJ(ajoutJours(j,1));};
  if($('pjA'))$('pjA').onclick=function(){changeJ(auj());};
  document.querySelectorAll('[data-pl]').forEach(function(x){x.onclick=function(ev){ev.preventDefault();ev.stopPropagation();planifier(ouverts.find(function(b){return b.id===x.dataset.pl;}),j);};});
  $('peN').onclick=function(){editerPersonne(null);};
  document.querySelectorAll('[data-pe]').forEach(function(x){x.onclick=function(){editerPersonne(x.dataset.pe);};});
};
function ligneBonPlan(b){
  var e=EQID[b.equipement_id],p=+b.temps_prevu_min||0,fait=+b.duree_min||0;
  return '<a class="ligne" href="#bon/'+b.id+'"><div class="g"><div class="t">'+numBT(b.numero)+' · '+esc(b.titre)+'</div><div class="s">'+esc(e?chemin(e):'—')+
    (b.assigne_a?' · 👷 '+esc(b.assigne_a):'')+(b.prevu_le?(b.prevu_le<auj()?' · <b style="color:var(--orange)">reporté du '+fmtD(b.prevu_le)+'</b>':' · '+fmtD(b.prevu_le)):'')+(p?' · prévu '+fmtMin(p)+(fait?' (déjà '+fmtMin(fait)+')':''):' · <span style="color:var(--orange)">temps ?</span>')+'</div></div>'+
    badgeStatut(b.statut)+'<button class="btn sm" data-pl="'+b.id+'">Planifier</button></a>';
}
function planifier(b,jourDefaut){
  if(!b)return;
  ouvrir('<h3>Planifier '+numBT(b.numero)+'</h3><div class="etiq">'+esc(b.titre)+'</div>'+
    '<label>Confié à</label><select id="plP"><option value="">— personne —</option>'+PERS.filter(function(p){return p.actif!==false;}).map(function(p){return '<option'+(norm(p.nom)===norm(b.assigne_a)?' selected':'')+'>'+esc(p.nom)+'</option>';}).join('')+'</select>'+
    '<div class="grille"><div><label>Jour</label><input type="date" id="plD" value="'+(b.prevu_le||jourDefaut||auj())+'"></div><div><label>Temps prévu (minutes)</label><input id="plT" inputmode="numeric" value="'+(b.temps_prevu_min||'')+'"></div></div>'+
    '<div class="actions"><button class="btn l sm" id="plX" style="margin-right:auto">Retirer du planning</button><button class="btn" onclick="fermer()">Annuler</button><button class="btn p" id="plO">Enregistrer</button></div>');
  $('plO').onclick=async function(){try{await q(sb.from('gmao_interventions').update({assigne_a:$('plP').value||null,prevu_le:val('plD')||null,temps_prevu_min:nb(val('plT'))}).eq('id',b.id));
    if($('plP').value)await logSys(b.id,'📅 '+NOM+' confie le bon à '+$('plP').value+' pour le '+fmtD(val('plD')));fermer();route();}catch(x){erreur(x);}};
  $('plX').onclick=async function(){try{await q(sb.from('gmao_interventions').update({assigne_a:null,prevu_le:null}).eq('id',b.id));fermer();route();}catch(x){erreur(x);}};
}
function editerPersonne(pid){
  var p=pid?PERS.find(function(x){return x.id===pid;}):{nom:'',capacite_min:420,actif:true};
  ouvrir('<h3>'+(pid?'Modifier':'Ajouter')+' une personne</h3><label>Prénom / nom</label><input id="psN" value="'+esc(p.nom)+'">'+
    '<label>Temps disponible pour la maintenance, par jour (heures)</label><input id="psC" inputmode="decimal" value="'+((+p.capacite_min||420)/60)+'"><div class="etiq">ex. 7 pour une journée complète, 2 si la personne fait surtout de la production</div>'+
    '<label style="display:flex;gap:8px;align-items:center;color:var(--txt);font-size:14px"><input type="checkbox" id="psA" style="width:auto"'+(p.actif!==false?' checked':'')+'> Active</label>'+
    '<div class="actions">'+(pid?'<button class="btn r sm" id="psX" style="margin-right:auto">Supprimer</button>':'')+'<button class="btn" onclick="fermer()">Annuler</button><button class="btn p" id="psO">Enregistrer</button></div>');
  $('psO').onclick=async function(){var d={nom:val('psN'),capacite_min:Math.round((nb(val('psC'))||7)*60),actif:$('psA').checked};if(!d.nom)return;
    try{if(pid)await q(sb.from('gmao_personnes').update(d).eq('id',pid));else await q(sb.from('gmao_personnes').insert(d));PERS=await q(sb.from('gmao_personnes').select('*').order('nom'));fermer();route();}catch(x){erreur(x);}};
  if(pid)$('psX').onclick=async function(){if(!confirm('Supprimer '+p.nom+' ?'))return;try{await q(sb.from('gmao_personnes').delete().eq('id',pid));PERS=PERS.filter(function(x){return x.id!==pid;});fermer();route();}catch(x){erreur(x);}};
}

/* =====================================================================
   DÉMARRAGE
   ===================================================================== */
async function demarrer(){
  $('login').style.display='none';$('app').style.display='block';
  NOM=(USER.user_metadata&&USER.user_metadata.nom)||'';
  if(!NOM){
    var n=await demander('Ton prénom','','Il s\'affichera sur les bons et les messages.');
    NOM=(n||USER.email.split('@')[0]).trim();
    try{await sb.auth.updateUser({data:{nom:NOM}});}catch(e){}
  }
  $('qui').innerHTML=esc(NOM)+' · '+VERSION+' · <a href="#" id="dec" style="color:#cfe0f3">quitter</a>';
  $('dec').onclick=async function(e){e.preventDefault();await sb.auth.signOut();location.reload();};
  try{await chargerTout();}catch(e){
    $('main').innerHTML='<div class="carte"><b>La base GMAO n\'est pas encore installée.</b><br>Il faut d\'abord lancer le fichier <code>gmao-installation.sql</code> dans Supabase (SQL Editor).<br><br><span class="etiq">'+esc(e.message||e)+'</span></div>';return;
  }
  route();
}
async function connexion(){
  $('li-err').style.display='none';
  var r=await sb.auth.signInWithPassword({email:val('li-email'),password:$('li-pw').value});
  if(r.error){$('li-err').textContent='Connexion impossible : '+r.error.message;$('li-err').style.display='block';return;}
  USER=r.data.user;demarrer();
}
$('li-btn').onclick=connexion;
$('li-pw').onkeydown=function(e){if(e.key==='Enter')connexion();};
(async function(){var s=await sb.auth.getSession();if(s.data&&s.data.session){USER=s.data.session.user;demarrer();}else $('login').style.display='block';})();
document.addEventListener('visibilitychange',function(){if(!document.hidden&&USER&&/^#bon\//.test(location.hash)&&!$('fond').classList.contains('on'))route();});
</script>

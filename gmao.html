<style>

html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}

nav a{color:#cfe0f3;padding:7px 11px;border-radius:8px;white-space:nowrap;font-size:14px}

#qui{font-size:12px;color:#cfe0f3;white-space:nowrap}
main{max-width:1100px;margin:0 auto;padding:14px 16px 90px}
.carte{background:var(--carte);border:1px solid var(--ligne);border-radius:12px;padding:14px;margin-bottom:12px}

.carte h2 .d{margin-left:auto}
h1.titre{font-size:20px;margin:4px 0 12px}
.btn{border:1px solid var(--ligne);background:#fff;border-radius:8px;padding:8px 12px;font-weight:500}
.btn.p{background:var(--bleu);border-color:var(--bleu);color:#fff}
.btn.r{background:var(--rouge);border-color:var(--rouge);color:#fff}
.btn.v{background:var(--vert);border-color:var(--vert);color:#fff}
.btn.l{border:none;background:none;color:var(--bleu);padding:4px 6px}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.5}

.b-rouge{background:var(--rouge2);color:var(--rouge)}.b-vert{background:var(--vert2);color:var(--vert)}

.etiq{font-size:12px;color:var(--doux)}

.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#16324f;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;display:none}

.solution .rep{margin-top:6px;font-size:14px;white-space:pre-wrap}
mark{background:#fff2a8;padding:0 1px;border-radius:2px}
.planche{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.etq{background:#fff;border:2px dashed #999;border-radius:10px;padding:10px;text-align:center;break-inside:avoid}
.etq-h{background:var(--rouge);color:#fff;font-weight:800;border-radius:6px;padding:4px;font-size:13px}
.etq-qr{display:flex;justify-content:center;margin:8px 0}.etq-qr img,.etq-qr canvas{width:150px;height:150px}
.etq-n{font-weight:800;font-size:15px;line-height:1.2}.etq-c{font-size:11px;color:#555}
@media print{header,.noprint,#toast{display:none!important}body{background:#fff}main{padding:0;max-width:none}.planche{grid-template-columns:repeat(3,1fr);gap:6mm}.etq{border:1px dashed #888}}
.grosbt{display:flex;gap:10px;margin-top:14px}
.btn.o{background:var(--orange);border-color:var(--orange);color:#fff}
.chrono.rouge{background:var(--rouge2);color:var(--rouge)}
.barre{height:8px;background:rgba(0,0,0,.08);border-radius:5px;margin-top:8px;overflow:hidden}.barre>div{height:100%;background:var(--vert);border-radius:5px}
.chrono .barre>div{background:var(--orange)}.chrono.rouge .barre>div,.barre.rouge>div{background:var(--rouge)}.barre.gros{height:14px;margin:4px 0 8px}
.alerte{background:var(--rouge2);color:var(--rouge);padding:8px 10px;border-radius:8px;margin-bottom:8px}
.check{display:flex;flex-direction:column;gap:6px}

.ck.ok{background:var(--vert2);border-color:#b7dcb9}.ck.ok .bx{background:var(--vert);border-color:var(--vert)}.ck.ok .g{text-decoration:line-through;color:#4b6b4d}
.grosbt .btn{flex:1;padding:18px 10px;font-size:19px;border-radius:12px;font-weight:700}
.chrono{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--orange2);color:#7a4300;font-size:15px}
@media(max-width:640px){header h1{font-size:15px}#qui{display:none}main{padding:10px 10px 80px}h1.titre{font-size:18px}}
</style>
</head>

<script>

var VERSION='v9.15';

var USER=null, NOM='';
var EQ=[], EQID={}, MOD=[], MODID={}, ART=[], ARTID={}, LIENS=[], PREV=[], PART=[], MES=[], MESID={}, DERN={}, V2=true, SRC=[], SRCA={}, V4=true, PERS=[], STATS={}, V6=true, V8=true, ASSOC=[], ASSOCA={}, V11=true;

/* ---------- outils ---------- */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();}
function compact(s){return norm(s).replace(/[^a-z0-9]/g,'');}
function correspond(q,hay){
  var w=norm(q).split(' ').filter(Boolean); if(!w.length)return true;
  var h=norm(hay), hc=compact(hay);
  return w.every(function(x){
    if(h.indexOf(x)>=0)return true;
    var xc=compact(x); if(xc&&hc.indexOf(xc)>=0)return true;
    if(x.length>3){var r=x.replace(/(s|x|es)$/,''); if(h.indexOf(r)>=0)return true;}
    return false;
  });
}
/* les meilleurs résultats d'abord : nom qui contient la recherche entière, puis tous les mots dans le nom */
function trier(t,l,prim){
  if(!t||!prim)return l;var qn=norm(t),qc=compact(t);
  function sc(x){var n=norm(prim(x)),c=compact(prim(x));if(c===qc)return 0;if(n.indexOf(qn)>=0||c.indexOf(qc)>=0)return 1;if(correspond(t,prim(x)))return 2;return 3;}
  return l.map(function(x,i){return [sc(x),i,x];}).sort(function(a,b){return a[0]-b[0]||a[1]-b[1];}).map(function(a){return a[2];});
}
function toast(t){var e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(function(){e.style.display='none';},2600);}
function erreur(e){console.error(e);toast('⚠ '+((e&&e.message)||e||'Erreur'));}
function fmtD(d){if(!d)return'';var x=new Date(d);return x.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'});}
function fmtDH(d){if(!d)return'';var x=new Date(d);return x.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})+' '+x.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}
function auj(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function ajoutJours(iso,n){var d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function joursEntre(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);}
function minutesDepuis(d){return Math.max(0,Math.round((Date.now()-new Date(d))/60000));}
function qrTel(){
  var url=location.href;
  ouvrir('<h3>📱 Ouvrir sur le téléphone</h3><div class="etiq">Vise ce code avec l\'appareil photo du téléphone. Première fois : connecte-toi avec le même e-mail et mot de passe, puis dans Safari « Partager → Sur l\'écran d\'accueil » pour avoir l\'icône GMAO.</div><div id="qr" style="display:flex;justify-content:center;margin:14px 0"></div><div class="etiq" style="word-break:break-all">'+esc(url)+'</div><div class="actions"><button class="btn" onclick="fermer()">Fermer</button></div>');
  function dessiner(){new QRCode($('qr'),{text:url,width:220,height:220});}
  if(window.QRCode)dessiner();else{var sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';sc.onload=dessiner;sc.onerror=function(){$('qr').textContent='(QR indisponible — ouvre le lien ci-dessous sur le téléphone)';};document.head.appendChild(sc);}
}
function numBT(n){return 'BT-'+String(n||0).padStart(4,'0');}
function nb(v){var x=parseFloat(String(v).replace(',','.'));return isNaN(x)?null:x;}
function val(id){var e=$(id);return e?e.value.trim():'';}

/* ---------- données ---------- */
async function q(p){var r=await p;if(r.error)throw r.error;return r.data;}
async function chargerTout(){
  var r=await Promise.all([
    q(sb.from('gmao_equipements').select('*').order('code')),
    q(sb.from('gmao_modeles').select('*').order('nom')),
    q(sb.from('gmao_articles').select('*').order('designation')),
    q(sb.from('gmao_liens').select('*')),
    q(sb.from('gmao_preventifs').select('*'))
  ]);
  EQ=r[0];MOD=r[1];ART=r[2];LIENS=r[3];PREV=r[4];
  try{
    var r2=await Promise.all([q(sb.from('gmao_partenaires').select('*').order('nom')),q(sb.from('gmao_mesures').select('*').order('nom')),q(sb.from('gmao_releves').select('mesure_id,valeur,le').order('le',{ascending:false}).limit(5000))]);
    PART=r2[0];MES=r2[1];DERN={};r2[2].forEach(function(x){if(!DERN[x.mesure_id])DERN[x.mesure_id]=x;});V2=true;
  }catch(e){V2=false;PART=[];MES=[];DERN={};}
  MESID={};MES.forEach(function(m){MESID[m.id]=m;});
  try{SRC=await q(sb.from('gmao_sources').select('*'));V4=true;}catch(e){SRC=[];V4=false;}
  try{PERS=await q(sb.from('gmao_personnes').select('*').order('nom'));V6=true;
    STATS={};(await q(sb.from('gmao_interventions').select('preventif_id,duree_min,valide_le').eq('statut','Terminé'))).forEach(function(b){if(b.preventif_id&&b.valide_le&&b.duree_min){var x=STATS[b.preventif_id]=STATS[b.preventif_id]||{n:0,t:0};x.n++;x.t+=+b.duree_min;}});
    Object.keys(STATS).forEach(function(k){STATS[k].moy=Math.round(STATS[k].t/STATS[k].n);});
  }catch(e){PERS=[];STATS={};V6=false;}
  try{await q(sb.from('gmao_commandes').select('id').limit(1));V8=true;}catch(e){V8=false;}
  try{ASSOC=await q(sb.from('gmao_assoc').select('*'));V11=true;}catch(e){ASSOC=[];V11=false;}
  ASSOCA={};ASSOC.forEach(function(x){(ASSOCA[x.article_a]=ASSOCA[x.article_a]||[]).push({id:x.id,autre:x.article_b,note:x.note});(ASSOCA[x.article_b]=ASSOCA[x.article_b]||[]).push({id:x.id,autre:x.article_a,note:x.note});});
  SRCA={};SRC.forEach(function(x){(SRCA[x.article_id]=SRCA[x.article_id]||[]).push(x);});
  EQID={};EQ.forEach(function(e){EQID[e.id]=e;});
  MODID={};MOD.forEach(function(m){MODID[m.id]=m;});
  ARTID={};ART.forEach(function(a){ARTID[a.id]=a;});
}
function chemin(e,sep){var p=[],x=e,g=0;while(x&&g++<20){p.unshift(x.nom);x=EQID[x.parent_id];}return p.join(sep||' › ');}
function cheminLiens(e){var p=[],x=EQID[e.parent_id],g=0;while(x&&g++<20){p.unshift('<a href="#eq/'+x.id+'">'+esc(x.nom)+'</a>');x=EQID[x.parent_id];}return p.join(' › ');}
function enfants(id){return EQ.filter(function(e){return e.parent_id===id;});}
function descendants(id){var out=[],pile=[id];while(pile.length){var c=pile.pop();enfants(c).forEach(function(e){out.push(e.id);pile.push(e.id);});}return out;}
function hayEq(e){var m=MODID[e.modele_id];return [e.code,e.nom,chemin(e),e.marque,e.num_serie,e.emplacement,e.famille,m?m.nom:''].join(' ');}
function primEq(e){return e.nom+' '+e.code;}
function primArt(a){return [a.designation,a.ref,a.ref_fabricant,a.ref_fournisseur].concat((SRCA[a.id]||[]).map(function(x){return x.ref||'';})).join(' ');}
// v9.13 - Toutes les références d'une pièce (interne, constructeur, fournisseurs), sans doublon
function refsTout(a){var v=[];[a.ref,a.ref_fabricant].concat((SRCA[a.id]||[]).map(function(x){return x.ref;})).forEach(function(r){r=String(r||'').trim();if(r&&v.indexOf(r)<0)v.push(r);});return v;}
function assocNoms(a){return (ASSOCA[a.id]||[]).map(function(x){var o=ARTID[x.autre];if(!o)return '';var r=refsTout(o);return o.designation+(r.length?' ('+r.slice(0,2).join(' / ')+')':'');}).filter(Boolean);}
function hayArt(a){return [assocNoms(a).join(' '),a.ref,a.designation,a.ref_fabricant,a.ref_fournisseur,a.fournisseur,a.emplacement,a.motscles,a.notes].concat((SRCA[a.id]||[]).map(function(x){return x.partenaire+' '+(x.ref||'');})).join(' ');}
/* pièces d'un équipement : liées au modèle + liées directement */
function piecesDe(e){
  var out=[];LIENS.forEach(function(l){
    if(l.equipement_id===e.id)out.push({l:l,via:'directe'});
    else if(e.modele_id&&l.modele_id===e.modele_id)out.push({l:l,via:'modele'});
  });return out.filter(function(x){return ARTID[x.l.article_id];});
}
/* où est utilisée une pièce : liste d'équipements */
function ouUtilise(artId){
  var res=[];LIENS.filter(function(l){return l.article_id===artId;}).forEach(function(l){
    if(l.equipement_id&&EQID[l.equipement_id])res.push({e:EQID[l.equipement_id],l:l});
    if(l.modele_id)EQ.filter(function(e){return e.modele_id===l.modele_id;}).forEach(function(e){res.push({e:e,l:l,m:MODID[l.modele_id]});});
  });return res;
}

/* ---------- photos ---------- */
/* PHOTO PAR GLISSER-DÉPOSER OU COLLER : depuis l'app Photos du Mac, glisser la photo sur la zone,
   ou la copier (⌘C) puis ⌘V sur la page. Valable sur la page où la zone a été préparée. */
var _photoCollee=null;
function accepterPhoto(zone,fn){
  _photoCollee={hash:location.hash,fn:fn};
  if(!zone)return;
  zone.addEventListener('dragover',function(e){e.preventDefault();zone.style.outline='3px dashed var(--bleu)';});
  zone.addEventListener('dragleave',function(){zone.style.outline='';});
  zone.addEventListener('drop',function(e){e.preventDefault();zone.style.outline='';var f=[].slice.call((e.dataTransfer&&e.dataTransfer.files)||[]).find(function(x){return /^image\//.test(x.type)||/\.(jpe?g|png|heic|gif|webp)$/i.test(x.name);});if(f)fn(f);else toast('Glissez une photo (image)');});
}
document.addEventListener('paste',function(e){
  if(!_photoCollee||_photoCollee.hash!==location.hash)return;
  var it=[].slice.call((e.clipboardData&&e.clipboardData.items)||[]).find(function(x){return x.kind==='file'&&/^image\//.test(x.type);});
  if(!it)return; e.preventDefault(); _photoCollee.fn(it.getAsFile());
});
function choisirPhoto(){return new Promise(function(res){var f=$('filePhoto');f.value='';f.onchange=function(){res(f.files[0]||null);};f.click();});}
async function envoyerPhoto(file){
  var img=await new Promise(function(ok,ko){var i=new Image();i.onload=function(){ok(i);};i.onerror=ko;i.src=URL.createObjectURL(file);});
  var max=1600,w=img.width,h=img.height,k=Math.min(1,max/Math.max(w,h));
  var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  var blob=await new Promise(function(ok){c.toBlob(ok,'image/jpeg',0.82);});
  var nom=Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
  var r=await sb.storage.from('gmao').upload(nom,blob,{contentType:'image/jpeg'});
  if(r.error)throw r.error;
  return sb.storage.from('gmao').getPublicUrl(nom).data.publicUrl;
}
function zoom(url){ouvrir('<img src="'+esc(url)+'" style="width:100%;border-radius:10px"><div class="actions"><button class="btn" onclick="fermer()">Fermer</button></div>');}

/* ---------- fenêtres ---------- */
function ouvrir(html){$('boite').innerHTML=html;$('fond').classList.add('on');}
function fermer(){$('fond').classList.remove('on');$('boite').innerHTML='';}
$('fond').addEventListener('click',function(e){if(e.target.id==='fond')fermer();});
function demander(titre,defaut,aide){
  return new Promise(function(res){
    ouvrir('<h3>'+esc(titre)+'</h3>'+(aide?'<div class="etiq">'+esc(aide)+'</div>':'')+
      '<input id="dm-v" value="'+esc(defaut==null?'':defaut)+'"><div class="actions"><button class="btn" id="dm-a">Annuler</button><button class="btn p" id="dm-o">OK</button></div>');
    var i=$('dm-v');setTimeout(function(){i.focus();i.select();},50);
    $('dm-a').onclick=function(){fermer();res(null);};
    $('dm-o').onclick=function(){var v=i.value;fermer();res(v);};
    i.onkeydown=function(e){if(e.key==='Enter')$('dm-o').click();};
  });
}
/* Sélecteur avec recherche tolérante */
function choisir(o){
  return new Promise(function(res){
    ouvrir('<h3>'+esc(o.titre)+'</h3><div class="rech"><input id="ch-q" placeholder="Tape quelques lettres, un code, une référence…"></div>'+
      (o.entete||'')+'<div class="liste-choix" id="ch-l"></div><div class="actions">'+(o.creer?'<button class="btn" id="ch-c">+ '+esc(o.creer)+'</button>':'')+'<button class="btn" id="ch-a">Annuler</button></div>');
    var inp=$('ch-q');
    function rendre(){
      var t=inp.value,l=trier(t,o.items.filter(function(x){return correspond(t,o.hay(x));}),o.prim).slice(0,150);
      $('ch-l').innerHTML=l.length?l.map(function(x,i){return '<div class="ligne" data-i="'+o.items.indexOf(x)+'" style="cursor:pointer">'+o.rendu(x)+'</div>';}).join(''):'<div class="vide">Rien trouvé.</div>';
    }
    $('ch-l').onclick=function(e){var d=e.target.closest('[data-i]');if(!d)return;var x=o.items[+d.dataset.i];fermer();res(x);};
    $('ch-a').onclick=function(){fermer();res(null);};
    if(o.creer)$('ch-c').onclick=function(){fermer();res('__creer__');};
    inp.oninput=rendre;rendre();setTimeout(function(){inp.focus();},50);
  });
}
function renduEq(e){return '<span class="pt '+esc(e.criticite||'')+'"></span><div class="g"><div class="t">'+esc(e.nom)+' <span class="etiq">'+esc(e.code)+'</span>'+(e.contrat_partenaire_id?' <span title="Sous contrat de maintenance">🛡</span>':'')+'</div><div class="s">'+esc(chemin(e))+'</div></div>';}
// v9.10 - Référence affichée partout : réf. interne, sinon constructeur, sinon la réf. du premier fournisseur.
function refArt(a){if(!a)return '';if(a.ref)return a.ref;if(a.ref_fabricant)return a.ref_fabricant;var s=(SRCA[a.id]||[]).find(function(x){return x.ref;});return s?s.ref+(s.partenaire?' ('+s.partenaire+')':''):(a.ref_fournisseur||'');}
function renduArt(a){return (a.photo?'<img class="mini" src="'+esc(a.photo)+'">':'<div class="mini"></div>')+'<div class="g"><div class="t">'+esc(a.designation)+'</div><div class="s">'+esc(refsTout(a).concat([a.emplacement]).filter(Boolean).join(' · '))+((SRCA[a.id]||[]).length>1?' · <b>'+SRCA[a.id].length+' fournisseurs</b>':'')+(assocNoms(a).length?'<br>🔗 va avec : '+esc(assocNoms(a).join(', ')):'')+'</div></div>'+badgeStock(a);}
function choisirEq(titre){return choisir({titre:titre||'Choisir une machine',items:EQ,hay:hayEq,rendu:renduEq,prim:primEq});}
function badgeStock(a){var s=+a.stock||0,m=+a.stock_mini||0;return '<span class="badge '+(s<=0?'b-rouge':(s<=m?'b-orange':'b-vert'))+'">'+s+' '+esc(a.unite||'')+'</span>';}

/* ---------- badges ---------- */
var STATUTS=['Demandé','En cours','En pause','Attente pièce','Terminé'];
function badgeStatut(s){var c={'Demandé':'b-bleu','En cours':'b-orange','En pause':'b-orange','Attente pièce':'b-rouge','Terminé':'b-vert'}[s]||'';return '<span class="badge '+c+'">'+esc(s)+'</span>';}
function badgePrio(p,arr){if(arr)return '<span class="badge b-rouge">⛔ arrêt</span>';if(p==='Urgente')return '<span class="badge b-rouge">Urgent</span>';return '';}
/* v9.15 - CONTRAT DE MAINTENANCE : le contrat d'une machine vaut aussi pour ses sous-ensembles */
function contratDe(e){var vu={};while(e&&!vu[e.id]){vu[e.id]=1;if(e.contrat_partenaire_id){var p=PART.find(function(x){return x.id===e.contrat_partenaire_id;});if(p)return {p:p,eq:e};}e=e.parent_id?EQID[e.parent_id]:null;}return null;}
function badgeContrat(e){var c=contratDe(e);return c?'<span class="badge b-bleu" title="Machine sous contrat de maintenance">🛡 Sous contrat · '+esc(c.p.nom)+'</span>':'';}
function boutonsContact(p){return (p.telephone?'<a class="btn p" href="tel:'+esc(p.telephone.replace(/\s/g,''))+'">📞 Appeler '+esc(p.telephone)+'</a>':'')+(p.email?'<a class="btn" href="mailto:'+esc(p.email)+'">✉ Écrire</a>':'');}
function badgeEtat(e){if(!e)return'';var c={'En service':'b-vert','Dégradé':'b-orange','En réparation':'b-orange','Hors service':'b-rouge'}[e]||'';return '<span class="badge '+c+'">'+esc(e)+'</span>';}
function echeance(p){if(!p.dernier)return null;return ajoutJours(p.dernier,p.periodicite_jours||30);}
function fmtN(x){var r=Math.round(x*10)/10;return (r===0?0:r).toLocaleString('fr-FR');}
/* état d'un plan préventif : à la date ou au compteur */
function infoPrev(p){
  if(p.mesure_id){
    var m=MESID[p.mesure_id],d=DERN[p.mesure_id],u=m?(m.unite||''):'',per=+p.periodicite_valeur||0;
    if(!d)return {cls:'b-orange',txt:'aucun relevé',ordre:-1,aFaire:true};
    if(p.dernier_valeur==null)return {cls:'b-orange',txt:'jamais fait',ordre:-1,aFaire:true};
    var reste=(+p.dernier_valeur)+per-(+d.valeur);
    if(reste<=0)return {cls:'b-rouge',txt:(reste<0?'dépassé de '+fmtN(-reste):'atteint')+''+' '+u,ordre:reste/(per||1),aFaire:true};
    if(reste<=per*0.1)return {cls:'b-orange',txt:'encore '+fmtN(reste)+' '+u,ordre:reste/(per||1),aFaire:true};
    return {cls:'b-vert',txt:'encore '+fmtN(reste)+' '+u,ordre:reste/(per||1),aFaire:false};
  }
  var e=echeance(p);if(!e)return {cls:'b-orange',txt:'jamais fait',ordre:-1,aFaire:true};
  var j=joursEntre(auj(),e),per2=p.periodicite_jours||30;
  if(j<0)return {cls:'b-rouge',txt:'en retard de '+(-j)+' j',ordre:j/per2,aFaire:true};
  if(j<=7)return {cls:'b-orange',txt:'dans '+j+' j',ordre:j/per2,aFaire:true};
  return {cls:'b-vert',txt:fmtD(e),ordre:j/per2,aFaire:false};
}
function badgeEcheance(p){var i=infoPrev(p);return '<span class="badge '+i.cls+'">'+esc(i.txt)+'</span>';}

/* ---------- routeur ---------- */
var VUES={};
function aller(h){location.hash=h;}
async function route(){
  /* Connexion perdue (après des heures ouvertes, coupure Supabase…) : sans elle, les listes arrivent VIDES sans erreur */
  try{var ss=await sb.auth.getSession();if(!ss.data||!ss.data.session){var rf=await sb.auth.refreshSession();if(!rf.data||!rf.data.session){toast('Connexion expirée : reconnecte-toi');setTimeout(function(){location.reload();},1200);return;}}}catch(e){}
  var h=location.hash.replace(/^#/,'')||'accueil', p=h.split('/'), v=p[0];
  document.querySelectorAll('#nav a').forEach(function(a){
    var d=a.dataset.v;a.classList.toggle('on',d===v||(d==='bons'&&(v==='bon'||v==='pannes'))||(d==='planning'&&v==='planning')||(d==='parc'&&(v==='eq'||v==='etiquettes'))||(d==='articles'&&(v==='art'||v==='stock'||v==='doublons'))||(d==='modeles'&&v==='mod')||(d==='compteurs'&&v==='mes')||(d==='partenaires'&&v==='par'));
  });
  var f=VUES[v]||VUES.accueil;
  $('main').innerHTML='<div class="vide">Chargement…</div>';
  try{await f(p[1],p[2]);}catch(e){erreur(e);$('main').innerHTML='<div class="carte">Erreur : '+esc(e.message||e)+'</div>';}
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* DEMANDE À TRAITER : bon ouvert que personne n'a encore pris en main (pas confié ou pas de jour) — ex. une demande d'un employé par QR code */
function aTraiter(b){return b.statut!=='Terminé'&&b.statut!=='Attente pièce'&&(!b.assigne_a||!b.prevu_le);}
/* demande venue d'un employé (QR code) : le demandeur n'est ni toi ni quelqu'un de l'équipe maintenance */
function deEmploye(b){return !!b.demandeur&&!memePers(b.demandeur,NOM)&&!PERS.some(function(p){return memePers(b.demandeur,p.nom);});}
function ligneBon(b){
  var e=EQID[b.equipement_id];
  return '<a class="ligne" href="#bon/'+b.id+'"><div class="g"><div class="t">'+numBT(b.numero)+' · '+esc(b.titre)+'</div><div class="s">'+
    esc(e?chemin(e):'— sans machine —')+' · '+esc(b.type)+' · '+fmtDH(b.cree_le)+(b.intervenant?' · '+esc(b.intervenant):'')+(deEmploye(b)?' · <b style="color:var(--bleu)">📱 demandé par '+esc(b.demandeur)+'</b>':'')+'</div></div>'+badgePrio(b.priorite,b.machine_arretee&&b.statut!=='Terminé')+badgeStatut(b.statut)+'</a>';
}
function periodeTxt(p){
  if(p.mesure_id){var m=MESID[p.mesure_id];return 'toutes les '+fmtN(+p.periodicite_valeur||0)+' '+esc(m?(m.unite||''):'')+' ('+esc(m?m.nom:'compteur ?')+') · fait à '+(p.dernier_valeur==null?'—':fmtN(+p.dernier_valeur));}
  var pr=occurrences(p,auj(),ajoutJours(auj(),120)).slice(0,3);
  return 'tous les '+p.periodicite_jours+' j · fait le '+(p.dernier?fmtD(p.dernier):'—')+(pr.length?' · <b>prochaines : '+pr.map(fmtD).join(', ')+'</b>':'');
}
/* dates des prochains passages d'un plan à la date, entre deux jours */
function occurrences(p,de,a){
  if(p.mesure_id||!p.actif)return [];
  var per=Math.max(1,p.periodicite_jours||30),e=echeance(p)||auj(),out=[],g=0;
  while(e<de&&g++<500)e=ajoutJours(e,per);
  while(e<=a&&g++<1000){out.push(e);e=ajoutJours(e,per);}
  return out;
}
/* Anti-doublon : bons encore ouverts sur la même machine */
async function ouvertsSur(eqId){if(!eqId)return [];return await q(sb.from('gmao_interventions').select('id,numero,titre,prevu_le,statut').eq('equipement_id',eqId).neq('statut','Terminé'));}
function memeTitre(a,b){a=norm(a);b=norm(b);return !!a&&!!b&&(a===b||a.indexOf(b)>=0||b.indexOf(a)>=0);}
function txtBons(l){return l.slice(0,6).map(function(b){return '• '+numBT(b.numero)+' — '+b.titre+(b.prevu_le?' (prévu le '+fmtD(b.prevu_le)+')':'')+' ['+b.statut+']';}).join('\n');}
/* Retourne true si on peut créer ; sinon ouvre le bon existant */
async function verifDoublon(eqId,titre,tous){
  var l=await ouvertsSur(eqId);if(!l.length)return true;
  var m=l.filter(function(b){return memeTitre(b.titre,titre);});
  if(m.length){if(confirm('⚠ Un bon « '+m[0].titre+' » est DÉJÀ ouvert sur cette machine :\n'+txtBons(m)+'\n\nCréer quand même un 2ᵉ bon ?\n(« Annuler » = ouvrir le bon existant)'))return true;aller('bon/'+m[0].id);return false;}
  if(tous&&!confirm('Déjà ouvert sur cette machine :\n'+txtBons(l)+'\n\nSi c\'est le même problème, « Annuler » et complète le bon existant.\nCréer un nouveau bon ?'))return false;
  return true;
}
async function lancerPrevLe(pid,jour){
  var p=PREV.find(function(x){return x.id===pid;});if(!p)return;
  var deja=await q(sb.from('gmao_interventions').select('*').eq('preventif_id',pid).neq('statut','Terminé'));
  if(deja.length){planifier(deja[0],jour);return;}
  if(!(await verifDoublon(p.equipement_id,p.titre)))return;
  var desc=(p.checklist||'').split('\n').filter(function(x){return x.trim();}).map(function(x){return '☐ '+x.trim();}).join('\n');
  try{var r=await q(sb.from('gmao_interventions').insert({titre:p.titre,description:desc,type:'Préventif',priorite:'Normale',equipement_id:p.equipement_id,preventif_id:pid,demandeur:NOM,prevu_le:jour,temps_prevu_min:p.temps_prevu_min||null}).select());
    planifier(r[0],jour);}catch(x){erreur(x);}
}
function lignePrev(p){
  var e=EQID[p.equipement_id];
  var dbl=PREV.some(function(x){return x.id!==p.id&&x.equipement_id===p.equipement_id&&memeTitre(x.titre,p.titre);});
  return '<div class="ligne"><div class="g"><div class="t">'+esc(p.titre)+(dbl?' <span class="badge b-orange">⚠ 2 plans identiques sur cette machine ?</span>':'')+'</div><div class="s">'+esc(e?chemin(e):'—')+' · '+periodeTxt(p)+(p.temps_prevu_min?' · ⏱ prévu '+fmtMin(p.temps_prevu_min):'')+(STATS[p.id]?' · réel moyen '+fmtMin(STATS[p.id].moy)+' ('+STATS[p.id].n+' fois)':'')+'</div></div>'+
    badgeEcheance(p)+'<button class="btn sm" onclick="lancerPrev(\''+p.id+'\')">Créer le bon</button><button class="btn sm l" onclick="editerPrev(\''+p.id+'\')">✎</button></div>';
}

/* =====================================================================
   STOCK : valorisation (pour le comptable) + pièces les plus consommées
   ===================================================================== */
function eur(x){return (+x||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});}
function qFr(x){var r=Math.round((+x||0)*100)/100;return r.toLocaleString('fr-FR');}
/* Prix unitaire retenu : prix de la fiche, sinon le prix fournisseur le plus récent (le moins cher à date égale) */
function memeFo(x,y){return norm(String(x||'')).trim()===norm(String(y||'')).trim();}
function prixRetenu(a){
  // v9.11 - Le fournisseur chez qui la pièce a été achetée (a.fournisseur) passe avant tout le reste
  if(a.fournisseur){var ch=(SRCA[a.id]||[]).find(function(x){return memeFo(x.partenaire,a.fournisseur)&&x.prix!=null&&+x.prix>0;});
    if(ch)return {p:+ch.prix,src:ch.partenaire+' (acheté ici)'};}
  if(a.prix!=null&&+a.prix>0)return {p:+a.prix,src:a.fournisseur||'fiche pièce'};
  var l=(SRCA[a.id]||[]).filter(function(x){return x.prix!=null&&+x.prix>0;});
  if(!l.length)return null;
  l.sort(function(x,y){var dx=x.date_prix||'',dy=y.date_prix||'';if(dx!==dy)return dx<dy?1:-1;return (+x.prix)-(+y.prix);});
  return {p:+l[0].prix,src:l[0].partenaire+(l[0].date_prix?' ('+fmtD(l[0].date_prix)+')':'')};
}
function telecharger(nom,lignes){

    if(start&&cur===null)cur=d;else if(stop&&cur!==null){total+=d-cur;cur=null;}
  });
  return {min:Math.round((total+(cur!==null?Date.now()-cur:0))/60000),cur:cur};
}

/* Éléments qui ne sont pas des machines : décochés par défaut */
function exclureParDefaut(r){
  var c=norm(r.code),n=norm(r.nom),f=norm(r.famille);
  if(/^(la courtine)$/.test(c))return 'site';
  if(/tachygraphe|^carte |^cf$|^vds$/.test(c)||/vdo dlk/.test(n)||/^carte /.test(n))return 'chronotachygraphe';
  if(/matin|am$/.test(c)&&/manutention|sechage repassage/.test(f))return 'personne / équipe';
  if(/^(production|ma|mg)$/.test(c))return 'pseudo-équipement';
  if(/poubelle/.test(n))return 'poubelle';
  if(/^allee /.test(n))return 'allée';
  return '';
}
/* Parents ambigus dans DIMO (même nom pour plusieurs équipements) */
var PARENT_FORCE={'VA12':'EMTAE1','VA13':'EMTAE1','VA16':'EMTAE1','A25':'EMTAE2','VA20':'EMTAE2','VA26':'EMTAE2','ebmpapst 4314':'AEEMX'};
var MODELE_PROPOSE={'1.S1':'Kannegiesser D60','4.S4':'Kannegiesser D60','2.S2':'Kannegiesser D120','3.S3':'Kannegiesser D120','B30':'Sfere BM cercleuse semi-auto','CSA2':'Sfere BM cercleuse semi-auto','40022-T10':'Fradin tapis de convoyage','T12':'Fradin tapis de convoyage'};
function propre(s){s=String(s||'').replace(/\s+/g,' ').trim();s=s.replace(/transportt/gi,'transport').replace(/\bpalie\b/gi,'partie');return s?s.charAt(0).toUpperCase()+s.slice(1):'';}
function etatPropre(s){var n=norm(s);return {'en service':'En service','degrade':'Dégradé','en reparation':'En réparation','hors service':'Hors service'}[n]||'En service';}
function lireCSV(txt){
  var sep=(txt.split('\n')[0].match(/;/g)||[]).length>=(txt.split('\n')[0].match(/,/g)||[]).length?';':',';
  var rows=[],row=[],cur='',inq=false;
  for(var i=0;i<txt.length;i++){var ch=txt[i];
    if(inq){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++;}else inq=false;}else cur+=ch;}
    else if(ch==='"')inq=true;else if(ch===sep){row.push(cur);cur='';}else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';}else if(ch!=='\r')cur+=ch;}
  if(cur||row.length){row.push(cur);rows.push(row);}
  var h=rows.shift().map(function(x){return x.replace(/^﻿/,'').trim();});
  return rows.filter(function(r){return r.some(function(x){return x.trim();});}).map(function(r){var o={};h.forEach(function(k,i){o[k]=r[i]||'';});return o;});
}
var IMP=null;
VUES.import=async function(){
  $('main').innerHTML='<h1 class="titre">Import depuis DIMO</h1><div class="carte"><b>1.</b> Choisis un fichier exporté de DIMO (.csv) : <b>Equipements</b>, <b>Pièces stockées par magasin</b>, <b>Partenaires</b> ou <b>Mesures</b>.<br><br><input type="file" id="iF" accept=".csv,text/csv"></div><div id="iZ"></div>';
  $('iF').onchange=async function(){
    var f=this.files[0];if(!f)return;var txt=await f.text();var L=lireCSV(txt);
    if(L.length&&('Code pièce' in L[0])){preparerPieces(L);return;}
    if(L.length&&('Sous-traitant' in L[0])){preparerPartenaires(L);return;}
    if(L.length&&('Unité' in L[0])&&('Equipement' in L[0]||'Équipement' in L[0])){preparerMesures(L);return;}
    if(!L.length||!('Equipement père' in L[0])){$('iZ').innerHTML='<div class="carte">Ce fichier ne ressemble ni à l\'export Équipements ni à l\'export Pièces de DIMO.</div>';return;}
    var rows=L.map(function(o){return {code:o['Code'].trim(),nom:propre(o['Désignation']),pereNom:o['Equipement père'],marque:propre(o['Marque']),modeleTxt:o["Modèle d'équipement"],num_serie:o['Numéro de série'].trim(),etat:etatPropre(o["Etat d'équipement"]),emplacement:propre(o['Emplacement']),famille:propre(o['Désignation famille d\'équipements']),criticite:propre(o["Criticité d'équipement"])||null,en_service:o['En service']==='true'};});
    var parNom={};rows.forEach(function(r){var k=norm(r.nom);(parNom[k]=parNom[k]||[]).push(r);});
    var parCode={};rows.forEach(function(r){parCode[r.code]=r;});
    var series={};rows.forEach(function(r){if(r.num_serie)(series[r.num_serie]=series[r.num_serie]||[]).push(r.code);});
    rows.forEach(function(r){
      r.exclu=exclureParDefaut(r);r.inclus=!r.exclu;r.warn=[];
      var pk=norm(r.pereNom);
      if(PARENT_FORCE[r.code])r.pere=PARENT_FORCE[r.code];
      else if(pk&&parNom[pk]){var c=parNom[pk].filter(function(x){return x.code!==r.code;});if(c.length===1)r.pere=c[0].code;else if(c.length>1){r.pere=c[0].code;r.warn.push('parent ambigu ('+c.map(function(x){return x.code;}).join(', ')+')');}}
      else if(pk)r.warn.push('parent « '+r.pereNom+' » introuvable');
      if(r.pere==='La courtine')r.pere=null;
      if(r.num_serie&&series[r.num_serie].length>1)r.warn.push('n° série '+r.num_serie+' en double');
      if(EQ.some(function(e){return norm(e.code)===norm(r.code);})){r.inclus=false;r.exclu='déjà dans la GMAO';}
      r.modele=MODELE_PROPOSE[r.code]||'';
    });
    rows.forEach(function(r){if(!r.en_service&&rows.some(function(x){return x.pere===r.code&&x.inclus;})){r.en_service=true;r.warn.push('marqué actif (contient des machines)');}});
    IMP={rows:rows,parCode:parCode};afficherImport();
  };
};

  $('iZ').innerHTML='<div class="carte"><b>2.</b> Vérifie la liste. Les lignes grisées (personnes, tachygraphes, poubelles, allées…) ne seront pas importées — coche-les si tu veux les garder.<br>Les noms, emplacements et familles ont été nettoyés. Les modèles proposés regroupent les machines identiques.'+

async function importer(){
  var R=IMP.rows.filter(function(r){return r.inclus;});if(!R.length)return;
  $('iGo').disabled=true;$('iGo').textContent='Import en cours…';
  try{
    var modIds={};
    for(var nomM of uniques(R.map(function(r){return r.modele;}))){
      var ex=MOD.find(function(m){return norm(m.nom)===norm(nomM);});
      if(ex){modIds[nomM]=ex.id;continue;}
      var marque=R.find(function(r){return r.modele===nomM;}).marque||null;
      var mr=await q(sb.from('gmao_modeles').insert({nom:nomM,marque:marque}).select());modIds[nomM]=mr[0].id;
    }
    var ids={};R.forEach(function(r){ids[r.code]=crypto.randomUUID();});
    EQ.forEach(function(e){ids[e.code]=ids[e.code]||e.id;});
    /* parents d'abord */
    var faits={},ordre=[],garde=0;

    R.forEach(function(r){if(!faits[r.code])ordre.push(r);});
    var payload=ordre.map(function(r){return {id:ids[r.code],code:r.code,nom:r.nom||r.code,parent_id:(r.pere&&ids[r.pere])||null,modele_id:r.modele?modIds[r.modele]:null,marque:r.marque||null,num_serie:r.num_serie||null,etat:r.etat,en_service:r.en_service,emplacement:r.emplacement||null,famille:r.famille||null,criticite:r.criticite||null};});
    for(var i=0;i<payload.length;i+=50)await q(sb.from('gmao_equipements').insert(payload.slice(i,i+50)));
    await chargerTout();toast('✓ '+payload.length+' équipements importés');aller('parc');

/* ---------- Import des pièces DIMO ---------- */
/* Pièces reconnues pour une machine (code pièce DIMO → code équipement ; m:true = lier au modèle) */
var PIECE_MACHINE={
  '14401211':{e:'PGT'},'JPGT':{e:'PGT'},'12511':{e:'PGT'},
  'ASA38.10':{e:'TL1'},'asa38.10 attache a goupille':{e:'TL1'},'ASA3810.10SLINK':{e:'TL1'},
  'sanglecfm2':{e:'3.CFM2'},'BTCFM2':{e:'3.CFM2'},
  'plaq':{e:'PTM'},'62204-2RS':{e:'PTM'},
  '6205.HV.ZZ':{e:'NAV1'},'WM100349':{e:'NAV1'},
  'TAP  4900X1080':{e:'P1'},'moteur2 sortie séchoir':{e:'moteur2'},'MRFAXMPB':{e:'MRFAXM'},
  'pompe 2':{e:'pompe 2'},'4314':{e:'ebmpapst 4314'},'8881450':{e:'pompe 8881450'},
  '055350/3':{e:'VFD120'},'VFL120':{e:'VFL120'},'69042850':{e:'ASPI'},'Aspi':{e:'ASPI'},'BES':{e:'OG716.971'},
  'feuil':{e:'B30',m:true},'FIL':{e:'MSF1'}
};
function nbFr(v){v=String(v||'').replace(/["'\s]/g,'').replace(',','.');var x=parseFloat(v);return isNaN(x)?0:x;}
function unitePropre(u){var n=norm(u);if(!n||n==='unite'||n==='degre celsius')return 'pce';if(n==='metre')return 'm';return u.trim();}
function preparerPieces(L){
  var parCle={},liste=[];
  L.forEach(function(o){
    var code=String(o['Code pièce']||'').trim(), u=unitePropre(o['Unité de stockage']), cle=norm(code)+'|'+norm(u);
    var mag2=o['Code magasin']!=='MAIN', lieu=String(o['Lieu de stockage']||'').trim();
    var empl=lieu?(mag2?'Magasin 2 – '+lieu:lieu):(mag2?'Magasin 2':'');
    var x=parCle[cle];
    if(!x){x=parCle[cle]={ref:code,designation:propre(o['Désignation pièce']),unite:u,stock:0,empl:[],fournisseur:propre(o['Fournisseur principal']),alerte:false,inclus:true,warn:[]};liste.push(x);}
    x.stock+=nbFr(o['Réelle']);if(empl&&x.empl.indexOf(empl)<0)x.empl.push(empl);
    if(o['Pièce/stock en alerte']==='Oui')x.alerte=true;
  });
  var vus={};liste.forEach(function(x){var k=norm(x.ref);if(vus[k]){x.designation+=' ('+x.unite+')';vus[k].designation.indexOf('(')<0&&(vus[k].designation+=' ('+vus[k].unite+')');}else vus[k]=x;});
  liste.forEach(function(x){
    x.emplacement=x.empl.join(' / ');
    x.stock_mini=x.alerte?Math.max(1,x.stock):0;
    var m=PIECE_MACHINE[x.ref]||PIECE_MACHINE[x.ref.trim()], e=null;
    if(!m){e=EQ.find(function(q){return compact(q.code)===compact(x.ref)||(q.num_serie&&compact(q.num_serie)===compact(x.ref));});if(e)m={e:e.code};}
    if(m){e=EQ.find(function(q){return q.code===m.e;});if(e){x.lien={equipement:e,modele:m.m&&e.modele_id?MODID[e.modele_id]:null};x.lier=true;}}
    if(ART.some(function(a){return norm(a.ref)===norm(x.ref)&&norm(a.unite)===norm(x.unite);})){x.inclus=false;x.warn.push('déjà dans la GMAO');}
  });
  IMP={pieces:liste};afficherPieces();
}
function afficherPieces(){
  var R=IMP.pieces,n=R.filter(function(r){return r.inclus;}).length,nl=R.filter(function(r){return r.inclus&&r.lien&&r.lier;}).length;
  $('iZ').innerHTML='<div class="carte"><b>2.</b> '+R.length+' pièces trouvées. DIMO ne donne pas les machines de chaque pièce : j\'en ai reconnu <b>'+R.filter(function(r){return r.lien;}).length+'</b> (pompe à graisse tunnel, chaîne tunnel, CFM2, navette…). Les autres, tu les lieras au fil de l\'eau depuis la fiche machine.<br>'+
    '<span class="etiq">Le stock mini n\'est pas dans l\'export : les pièces « en alerte » dans DIMO reçoivent un mini de 1 (à ajuster).</span>'+
    '<div class="actions"><button class="btn p" id="iGo">Importer '+n+' pièces ('+nl+' liens machine)</button></div></div>'+
    '<div class="carte" style="overflow-x:auto"><table class="imp"><tr><th></th><th>Réf.</th><th>Désignation</th><th>Stock</th><th>Emplacement</th><th>Fournisseur</th><th>Machine</th></tr>'+
    R.map(function(r,i){return '<tr class="'+(r.inclus?'':'ex')+'"><td><input type="checkbox" data-i="'+i+'" style="width:auto"'+(r.inclus?' checked':'')+'></td><td>'+esc(r.ref)+'</td><td>'+esc(r.designation)+(r.alerte?' <span class="badge b-orange">alerte</span>':'')+r.warn.map(function(w){return '<div class="warn">'+esc(w)+'</div>';}).join('')+'</td><td>'+r.stock+' '+esc(r.unite)+'</td><td>'+esc(r.emplacement)+'</td><td>'+esc(r.fournisseur)+'</td><td>'+
      (r.lien?'<label style="display:flex;gap:5px;margin:0;color:var(--txt);font-size:13px"><input type="checkbox" data-l="'+i+'" style="width:auto"'+(r.lier?' checked':'')+'>'+esc(r.lien.modele?'modèle '+r.lien.modele.nom:r.lien.equipement.nom)+'</label>':'')+'</td></tr>';}).join('')+'</table></div>';
  document.querySelectorAll('#iZ [data-i]').forEach(function(c){c.onchange=function(){R[+c.dataset.i].inclus=c.checked;afficherPieces();};});
  document.querySelectorAll('#iZ [data-l]').forEach(function(c){c.onchange=function(){R[+c.dataset.l].lier=c.checked;afficherPieces();};});
  $('iGo').onclick=importerPieces;

function piecesDuPart(x){var k=norm(x.nom);return ART.filter(function(a){return (SRCA[a.id]||[]).some(function(s){return norm(s.partenaire)===k;})||(!V4&&norm(a.fournisseur)===k);});}
function sigArt(a){
  var d=norm(a.designation).replace(/[()]/g,' ');
  var mots=d.split(/[^a-z0-9]+/).filter(Boolean);
  var premier=(mots.find(function(m){return !/\d/.test(m)&&m.length>2;})||'').replace(/(s|x)$/,'');
  return {premier:premier,nums:(d.match(/\d+/g)||[]).map(Number),c:compact(a.designation)};
}
function sousSuite(c,l){if(c.length<2||c.length>l.length)return false;for(var i=0;i+c.length<=l.length;i++){var ok=true;for(var j=0;j<c.length;j++)if(l[i+j]!==c[j]){ok=false;break;}if(ok)return true;}return false;}
function memePiece(a,b){
  if(a.id&&a.id===b.id)return false;
  var sa=sigArt(a),sb2=b._sig||(b._sig=sigArt(b));
  var ra=compact(a.ref),rb=compact(b.ref);
  if(ra.length>=4&&/\d/.test(ra)&&sb2.c.indexOf(ra)>=0)return true;
  if(rb.length>=4&&/\d/.test(rb)&&sa.c.indexOf(rb)>=0)return true;
  if(compact(a.ref_fabricant)&&compact(a.ref_fabricant)===compact(b.ref_fabricant))return true;
  if(sa.premier&&sa.premier===sb2.premier){var c=sa.nums.length<=sb2.nums.length?[sa.nums,sb2.nums]:[sb2.nums,sa.nums];if(sousSuite(c[0],c[1]))return true;}
  return false;
}
function lireIgnores(){try{return JSON.parse(localStorage.getItem('gmao_pas_doublon')||'{}');}catch(e){return {};}}
function cleP(x,y){return x<y?x+'|'+y:y+'|'+x;}
function similaires(a){var ig=lireIgnores();return ART.filter(function(b){return b.id!==a.id&&!ig[cleP(a.id,b.id)]&&memePiece(a,b);});}
function paireDoublons(){
  var ig=lireIgnores(),out=[];
  for(var i=0;i<ART.length;i++)for(var j=i+1;j<ART.length;j++){var a=ART[i],b=ART[j];if(!ig[cleP(a.id,b.id)]&&memePiece(a,b))out.push([a,b]);}
  return out;
}

/* =====================================================================
   PANNES DÉJÀ RÉSOLUES : retrouver une réparation passée en décrivant la panne
   ===================================================================== */
var HIST=null, HIST_T=0;
var MOTS_VIDES={le:1,la:1,les:1,de:1,du:1,des:1,un:1,une:1,et:1,en:1,au:1,aux:1,sur:1,pas:1,plus:1,est:1,il:1,elle:1,qui:1,que:1,ne:1,se:1,sa:1,son:1,ses:1,par:1,pour:1,avec:1,dans:1,peu:1,peine:1,machine:1,veut:1,fait:1,tres:1,trop:1,cest:1,mais:1,ou:1,ca:1};
async function chargerHistorique(force){
  if(HIST&&!force&&Date.now()-HIST_T<120000)return HIST;
  var r=await Promise.all([
    q(sb.from('gmao_interventions').select('*').eq('statut','Terminé').order('fin',{ascending:false}).limit(1500)),
    q(sb.from('gmao_messages').select('intervention_id,texte,auteur').neq('auteur','•').limit(8000)),
    q(sb.from('gmao_mouvements').select('article_id,intervention_id,quantite').limit(8000))
  ]);
  var msg={},pcs={};
  r[1].forEach(function(m){if(m.texte)(msg[m.intervention_id]=msg[m.intervention_id]||[]).push(m.texte);});
  r[2].forEach(function(m){if(m.intervention_id&&m.quantite<0&&ARTID[m.article_id])(pcs[m.intervention_id]=pcs[m.intervention_id]||[]).push({a:ARTID[m.article_id],n:-m.quantite});});
  HIST=r[0].map(function(b){var e=EQID[b.equipement_id],md=e&&MODID[e.modele_id];
    b._msgs=msg[b.id]||[];b._pcs=pcs[b.id]||[];
    b._titreN=norm(b.titre);
    b._hayN=norm([b.titre,b.description,b.rapport,b.justification,b._msgs.join(' '),b._pcs.map(function(x){return x.a.designation+' '+(refArt(x.a));}).join(' '),e?chemin(e)+' '+e.code:'',md?md.nom:''].join(' '));
    return b;});
  HIST_T=Date.now();return HIST;
}
function motsCles(t){return norm(t).split(/[^a-z0-9]+/).filter(function(w){return w.length>=3&&!MOTS_VIDES[w];});}
/* score : mots trouvés (le titre compte double, début de mot accepté : « cercle » ↔ « cercleuse »), + même machine / même modèle */
function scorePanne(b,mots,eq){
  var s=0;mots.forEach(function(w){var p=w.length>5?w.slice(0,5):w;
    if(b._titreN.indexOf(w)>=0)s+=2;else if(b._titreN.indexOf(p)>=0)s+=1.2;
    if(b._hayN.indexOf(w)>=0)s+=1;else if(b._hayN.indexOf(p)>=0)s+=0.6;});
  if(s>0&&eq){var e=EQID[b.equipement_id];if(e&&e.id===eq.id)s+=3;else if(e&&eq.modele_id&&e.modele_id===eq.modele_id)s+=2;}
  return s;
}
function chercherPannes(texte,eq,exclureId){
  var mots=motsCles(texte);if(!mots.length||!HIST)return [];
  return HIST.filter(function(b){return b.id!==exclureId;}).map(function(b){return {b:b,s:scorePanne(b,mots,eq)};})
    .filter(function(x){return x.s>=Math.max(1.5,mots.length*0.6);}).sort(function(a,b){return b.s-a.s;});
}
function surligner(t,mots){var h=esc(t);mots.forEach(function(w){var p=w.length>5?w.slice(0,5):w;h=h.replace(new RegExp('(^|[^a-z0-9à-ÿ])('+p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[a-zà-ÿ]*)','gi'),'$1<mark>$2</mark>');});return h;}
function carteSolution(b,mots,eq){
  var e=EQID[b.equipement_id],md=e&&MODID[e.modele_id];
  var lien=eq&&e?(e.id===eq.id?'<span class="badge b-vert">même machine</span>':(eq.modele_id&&e.modele_id===eq.modele_id?'<span class="badge b-bleu">même modèle</span>':'')):'';
  return '<a class="solution" href="#bon/'+b.id+'"><div class="t">'+numBT(b.numero)+' · '+surligner(b.titre,mots)+' '+lien+'</div>'+
    '<div class="s">'+esc(e?chemin(e):'—')+(md?' ('+esc(md.nom)+')':'')+' · '+fmtD(b.fin)+(b.intervenant?' · '+esc(b.intervenant):'')+(b.duree_min?' · ⏱ '+fmtMin(b.duree_min):'')+'</div>'+
    (b.rapport?'<div class="rep"><b>Ce qui a été fait :</b> '+surligner(b.rapport,mots)+'</div>':'<div class="rep etiq">(pas de compte rendu)</div>')+
    (b._pcs.length?'<div class="s">🔩 '+b._pcs.map(function(x){return x.n+' × '+esc(x.a.designation)+(refArt(x.a)?' ('+esc(refArt(x.a))+')':'');}).join(', ')+'</div>':'')+'</a>';
}
VUES.pannes=async function(){
  $('main').innerHTML='<h1 class="titre">💡 Pannes déjà résolues</h1><div class="carte" style="background:var(--bleu2)">Décris la panne avec tes mots (« cercleuse feuillard ne sort pas », « fuite vérin », « courroie qui patine »…) : la GMAO retrouve les réparations passées, avec ce qui a été fait et les pièces utilisées.</div>'+

  $('rpn').oninput=rendre;rendre();setTimeout(function(){$('rpn').focus();},50);
};

    '<label style="display:flex;gap:8px;align-items:center;color:var(--txt);font-size:15px;margin-top:14px"><input type="checkbox" id="sdB" style="width:auto" checked> Créer l\'intervention à faire quand la pièce arrivera</label>'+
    '<div id="sdBz"><label>Ce qu\'il faudra faire</label><input id="sdT" value="'+esc('Remplacer '+(art?art.designation:'la pièce')+(e?' — '+e.nom:''))+'">'+
    '<div class="grille"><div><label>Temps prévu (minutes)</label><input id="sdM" inputmode="numeric" placeholder="ex. 60"></div><div><label>Confié à</label><select id="sdA"><option value="">— plus tard —</option>'+PERS.filter(function(p){return p.actif!==false;}).map(function(p){return '<option'+(memePers(p.nom,b.intervenant||NOM)?' selected':'')+'>'+esc(p.nom)+'</option>';}).join('')+'</select></div></div></div>'+
    '<div class="actions"><button class="btn" onclick="fermer()">Annuler</button><button class="btn p" id="sdO">Enregistrer</button></div>');
  $('sdB').onchange=function(){$('sdBz').style.display=this.checked?'':'none';};
  if($('sdP')){$('sdP').focus();var tAuto=true;$('sdT').oninput=function(){tAuto=false;};
    $('sdP').oninput=function(){if(tAuto)$('sdT').value='Remplacer '+(this.value.trim()||'la pièce')+(e?' — '+e.nom:'');};}
  $('sdO').onclick=async function(){
    var des=art?art.designation:val('sdP');if(!des){toast('Indique la pièce');return;}
    this.disabled=true;
    try{
      var suite=null;
      if($('sdB').checked){
        var r=await q(sb.from('gmao_interventions').insert({titre:val('sdT')||('Suite de '+numBT(b.numero)),description:'Suite de '+numBT(b.numero)+' : '+b.titre+'\n☐ '+(val('sdT')||'Remplacer '+des),
          type:b.type==='Préventif'?'Curatif':(b.type||'Curatif'),priorite:b.priorite||'Normale',statut:'Attente pièce',equipement_id:b.equipement_id,demandeur:NOM,
          suite_de:b.id,temps_prevu_min:nb(val('sdM')),assigne_a:$('sdA').value||null}).select());
        suite=r[0];
        await q(sb.from('gmao_messages').insert({intervention_id:suite.id,auteur:'•',texte:'🔁 '+NOM+' : suite de '+numBT(b.numero)+' — en attente de « '+des+' »'}));
      }
      await q(sb.from('gmao_commandes').insert({article_id:art?art.id:null,designation:des,quantite:nb(val('sdQ'))||1,fournisseur:val('sdF')||null,ref:src?src.ref:null,
        bon_origine:b.id,bon_suite:suite?suite.id:null,demande_par:NOM,statut:'À commander'}));
      await logSys(b.id,'🛒 '+NOM+' : pièce à commander « '+des+' »'+(suite?' — suite prévue : '+numBT(suite.numero):''));
      fermer();toast('✓ Commande notée'+(suite?' et '+numBT(suite.numero)+' créé':''));route();
    }catch(x){this.disabled=false;erreur(x);}
  };
}
/* Commander une pièce depuis sa fiche (lien avec la pièce : à la réception, le stock monte tout seul) */
function commanderPiece(a,qteConseil){
  var srcs=(SRCA[a.id]||[]).slice().sort(function(x,y){return (x.prix==null?1e9:+x.prix)-(y.prix==null?1e9:+y.prix);});
  var noms=[];srcs.forEach(function(x){if(x.partenaire&&noms.indexOf(x.partenaire)<0)noms.push(x.partenaire);});if(a.fournisseur&&noms.indexOf(a.fournisseur)<0)noms.push(a.fournisseur);
  ouvrir('<h3>🛒 Commander « '+esc(a.designation)+' »</h3>'+
    '<div class="grille"><div><label>Quantité</label><input id="cqQ" inputmode="decimal" value="'+(qteConseil||Math.max(1,(+a.stock_mini||0)-(+a.stock||0)||1))+'"></div>'+
    '<div><label>Fournisseur</label><input id="cqF" list="cqL" value="'+esc(noms[0]||'')+'"><datalist id="cqL">'+noms.map(function(n){return '<option value="'+esc(n)+'">';}).join('')+'</datalist></div></div>'+
    (srcs.length?'<div class="etiq" style="margin-top:6px">'+srcs.filter(function(x){return x.prix!=null;}).slice(0,4).map(function(x){return esc(x.partenaire)+' : '+eur(x.prix)+(x.ref?' (réf. '+esc(x.ref)+')':'');}).join(' · ')+'</div>':'')+
    '<label>Où en est la commande ?</label><div class="puces" id="cqS"><button class="puce on" data-s="À commander">À commander</button><button class="puce" data-s="Commandée">Déjà commandée</button></div>'+
    '<label>Remarque (facultatif)</label><input id="cqN" placeholder="ex. devis demandé, délai 3 semaines…">'+
    '<div class="actions"><button class="btn" onclick="fermer()">Annuler</button><button class="btn p" id="cqO">Enregistrer</button></div>');
  var st='À commander';
  $('cqS').onclick=function(e){var b=e.target.closest('[data-s]');if(!b)return;st=b.dataset.s;document.querySelectorAll('#cqS .puce').forEach(function(x){x.classList.toggle('on',x===b);});};
  $('cqO').onclick=async function(){
    var fo=val('cqF'),src=srcs.find(function(x){return x.partenaire===fo;});this.disabled=true;
    try{await q(sb.from('gmao_commandes').insert({article_id:a.id,designation:a.designation,quantite:nb(val('cqQ'))||1,fournisseur:fo||null,ref:src&&src.ref?src.ref:(a.ref_fournisseur||a.ref||null),
      statut:st,commandee_le:st==='Commandée'?new Date().toISOString():null,demande_par:NOM,notes:val('cqN')||null}));
      fermer();toast('✓ '+(st==='Commandée'?'Commande enregistrée':'Ajouté aux pièces à commander'));route();}catch(x){this.disabled=false;erreur(x);}
  };
}
VUES.achats=async function(f){
  if(!V8)return pasV8();
  var filtre=f||'ouvertes';
  var l=await q(sb.from('gmao_commandes').select('*').order('cree_le',{ascending:false}).limit(500));
  var bons={};(await q(sb.from('gmao_interventions').select('id,numero,titre,statut').limit(3000))).forEach(function(b){bons[b.id]=b;});
  var F={ouvertes:function(c){return c.statut!=='Reçue';},acommander:function(c){return c.statut==='À commander';},commandees:function(c){return c.statut==='Commandée';},recues:function(c){return c.statut==='Reçue';}};
  var lib={ouvertes:'En cours',acommander:'À commander',commandees:'Commandées',recues:'Reçues'};
  var r=l.filter(F[filtre]);
  $('main').innerHTML='<h1 class="titre">🛒 Commandes de pièces <button class="btn p sm" style="float:right" id="acN">+ Commande</button></h1>'+
    '<div class="puces">'+Object.keys(lib).map(function(k){return '<button class="puce'+(k===filtre?' on':'')+'" onclick="aller(\'achats/'+k+'\')">'+lib[k]+' ('+l.filter(F[k]).length+')</button>';}).join('')+'</div>'+
    '<div class="carte">'+(r.length?r.map(function(c){var a=ARTID[c.article_id],bo=bons[c.bon_origine],bs=bons[c.bon_suite];
      // v9.14 - Référence : celle de la commande, sinon celle du fournisseur sur la fiche, sinon la référence de la fiche
      var rf=c.ref||'';if(!rf&&a){var sf=(SRCA[a.id]||[]).find(function(x){return x.ref&&memeFo(x.partenaire,c.fournisseur);});rf=sf?sf.ref:refArt(a);}
      return '<div class="ligne"><div class="g"><div class="t">'+(c.quantite&&c.quantite!=1?c.quantite+' × ':'')+esc(c.designation)+(rf?' <span class="etiq">réf. '+esc(rf)+'</span>':'')+'</div><div class="s">'+
        esc(c.fournisseur||'fournisseur ?')+' · demandé le '+fmtD(c.cree_le)+(c.demande_par?' par '+esc(c.demande_par):'')+(c.commandee_le?' · commandé le '+fmtD(c.commandee_le):'')+(c.recue_le?' · reçu le '+fmtD(c.recue_le):'')+
        (bo?' · pour <a href="#bon/'+bo.id+'">'+numBT(bo.numero)+'</a>':'')+(bs?' · suite <a href="#bon/'+bs.id+'">'+numBT(bs.numero)+'</a> '+badgeStatut(bs.statut):'')+'</div></div>'+
        badgeCmd(c.statut)+
        (c.statut==='À commander'?'<button class="btn sm" data-cm="'+c.id+'">Commandée</button>':'')+
        (c.statut!=='Reçue'?'<button class="btn v sm" data-rc="'+c.id+'">📦 Reçue</button>':'')+
        (a?'<a class="btn l sm" href="#art/'+a.id+'">fiche</a>':'<button class="btn sm" data-lf="'+c.id+'" title="Rattacher cette commande à la fiche de la pièce">🔗 lier à une fiche</button>')+'<button class="btn l sm" data-cx="'+c.id+'">✕</button></div>';}).join(''):'<div class="vide">Rien ici.</div>')+'</div>';
  document.querySelectorAll('[data-lf]').forEach(function(x){x.onclick=async function(){var c=l.find(function(z){return z.id===x.dataset.lf;});if(!c)return;
    var nd=norm(c.designation),proches=ART.filter(function(a){var d=norm(a.designation);return d===nd||d.indexOf(nd)>=0||nd.indexOf(d)>=0;}),autres=ART.filter(function(a){return proches.indexOf(a)<0;});
    var a=await choisir({titre:'Fiche de « '+c.designation+' » ?',items:proches.concat(autres),hay:hayArt,prim:primArt,rendu:function(z){return (proches.indexOf(z)>=0?'⭐ ':'')+renduArt(z);}});if(!a)return;
    var sf=(SRCA[a.id]||[]).find(function(y){return y.ref&&memeFo(y.partenaire,c.fournisseur);});
    try{await q(sb.from('gmao_commandes').update({article_id:a.id,ref:c.ref||(sf?sf.ref:(refArt(a)||null))}).eq('id',c.id));toast('🔗 Commande rattachée à la fiche');route();}catch(e){erreur(e);}};});
  $('acN').onclick=async function(){var d=await demander('Pièce à commander','');if(!d)return;try{await q(sb.from('gmao_commandes').insert({designation:d.trim(),demande_par:NOM,statut:'À commander',quantite:1}));route();}catch(x){erreur(x);}};
  document.querySelectorAll('[data-cm]').forEach(function(x){x.onclick=async function(){var c=l.find(function(z){return z.id===x.dataset.cm;});
    var fo=await demander('Commandée chez quel fournisseur ?',c.fournisseur||'');if(fo===null)return;
    try{await q(sb.from('gmao_commandes').update({statut:'Commandée',commandee_le:new Date().toISOString(),fournisseur:fo||c.fournisseur}).eq('id',c.id));
      if(c.bon_suite)await logSys(c.bon_suite,'🛒 '+NOM+' : « '+c.designation+' » commandé'+(fo?' chez '+fo:''));route();}catch(e){erreur(e);}};});
  document.querySelectorAll('[data-rc]').forEach(function(x){x.onclick=async function(){var c=l.find(function(z){return z.id===x.dataset.rc;});
    var n=nb(await demander('Quantité reçue',c.quantite||1,c.article_id?'Le stock de la pièce sera augmenté d\'autant.':''));if(n===null)return;
    try{
      if(c.article_id&&n>0)await q(sb.rpc('gmao_mouvement',{p_article:c.article_id,p_qte:Math.abs(n),p_bon:null,p_motif:'Réception commande'+(c.fournisseur?' '+c.fournisseur:''),p_auteur:NOM}));
      await q(sb.from('gmao_commandes').update({statut:'Reçue',recue_le:new Date().toISOString()}).eq('id',c.id));
      if(c.article_id&&c.fournisseur){try{await q(sb.from('gmao_articles').update({fournisseur:c.fournisseur}).eq('id',c.article_id));}catch(e){}}
      var bs=c.bon_suite&&bons[c.bon_suite];
      if(bs&&bs.statut==='Attente pièce'){await q(sb.from('gmao_interventions').update({statut:'Demandé'}).eq('id',bs.id));await logSys(bs.id,'📦 '+NOM+' : « '+c.designation+' » reçu — intervention à planifier');}
      if(c.article_id)await chargerTout();
      toast(bs?'📦 Reçu — '+numBT(bs.numero)+' est prêt à être planifié':'📦 Reçu');route();
    }catch(e){erreur(e);}};});
  document.querySelectorAll('[data-cx]').forEach(function(x){x.onclick=async function(){if(!confirm('Supprimer cette ligne de commande ?'))return;try{await q(sb.from('gmao_commandes').delete().eq('id',x.dataset.cx));route();}catch(e){erreur(e);}};});
};

/* =====================================================================
   DÉMARRAGE
   ===================================================================== */
async function demarrer(){
  $('login').style.display='none';$('app').style.display='block';
  NOM=(USER.user_metadata&&USER.user_metadata.nom)||'';
  if(!NOM){
    var n=await demander('Ton prénom','','Il s\'affichera sur les bons et les messages.');
    NOM=(n||USER.email.split('@')[0]).trim();
    try{await sb.auth.updateUser({data:{nom:NOM}});}catch(e){}
  }
  $('qui').innerHTML=esc(NOM)+' · '+VERSION+' · <a href="#" id="dec" style="color:#cfe0f3">quitter</a>';
  $('dec').onclick=async function(e){e.preventDefault();await sb.auth.signOut();location.reload();};
  try{await chargerTout();}catch(e){
    $('main').innerHTML='<div class="carte"><b>La base GMAO n\'est pas encore installée.</b><br>Il faut d\'abord lancer le fichier <code>gmao-installation.sql</code> dans Supabase (SQL Editor).<br><br><span class="etiq">'+esc(e.message||e)+'</span></div>';return;
  }
  route();
}
async function connexion(){
  $('li-err').style.display='none';
  var r=await sb.auth.signInWithPassword({email:val('li-email'),password:$('li-pw').value});
  if(r.error){$('li-err').textContent='Connexion impossible : '+r.error.message;$('li-err').style.display='block';return;}
  USER=r.data.user;demarrer();
}
$('li-btn').onclick=connexion;
$('li-pw').onkeydown=function(e){if(e.key==='Enter')connexion();};
try{sb.auth.onAuthStateChange(function(ev){if(ev==='SIGNED_OUT'&&USER)location.reload();});}catch(e){}
(async function(){var s=await sb.auth.getSession();if(s.data&&s.data.session){USER=s.data.session.user;demarrer();}else $('login').style.display='block';})();
document.addEventListener('visibilitychange',function(){if(!document.hidden&&USER&&/^#bon\//.test(location.hash)&&!$('fond').classList.contains('on'))route();});
</script>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GMAO BdL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f4f5f7;--carte:#fff;--txt:#1d2430;--doux:#6b7280;--ligne:#e3e6ea;
  --bleu:#1f5fa8;--bleu2:#e8f0fa;--vert:#2e7d32;--vert2:#e6f4e7;--rouge:#c62828;--rouge2:#fdecec;
  --orange:#e67e00;--orange2:#fff3e0;--gris2:#eef0f2;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:var(--bleu);text-decoration:none}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;border:1px solid var(--ligne);border-radius:8px;padding:9px 10px;background:#fff;width:100%}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:12px;color:var(--doux);margin:10px 0 3px}
header{position:sticky;top:0;z-index:20;background:#16324f;color:#fff;display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap}
header h1{font-size:17px;margin:0 10px 0 0;white-space:nowrap}
nav{display:flex;gap:4px;overflow-x:auto;flex:1}
nav a{color:#cfe0f3;padding:7px 11px;border-radius:8px;white-space:nowrap;font-size:14px}
nav a.on{background:#fff;color:#16324f;font-weight:600}
#qui{font-size:12px;color:#cfe0f3;white-space:nowrap}
main{max-width:1100px;margin:0 auto;padding:14px 16px 90px}
.carte{background:var(--carte);border:1px solid var(--ligne);border-radius:12px;padding:14px;margin-bottom:12px}
.carte h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.carte h2 .d{margin-left:auto}
h1.titre{font-size:20px;margin:4px 0 12px}
.btn{border:1px solid var(--ligne);background:#fff;border-radius:8px;padding:8px 12px;font-weight:500}
.btn.p{background:var(--bleu);border-color:var(--bleu);color:#fff}
.btn.r{background:var(--rouge);border-color:var(--rouge);color:#fff}
.btn.v{background:var(--vert);border-color:var(--vert);color:#fff}
.btn.l{border:none;background:none;color:var(--bleu);padding:4px 6px}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.5}
.gros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.gros .btn{flex:1;min-width:200px;padding:16px;font-size:17px;border-radius:12px}
.tuiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.tuile{background:#fff;border:1px solid var(--ligne);border-radius:12px;padding:12px;display:block;color:var(--txt)}
.tuile b{display:block;font-size:26px}
.tuile span{font-size:13px;color:var(--doux)}
.tuile.alerte b{color:var(--rouge)}
.ligne{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--ligne);color:var(--txt)}
.ligne:last-child{border-bottom:none}
.ligne:hover{background:#fafbfc}
.ligne .g{flex:1;min-width:0}
.ligne .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.ligne .s{font-size:12.5px;color:var(--doux);overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--gris2);color:#444;white-space:nowrap}
.b-rouge{background:var(--rouge2);color:var(--rouge)}.b-vert{background:var(--vert2);color:var(--vert)}
.b-orange{background:var(--orange2);color:var(--orange)}.b-bleu{background:var(--bleu2);color:var(--bleu)}
.pt{display:inline-block;width:9px;height:9px;border-radius:50%;background:#bbb;flex:none}
.pt.Critique{background:var(--rouge)}.pt.Haute{background:var(--orange)}.pt.Normale{background:#4a90d9}.pt.Basse{background:#9bb}
.grille{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:640px){.grille{grid-template-columns:1fr}.gros .btn{min-width:100%}}
.rech{position:relative;margin-bottom:10px}
.rech input{padding-left:34px;font-size:16px}
.rech:before{content:"🔎";position:absolute;left:10px;top:9px;font-size:15px}
.puces{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.puce{border:1px solid var(--ligne);background:#fff;border-radius:20px;padding:5px 12px;font-size:13px}
.puce.on{background:var(--bleu);color:#fff;border-color:var(--bleu)}
.arbre .n{display:flex;align-items:center;gap:7px;padding:6px 4px;border-bottom:1px solid #f0f1f3}
.arbre .n .fl{width:22px;text-align:center;color:var(--doux);cursor:pointer;flex:none}
.arbre .n .code{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--doux);min-width:70px}
.arbre .n.off{opacity:.45}
.chemin{font-size:13px;color:var(--doux);margin-bottom:6px}
.chemin a{color:var(--doux);text-decoration:underline dotted}
.photo{width:100%;max-height:260px;object-fit:contain;border-radius:10px;background:#f0f1f3}
.mini{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#eef0f2;flex:none}
.fil .msg{padding:9px 11px;border-radius:10px;background:#f6f7f9;margin-bottom:8px}
.fil .msg.sys{background:none;font-size:12.5px;color:var(--doux);padding:2px 4px}
.fil .msg .q{font-size:12px;color:var(--doux);margin-bottom:3px}
.fil .msg img{max-width:240px;max-height:240px;border-radius:8px;display:block;margin-top:6px;cursor:zoom-in}
.compo{display:flex;gap:6px;align-items:flex-end}
.compo textarea{min-height:44px}
.stats{display:flex;gap:16px;flex-wrap:wrap}
.stats div{min-width:90px}.stats b{display:block;font-size:22px}
.vide{color:var(--doux);font-style:italic;padding:8px 4px}
.etiq{font-size:12px;color:var(--doux)}
#fond{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto}
#fond.on{display:flex}
#boite{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
#boite h3{margin:0 0 10px}
.liste-choix{max-height:55vh;overflow:auto;margin-top:8px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#16324f;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;display:none}
table.imp{width:100%;border-collapse:collapse;font-size:13px}
table.imp td,table.imp th{border-bottom:1px solid var(--ligne);padding:5px;text-align:left;vertical-align:top}
table.imp tr.ex{opacity:.45}
.warn{color:var(--orange);font-size:12px}
#login{max-width:360px;margin:70px auto}
</style>
</head>
<body>

<div id="login" class="carte" style="display:none">
  <h2>GMAO — Blanchisserie du Limousin</h2>
  <label>E-mail</label><input id="li-email" type="email" autocomplete="username">
  <label>Mot de passe</label><input id="li-pw" type="password" autocomplete="current-password">
  <div id="li-err" style="color:var(--rouge);margin-top:8px;display:none"></div>
  <div class="actions"><button class="btn p" id="li-btn">Se connecter</button></div>
</div>

<div id="app" style="display:none">
  <header>
    <h1>🔧 GMAO BdL</h1>
    <nav id="nav">
      <a href="#accueil" data-v="accueil">Accueil</a>
      <a href="#bons" data-v="bons">Bons de travail</a>
      <a href="#parc" data-v="parc">Parc</a>
      <a href="#articles" data-v="articles">Pièces</a>
      <a href="#preventif" data-v="preventif">Préventif</a>
      <a href="#modeles" data-v="modeles">Modèles</a>
      <a href="#import" data-v="import">Import</a>
    </nav>
    <span id="qui"></span>
  </header>
  <main id="main"></main>
</div>

<div id="fond"><div id="boite"></div></div>
<div id="toast"></div>
<input type="file" id="filePhoto" accept="image/*" style="display:none">

<script>
/* =====================================================================
   GMAO BdL — v1
   ===================================================================== */
var VERSION='v2';
var SB_URL='https://wjaesphordfjzavnptpu.supabase.co';
var SB_KEY='sb_publishable_5mm_jnRkeRucn-VSNc6nhA_Htc6PBk8';
var sb=supabase.createClient(SB_URL,SB_KEY);
var USER=null, NOM='';
var EQ=[], EQID={}, MOD=[], MODID={}, ART=[], ARTID={}, LIENS=[], PREV=[];

/* ---------- outils ---------- */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();}
function compact(s){return norm(s).replace(/[^a-z0-9]/g,'');}
function correspond(q,hay){
  var w=norm(q).split(' ').filter(Boolean); if(!w.length)return true;
  var h=norm(hay), hc=compact(hay);
  return w.every(function(x){
    if(h.indexOf(x)>=0)return true;
    var xc=compact(x); if(xc&&hc.indexOf(xc)>=0)return true;
    if(x.length>3){var r=x.replace(/(s|x|es)$/,''); if(h.indexOf(r)>=0)return true;}
    return false;
  });
}
/* les meilleurs résultats d'abord : nom qui contient la recherche entière, puis tous les mots dans le nom */
function trier(t,l,prim){
  if(!t||!prim)return l;var qn=norm(t),qc=compact(t);
  function sc(x){var n=norm(prim(x)),c=compact(prim(x));if(c===qc)return 0;if(n.indexOf(qn)>=0||c.indexOf(qc)>=0)return 1;if(correspond(t,prim(x)))return 2;return 3;}
  return l.map(function(x,i){return [sc(x),i,x];}).sort(function(a,b){return a[0]-b[0]||a[1]-b[1];}).map(function(a){return a[2];});
}
function toast(t){var e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(function(){e.style.display='none';},2600);}
function erreur(e){console.error(e);toast('⚠ '+((e&&e.message)||e||'Erreur'));}
function fmtD(d){if(!d)return'';var x=new Date(d);return x.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'});}
function fmtDH(d){if(!d)return'';var x=new Date(d);return x.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})+' '+x.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}
function auj(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function ajoutJours(iso,n){var d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function joursEntre(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);}
function numBT(n){return 'BT-'+String(n||0).padStart(4,'0');}
function nb(v){var x=parseFloat(String(v).replace(',','.'));return isNaN(x)?null:x;}
function val(id){var e=$(id);return e?e.value.trim():'';}

/* ---------- données ---------- */
async function q(p){var r=await p;if(r.error)throw r.error;return r.data;}
async function chargerTout(){
  var r=await Promise.all([
    q(sb.from('gmao_equipements').select('*').order('code')),
    q(sb.from('gmao_modeles').select('*').order('nom')),
    q(sb.from('gmao_articles').select('*').order('designation')),
    q(sb.from('gmao_liens').select('*')),
    q(sb.from('gmao_preventifs').select('*'))
  ]);
  EQ=r[0];MOD=r[1];ART=r[2];LIENS=r[3];PREV=r[4];
  EQID={};EQ.forEach(function(e){EQID[e.id]=e;});
  MODID={};MOD.forEach(function(m){MODID[m.id]=m;});
  ARTID={};ART.forEach(function(a){ARTID[a.id]=a;});
}
function chemin(e,sep){var p=[],x=e,g=0;while(x&&g++<20){p.unshift(x.nom);x=EQID[x.parent_id];}return p.join(sep||' › ');}
function cheminLiens(e){var p=[],x=EQID[e.parent_id],g=0;while(x&&g++<20){p.unshift('<a href="#eq/'+x.id+'">'+esc(x.nom)+'</a>');x=EQID[x.parent_id];}return p.join(' › ');}
function enfants(id){return EQ.filter(function(e){return e.parent_id===id;});}
function descendants(id){var out=[],pile=[id];while(pile.length){var c=pile.pop();enfants(c).forEach(function(e){out.push(e.id);pile.push(e.id);});}return out;}
function hayEq(e){var m=MODID[e.modele_id];return [e.code,e.nom,chemin(e),e.marque,e.num_serie,e.emplacement,e.famille,m?m.nom:''].join(' ');}
function primEq(e){return e.nom+' '+e.code;}
function primArt(a){return [a.designation,a.ref,a.ref_fabricant,a.ref_fournisseur].join(' ');}
function hayArt(a){return [a.ref,a.designation,a.ref_fabricant,a.ref_fournisseur,a.fournisseur,a.emplacement,a.motscles,a.notes].join(' ');}
/* pièces d'un équipement : liées au modèle + liées directement */
function piecesDe(e){
  var out=[];LIENS.forEach(function(l){
    if(l.equipement_id===e.id)out.push({l:l,via:'directe'});
    else if(e.modele_id&&l.modele_id===e.modele_id)out.push({l:l,via:'modele'});
  });return out.filter(function(x){return ARTID[x.l.article_id];});
}
/* où est utilisée une pièce : liste d'équipements */
function ouUtilise(artId){
  var res=[];LIENS.filter(function(l){return l.article_id===artId;}).forEach(function(l){
    if(l.equipement_id&&EQID[l.equipement_id])res.push({e:EQID[l.equipement_id],l:l});
    if(l.modele_id)EQ.filter(function(e){return e.modele_id===l.modele_id;}).forEach(function(e){res.push({e:e,l:l,m:MODID[l.modele_id]});});
  });return res;
}

/* ---------- photos ---------- */
function choisirPhoto(){return new Promise(function(res){var f=$('filePhoto');f.value='';f.onchange=function(){res(f.files[0]||null);};f.click();});}
async function envoyerPhoto(file){
  var img=await new Promise(function(ok,ko){var i=new Image();i.onload=function(){ok(i);};i.onerror=ko;i.src=URL.createObjectURL(file);});
  var max=1600,w=img.width,h=img.height,k=Math.min(1,max/Math.max(w,h));
  var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  var blob=await new Promise(function(ok){c.toBlob(ok,'image/jpeg',0.82);});
  var nom=Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
  var r=await sb.storage.from('gmao').upload(nom,blob,{contentType:'image/jpeg'});
  if(r.error)throw r.error;
  return sb.storage.from('gmao').getPublicUrl(nom).data.publicUrl;
}
function zoom(url){ouvrir('<img src="'+esc(url)+'" style="width:100%;border-radius:10px"><div class="actions"><button class="btn" onclick="fermer()">Fermer</button></div>');}

/* ---------- fenêtres ---------- */
function ouvrir(html){$('boite').innerHTML=html;$('fond').classList.add('on');}
function fermer(){$('fond').classList.remove('on');$('boite').innerHTML='';}
$('fond').addEventListener('click',function(e){if(e.target.id==='fond')fermer();});
function demander(titre,defaut,aide){
  return new Promise(function(res){
    ouvrir('<h3>'+esc(titre)+'</h3>'+(aide?'<div class="etiq">'+esc(aide)+'</div>':'')+
      '<input id="dm-v" value="'+esc(defaut==null?'':defaut)+'"><div class="actions"><button class="btn" id="dm-a">Annuler</button><button class="btn p" id="dm-o">OK</button></div>');
    var i=$('dm-v');setTimeout(function(){i.focus();i.select();},50);
    $('dm-a').onclick=function(){fermer();res(null);};
    $('dm-o').onclick=function(){var v=i.value;fermer();res(v);};
    i.onkeydown=function(e){if(e.key==='Enter')$('dm-o').click();};
  });
}
/* Sélecteur avec recherche tolérante */
function choisir(o){
  return new Promise(function(res){
    ouvrir('<h3>'+esc(o.titre)+'</h3><div class="rech"><input id="ch-q" placeholder="Tape quelques lettres, un code, une référence…"></div>'+
      (o.entete||'')+'<div class="liste-choix" id="ch-l"></div><div class="actions">'+(o.creer?'<button class="btn" id="ch-c">+ '+esc(o.creer)+'</button>':'')+'<button class="btn" id="ch-a">Annuler</button></div>');
    var inp=$('ch-q');
    function rendre(){
      var t=inp.value,l=trier(t,o.items.filter(function(x){return correspond(t,o.hay(x));}),o.prim).slice(0,150);
      $('ch-l').innerHTML=l.length?l.map(function(x,i){return '<div class="ligne" data-i="'+o.items.indexOf(x)+'" style="cursor:pointer">'+o.rendu(x)+'</div>';}).join(''):'<div class="vide">Rien trouvé.</div>';
    }
    $('ch-l').onclick=function(e){var d=e.target.closest('[data-i]');if(!d)return;var x=o.items[+d.dataset.i];fermer();res(x);};
    $('ch-a').onclick=function(){fermer();res(null);};
    if(o.creer)$('ch-c').onclick=function(){fermer();res('__creer__');};
    inp.oninput=rendre;rendre();setTimeout(function(){inp.focus();},50);
  });
}
function renduEq(e){return '<span class="pt '+esc(e.criticite||'')+'"></span><div class="g"><div class="t">'+esc(e.nom)+' <span class="etiq">'+esc(e.code)+'</span></div><div class="s">'+esc(chemin(e))+'</div></div>';}
function renduArt(a){return (a.photo?'<img class="mini" src="'+esc(a.photo)+'">':'<div class="mini"></div>')+'<div class="g"><div class="t">'+esc(a.designation)+'</div><div class="s">'+esc([a.ref,a.ref_fabricant,a.emplacement].filter(Boolean).join(' · '))+'</div></div>'+badgeStock(a);}
function choisirEq(titre){return choisir({titre:titre||'Choisir une machine',items:EQ,hay:hayEq,rendu:renduEq,prim:primEq});}
function badgeStock(a){var s=+a.stock||0,m=+a.stock_mini||0;return '<span class="badge '+(s<=0?'b-rouge':(s<=m?'b-orange':'b-vert'))+'">'+s+' '+esc(a.unite||'')+'</span>';}

/* ---------- badges ---------- */
var STATUTS=['Demandé','En cours','Attente pièce','Terminé'];
function badgeStatut(s){var c={'Demandé':'b-bleu','En cours':'b-orange','Attente pièce':'b-rouge','Terminé':'b-vert'}[s]||'';return '<span class="badge '+c+'">'+esc(s)+'</span>';}
function badgePrio(p,arr){if(arr)return '<span class="badge b-rouge">⛔ arrêt</span>';if(p==='Urgente')return '<span class="badge b-rouge">Urgent</span>';return '';}
function badgeEtat(e){if(!e)return'';var c={'En service':'b-vert','Dégradé':'b-orange','En réparation':'b-orange','Hors service':'b-rouge'}[e]||'';return '<span class="badge '+c+'">'+esc(e)+'</span>';}
function echeance(p){if(!p.dernier)return null;return ajoutJours(p.dernier,p.periodicite_jours||30);}
function badgeEcheance(p){
  var e=echeance(p);if(!e)return '<span class="badge b-orange">jamais fait</span>';
  var j=joursEntre(auj(),e);
  if(j<0)return '<span class="badge b-rouge">en retard de '+(-j)+' j</span>';
  if(j<=7)return '<span class="badge b-orange">dans '+j+' j</span>';
  return '<span class="badge b-vert">'+fmtD(e)+'</span>';
}

/* ---------- routeur ---------- */
var VUES={};
function aller(h){location.hash=h;}
async function route(){
  var h=location.hash.replace(/^#/,'')||'accueil', p=h.split('/'), v=p[0];
  document.querySelectorAll('#nav a').forEach(function(a){
    var d=a.dataset.v;a.classList.toggle('on',d===v||(d==='bons'&&v==='bon')||(d==='parc'&&v==='eq')||(d==='articles'&&v==='art')||(d==='modeles'&&v==='mod'));
  });
  var f=VUES[v]||VUES.accueil;
  $('main').innerHTML='<div class="vide">Chargement…</div>';
  try{await f(p[1],p[2]);}catch(e){erreur(e);$('main').innerHTML='<div class="carte">Erreur : '+esc(e.message||e)+'</div>';}
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* =====================================================================
   ACCUEIL
   ===================================================================== */
VUES.accueil=async function(){
  var bons=await q(sb.from('gmao_interventions').select('*').neq('statut','Terminé').order('cree_le',{ascending:false}));
  var retard=PREV.filter(function(p){if(!p.actif)return false;var e=echeance(p);return !e||e<=ajoutJours(auj(),7);});
  var sousMini=ART.filter(function(a){return (+a.stock||0)<=(+a.stock_mini||0)&&(+a.stock_mini||0)>0;});
  var degr=EQ.filter(function(e){return e.en_service&&e.etat&&e.etat!=='En service';});
  var urg=bons.filter(function(b){return b.priorite==='Urgente'||b.machine_arretee;});
  var html='<div class="gros"><button class="btn r" onclick="aller(\'bon/nouveau\')">⚠ Signaler une panne</button>'+
    '<button class="btn p" onclick="aller(\'articles\')">🔎 Chercher une pièce</button></div>'+
    '<div class="tuiles">'+

var ouverts={}, voirHS=false;
VUES.parc=async function(){
  $('main').innerHTML='<h1 class="titre">Parc machines <button class="btn p sm" style="float:right" onclick="nouvelEq()">+ Équipement</button></h1>'+
    '<div class="rech"><input id="rp" placeholder="Chercher : nom, code, marque, n° de série, emplacement…"></div>'+
    '<div class="puces"><button class="puce" id="pTout">Tout déplier</button><button class="puce" id="pRien">Tout replier</button><button class="puce'+(voirHS?' on':'')+'" id="pHS">Afficher hors service</button></div>'+
    '<div class="carte arbre" id="ap"></div>';
  function noeud(e,niv,filtre){
    var enf=enfants(e.id).filter(function(x){return voirHS||x.en_service!==false||enfants(x.id).length;}).sort(function(a,b){return a.nom.localeCompare(b.nom,'fr',{numeric:true});});
    var ouvert=filtre||ouverts[e.id];
    var h='<div class="n'+(e.en_service===false?' off':'')+'" style="padding-left:'+(niv*18+4)+'px"><span class="fl" data-t="'+e.id+'">'+(enf.length?(ouvert?'▾':'▸'):'')+'</span>'+
      '<span class="pt '+esc(e.criticite||'')+'"></span><a href="#eq/'+e.id+'" style="flex:1;color:var(--txt)"><b>'+esc(e.nom)+'</b> '+(e.modele_id&&MODID[e.modele_id]?'<span class="etiq">· '+esc(MODID[e.modele_id].nom)+'</span>':'')+'</a>'+
      '<span class="code">'+esc(e.code)+'</span>'+(e.etat&&e.etat!=='En service'?badgeEtat(e.etat):'')+'</div>';
    if(enf.length&&ouvert)h+=enf.map(function(x){return noeud(x,niv+1,filtre);}).join('');
    return h;
  }
  function rendre(){
    var t=val('rp');
    if(t){
      var r=trier(t,EQ.filter(function(e){return (voirHS||e.en_service!==false)&&correspond(t,hayEq(e));}),primEq);
      $('ap').innerHTML=r.length?r.map(function(e){return '<a class="ligne" href="#eq/'+e.id+'">'+renduEq(e)+badgeEtat(e.etat&&e.etat!=='En service'?e.etat:'')+'</a>';}).join(''):'<div class="vide">Rien trouvé.</div>';
      return;
    }
    var rac=EQ.filter(function(e){return !e.parent_id||!EQID[e.parent_id];}).filter(function(x){return voirHS||x.en_service!==false||enfants(x.id).length;}).sort(function(a,b){return a.nom.localeCompare(b.nom,'fr',{numeric:true});});
    $('ap').innerHTML=rac.length?rac.map(function(e){return noeud(e,0,false);}).join(''):'<div class="vide">Aucun équipement. <a href="#import">Importer depuis DIMO</a></div>';
  }
  $('rp').oninput=rendre;
  $('ap').onclick=function(e){var t=e.target.closest('[data-t]');if(!t)return;ouverts[t.dataset.t]=!ouverts[t.dataset.t];rendre();};
  $('pTout').onclick=function(){EQ.forEach(function(e){ouverts[e.id]=true;});rendre();};
  $('pRien').onclick=function(){ouverts={};rendre();};
  $('pHS').onclick=function(){voirHS=!voirHS;this.classList.toggle('on',voirHS);rendre();};
  rendre();
};
async function nouvelEq(parentId){
  var code=await demander('Code du nouvel équipement','', 'Un code court et unique (ex. S5, TR1-AE3)');if(!code)return;
  if(EQ.some(function(e){return norm(e.code)===norm(code);})){toast('Ce code existe déjà');return;}
  var nom=await demander('Nom de l\'équipement','');if(!nom)return;
  try{var r=await q(sb.from('gmao_equipements').insert({code:code.trim(),nom:nom.trim(),parent_id:parentId||null,etat:'En service',en_service:true}).select());
    await chargerTout();aller('eq/'+r[0].id);}catch(x){erreur(x);}
}

  var emplacements=uniques(EQ.map(function(x){return x.emplacement;})), familles=uniques(EQ.map(function(x){return x.famille;}));
  var html='<div class="chemin"><a href="#parc">Parc</a>'+(e.parent_id?' › '+cheminLiens(e):'')+'</div>'+
    '<h1 class="titre"><span class="pt '+esc(e.criticite||'')+'"></span> '+esc(e.nom)+' <span class="etiq">'+esc(e.code)+'</span> '+badgeEtat(e.etat)+'</h1>'+

function uniques(l){var s={},o=[];l.forEach(function(x){x=(x||'').trim();var k=norm(x);if(x&&!s[k]){s[k]=1;o.push(x);}});return o.sort(function(a,b){return a.localeCompare(b,'fr');});}

/* Lier une pièce à une machine ou un modèle (depuis l'un ou l'autre côté) */
async function lierPiece(ctx){
  var art=ctx.article, cibleEq=ctx.equipement, cibleMod=ctx.modele;
  if(!art){
    art=await choisir({titre:'Quelle pièce ?',items:ART,hay:hayArt,prim:primArt,rendu:renduArt,creer:'Nouvelle pièce'});
    if(!art)return;
    if(art==='__creer__'){art=await creerArticleRapide();if(!art)return;}
  }
  if(!cibleEq&&!cibleMod){cibleEq=await choisirEq('Sur quelle machine ?');if(!cibleEq)return;}
  var surModele=!!cibleMod;
  if(cibleEq&&cibleEq.modele_id&&MODID[cibleEq.modele_id]){
    var m=MODID[cibleEq.modele_id], nbm=EQ.filter(function(x){return x.modele_id===m.id;}).length;
    surModele=await new Promise(function(res){
      ouvrir('<h3>Lier « '+esc(art.designation)+' »</h3><p>'+esc(cibleEq.nom)+' est du modèle <b>'+esc(m.nom)+'</b> ('+nbm+' machine'+(nbm>1?'s':'')+').</p>'+
        '<div class="actions" style="flex-direction:column;align-items:stretch"><button class="btn p" id="lpM">À toutes les machines '+esc(m.nom)+' (conseillé)</button><button class="btn" id="lpE">Seulement à '+esc(cibleEq.nom)+'</button><button class="btn l" id="lpA">Annuler</button></div>');
      $('lpM').onclick=function(){fermer();res(true);};$('lpE').onclick=function(){fermer();res(false);};$('lpA').onclick=function(){fermer();res(null);};
    });
    if(surModele===null)return;
    if(surModele)cibleMod=m;
  }
  var rep=await demander('Repère / usage (facultatif)','','ex. courroie ventilateur, côté gauche, quantité montée…');
  if(rep===null)return;
  var lien={article_id:art.id,repere:rep||null,quantite:1};
  if(surModele)lien.modele_id=cibleMod.id;else lien.equipement_id=cibleEq.id;
  try{var r=await q(sb.from('gmao_liens').insert(lien).select());LIENS.push(r[0]);toast('✓ Pièce liée');route();}catch(x){erreur(x);}
}

/* Éléments qui ne sont pas des machines : décochés par défaut */
function exclureParDefaut(r){
  var c=norm(r.code),n=norm(r.nom),f=norm(r.famille);
  if(/^(la courtine)$/.test(c))return 'site';
  if(/tachygraphe|^carte |^cf$|^vds$/.test(c)||/vdo dlk/.test(n)||/^carte /.test(n))return 'chronotachygraphe';
  if(/matin|am$/.test(c)&&/manutention|sechage repassage/.test(f))return 'personne / équipe';
  if(/^(production|ma|mg)$/.test(c))return 'pseudo-équipement';
  if(/poubelle/.test(n))return 'poubelle';
  if(/^allee /.test(n))return 'allée';
  return '';
}
/* Parents ambigus dans DIMO (même nom pour plusieurs équipements) */
var PARENT_FORCE={'VA12':'EMTAE1','VA13':'EMTAE1','VA16':'EMTAE1','A25':'EMTAE2','VA20':'EMTAE2','VA26':'EMTAE2','ebmpapst 4314':'AEEMX'};
var MODELE_PROPOSE={'1.S1':'Kannegiesser D60','4.S4':'Kannegiesser D60','2.S2':'Kannegiesser D120','3.S3':'Kannegiesser D120','B30':'Sfere BM cercleuse semi-auto','CSA2':'Sfere BM cercleuse semi-auto','40022-T10':'Fradin tapis de convoyage','T12':'Fradin tapis de convoyage'};
function propre(s){s=String(s||'').replace(/\s+/g,' ').trim();s=s.replace(/transportt/gi,'transport').replace(/\bpalie\b/gi,'partie');return s?s.charAt(0).toUpperCase()+s.slice(1):'';}
function etatPropre(s){var n=norm(s);return {'en service':'En service','degrade':'Dégradé','en reparation':'En réparation','hors service':'Hors service'}[n]||'En service';}
function lireCSV(txt){
  var sep=(txt.split('\n')[0].match(/;/g)||[]).length>=(txt.split('\n')[0].match(/,/g)||[]).length?';':',';
  var rows=[],row=[],cur='',inq=false;
  for(var i=0;i<txt.length;i++){var ch=txt[i];
    if(inq){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++;}else inq=false;}else cur+=ch;}
    else if(ch==='"')inq=true;else if(ch===sep){row.push(cur);cur='';}else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';}else if(ch!=='\r')cur+=ch;}
  if(cur||row.length){row.push(cur);rows.push(row);}
  var h=rows.shift().map(function(x){return x.replace(/^﻿/,'').trim();});
  return rows.filter(function(r){return r.some(function(x){return x.trim();});}).map(function(r){var o={};h.forEach(function(k,i){o[k]=r[i]||'';});return o;});
}
var IMP=null;
VUES.import=async function(){
  $('main').innerHTML='<h1 class="titre">Import depuis DIMO</h1><div class="carte"><b>1.</b> Choisis un fichier exporté de DIMO (.csv) : <b>Equipements</b> ou <b>Pièces stockées par magasin</b>.<br><br><input type="file" id="iF" accept=".csv,text/csv"></div><div id="iZ"></div>';
  $('iF').onchange=async function(){
    var f=this.files[0];if(!f)return;var txt=await f.text();var L=lireCSV(txt);
    if(L.length&&('Code pièce' in L[0])){preparerPieces(L);return;}
    if(!L.length||!('Equipement père' in L[0])){$('iZ').innerHTML='<div class="carte">Ce fichier ne ressemble ni à l\'export Équipements ni à l\'export Pièces de DIMO.</div>';return;}
    var rows=L.map(function(o){return {code:o['Code'].trim(),nom:propre(o['Désignation']),pereNom:o['Equipement père'],marque:propre(o['Marque']),modeleTxt:o["Modèle d'équipement"],num_serie:o['Numéro de série'].trim(),etat:etatPropre(o["Etat d'équipement"]),emplacement:propre(o['Emplacement']),famille:propre(o['Désignation famille d\'équipements']),criticite:propre(o["Criticité d'équipement"])||null,en_service:o['En service']==='true'};});
    var parNom={};rows.forEach(function(r){var k=norm(r.nom);(parNom[k]=parNom[k]||[]).push(r);});
    var parCode={};rows.forEach(function(r){parCode[r.code]=r;});
    var series={};rows.forEach(function(r){if(r.num_serie)(series[r.num_serie]=series[r.num_serie]||[]).push(r.code);});
    rows.forEach(function(r){
      r.exclu=exclureParDefaut(r);r.inclus=!r.exclu;r.warn=[];
      var pk=norm(r.pereNom);
      if(PARENT_FORCE[r.code])r.pere=PARENT_FORCE[r.code];
      else if(pk&&parNom[pk]){var c=parNom[pk].filter(function(x){return x.code!==r.code;});if(c.length===1)r.pere=c[0].code;else if(c.length>1){r.pere=c[0].code;r.warn.push('parent ambigu ('+c.map(function(x){return x.code;}).join(', ')+')');}}
      else if(pk)r.warn.push('parent « '+r.pereNom+' » introuvable');
      if(r.pere==='La courtine')r.pere=null;
      if(r.num_serie&&series[r.num_serie].length>1)r.warn.push('n° série '+r.num_serie+' en double');
      if(EQ.some(function(e){return norm(e.code)===norm(r.code);})){r.inclus=false;r.exclu='déjà dans la GMAO';}
      r.modele=MODELE_PROPOSE[r.code]||'';
    });
    rows.forEach(function(r){if(!r.en_service&&rows.some(function(x){return x.pere===r.code&&x.inclus;})){r.en_service=true;r.warn.push('marqué actif (contient des machines)');}});
    IMP={rows:rows,parCode:parCode};afficherImport();
  };
};
function afficherImport(){

  $('iZ').innerHTML='<div class="carte"><b>2.</b> Vérifie la liste. Les lignes grisées (personnes, tachygraphes, poubelles, allées…) ne seront pas importées — coche-les si tu veux les garder.<br>Les noms, emplacements et familles ont été nettoyés. Les modèles proposés regroupent les machines identiques.'+

    R.map(function(r,i){var p=r.pere&&IMP.parCode[r.pere];return '<tr class="'+(r.inclus?'':'ex')+'"><td><input type="checkbox" data-i="'+i+'" style="width:auto"'+(r.inclus?' checked':'')+'></td><td>'+esc(r.code)+'</td><td>'+esc(r.nom)+'</td><td>'+(p?esc(p.nom)+' <span class="etiq">'+esc(p.code)+'</span>':'<span class="etiq">racine</span>')+'</td><td>'+esc(r.modele)+'</td><td>'+esc(r.etat)+'</td><td>'+(r.exclu?'<span class="etiq">'+esc(r.exclu)+'</span> ':'')+r.warn.map(function(w){return '<div class="warn">⚠ '+esc(w)+'</div>';}).join('')+'</td></tr>';}).join('')+'</table></div>';
  document.querySelectorAll('#iZ [data-i]').forEach(function(c){c.onchange=function(){R[+c.dataset.i].inclus=c.checked;afficherImport();};});

async function importer(){
  var R=IMP.rows.filter(function(r){return r.inclus;});if(!R.length)return;
  $('iGo').disabled=true;$('iGo').textContent='Import en cours…';
  try{
    var modIds={};
    for(var nomM of uniques(R.map(function(r){return r.modele;}))){
      var ex=MOD.find(function(m){return norm(m.nom)===norm(nomM);});
      if(ex){modIds[nomM]=ex.id;continue;}
      var marque=R.find(function(r){return r.modele===nomM;}).marque||null;

    }

    EQ.forEach(function(e){ids[e.code]=ids[e.code]||e.id;});
    /* parents d'abord */
    var faits={},ordre=[],garde=0;

    R.forEach(function(r){if(!faits[r.code])ordre.push(r);});
    var payload=ordre.map(function(r){return {id:ids[r.code],code:r.code,nom:r.nom||r.code,parent_id:(r.pere&&ids[r.pere])||null,modele_id:r.modele?modIds[r.modele]:null,marque:r.marque||null,num_serie:r.num_serie||null,etat:r.etat,en_service:r.en_service,emplacement:r.emplacement||null,famille:r.famille||null,criticite:r.criticite||null};});
    for(var i=0;i<payload.length;i+=50)await q(sb.from('gmao_equipements').insert(payload.slice(i,i+50)));

  }catch(x){$('iGo').disabled=false;$('iGo').textContent='Réessayer';erreur(x);}
}

function unitePropre(u){var n=norm(u);if(!n||n==='unite'||n==='degre celsius')return 'pce';if(n==='metre')return 'm';return u.trim();}

    '<div class="actions"><button class="btn p" id="iGo">Importer '+n+' pièces ('+nl+' liens machine)</button></div></div>'+
    '<div class="carte" style="overflow-x:auto"><table class="imp"><tr><th></th><th>Réf.</th><th>Désignation</th><th>Stock</th><th>Emplacement</th><th>Fournisseur</th><th>Machine</th></tr>'+
    R.map(function(r,i){return '<tr class="'+(r.inclus?'':'ex')+'"><td><input type="checkbox" data-i="'+i+'" style="width:auto"'+(r.inclus?' checked':'')+'></td><td>'+esc(r.ref)+'</td><td>'+esc(r.designation)+(r.alerte?' <span class="badge b-orange">alerte</span>':'')+r.warn.map(function(w){return '<div class="warn">'+esc(w)+'</div>';}).join('')+'</td><td>'+r.stock+' '+esc(r.unite)+'</td><td>'+esc(r.emplacement)+'</td><td>'+esc(r.fournisseur)+'</td><td>'+
      (r.lien?'<label style="display:flex;gap:5px;margin:0;color:var(--txt);font-size:13px"><input type="checkbox" data-l="'+i+'" style="width:auto"'+(r.lier?' checked':'')+'>'+esc(r.lien.modele?'modèle '+r.lien.modele.nom:r.lien.equipement.nom)+'</label>':'')+'</td></tr>';}).join('')+'</table></div>';
  document.querySelectorAll('#iZ [data-i]').forEach(function(c){c.onchange=function(){R[+c.dataset.i].inclus=c.checked;afficherPieces();};});
  document.querySelectorAll('#iZ [data-l]').forEach(function(c){c.onchange=function(){R[+c.dataset.l].lier=c.checked;afficherPieces();};});
  $('iGo').onclick=importerPieces;
}
async function importerPieces(){
  var R=IMP.pieces.filter(function(r){return r.inclus;});if(!R.length)return;
  $('iGo').disabled=true;$('iGo').textContent='Import en cours…';
  try{
    R.forEach(function(r){r.id=crypto.randomUUID();});
    var pl=R.map(function(r){return {id:r.id,ref:r.ref,designation:r.designation||r.ref,unite:r.unite,stock:r.stock,stock_mini:r.stock_mini,emplacement:r.emplacement||null,fournisseur:r.fournisseur||null};});
    for(var i=0;i<pl.length;i+=100)await q(sb.from('gmao_articles').insert(pl.slice(i,i+100)));
    var li=R.filter(function(r){return r.lien&&r.lier;}).map(function(r){var o={article_id:r.id,quantite:1};if(r.lien.modele)o.modele_id=r.lien.modele.id;else o.equipement_id=r.lien.equipement.id;return o;});
    if(li.length)await q(sb.from('gmao_liens').insert(li));
    await chargerTout();toast('✓ '+pl.length+' pièces importées');aller('articles');
  }catch(x){$('iGo').disabled=false;$('iGo').textContent='Réessayer';erreur(x);}
}

/* =====================================================================
   DÉMARRAGE
   ===================================================================== */
async function demarrer(){
  $('login').style.display='none';$('app').style.display='block';
  NOM=(USER.user_metadata&&USER.user_metadata.nom)||'';
  if(!NOM){
    var n=await demander('Ton prénom','','Il s\'affichera sur les bons et les messages.');
    NOM=(n||USER.email.split('@')[0]).trim();
    try{await sb.auth.updateUser({data:{nom:NOM}});}catch(e){}
  }
  $('qui').innerHTML=esc(NOM)+' · '+VERSION+' · <a href="#" id="dec" style="color:#cfe0f3">quitter</a>';
  $('dec').onclick=async function(e){e.preventDefault();await sb.auth.signOut();location.reload();};
  try{await chargerTout();}catch(e){
    $('main').innerHTML='<div class="carte"><b>La base GMAO n\'est pas encore installée.</b><br>Il faut d\'abord lancer le fichier <code>gmao-installation.sql</code> dans Supabase (SQL Editor).<br><br><span class="etiq">'+esc(e.message||e)+'</span></div>';return;
  }
  route();
}
async function connexion(){
  $('li-err').style.display='none';
  var r=await sb.auth.signInWithPassword({email:val('li-email'),password:$('li-pw').value});
  if(r.error){$('li-err').textContent='Connexion impossible : '+r.error.message;$('li-err').style.display='block';return;}
  USER=r.data.user;demarrer();
}
$('li-btn').onclick=connexion;
$('li-pw').onkeydown=function(e){if(e.key==='Enter')connexion();};
(async function(){var s=await sb.auth.getSession();if(s.data&&s.data.session){USER=s.data.session.user;demarrer();}else $('login').style.display='block';})();
document.addEventListener('visibilitychange',function(){if(!document.hidden&&USER&&/^#bon\//.test(location.hash)&&!$('fond').classList.contains('on'))route();});
</script>

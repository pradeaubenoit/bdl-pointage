<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rolls — BdL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bleu:#1f5fa8;--bleu2:#e8f0fa;--vert:#2e7d32;--vert2:#e6f4e7;--rouge:#c62828;--rouge2:#fdecec;--orange:#e67e00;--orange2:#fff3e0;--txt:#1d2329;--doux:#66717d;--ligne:#dde2e7}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#eef1f4;color:var(--txt)}
header{background:#1f2a35;color:#fff;padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header b{font-size:19px;margin-right:10px}header a{color:#cfd8e0;text-decoration:none;padding:6px 10px;border-radius:8px}header a.on{background:#fff;color:#1f2a35;font-weight:600}
main{max-width:1100px;margin:0 auto;padding:18px}
.carte{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px #0001}
h1{font-size:24px;margin:4px 0 14px}h2{font-size:17px;margin:0 0 10px}
.tuiles{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tuile{flex:1;min-width:140px;background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 1px 3px #0001;cursor:pointer}
.tuile b{font-size:28px;display:block}.tuile span{color:var(--doux);font-size:13px}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--ligne);text-align:left;font-size:14px}th{color:var(--doux);font-weight:600}
.etat{padding:3px 9px;border-radius:20px;font-weight:600;font-size:12px}
.e-bdl{background:#eef0f2;color:#555}.e-pret{background:var(--bleu2);color:var(--bleu)}.e-chauffeur{background:var(--orange2);color:var(--orange)}.e-client{background:var(--vert2);color:var(--vert)}.e-retour{background:#f3e8fd;color:#6b2fa3}
.vieux{color:var(--rouge);font-weight:700}
input,select{font-size:15px;padding:8px 10px;border:1px solid var(--ligne);border-radius:8px}
.btn{font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid var(--ligne);background:#fff;cursor:pointer}.btn.p{background:var(--bleu);color:#fff;border-color:var(--bleu)}
.s{color:var(--doux);font-size:13px}
#login{max-width:360px;margin:60px auto}#login input{width:100%;margin:6px 0 12px}
.planche{display:block}
.etq{border:2px solid #000;border-radius:10px;padding:10px;text-align:center;break-inside:avoid}
.etq .n{font-size:64px;font-weight:900;line-height:1}.etq .t{font-size:11px;font-weight:700}.etq canvas,.etq img{margin:6px auto}
.page{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.page.tube{grid-template-columns:repeat(2,1fr)}.page.bc3{grid-template-columns:repeat(3,1fr)}
.bande{border:1.5px dashed #000;display:flex;align-items:center;justify-content:space-around;padding:2px 4px;height:96px;box-sizing:border-box}
.bande .n{font-size:24px;font-weight:900;letter-spacing:-1px}
@page{size:A4;margin:10mm}
@media print{header,.noprint{display:none!important}body{background:#fff}main{padding:0;max-width:none}.carte{box-shadow:none;padding:0}
  .planche{display:block}
  .page{grid-template-columns:repeat(3,60mm);grid-auto-rows:63mm;gap:4mm;justify-content:center;margin:0;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
  .etq{box-sizing:border-box;height:63mm;overflow:hidden;padding:2mm;break-inside:avoid;page-break-inside:avoid;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .etq .n{font-size:54px}
  .page.tube{grid-template-columns:repeat(2,92mm);grid-auto-rows:26mm;gap:1.5mm 4mm}
  .bande{height:26mm;break-inside:avoid;page-break-inside:avoid}
  .page.bc3{grid-template-columns:repeat(3,60mm);grid-auto-rows:var(--bch,20mm);gap:2mm 3mm}.page.bc3 .bande{height:var(--bch,20mm)}}
</style>
</head>
<body>
<header class="noprint"><b>🧺 Rolls BdL</b><a href="#liste" id="n-liste">Rolls</a><a href="#clients" id="n-clients">Par client</a><a href="#personnes" id="n-personnes">Personnes</a><a href="#etiquettes" id="n-etiquettes">Étiquettes QR</a><a href="#qrclients" id="n-qrclients">QR clients</a><a href="#tournees" id="n-tournees">Tournées</a></header>
<div id="login" class="carte" style="display:none"><h2>Connexion</h2><div class="s">Même compte que la GMAO.</div><input id="lE" type="email" placeholder="E-mail"><input id="lP" type="password" placeholder="Mot de passe"><button class="btn p" id="lOk">Se connecter</button><div id="lErr" class="s" style="color:var(--rouge)"></div></div>
<main id="main"></main>
<script>
var SB_URL='https://wjaesphordfjzavnptpu.supabase.co', SB_KEY='sb_publishable_5mm_jnRkeRucn-VSNc6nhA_Htc6PBk8';
var sb=supabase.createClient(SB_URL,SB_KEY);
var $=function(i){return document.getElementById(i);};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
async function q(p){var r=await p;if(r.error)throw r.error;return r.data;}
var ETATS={bdl:'Vide à la BdL',pret:'Rempli, prêt',chauffeur:'Dans le camion',client:'Chez le client',retour:'En retour',sale:'Sale, à la BdL'};
var ROLES={chauffeur:'Chauffeur',atelier:'Atelier',laveur:'Laveur',bureau:'Bureau'};
var ROLLS=[],PERS=[],SEUIL_J=10;
function jours(d){return Math.floor((Date.now()-new Date(d).getTime())/864e5);}
function fmtQ(q){var d=new Date(q);return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}
var LINGE_API='https://script.google.com/macros/s/AKfycbxxHYpmiuhfyoKgzPmAwDtuuyxNx-uOalpohNT7p6Zrl2BPFnOGd0P-Q7_iNHVSTQc/exec';
function urlClient(c){return location.href.split('#')[0].replace(/[^\/]*$/,'')+'roll.html?c='+encodeURIComponent(c);}
function urlRoll(n){return location.href.split('#')[0].replace(/[^\/]*$/,'')+'roll.html?r='+encodeURIComponent(n);}
async function charger(){ROLLS=await q(sb.from('rolls').select('*').eq('actif',true).order('numero'));PERS=await q(sb.from('rolls_personnes').select('*').order('nom'));}
var VUES={};
async function route(){var v=(location.hash||'#liste').slice(1).split('/')[0];document.querySelectorAll('header a').forEach(function(a){a.classList.toggle('on',a.id==='n-'+v);});
  try{await charger();await (VUES[v]||VUES.liste)();}catch(e){$('main').innerHTML='<div class="carte" style="color:var(--rouge)">Erreur : '+esc(e.message||e)+'</div>';}}
window.addEventListener('hashchange',route);

var filtre='';
VUES.liste=async function(){
  var n={};ROLLS.forEach(function(r){n[r.etat]=(n[r.etat]||0)+1;});
  var vieux=ROLLS.filter(function(r){return (r.etat==='client'||r.etat==='retour')&&jours(r.maj_le)>=SEUIL_J;});
  var h='<h1>Rolls ('+ROLLS.length+')</h1><div class="tuiles">'+['bdl','pret','chauffeur','client','retour','sale'].map(function(e){return '<div class="tuile" data-f="'+e+'"><b>'+(n[e]||0)+'</b><span>'+ETATS[e]+'</span></div>';}).join('')+
    '<div class="tuile" data-f="vieux" style="'+(vieux.length?'border:2px solid var(--rouge)':'')+'"><b style="color:'+(vieux.length?'var(--rouge)':'inherit')+'">'+vieux.length+'</b><span>chez un client depuis '+SEUIL_J+' j ou plus</span></div></div>';
  var heures=function(d){return (Date.now()-new Date(d).getTime())/36e5;};
  // Chargé le soir (après 14 h) = pour le prochain jour ouvré (lundi si chargé le vendredi ou le samedi) : alerte seulement après 18 h ce jour-là.
  // Chargé le matin : alerte au bout de 12 h, comme avant.
  function enRetardCamion(d){var t=new Date(d);if(t.getHours()<14)return heures(d)>=12;
    var lim=new Date(t);do{lim.setDate(lim.getDate()+1);}while(lim.getDay()===0||lim.getDay()===6);lim.setHours(18,0,0,0);return Date.now()>lim.getTime();}
  var quai=ROLLS.filter(function(r){return r.etat==='pret'&&heures(r.maj_le)>=24;}),camion=ROLLS.filter(function(r){return r.etat==='chauffeur'&&enRetardCamion(r.maj_le);});
  if(quai.length||camion.length)h+='<div class="carte" style="border-left:4px solid var(--rouge)"><h2 style="margin:0 0 6px">⚠ Alertes</h2>'+
    (camion.length?'<div>🚚 <b>'+camion.length+' chariot'+(camion.length>1?'s':'')+' encore dans un camion, pas livré</b> (déchargement incomplet ?) : '+camion.map(function(r){return esc(r.numero)+' pour '+esc(r.client||'?')+' ('+esc(r.personne||'')+')';}).join(' · ')+'</div>':'')+
    (quai.length?'<div style="margin-top:4px">🧺 <b>'+quai.length+' chariot'+(quai.length>1?'s':'')+' prêt'+(quai.length>1?'s':'')+' depuis plus de 24 h, pas chargé'+(quai.length>1?'s':'')+'</b> : '+quai.map(function(r){return esc(r.numero)+' pour '+esc(r.client||'?');}).join(' · ')+'</div>':'')+'</div>';
  h+='<div class="carte"><div style="display:flex;gap:10px;align-items:center;margin-bottom:8px"><input id="rq" placeholder="Chercher un roll ou un client…" style="flex:1">'+(filtre?'<button class="btn" id="rTout">Tout afficher</button>':'')+'</div><div id="rRes" style="margin-bottom:8px"></div><table><thead><tr><th>Roll</th><th>État</th><th>Client</th><th>Dernier scan</th><th>Par</th></tr></thead><tbody id="rT"></tbody></table></div>'+
    '<div class="carte noprint"><h2>Ajouter des rolls</h2><input id="aN" type="number" min="1" max="200" value="10" style="width:90px"> <button class="btn p" id="aOk">Créer les suivants</button> <span class="s">Numéros à la suite du dernier (R-021, R-022…).</span></div>';
  $('main').innerHTML=h;
  function rendre(){var t=($('rq').value||'').toLowerCase();
    var l=ROLLS.filter(function(r){if(!t){if(filtre==='vieux')return vieux.indexOf(r)>=0;if(filtre&&r.etat!==filtre)return false;return true;}return (r.numero+' '+(r.client||'')).toLowerCase().indexOf(t)>=0;});   // une recherche cherche dans TOUS les chariots, même si une tuile est sélectionnée
    // Recherche : résumé par état (ex. « BB : 3 chez le client · 1 dans le camion »)
    var n2={};l.forEach(function(r){n2[r.etat]=(n2[r.etat]||0)+1;});
    // Régularisation : chariots prêts ou dans un camion pour ce client → « livré sans scan » en un clic
    var aLivrer={};l.forEach(function(r){if((r.etat==='pret'||r.etat==='chauffeur')&&r.client)(aLivrer[r.client]=aLivrer[r.client]||[]).push(r);});
    var boutonsLiv=t?Object.keys(aLivrer).map(function(c){var n=aLivrer[c].length;return '<button class="btn p" data-liv="'+esc(c)+'" style="margin:6px 6px 0 0">🚚 Livré chez '+esc(c)+' sans scan ('+n+' chariot'+(n>1?'s':'')+')</button>';}).join(''):'';
    $('rRes').innerHTML=t&&l.length?'<div style="background:var(--bleu2);border-radius:8px;padding:8px 12px;font-size:15px"><b>« '+esc($('rq').value.trim())+' » : '+l.length+' chariot'+(l.length>1?'s':'')+'</b> — '+['client','chauffeur','pret','retour','sale','bdl'].filter(function(e){return n2[e];}).map(function(e){return '<b>'+n2[e]+'</b> '+esc(ETATS[e]).toLowerCase();}).join(' · ')+(boutonsLiv?'<div class="noprint">'+boutonsLiv+'</div>':'')+'</div>':'';
    document.querySelectorAll('[data-liv]').forEach(function(b){b.onclick=function(){livrerSansScan(b.getAttribute('data-liv'),aLivrer[b.getAttribute('data-liv')]);};});
    $('rT').innerHTML=l.map(function(r){var j=jours(r.maj_le),v=(r.etat==='client'||r.etat==='retour')&&j>=SEUIL_J;
      return '<tr style="cursor:pointer" data-r="'+r.id+'"><td><b>'+esc(r.numero)+'</b></td><td><span class="etat e-'+esc(r.etat)+'">'+esc(ETATS[r.etat]||r.etat)+'</span></td><td>'+esc(r.client||'—')+'</td><td class="'+(v?'vieux':'')+'">'+fmtQ(r.maj_le)+' <span class="s">('+j+' j)</span></td><td>'+esc(r.personne||'')+'</td></tr>';}).join('')||'<tr><td colspan="5" class="s">Aucun roll.</td></tr>';}
  $('rq').oninput=rendre;rendre();
  document.querySelectorAll('[data-f]').forEach(function(x){x.onclick=function(){filtre=filtre===x.dataset.f?'':x.dataset.f;VUES.liste();};});
  if($('rTout'))$('rTout').onclick=function(){filtre='';VUES.liste();};
  $('rT').onclick=function(e){var tr=e.target.closest('[data-r]');if(tr)historique(tr.dataset.r);};
  $('aOk').onclick=async function(){var k=parseInt($('aN').value)||0;if(k<1)return;
    var max=ROLLS.reduce(function(m,r){var x=parseInt(String(r.numero).replace(/\D/g,''))||0;return Math.max(m,x);},0);
    var l=[];for(var i=1;i<=k;i++)l.push({numero:'R-'+String(max+i).padStart(3,'0')});
    try{await q(sb.from('rolls').insert(l));route();}catch(e){alert(e.message);}};
};
// Le linge est parti sans scan (chauffeur absent…) : le bureau déclare les chariots livrés chez le client.
async function livrerSansScan(client,liste){
  if(!liste||!liste.length)return;
  if(!confirm('Livré chez « '+client+' » sans scan ?\n\n'+liste.map(function(r){return r.numero+' ('+(ETATS[r.etat]||r.etat).toLowerCase()+')';}).join('\n')+'\n\nCes '+liste.length+' chariot(s) passent « Chez le client ».'))return;
  var qui='Bureau',quand=new Date().toISOString();
  try{var u=await sb.auth.getUser();if(u&&u.data&&u.data.user&&u.data.user.email)qui='Bureau ('+u.data.user.email.split('@')[0]+')';}catch(e){}
  try{
    await q(sb.from('rolls_scans').insert(liste.map(function(r){return {roll_id:r.id,etape:'livre',client:client,personne:qui,quand:quand,note:'régularisé par le bureau : livré sans scan'};})));
    await q(sb.from('rolls').update({etat:'client',client:client,personne:qui,maj_le:quand}).in('id',liste.map(function(r){return r.id;})));
    alert('✓ '+liste.length+' chariot(s) livré(s) chez « '+client+' ».');route();
  }catch(e){alert('Régularisation impossible : '+(e.message||e));}
}
async function historique(id){
  var r=ROLLS.find(function(x){return x.id===id;});var s=await q(sb.from('rolls_scans').select('*').eq('roll_id',id).order('quand',{ascending:false}).limit(100));
  var L={vide:'Vidé au tunnel',rempli:'Rempli',charge:'Chargé',livre:'Livré',repris:'Repris',rentre:'Déchargé à la BdL'};
  $('main').innerHTML='<div class="noprint"><a href="#liste" onclick="route();return false">← Rolls</a></div><h1>'+esc(r.numero)+' <span class="etat e-'+esc(r.etat)+'">'+esc(ETATS[r.etat]||r.etat)+'</span></h1>'+
    '<div class="carte"><table><thead><tr><th>Quand</th><th>Étape</th><th>Client</th><th>Par</th><th>Contenu</th><th class="noprint"></th></tr></thead><tbody>'+(s.map(function(x){return '<tr><td>'+fmtQ(x.quand)+'</td><td>'+esc(L[x.etape]||x.etape)+'</td><td>'+esc(x.client||'')+'</td><td>'+esc(x.personne||'')+'</td><td class="s">'+esc(x.note||'')+'</td><td class="noprint"><button class="btn" style="padding:2px 10px" title="Supprimer ce scan (erreur)" data-sup="'+x.id+'">✕</button></td></tr>';}).join('')||'<tr><td colspan="6" class="s">Jamais scanné.</td></tr>')+'</tbody></table>'+
    '<div class="s" style="margin-top:8px">✕ = scan fait par erreur (mauvais client, mauvais roll). Le roll reprend l\'état du scan précédent.</div></div>'+
    '<div class="carte noprint"><h2>Corriger une anomalie</h2><div class="s" style="margin-bottom:8px">Une étape a été oubliée sur le terrain ? Enregistrez-la ici (notée « correction du bureau », ignorée dans les Tournées).</div>'+
    '<button class="btn" data-cor="vide">🌀 Vidé au tunnel (libre)</button> '+
    (!r.client&&r.etat!=='bdl'?'<button class="btn" id="corCli">🏷 Il était plein : indiquer le client</button> ':'')+
    (r.client?'<button class="btn" data-cor="rentre">🏭 Déchargé à la BdL (sale)</button> <button class="btn" data-cor="repris">↩ Repris chez '+esc(r.client)+'</button> <button class="btn" data-cor="livre">🚚 Livré chez '+esc(r.client)+'</button>':'')+'</div>';
  var EV={vide:'bdl',rempli:'pret',charge:'chauffeur',livre:'client',repris:'retour',rentre:'sale'};
  if($('corCli'))$('corCli').onclick=async function(){
    var connus=Array.from(new Set(ROLLS.map(function(x){return x.client;}).filter(Boolean))).sort(function(a,b){return a.localeCompare(b,'fr');});
    var c=prompt('Client de '+r.numero+' ?\n(écrivez le nom exact, ex. : '+connus.slice(0,6).join(', ')+'…)');if(!c||!c.trim())return;c=c.trim();
    var ex=connus.find(function(x){return x.toLowerCase()===c.toLowerCase();});
    if(!ex&&!confirm('« '+c+' » n\'est sur aucun autre chariot. Le garder quand même ?'))return;c=ex||c;
    var qui='Bureau',quand=new Date().toISOString();
    try{var u=await sb.auth.getUser();if(u&&u.data&&u.data.user&&u.data.user.email)qui='Bureau ('+u.data.user.email.split('@')[0]+')';}catch(x){}
    try{await q(sb.from('rolls_scans').insert({roll_id:id,etape:'rempli',client:c,personne:qui,quand:quand,note:'correction du bureau : client oublié'}));
      await q(sb.from('rolls').update({client:c,maj_le:quand}).eq('id',id));r.client=c;historique(id);}catch(x){alert('Correction impossible : '+(x.message||x));}
  };
  document.querySelectorAll('[data-cor]').forEach(function(bt){bt.onclick=async function(){
    var e=bt.dataset.cor,lib=L[e]||e;
    if(!confirm(r.numero+' : enregistrer « '+lib+(e!=='vide'&&r.client?' — '+r.client:'')+' » maintenant ?\n\n'+r.numero+' passera « '+ETATS[EV[e]]+' ».'))return;
    var qui='Bureau',quand=new Date().toISOString();
    try{var u=await sb.auth.getUser();if(u&&u.data&&u.data.user&&u.data.user.email)qui='Bureau ('+u.data.user.email.split('@')[0]+')';}catch(x){}
    try{
      await q(sb.from('rolls_scans').insert({roll_id:id,etape:e,client:e==='vide'?null:r.client,personne:qui,quand:quand,note:'correction du bureau'}));
      var maj={etat:EV[e],client:e==='vide'?null:r.client,personne:qui,maj_le:quand};
      await q(sb.from('rolls').update(maj).eq('id',id));
      Object.assign(r,maj);historique(id);
    }catch(x){alert('Correction impossible : '+(x.message||x));}
  };});
  document.querySelectorAll('[data-sup]').forEach(function(bt){bt.onclick=async function(){
    var x=s.find(function(y){return y.id===bt.dataset.sup;});
    if(!confirm('Supprimer le scan « '+(L[x.etape]||x.etape)+(x.client?' — '+x.client:'')+' » du '+fmtQ(x.quand)+' ?'))return;
    try{
      await q(sb.from('rolls_scans').delete().eq('id',x.id));
      var reste=await q(sb.from('rolls_scans').select('*').eq('roll_id',id).order('quand',{ascending:false}).limit(1));
      var d=reste[0],maj=d?{etat:EV[d.etape]||'bdl',client:d.etape==='vide'?null:d.client,personne:d.personne,maj_le:d.quand}:{etat:'bdl',client:null,personne:null,maj_le:new Date().toISOString()};
      await q(sb.from('rolls').update(maj).eq('id',id));
      Object.assign(r,maj);historique(id);
    }catch(e){alert('Suppression impossible : '+(e.message||e));}
  };});
}
VUES.clients=async function(){
  var g={};ROLLS.forEach(function(r){if(!r.client||!(r.etat==='client'||r.etat==='pret'||r.etat==='chauffeur'))return;var x=g[r.client]=g[r.client]||{chez:[],route:[]};(r.etat==='client'?x.chez:x.route).push(r);});
  var cl=Object.keys(g).sort(function(a,b){return g[b].chez.length-g[a].chez.length||a.localeCompare(b,'fr');});
  $('main').innerHTML='<h1>Rolls par client</h1>'+
    '<div class="carte noprint"><h2>🔀 Fusionner deux noms (même client écrit autrement)</h2><div class="s" style="margin-bottom:8px">Tous les chariots et tout l\'historique du mauvais nom passent sous le bon nom ; le mauvais disparaît des listes. Ne touche pas à la facturation.</div>'+
    'Mauvais nom <select id="fuM"></select> → bon nom <select id="fuB"></select> <button class="btn p" id="fuOk">Fusionner</button></div>'+

    var amp=new Date(finTournee)-new Date(seg[0].a),place=0,route=0;
    var rows=seg.map(function(g,i){var apres=soir.length&&i>dernierTerrain,estSoir=soir.indexOf(g)>=0;var t=new Date(g.b)-new Date(g.a);if(!apres)place+=t;var tr=i?new Date(g.a)-new Date(seg[i-1].b):0;if(!apres)route+=tr;
      var quoi=[g.ch.length?g.ch.length+' chargé'+(g.ch.length>1?'s':''):'',g.liv.length?g.liv.length+' déposé'+(g.liv.length>1?'s':''):'',g.rep.length?g.rep.length+' repris':'',g.re.length?g.re.length+' déchargé'+(g.re.length>1?'s':''):''].filter(Boolean).join(' · ');
      return (i?'<tr><td></td><td class="s" colspan="5">'+(apres&&i===dernierTerrain+1?'⏸ fin de tournée — '+dur(tr)+' plus tard :':'🚚 trajet '+dur(tr))+'</td></tr>':'')+
        '<tr'+(apres?' style="background:#f3e8fd"':'')+'><td><b>'+esc(g.lieu)+(estSoir?' 🌙 pour demain':'')+'</b>'+(g.arr?'<div class="s">arrivé '+hm(g.arr)+(g.dep?' · reparti '+hm(g.dep):'')+(g.sansQR?' <b style="color:var(--orange)">· choisi dans la liste, sans QR</b>':'')+'</div>':'')+'</td><td>'+hm(g.a)+'</td><td>'+hm(g.b)+'</td><td>'+dur(t)+'</td><td>'+quoi+'</td><td class="s">'+esc(g.ch.concat(g.liv,g.rep,g.re).join(', '))+'</td></tr>';}).join('');
    // BILAN
    var liv={},rep={},nre=0,nsoir=0,sansQR=0,soirC={};
    seg.forEach(function(g){if(g.liv.length)liv[g.lieu]=(liv[g.lieu]||0)+g.liv.length;if(g.rep.length)rep[g.lieu]=(rep[g.lieu]||0)+g.rep.length;nre+=g.re.length;if(g.sansQR)sansQR++;});
    soir.forEach(function(g){nsoir+=g.ch.length;});
    var clientSoir={};L.forEach(function(s){if(s.etape==='charge'){soir.forEach(function(g){if(new Date(s.quand)>=new Date(g.a)&&new Date(s.quand)<=new Date(g.b))clientSoir[s.client||'vides']=(clientSoir[s.client||'vides']||0)+1;});}});
    var camion=j===auj?ROLLS.filter(function(r){return r.etat==='chauffeur'&&r.personne===ch;}):null;
    var camG={};(camion||[]).forEach(function(r){camG[r.client||'vides']=(camG[r.client||'vides']||0)+1;});
    var nLiv=Object.keys(liv).reduce(function(a,k){return a+liv[k];},0),nRep=Object.keys(rep).reduce(function(a,k){return a+rep[k];},0);
    var fin=soir.length?'🌙 Fin de journée par le <b>chargement pour demain</b> ('+nsoir+' chariot'+(nsoir>1?'s':'')+') : le camion repart de chez le chauffeur.':
      (seg.length&&seg[seg.length-1].lieu==='BdL — déchargement linge sale'?'Fin de journée : déchargement du linge sale à la BdL.':'<span style="color:var(--orange)">Fin de journée hors BdL (dernier scan chez un client ou en cours).</span>');
    var ligne=function(o){var k=Object.keys(o).sort(function(a,b){return a.localeCompare(b,'fr');});return k.length?k.map(function(c){return esc(c)+' <b>'+o[c]+'</b>';}).join(' · '):'—';};
    h+='<div class="carte"><h2 style="margin-top:0">🚚 '+esc(ch)+' <span class="s" style="font-weight:400">· '+j.slice(8,10)+'/'+j.slice(5,7)+'/'+j.slice(0,4)+'</span></h2>'+
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:10px">'+
        '<div class="tuile"><b>'+hm(seg[0].a)+' → '+hm(finTournee)+'</b><span>tournée : '+dur(amp)+(soir.length?' + chargement du soir '+hm(soir[0].a)+' → '+hm(soir[soir.length-1].b):'')+'</span></div>'+
        '<div class="tuile"><b>'+dur(place)+'</b><span>entre 1er et dernier scan de chaque arrêt · le reste ('+dur(route)+') = route + temps non scanné</span></div>'+
        '<div class="tuile"><b>'+nLiv+'</b><span>chariots déposés chez '+Object.keys(liv).length+' client'+(Object.keys(liv).length>1?'s':'')+'</span></div>'+
        '<div class="tuile"><b>'+nRep+'</b><span>chariots repris</span></div>'+
        '<div class="tuile"><b>'+nre+'</b><span>déchargés linge sale à la BdL</span></div>'+
        (soir.length?'<div class="tuile" style="border:2px solid #6b2fa3"><b>'+nsoir+'</b><span>🌙 chargés pour demain</span></div>':'')+
      '</div>'+
      '<div style="margin-bottom:6px"><b>Livré :</b> '+ligne(liv)+'</div>'+
      '<div style="margin-bottom:6px"><b>Repris :</b> '+ligne(rep)+'</div>'+
      (soir.length?'<div style="margin-bottom:6px"><b>🌙 Chargé pour demain :</b> '+ligne(clientSoir)+'</div>':'')+
      (camion?'<div style="margin-bottom:6px"><b>Dans son camion maintenant :</b> '+(camion.length?camion.length+' chariot'+(camion.length>1?'s':'')+' — '+ligne(camG):'vide')+'</div>':'')+
      (sansQR?'<div style="margin-bottom:6px;color:var(--orange)">⚠ '+sansQR+' arrivée'+(sansQR>1?'s':'')+' choisie'+(sansQR>1?'s':'')+' dans la liste, sans QR client.</div>':'')+
      '<div style="margin-bottom:10px">'+fin+'</div>'+
      '<details'+(chT?' open':'')+'><summary style="cursor:pointer;font-weight:700">📋 Déroulé de la journée, dans l\'ordre ('+seg.length+' étapes)</summary>'+
      '<table style="margin-top:8px"><thead><tr><th>Où</th><th>Début</th><th>Fin</th><th>Durée scannée</th><th>Chariots</th><th>N°</th></tr></thead><tbody>'+rows+'</tbody></table></details>'+
      '<details class="plan" data-pch="'+esc(ch)+'" data-pwd="'+new Date(j+'T12:00:00').getDay()+'" style="margin-top:10px"><summary style="cursor:pointer;font-weight:700">🗺 Plans de tournée de '+esc(ch)+' (pour un remplaçant)</summary><div class="planC" style="margin-top:8px"></div></details></div>';
  });
  $('main').innerHTML=h;
  $('tJ').onchange=function(){jourT=this.value;VUES.tournees();};
  document.querySelectorAll('details.plan').forEach(function(dt){dt.addEventListener('toggle',function(){if(dt.open&&!dt.dataset.fait){dt.dataset.fait=1;planTournee(dt,dt.dataset.pch,+dt.dataset.pwd);}});});
  document.querySelectorAll('[data-ch]').forEach(function(b){b.onclick=function(){chT=b.dataset.ch||null;VUES.tournees();};});
};
/* ---------- PLAN DE TOURNÉE : ordre habituel des arrêts d'un chauffeur pour un jour de la semaine,
   calculé sur ses 4 derniers jours identiques (scans des 10 dernières semaines). Pour briefer un remplaçant. ---------- */
var JOURS_S=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
async function planTournee(dt,ch,wd){
  var box=dt.querySelector('.planC');
  box.innerHTML='<div class="s">Calcul à partir de ses tournées passées…</div>';
  var p2=function(n){return String(n).padStart(2,'0');};
  var depuis=new Date(Date.now()-70*864e5);
  var sc;
  try{sc=await q(sb.from('rolls_scans').select('quand,etape,client,roll_id,note').eq('personne',ch).in('etape',['charge','livre','repris','rentre','arrivee']).gte('quand',depuis.toISOString()).order('quand').limit(10000));}
  catch(e){box.innerHTML='<div style="color:var(--rouge)">Erreur : '+esc(e.message||e)+'</div>';return;}
  sc=sc.filter(function(s){return !/^regroupement/.test(s.note||'');});
  var cleJ=function(t){var d=new Date(t);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());};
  var parJour={};sc.forEach(function(s){var k=cleJ(s.quand);(parJour[k]=parJour[k]||[]).push(s);});
  var dispo={};Object.keys(parJour).forEach(function(k){var w=new Date(k+'T12:00:00').getDay();if(parJour[k].some(function(s){return s.etape==='livre'||s.etape==='repris'||s.etape==='arrivee';}))dispo[w]=(dispo[w]||0)+1;});
  function rendre(w){
    var jours=Object.keys(parJour).filter(function(k){return new Date(k+'T12:00:00').getDay()===w&&parJour[k].some(function(s){return s.etape==='livre'||s.etape==='repris'||s.etape==='arrivee';});}).sort().slice(-4);
    var puces=[1,2,3,4,5,6,0].filter(function(x){return x!==0||dispo[0];}).map(function(x){return '<button class="btn'+(x===w?' p':'')+'" data-pw="'+x+'" style="padding:4px 10px">'+JOURS_S[x].slice(0,3)+(dispo[x]?'':' <span class="s">(—)</span>')+'</button>';}).join(' ');
    var h='<div class="noprint" style="margin-bottom:8px">'+puces+'</div>';
    if(!jours.length){box.innerHTML=h+'<div class="s">Aucune tournée de '+esc(ch)+' un '+JOURS_S[w]+' dans les 10 dernières semaines.</div>';brancher();return;}
    // Chaque jour = la suite réelle des arrêts, BdL comprise (rechargement en milieu de tournée, déchargement du linge sale).
    // Le chargement fait le soir APRÈS la tournée prépare le lendemain : il est compté pour le jour suivant (« chargé la veille au soir »).
    var mn=function(t){var d=new Date(t);return d.getHours()*60+d.getMinutes();};
    var terrain=function(s){return s.etape==='livre'||s.etape==='repris'||s.etape==='rentre';};
    function decoupe(k){var L=parJour[k]||[],dt=-1;L.forEach(function(s,i){if(terrain(s))dt=i;});
      return {jour:dt<0?[]:L.slice(0,dt+1),soir:dt<0?[]:L.slice(dt+1).filter(function(s){return s.etape==='charge';})};}
    var veille=function(k){var d=new Date(k+'T12:00:00');d.setDate(d.getDate()-1);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());};
    var C={},soirs=[],nSoir=0;
    jours.forEach(function(k){
      var J=decoupe(k).jour,V=decoupe(veille(k)).soir,arrets=[],nBdl=0;
      if(V.length&&!(J.length&&J[0].etape==='charge')){nSoir++;soirs.push(mn(V[0].quand));}
      J.forEach(function(s){
        var bdl=s.etape==='charge'||s.etape==='rentre',lieu=bdl?(s.etape==='charge'?'BdL — chargement':'BdL — déchargement du linge sale'):(s.client||'?');
        var g=arrets[arrets.length-1];
        if(!g||g.lieu!==lieu){g={lieu:lieu,bdl:bdl,t:mn(s.quand),liv:0,rep:0,ch:0};if(bdl){nBdl++;g.cle=lieu+'#'+nBdl;}else g.cle=lieu;arrets.push(g);}
        if(s.etape==='livre')g.liv++;if(s.etape==='repris')g.rep++;if(s.etape==='charge')g.ch++;});
      arrets=arrets.filter(function(g,i){return g.bdl||g.liv||g.rep||!(arrets[i+1]&&arrets[i+1].bdl);});
      arrets.forEach(function(g,i){var x=C[g.cle]=C[g.cle]||{lieu:g.lieu,bdl:g.bdl,n:0,pos:0,t:0,liv:0,rep:0,ch:0};x.n++;x.pos+=i/Math.max(1,arrets.length-1);x.t+=g.t;x.liv+=g.liv;x.rep+=g.rep;x.ch+=g.ch;});
    });
    var hm2=function(m){m=Math.round(m);return p2(Math.floor(m/60))+':'+p2(m%60);};
    var moy=function(a){return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:null;};
    var quai={};ROLLS.forEach(function(r){if(r.etat==='pret'&&r.client)quai[nrm2(r.client)]=(quai[nrm2(r.client)]||0)+1;});
    var cl=Object.keys(C).sort(function(a,b){return C[a].t/C[a].n-C[b].t/C[b].n;});   // ordre = heure de passage moyenne
    var arr=function(v){var r=Math.round(v*2)/2;return r?String(r).replace('.',','):'0';};
    var num=0;
    h+='<div style="font-weight:700;margin-bottom:4px">🗺 Tournée du '+JOURS_S[w]+' — '+esc(ch)+'</div>'+
      '<div class="s" style="margin-bottom:8px">D\'après '+jours.length+' '+JOURS_S[w]+(jours.length>1?'s':'')+' : '+jours.map(function(k){return k.slice(8,10)+'/'+k.slice(5,7);}).join(', ')+(jours.length<3?' · <b style="color:var(--orange)">encore peu de données, plan approximatif</b>':'')+'</div>'+
      '<table><thead><tr><th>#</th><th>Où</th><th>Heure ≈</th><th>Déposer ≈</th><th>Reprendre ≈</th><th>Fréquence</th><th>Au quai maintenant</th></tr></thead><tbody>'+
      (nSoir?'<tr style="background:#f3e8fd"><td></td><td><b>🌙 Camion chargé la veille au soir</b> <span class="s">(il part de chez lui)</span></td><td>la veille '+hm2(moy(soirs))+'</td><td colspan="4" class="s">'+nSoir+' / '+jours.length+'</td></tr>':'')+
      cl.map(function(c){var x=C[c];
        if(x.bdl)return '<tr style="background:#eef0f2"><td></td><td><b>'+esc(x.lieu)+'</b>'+(x.ch?' <span class="s">('+arr(x.ch/x.n)+' chariot'+(x.ch/x.n>1?'s':'')+' chargé'+(x.ch/x.n>1?'s':'')+')</span>':'')+'</td><td>'+hm2(x.t/x.n)+'</td><td colspan="3"></td><td'+(x.n<jours.length?' style="color:var(--orange)"':'')+'>'+(x.n<jours.length?x.n+' / '+jours.length:'')+'</td></tr>';
        var qq=quai[nrm2(x.lieu)]||0;num++;
        return '<tr><td>'+num+'</td><td><b>'+esc(x.lieu)+'</b></td><td>'+hm2(x.t/x.n)+'</td><td>'+arr(x.liv/x.n)+'</td><td>'+arr(x.rep/x.n)+'</td><td'+(x.n<jours.length?' style="color:var(--orange)"':'')+'>'+x.n+' / '+jours.length+(x.n<jours.length?' (pas toujours)':'')+'</td><td>'+(qq?'<b>'+qq+' prêt'+(qq>1?'s':'')+'</b>':'<span class="s">—</span>')+'</td></tr>';}).join('')+
      '</tbody></table>'+
      '<div class="s" style="margin-top:6px">Ordre et heures = moyenne de ses tournées. Lignes grises = passages à la BdL. « Au quai maintenant » = chariots remplis qui attendent à la BdL pour ce client.</div>';
    box.innerHTML=h;brancher();
  }
  function brancher(){box.querySelectorAll('[data-pw]').forEach(function(b){b.onclick=function(){rendre(+b.dataset.pw);};});}
  rendre(wd);
}
function nrm2(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();}
async function demarrer(){$('login').style.display='none';route();}
$('lOk').onclick=async function(){var r=await sb.auth.signInWithPassword({email:$('lE').value.trim(),password:$('lP').value});if(r.error){$('lErr').textContent=r.error.message;return;}demarrer();};
(async function(){var s=await sb.auth.getSession();if(s.data&&s.data.session)demarrer();else $('login').style.display='block';})();
</script>

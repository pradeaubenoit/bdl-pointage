<html lang="fr">
<head>

<style>
:root{--bleu:#1f5fa8;--bleu2:#e8f0fa;--vert:#2e7d32;--vert2:#e6f4e7;--rouge:#c62828;--rouge2:#fdecec;--orange:#e67e00;--orange2:#fff3e0;--txt:#1d2329;--doux:#66717d;--ligne:#dde2e7}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#eef1f4;color:var(--txt)}
header{background:#1f2a35;color:#fff;padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header b{font-size:19px;margin-right:10px}header a{color:#cfd8e0;text-decoration:none;padding:6px 10px;border-radius:8px}header a.on{background:#fff;color:#1f2a35;font-weight:600}
main{max-width:1100px;margin:0 auto;padding:18px}
.carte{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px #0001}
h1{font-size:24px;margin:4px 0 14px}h2{font-size:17px;margin:0 0 10px}
.tuiles{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tuile{flex:1;min-width:140px;background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 1px 3px #0001;cursor:pointer}
.tuile b{font-size:28px;display:block}.tuile span{color:var(--doux);font-size:13px}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--ligne);text-align:left;font-size:14px}th{color:var(--doux);font-weight:600}
.etat{padding:3px 9px;border-radius:20px;font-weight:600;font-size:12px}
.e-bdl{background:#eef0f2;color:#555}.e-pret{background:var(--bleu2);color:var(--bleu)}.e-chauffeur{background:var(--orange2);color:var(--orange)}.e-client{background:var(--vert2);color:var(--vert)}.e-retour{background:#f3e8fd;color:#6b2fa3}
.vieux{color:var(--rouge);font-weight:700}
input,select{font-size:15px;padding:8px 10px;border:1px solid var(--ligne);border-radius:8px}
.btn{font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid var(--ligne);background:#fff;cursor:pointer}.btn.p{background:var(--bleu);color:#fff;border-color:var(--bleu)}
.s{color:var(--doux);font-size:13px}
#login{max-width:360px;margin:60px auto}#login input{width:100%;margin:6px 0 12px}
.planche{display:block}
.etq{border:2px solid #000;border-radius:10px;padding:10px;text-align:center;break-inside:avoid}
.etq .n{font-size:64px;font-weight:900;line-height:1}.etq .t{font-size:11px;font-weight:700}.etq canvas,.etq img{margin:6px auto}
.page{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.page.tube{grid-template-columns:repeat(2,1fr)}.page.bc3{grid-template-columns:repeat(3,1fr)}
.bande{border:1.5px dashed #000;display:flex;align-items:center;justify-content:space-around;padding:2px 4px;height:96px;box-sizing:border-box}
.bande .n{font-size:24px;font-weight:900;letter-spacing:-1px}
@page{size:A4;margin:10mm}
@media print{header,.noprint{display:none!important}body{background:#fff}main{padding:0;max-width:none}.carte{box-shadow:none;padding:0}
  .planche{display:block}
  .page{grid-template-columns:repeat(3,60mm);grid-auto-rows:63mm;gap:4mm;justify-content:center;margin:0;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
  .etq{box-sizing:border-box;height:63mm;overflow:hidden;padding:2mm;break-inside:avoid;page-break-inside:avoid;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .etq .n{font-size:54px}
  .page.tube{grid-template-columns:repeat(2,92mm);grid-auto-rows:26mm;gap:1.5mm 4mm}
  .bande{height:26mm;break-inside:avoid;page-break-inside:avoid}
  .page.bc3{grid-template-columns:repeat(3,60mm);grid-auto-rows:var(--bch,20mm);gap:2mm 3mm}.page.bc3 .bande{height:var(--bch,20mm)}}
</style>

<div id="login" class="carte" style="display:none"><h2>Connexion</h2><div class="s">Même compte que la GMAO.</div><input id="lE" type="email" placeholder="E-mail"><input id="lP" type="password" placeholder="Mot de passe"><button class="btn p" id="lOk">Se connecter</button><div id="lErr" class="s" style="color:var(--rouge)"></div></div>
<main id="main"></main>
<script>
var SB_URL='https://wjaesphordfjzavnptpu.supabase.co', SB_KEY='sb_publishable_5mm_jnRkeRucn-VSNc6nhA_Htc6PBk8';
var sb=supabase.createClient(SB_URL,SB_KEY);
var $=function(i){return document.getElementById(i);};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
async function q(p){var r=await p;if(r.error)throw r.error;return r.data;}
var ETATS={bdl:'Vide à la BdL',pret:'Rempli, prêt',chauffeur:'Dans le camion',client:'Chez le client',retour:'En retour',sale:'Sale, à la BdL'};
var ROLES={chauffeur:'Chauffeur',atelier:'Atelier',laveur:'Laveur',bureau:'Bureau'};
var ROLLS=[],PERS=[],SEUIL_J=10;
function jours(d){return Math.floor((Date.now()-new Date(d).getTime())/864e5);}
function fmtQ(q){var d=new Date(q);return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}
var LINGE_API='https://script.google.com/macros/s/AKfycbxxHYpmiuhfyoKgzPmAwDtuuyxNx-uOalpohNT7p6Zrl2BPFnOGd0P-Q7_iNHVSTQc/exec';
function urlClient(c){return location.href.split('#')[0].replace(/[^\/]*$/,'')+'roll.html?c='+encodeURIComponent(c);}
function urlRoll(n){return location.href.split('#')[0].replace(/[^\/]*$/,'')+'roll.html?r='+encodeURIComponent(n);}
async function charger(){ROLLS=await q(sb.from('rolls').select('*').eq('actif',true).order('numero'));PERS=await q(sb.from('rolls_personnes').select('*').order('nom'));}
var VUES={};
async function route(){var v=(location.hash||'#liste').slice(1).split('/')[0];document.querySelectorAll('header a').forEach(function(a){a.classList.toggle('on',a.id==='n-'+v);});
  try{await charger();await (VUES[v]||VUES.liste)();}catch(e){$('main').innerHTML='<div class="carte" style="color:var(--rouge)">Erreur : '+esc(e.message||e)+'</div>';}}
window.addEventListener('hashchange',route);

var filtre='',rechMem='',coches={};
var etatRech='',AVANT={};   // AVANT[roll] = dernière personne (hors bureau) avant une correction du bureau
VUES.liste=async function(){
  var n={};ROLLS.forEach(function(r){n[r.etat]=(n[r.etat]||0)+1;});
  var vieux=ROLLS.filter(function(r){return (r.etat==='client'||r.etat==='retour')&&jours(r.maj_le)>=SEUIL_J;});
  var h='<h1>Rolls ('+ROLLS.length+')</h1><div class="tuiles">'+['bdl','pret','chauffeur','client','retour','sale'].map(function(e){return '<div class="tuile" data-f="'+e+'"><b>'+(n[e]||0)+'</b><span>'+ETATS[e]+'</span></div>';}).join('')+
    '<div class="tuile" data-f="vieux" style="'+(vieux.length?'border:2px solid var(--rouge)':'')+'"><b style="color:'+(vieux.length?'var(--rouge)':'inherit')+'">'+vieux.length+'</b><span>chez un client depuis '+SEUIL_J+' j ou plus</span></div></div>';
  var heures=function(d){return (Date.now()-new Date(d).getTime())/36e5;};
  // Chargé le soir (après 14 h) = pour le prochain jour ouvré (lundi si chargé le vendredi ou le samedi) : alerte seulement après 18 h ce jour-là.
  // Chargé le matin : alerte au bout de 12 h, comme avant.
  function enRetardCamion(d){var t=new Date(d);if(t.getHours()<14)return heures(d)>=12;
    var lim=new Date(t);do{lim.setDate(lim.getDate()+1);}while(lim.getDay()===0||lim.getDay()===6);lim.setHours(18,0,0,0);return Date.now()>lim.getTime();}
  var quai=ROLLS.filter(function(r){return r.etat==='pret'&&heures(r.maj_le)>=24;}),camion=ROLLS.filter(function(r){return r.etat==='chauffeur'&&enRetardCamion(r.maj_le);});
  // Livraison incomplète : un chariot rempli pour un client est resté au quai alors que ce client a été livré APRÈS son remplissage
  var oublies=[];try{var prets=ROLLS.filter(function(r){return r.etat==='pret'&&r.client;});
    if(prets.length){var plusVieux=prets.reduce(function(m,r){return r.maj_le<m?r.maj_le:m;},prets[0].maj_le);
      var lv=await q(sb.from('rolls_scans').select('quand,client,personne').eq('etape','livre').gte('quand',plusVieux).order('quand').limit(5000));
      var nz=function(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();};
      prets.forEach(function(r){var l2=lv.filter(function(x){return nz(x.client)===nz(r.client)&&x.quand>r.maj_le;})[0];if(l2)oublies.push({r:r,l:l2});});}}catch(e){}
  var idOub={};oublies.forEach(function(o){idOub[o.r.id]=1;});quai=quai.filter(function(r){return !idOub[r.id];});
  var incAuj=0;try{var d0=new Date();d0.setHours(0,0,0,0);var si=await q(sb.from('rolls_scans').select('note,roll_id,quand').not('note','is',null).gte('quand',d0.toISOString()).limit(2000));var vu2={};si.forEach(function(x){var t=typeIncident(x.note);if(!t||t.k==='correction'||t.k==='livreBureau')return;var k=t.k+x.roll_id;if(!vu2[k]){vu2[k]=1;incAuj++;}});}catch(e){}
  if(incAuj)h+='<div class="carte" style="border-left:4px solid var(--orange);cursor:pointer" onclick="location.hash=\'#incidents\'"><b>⚠ '+incAuj+' incident'+(incAuj>1?'s':'')+' aujourd\'hui</b> (scans oubliés au tunnel, à l\'atelier ou chez le client) — voir le détail →</div>';
  if(quai.length||camion.length||oublies.length)h+='<div class="carte" style="border-left:4px solid var(--rouge)"><h2 style="margin:0 0 6px">⚠ Alertes</h2>'+
    (oublies.length?'<div style="margin-bottom:4px">📦 <b>'+oublies.length+' chariot'+(oublies.length>1?'s':'')+' resté'+(oublies.length>1?'s':'')+' au quai alors que le client a été livré</b> (oubli au chargement, ou parti sans scan) : '+oublies.map(function(o){return esc(o.r.numero)+' pour '+esc(o.r.client)+' (rempli '+fmtQ(o.r.maj_le)+', livré '+fmtQ(o.l.quand)+' par '+esc(o.l.personne||'?')+')';}).join(' · ')+'</div>':'')+
    (camion.length?'<div>🚚 <b>'+camion.length+' chariot'+(camion.length>1?'s':'')+' encore dans un camion, pas livré</b> (déchargement incomplet ?) : '+camion.map(function(r){return esc(r.numero)+' pour '+esc(r.client||'?')+' ('+esc(r.personne||'')+')';}).join(' · ')+'</div>':'')+
    (quai.length?'<div style="margin-top:4px">🧺 <b>'+quai.length+' chariot'+(quai.length>1?'s':'')+' prêt'+(quai.length>1?'s':'')+' depuis plus de 24 h, pas chargé'+(quai.length>1?'s':'')+'</b> : '+quai.map(function(r){return esc(r.numero)+' pour '+esc(r.client||'?');}).join(' · ')+'</div>':'')+'</div>';
  h+='<div class="carte"><div style="display:flex;gap:10px;align-items:center;margin-bottom:8px"><input id="rq" placeholder="Chercher un roll ou un client…" style="flex:1">'+(filtre?'<button class="btn" id="rTout">Tout afficher</button>':'')+'</div><div id="rRes" style="margin-bottom:8px"></div><div id="rLot" class="noprint" style="display:none;position:sticky;top:0;z-index:5;background:#1f2a35;color:#fff;border-radius:8px;padding:8px 12px;margin-bottom:8px"></div><table><thead><tr><th class="noprint"><input type="checkbox" id="rAll" title="Tout cocher"></th><th>Roll</th><th>État</th><th>Client</th><th>Dernier scan</th><th>Par</th></tr></thead><tbody id="rT"></tbody></table></div>'+
    '<div class="carte noprint"><h2>Ajouter des rolls</h2><input id="aN" type="number" min="1" max="500" value="10" style="width:90px"> <button class="btn p" id="aOk">Créer les suivants</button> <span class="s">Numéros à la suite du dernier (R-021, R-022…).</span></div>';
  $('main').innerHTML=h;
  $('rq').value=rechMem;
  var corr=ROLLS.filter(function(r){return /^Bureau/.test(r.personne||'');});
  if(corr.length){try{var sv=await q(sb.from('rolls_scans').select('roll_id,personne,quand').in('roll_id',corr.map(function(r){return r.id;})).order('quand',{ascending:false}).limit(5000));
    sv.forEach(function(x){if(!/^Bureau/.test(x.personne||'')&&x.personne&&!AVANT[x.roll_id])AVANT[x.roll_id]=x.personne;});}catch(e){}}
  function rendre(){if(($('rq').value||'')!==rechMem)etatRech='';rechMem=$('rq').value||'';var t=rechMem.toLowerCase();
    var l=ROLLS.filter(function(r){if(filtre==='vieux'&&vieux.indexOf(r)<0)return false;if(filtre&&filtre!=='vieux'&&r.etat!==filtre)return false;
      return !t||(r.numero+' '+(r.client||'')+' '+(r.personne||'')+' '+(AVANT[r.id]||'')).toLowerCase().indexOf(t)>=0;});   // tuile ET recherche
    // Recherche : résumé par état (ex. « BB : 3 chez le client · 1 dans le camion »)
    var n2={};l.forEach(function(r){n2[r.etat]=(n2[r.etat]||0)+1;});
    var nTot=l.length;if(t&&etatRech){l=l.filter(function(r){return r.etat===etatRech;});if(!l.length){etatRech='';return rendre();}}   // clic sur « 10 en retour » dans le résumé
    // Régularisation : chariots prêts ou dans un camion pour ce client → « livré sans scan » en un clic
    var aLivrer={};l.forEach(function(r){if((r.etat==='pret'||r.etat==='chauffeur')&&r.client)(aLivrer[r.client]=aLivrer[r.client]||[]).push(r);});
    var boutonsLiv=t?Object.keys(aLivrer).map(function(c){var n=aLivrer[c].length;return '<button class="btn p" data-liv="'+esc(c)+'" style="margin:6px 6px 0 0">🚚 Livré chez '+esc(c)+' sans scan ('+n+' chariot'+(n>1?'s':'')+')</button>';}).join(''):'';
    $('rRes').innerHTML=t&&nTot?'<div style="background:var(--bleu2);border-radius:8px;padding:8px 12px;font-size:15px"><b>« '+esc($('rq').value.trim())+' »'+(filtre?' dans « '+esc(filtre==='vieux'?'chez un client depuis '+SEUIL_J+' j':ETATS[filtre])+' »':'')+' : '+nTot+' chariot'+(nTot>1?'s':'')+'</b> — '+['client','chauffeur','pret','retour','sale','bdl'].filter(function(e){return n2[e];}).map(function(e){return '<span data-er="'+e+'" title="Afficher seulement ceux-là" style="cursor:pointer;padding:1px 6px;border-radius:6px;'+(etatRech===e?'background:var(--bleu);color:#fff':'text-decoration:underline dotted')+'"><b>'+n2[e]+'</b> '+esc(ETATS[e]).toLowerCase()+'</span>';}).join(' · ')+(boutonsLiv?'<div class="noprint">'+boutonsLiv+'</div>':'')+'</div>':'';
    document.querySelectorAll('[data-er]').forEach(function(b){b.onclick=function(){etatRech=etatRech===b.dataset.er?'':b.dataset.er;rendre();};});
    document.querySelectorAll('[data-liv]').forEach(function(b){b.onclick=function(){livrerSansScan(b.getAttribute('data-liv'),aLivrer[b.getAttribute('data-liv')]);};});
    $('rT').innerHTML=l.map(function(r){var j=jours(r.maj_le),v=(r.etat==='client'||r.etat==='retour')&&j>=SEUIL_J;
      return '<tr style="cursor:pointer" data-r="'+r.id+'"><td class="noprint" data-ck><input type="checkbox" data-c="'+r.id+'"'+(coches[r.id]?' checked':'')+'></td><td><b>'+esc(r.numero)+'</b></td><td><span class="etat e-'+esc(r.etat)+'">'+esc(ETATS[r.etat]||r.etat)+'</span></td><td>'+esc(r.client||'—')+'</td><td class="'+(v?'vieux':'')+'">'+fmtQ(r.maj_le)+' <span class="s">('+j+' j)</span></td><td>'+esc(r.personne||'')+(AVANT[r.id]&&/^Bureau/.test(r.personne||'')?' <span class="s">(avant : '+esc(AVANT[r.id])+')</span>':'')+'</td></tr>';}).join('')||'<tr><td colspan="6" class="s">Aucun roll.'+(t&&filtre?' (recherche limitée à la tuile « '+esc(ETATS[filtre]||filtre)+' » : cliquez « Tout afficher »)':'')+'</td></tr>';
    LISTE_VUE=l;barreLot();}
  $('rq').oninput=rendre;rendre();
  document.querySelectorAll('[data-f]').forEach(function(x){x.onclick=function(){filtre=filtre===x.dataset.f?'':x.dataset.f;etatRech='';VUES.liste();};});   // la tuile s'ajoute à la recherche
  if($('rTout'))$('rTout').onclick=function(){filtre='';VUES.liste();};
  $('rT').onclick=function(e){
    if(e.target.closest('[data-ck]')){var c=e.target.closest('[data-ck]').querySelector('input');if(e.target!==c)c.checked=!c.checked;if(c.checked)coches[c.dataset.c]=1;else delete coches[c.dataset.c];barreLot();return;}
    var tr=e.target.closest('[data-r]');if(tr)historique(tr.dataset.r);};
  $('rAll').onchange=function(){var on=this.checked;(LISTE_VUE||[]).forEach(function(r){if(on)coches[r.id]=1;else delete coches[r.id];});rendre();};
  $('aOk').onclick=async function(){var b=this,k=parseInt($('aN').value)||0;if(k<1)return;if(k>500){alert('500 maximum à la fois.');return;}
    b.disabled=true;var t0=b.textContent;b.textContent='Création…';
    try{
      /* dernier numéro sur TOUS les chariots, y compris ceux désactivés (sinon doublon refusé) */
      var tous=await q(sb.from('rolls').select('numero').range(0,9999));
      var pris={},max=0;tous.forEach(function(r){pris[r.numero]=1;var x=parseInt(String(r.numero).replace(/\D/g,''))||0;if(x>max)max=x;});
      var l=[];for(var i=1;l.length<k;i++){var n='R-'+String(max+i).padStart(3,'0');if(!pris[n])l.push({numero:n});}
      var faits=0;
      for(var j=0;j<l.length;j+=50){b.textContent='Création… '+faits+'/'+l.length;await q(sb.from('rolls').insert(l.slice(j,j+50)));faits+=Math.min(50,l.length-j);}
      alert(faits+' chariots créés : '+l[0].numero+' à '+l[l.length-1].numero+'.');route();
    }catch(e){alert('Création impossible'+(faits?' (après '+faits+' créés)':'')+' : '+(e.message||e));route();}
    finally{b.disabled=false;b.textContent=t0;}};
};
/* ---------- Correction groupée : cocher plusieurs chariots puis une seule étape pour tous (scans oubliés) ---------- */
var LISTE_VUE=[];
function barreLot(){var z=$('rLot');if(!z)return;var ids=Object.keys(coches).filter(function(id){return ROLLS.some(function(r){return r.id===id;});});
  if(!ids.length){z.style.display='none';return;}z.style.display='block';
  z.innerHTML='<b>'+ids.length+' coché'+(ids.length>1?'s':'')+'</b> : '+
    '<button class="btn" data-lot="livre">🚚 Livré chez leur client</button> <button class="btn" data-lot="repris">↩ Repris chez leur client</button> '+
    '<button class="btn" data-lot="rentre">🏭 Déchargé à la BdL (sale)</button> <button class="btn" data-lot="vide">🌀 Vidé au tunnel</button> '+
    '<button class="btn" data-lot="tout">🔁 Livré + repris + déchargé</button> <button class="btn" data-lot="ratt">🌀 Leur dernier vidage était un rattrapage (oubli du laveur)</button> <button class="btn" data-lot="aucun" style="background:transparent;color:#cfd8e0;border-color:#cfd8e0">Décocher</button>';
  z.querySelectorAll('[data-lot]').forEach(function(b){b.onclick=function(){var e=b.dataset.lot;if(e==='aucun'){coches={};VUES.liste();return;}if(e==='ratt')return marquerRattrapage(ids);corrigerLot(ids,e);};});}
// Vidages faits par le bureau sous le nom d'un laveur : on les marque « rattrapage » pour qu'ils comptent comme incident laveur
async function marquerRattrapage(ids){
  if(!confirm(ids.length+' chariot(s) : leur DERNIER « vidé au tunnel » était un rattrapage du bureau (le laveur ne l\'avait pas scanné) ?'))return;
  var n=0;try{for(var i=0;i<ids.length;i++){var v=await q(sb.from('rolls_scans').select('id').eq('roll_id',ids[i]).eq('etape','vide').order('quand',{ascending:false}).limit(1));
      if(v.length){await q(sb.from('rolls_scans').update({note:'vidé au tunnel par le bureau (oubli du laveur)'}).eq('id',v[0].id));n++;}}
    coches={};alert('✓ '+n+' vidage(s) marqué(s). Ils apparaissent dans ⚠ Incidents.');route();}catch(x){alert('Impossible : '+(x.message||x));}
}
async function corrigerLot(ids,e){
  var liste=ROLLS.filter(function(r){return ids.indexOf(r.id)>=0;});
  var etapes=e==='tout'?['livre','repris','rentre']:[e];
  var sansCli=liste.filter(function(r){return !r.client;});
  if(e!=='vide'&&sansCli.length){alert(sansCli.map(function(r){return r.numero;}).join(', ')+' : pas de client. Décochez-les (ou indiquez leur client dans leur fiche).');return;}
  var L={livre:'Livré',repris:'Repris',rentre:'Déchargé sale',vide:'Vidé au tunnel'};
  if(!confirm(liste.length+' chariot(s) : '+etapes.map(function(x){return L[x];}).join(' → ')+'\n\n'+liste.map(function(r){return r.numero+(r.client?' ('+r.client+')':'');}).join('\n')))return;
  var qui='Bureau';try{var u=await sb.auth.getUser();if(u&&u.data&&u.data.user&&u.data.user.email)qui='Bureau ('+u.data.user.email.split('@')[0]+')';}catch(x){}
  var EV={livre:'client',repris:'retour',rentre:'sale',vide:'bdl'},t0=Date.now(),scans=[];
  liste.forEach(function(r){etapes.forEach(function(et,k){scans.push({roll_id:r.id,etape:et,client:et==='vide'?null:r.client,personne:qui,quand:new Date(t0+k*1000).toISOString(),note:'correction du bureau'});});});
  try{
    await q(sb.from('rolls_scans').insert(scans));
    var der=etapes[etapes.length-1],quand=new Date(t0+(etapes.length-1)*1000).toISOString();
    if(der==='vide')await q(sb.from('rolls').update({etat:'bdl',client:null,personne:qui,maj_le:quand}).in('id',ids));
    else await q(sb.from('rolls').update({etat:EV[der],personne:qui,maj_le:quand}).in('id',ids));
    coches={};alert('✓ '+liste.length+' chariot(s) corrigé(s).');route();
  }catch(x){alert('Correction impossible : '+(x.message||x));}
}
// Le linge est parti sans scan (chauffeur absent…) : le bureau déclare les chariots livrés chez le client.
async function livrerSansScan(client,liste){
  if(!liste||!liste.length)return;
  if(!confirm('Livré chez « '+client+' » sans scan ?\n\n'+liste.map(function(r){return r.numero+' ('+(ETATS[r.etat]||r.etat).toLowerCase()+')';}).join('\n')+'\n\nCes '+liste.length+' chariot(s) passent « Chez le client ».'))return;
  var qui='Bureau',quand=new Date().toISOString();
  try{var u=await sb.auth.getUser();if(u&&u.data&&u.data.user&&u.data.user.email)qui='Bureau ('+u.data.user.email.split('@')[0]+')';}catch(e){}
  try{
    await q(sb.from('rolls_scans').insert(liste.map(function(r){return {roll_id:r.id,etape:'livre',client:client,personne:qui,quand:quand,note:'régularisé par le bureau : livré sans scan'};})));
    await q(sb.from('rolls').update({etat:'client',client:client,personne:qui,maj_le:quand}).in('id',liste.map(function(r){return r.id;})));
    alert('✓ '+liste.length+' chariot(s) livré(s) chez « '+client+' ».');route();
  }catch(e){alert('Régularisation impossible : '+(e.message||e));}
}
// dernier « rempli » du cycle en cours (après le dernier passage au tunnel) : c'est lui qui porte le contenu du chariot
function dernierRempli(s){for(var i=0;i<s.length;i++){if(s[i].etape==='vide')return null;if(s[i].etape==='rempli')return s[i];}return null;}

VUES.clients=async function(){
  var g={};ROLLS.forEach(function(r){if(!r.client||!(r.etat==='client'||r.etat==='pret'||r.etat==='chauffeur'))return;var x=g[r.client]=g[r.client]||{chez:[],route:[]};(r.etat==='client'?x.chez:x.route).push(r);});

  $('main').innerHTML='<h1>Rolls par client</h1>'+
    '<div class="carte noprint"><h2>🔀 Fusionner deux noms (même client écrit autrement)</h2><div class="s" style="margin-bottom:8px">Tous les chariots et tout l\'historique du mauvais nom passent sous le bon nom ; le mauvais disparaît des listes. Ne touche pas à la facturation.</div>'+
    'Mauvais nom <select id="fuM"></select> → bon nom <select id="fuB"></select> <button class="btn p" id="fuOk">Fusionner</button></div>'+
    '<div class="carte"><table><thead><tr><th>Client</th><th>Chez le client</th><th>Le plus ancien</th><th>En route vers lui</th></tr></thead><tbody>'+
    (cl.map(function(c){var x=g[c],old=x.chez.reduce(function(m,r){return Math.max(m,jours(r.maj_le));},0);
      return '<tr><td><b>'+esc(c)+'</b></td><td>'+x.chez.length+(x.chez.length?' <span class="s">('+x.chez.map(function(r){return r.numero;}).join(', ')+')</span>':'')+'</td><td class="'+(old>=SEUIL_J?'vieux':'')+'">'+(x.chez.length?old+' j':'—')+'</td><td>'+x.route.length+'</td></tr>';}).join('')||'<tr><td colspan="4" class="s">Aucun roll chez un client pour l\'instant.</td></tr>')+'</tbody></table></div>';
  // noms connus : chariots + historique + clients sans saisie
  var noms={};ROLLS.forEach(function(r){if(r.client)noms[r.client]=1;});
  try{(await q(sb.from('rolls_scans').select('client').not('client','is',null).limit(5000))).forEach(function(x){noms[x.client]=1;});}catch(e){}
  try{(await q(sb.from('rolls_clients').select('nom'))).forEach(function(x){noms[x.nom]=1;});}catch(e){}
  var ln=Object.keys(noms).sort(function(a,b){return a.localeCompare(b,'fr');});

    try{
      await q(sb.from('rolls').update({client:b}).eq('client',m));
      await q(sb.from('rolls_scans').update({client:b}).eq('client',m));
      try{await q(sb.from('rolls_clients').delete().eq('nom',m));}catch(e){}
      alert('✓ « '+m+' » fusionné dans « '+b+' ».');route();
    }catch(e){alert('Fusion impossible : '+(e.message||e));}
  };
};
// Plusieurs postes possibles par personne : enregistrés « atelier,laveur »
function casesRoles(pref,val){var l=String(val||'').split(',');return Object.keys(ROLES).map(function(k){return '<label style="margin-right:8px;white-space:nowrap"><input type="checkbox" data-rl="'+pref+'" value="'+k+'"'+(l.indexOf(k)>=0?' checked':'')+'> '+ROLES[k]+'</label>';}).join('');}

   2. chargé puis redescendu au quai / au dépôt par le même chauffeur = chargement annulé

  sc.forEach(function(s,i){

    if(s.etape==='charge'&&deja[k]){
      for(var m=i-1;m>=0&&m>=i-6;m--){var t=sc[m];if(t.roll_id===s.roll_id&&t.etape==='rempli'&&/^non scanné à l'atelier/.test(t.note||'')&&new Date(s.quand)-new Date(t.quand)<180000){s.etape='repris';s.client=s.client||t.client;s.note='repris sale (chariot non scanné chez le client)';break;}}
    }
    // chargement juste après un arrêt client (≤ 10 min, sans être repassé par le déchargement BdL) = chariot sale repris chez ce client
    if(s.etape==='charge'&&deja[k]&&dern[k]&&new Date(s.quand)-new Date(dern[k].t)<=600000&&(!s.client||norme(s.client)===norme(dern[k].c))){s.etape='repris';s.client=dern[k].c;s.note='repris sale (chariot non scanné chez le client)';}
    if(s.etape==='livre'||s.etape==='repris'||s.etape==='arrivee'||s.etape==='depart'){deja[k]=deja[k]||(s.etape==='livre'||s.etape==='repris');if(s.client||dern[k])dern[k]={t:s.quand,c:s.client||(dern[k]&&dern[k].c)};}

  });

  return sc.filter(function(s){return s.etape!=='rempli'&&s.etape!=='vide';});

        if(s.etape==='livre')g.liv++;if(s.etape==='repris')g.rep++;if(s.etape==='charge')g.ch++;});
      arrets=arrets.filter(function(g,i){return g.bdl||g.liv||g.rep||!(arrets[i+1]&&arrets[i+1].bdl);});
      // après avoir retiré les fausses manips, on regroupe deux passages identiques qui se suivent (ex. chargement en plusieurs fois)
      arrets=arrets.reduce(function(acc,g){var d=acc[acc.length-1];if(d&&d.lieu===g.lieu){d.liv+=g.liv;d.rep+=g.rep;d.ch+=g.ch;}else acc.push(g);return acc;},[]);
      var vus={};arrets.forEach(function(g){if(g.bdl){nBdl++;g.cle=g.lieu+'#'+nBdl;}else{var k=nrm2(g.lieu);vus[k]=(vus[k]||0)+1;g.cle=g.lieu+(vus[k]>1?'#'+vus[k]:'');}});   // 2ᵉ passage chez un même client = ligne à part
      arrets.forEach(function(g,i){var x=C[g.cle]=C[g.cle]||{lieu:g.lieu,bdl:g.bdl,n:0,pos:0,t:0,liv:0,rep:0,ch:0};x.n++;x.pos+=i/Math.max(1,arrets.length-1);x.t+=g.t;x.liv+=g.liv;x.rep+=g.rep;x.ch+=g.ch;});
    });
    var hm2=function(m){m=Math.round(m);return p2(Math.floor(m/60))+':'+p2(m%60);};
    var moy=function(a){return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:null;};
    var quai={};ROLLS.forEach(function(r){if(r.etat==='pret'&&r.client)quai[nrm2(r.client)]=(quai[nrm2(r.client)]||0)+1;});
    var cl=Object.keys(C).sort(function(a,b){return C[a].t/C[a].n-C[b].t/C[b].n;});   // ordre = heure de passage moyenne
    var arr=function(v){var r=Math.round(v*2)/2;return r?String(r).replace('.',','):'0';};
    var num=0;
    h+='<div style="font-weight:700;margin-bottom:4px">🗺 Tournée du '+JOURS_S[w]+' — '+esc(ch)+'</div>'+
      '<div class="s" style="margin-bottom:8px">D\'après '+jours.length+' '+JOURS_S[w]+(jours.length>1?'s':'')+' : '+jours.map(function(k){return k.slice(8,10)+'/'+k.slice(5,7);}).join(', ')+(jours.length<3?' · <b style="color:var(--orange)">encore peu de données, plan approximatif</b>':'')+'</div>'+
      '<table><thead><tr><th>#</th><th>Où</th><th>Heure ≈</th><th>Déposer ≈</th><th>Reprendre ≈</th><th>Fréquence</th><th>Au quai maintenant</th></tr></thead><tbody>'+
      (nSoir?'<tr style="background:#f3e8fd"><td></td><td><b>🌙 Camion chargé la veille au soir</b> <span class="s">(il part de chez lui)</span></td><td>la veille '+hm2(moy(soirs))+'</td><td colspan="4" class="s">'+nSoir+' / '+jours.length+'</td></tr>':'')+
      cl.map(function(c){var x=C[c];
        if(x.bdl)return '<tr style="background:#eef0f2"><td></td><td><b>'+esc(x.lieu)+'</b>'+(x.ch?' <span class="s">('+arr(x.ch/x.n)+' chariot'+(x.ch/x.n>1?'s':'')+' chargé'+(x.ch/x.n>1?'s':'')+')</span>':'')+'</td><td>'+hm2(x.t/x.n)+'</td><td colspan="3"></td><td'+(x.n<jours.length?' style="color:var(--orange)"':'')+'>'+(x.n<jours.length?x.n+' / '+jours.length:'')+'</td></tr>';
        var qq=quai[nrm2(x.lieu)]||0;num++;
        return '<tr><td>'+num+'</td><td><b>'+esc(x.lieu)+'</b></td><td>'+hm2(x.t/x.n)+'</td><td>'+arr(x.liv/x.n)+'</td><td>'+arr(x.rep/x.n)+'</td><td'+(x.n<jours.length?' style="color:var(--orange)"':'')+'>'+x.n+' / '+jours.length+(x.n<jours.length?' (pas toujours)':'')+'</td><td>'+(qq?'<b>'+qq+' prêt'+(qq>1?'s':'')+'</b>':'<span class="s">—</span>')+'</td></tr>';}).join('')+
      '</tbody></table>'+
      '<div class="s" style="margin-top:6px">Ordre et heures = moyenne de ses tournées. Lignes grises = passages à la BdL. « Au quai maintenant » = chariots remplis qui attendent à la BdL pour ce client.</div>';
    box.innerHTML=h;brancher();
  }
  function brancher(){box.querySelectorAll('[data-pw]').forEach(function(b){b.onclick=function(){rendre(+b.dataset.pw);};});}
  rendre(wd);
}
function nrm2(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();}
async function demarrer(){$('login').style.display='none';route();}
$('lOk').onclick=async function(){var r=await sb.auth.signInWithPassword({email:$('lE').value.trim(),password:$('lP').value});if(r.error){$('lErr').textContent=r.error.message;return;}demarrer();};
(async function(){var s=await sb.auth.getSession();if(s.data&&s.data.session)demarrer();else $('login').style.display='block';})();
</script>

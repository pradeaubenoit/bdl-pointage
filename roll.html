<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Roll — BdL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bleu:#1f5fa8;--bleu2:#e8f0fa;--vert:#2e7d32;--vert2:#e6f4e7;--rouge:#c62828;--rouge2:#fdecec;--orange:#e67e00;--orange2:#fff3e0;--txt:#1d2329;--doux:#66717d;--ligne:#dde2e7}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#eef1f4;color:var(--txt);font-size:17px}
header{background:#1f2a35;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px}header button{background:transparent;border:1px solid #ffffff66;color:#fff;border-radius:8px;padding:6px 10px;font-size:14px}
main{padding:14px 16px;max-width:560px;margin:0 auto}
.carte{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px #0001}
.num{font-size:34px;font-weight:800;letter-spacing:1px}
.etat{display:inline-block;padding:4px 10px;border-radius:20px;font-weight:700;font-size:15px;margin-top:6px}
.e-bdl{background:#eef0f2;color:#555}.e-pret{background:var(--bleu2);color:var(--bleu)}.e-chauffeur{background:var(--orange2);color:var(--orange)}.e-client{background:var(--vert2);color:var(--vert)}.e-retour{background:#f3e8fd;color:#6b2fa3}.e-sale{background:#fdf2e3;color:#8a5a00}
.client{font-size:22px;font-weight:700;margin-top:8px}
.s{color:var(--doux);font-size:14px}
button.gros{display:block;width:100%;font-size:20px;font-weight:700;padding:18px;border-radius:14px;border:0;margin:10px 0;color:#fff;background:var(--bleu)}
button.gros.v{background:var(--vert)}button.gros.o{background:var(--orange)}button.gros.r{background:var(--rouge)}button.gros.g{background:#fff;color:var(--txt);border:2px solid var(--ligne)}
input,select{width:100%;font-size:18px;padding:12px;border:1px solid var(--ligne);border-radius:10px;margin:6px 0 10px}
label{font-weight:600;font-size:15px}
.liste{max-height:55vh;overflow:auto}.liste div{padding:14px 10px;border-bottom:1px solid var(--ligne);font-size:18px}
.ok{background:var(--vert2);border:2px solid var(--vert);color:var(--vert);text-align:center;font-size:22px;font-weight:800;padding:22px}
.alerte{background:var(--rouge2);border:2px solid var(--rouge);color:var(--rouge);font-weight:700;padding:14px;border-radius:12px;margin:10px 0}
.hist div{font-size:14px;padding:4px 0;border-bottom:1px dashed var(--ligne)}
#barre{position:fixed;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom));z-index:50;display:flex;gap:10px}
#barre button{margin:0;box-shadow:0 4px 14px #0004;background:#1f2a35}#barre #bNum{flex:0 0 22%;background:#fff;color:var(--txt);border:2px solid #1f2a35}#barre #bOu{flex:0 0 34%;background:var(--vert);font-size:17px;padding:18px 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#numFond{position:fixed;inset:0;background:#0009;z-index:100;display:none;align-items:flex-end;justify-content:center}
#numFond .boite{background:#fff;border-radius:18px 18px 0 0;padding:16px;width:100%;max-width:560px}
#numAff{font-size:40px;font-weight:800;text-align:center;letter-spacing:2px;min-height:52px}
.pave{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.pave button{font-size:28px;font-weight:700;padding:16px 0;border-radius:12px;border:1px solid var(--ligne);background:#f4f6f8}
main{padding-bottom:110px}
#scanFond{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column}
#lecteur{flex:1;width:100%}#lecteur video{object-fit:cover}
#scanFond .bar{padding:12px 16px;color:#fff;text-align:center;font-size:16px}
</style>
</head>
<body>
<header><b>🧺 Roll BdL</b><button id="moiBtn" onclick="changerMoi()"></button></header>
<main id="main"><div class="carte">Chargement…</div></main>
<div id="barre"><button class="gros" id="bOu" onclick="jeSuisChez()" style="display:none">📍 Où ?</button><button class="gros" id="bScan" onclick="ouvrirScanner()">📷 Scanner</button><button class="gros" id="bNum" onclick="ouvrirNumero()">⌨ N°</button></div>
<div id="numFond"><div class="boite"><div class="s" style="text-align:center">Numéro écrit sur le chariot</div><div id="numAff">R-</div><div class="pave" id="pave"></div><div style="display:flex;gap:10px;margin-top:10px"><button class="gros g" style="margin:0" onclick="fermerNumero()">Annuler</button><button class="gros v" style="margin:0" onclick="validerNumero()">Ouvrir</button></div></div></div>
<div id="scanFond"><div class="bar">Approchez le code-barres dans le cadre — dans n'importe quel sens</div><div id="lecteur"></div><div class="bar"><button class="gros g" style="margin:0" onclick="fermerScanner()">Annuler</button></div></div>
<script>
var SB_URL='https://wjaesphordfjzavnptpu.supabase.co', SB_KEY='sb_publishable_5mm_jnRkeRucn-VSNc6nhA_Htc6PBk8';
var LINGE_API='https://script.google.com/macros/s/AKfycbxxHYpmiuhfyoKgzPmAwDtuuyxNx-uOalpohNT7p6Zrl2BPFnOGd0P-Q7_iNHVSTQc/exec';
var sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false}});
var $=function(i){return document.getElementById(i);};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function lire(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function ecrire(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var ETATS={bdl:'Vide à la BdL',pret:'Rempli — prêt à partir',chauffeur:'Dans le camion',client:'Chez le client',retour:'Repris — en retour',sale:'Sale — déchargé à la BdL'};
var ROLES={chauffeur:'Chauffeur',atelier:'Atelier',laveur:'Laveur',bureau:'Bureau'};
var PRM=new URLSearchParams(location.search);
var numero=(PRM.get('r')||'').trim().toUpperCase();
// Arrêt chez un client : posé en scannant le QR du client (roll.html?c=Nom), gardé 4 h sur le téléphone
var ARRET=lire('roll_arret',null);
var NOUVEL_ARRET=false;
if(PRM.get('c')){var cNv=PRM.get('c').trim();NOUVEL_ARRET=!ARRET||ARRET.client!==cNv||Date.now()-ARRET.t>4*3600e3;ARRET={client:cNv,t:Date.now()};ecrire('roll_arret',ARRET);}
// Arrivée / départ enregistrés (heure réelle) ; gardés sur le téléphone si pas de réseau
function noterArret(etape,client){if(!MOI)return;var a={p_personne:MOI.id,p_code:MOI.code,p_client:client,p_etape:etape};if(ARRET&&ARRET.src==='liste')a.p_note='choisi dans la liste (sans QR)';
  sb.rpc('roll_arret',a).then(function(r){if(r&&r.error&&a.p_note){delete a.p_note;sb.rpc('roll_arret',a).catch(function(){});}}).catch(function(){});}
if(ARRET&&Date.now()-ARRET.t>4*3600e3){ARRET=null;try{localStorage.removeItem('roll_arret');}catch(e){}}
function nrm(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();}
var INFO=null, MOI=lire('roll_moi',null), CLIENTS=lire('roll_clients',[]);
function majMoi(){$('moiBtn').textContent=MOI?('👤 '+MOI.nom):'👤 Qui êtes-vous ?';var b=$('bOu');if(b){var ch=MOI&&String(MOI.role||'').split(',').some(function(x){return x==='chauffeur'||x==='bureau';});b.style.display=ch?'':'none';b.textContent=ARRET?'📍 '+ARRET.client:'📍 Où suis-je ?';}}
function fmtQ(q){var d=new Date(q);return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}
var LIB={vide:'vidé au tunnel',rempli:'rempli',charge:'chargé',livre:'livré',repris:'repris',rentre:'déchargé à la BdL (linge sale)'};

// Liste des clients : catalogue de BdL Linge (gardé sur le téléphone pour marcher sans réseau)
fetch(LINGE_API+'?action=catalogue').then(function(r){return r.json();}).then(function(d){
  if(d&&d.ok&&d.catalogue){CLIENTS=d.catalogue.map(function(c){return c.client;}).filter(Boolean).sort(function(a,b){return a.localeCompare(b,'fr');});ecrire('roll_clients',CLIENTS);}
}).catch(function(){});
// + clients sans saisie (hôpitaux…) créés au bureau
var EXTRA=lire('roll_clients_extra',[]);
function tousClients(){return Array.from(new Set(CLIENTS.concat(EXTRA))).sort(function(a,b){return a.localeCompare(b,'fr');});}
sb.rpc('roll_clients').then(function(r){if(!r.error&&Array.isArray(r.data)){EXTRA=r.data;ecrire('roll_clients_extra',EXTRA);}}).catch(function(){});

async function charger(){
  majMoi();
  if(!numero&&ARRET)return chargerArret();
  if(!numero){return demanderNumero();}
  $('main').innerHTML='<div class="carte">Chargement du roll '+esc(numero)+'…</div>';
  try{var r=await sb.rpc('roll_info',{p_numero:numero});if(r.error)throw r.error;INFO=r.data;}
  catch(e){$('main').innerHTML='<div class="carte alerte">Pas de réseau ou erreur : '+esc(e.message||e)+'</div><button class="gros g" onclick="charger()">Réessayer</button>';return;}
  if(!INFO.ok){$('main').innerHTML='<div class="carte alerte">'+esc(INFO.error)+'</div>';return demanderNumero(true);}
  // Postes mis à jour depuis le bureau : on les relit à chaque scan (et on redemande si la personne a été désactivée).
  if(MOI){var me=(INFO.personnes||[]).find(function(p){return p.id===MOI.id;});if(!me){MOI=null;try{localStorage.removeItem('roll_moi');}catch(e){}}else{MOI.role=me.role;MOI.nom=me.nom;ecrire('roll_moi',MOI);majMoi();}}
  if(!MOI)return choisirMoi();
  afficher();
}
/* ---------- Chez un client (QR du client) ---------- */
var ARR=null;
async function chargerArret(msg){
  $('main').innerHTML='<div class="carte">Chez '+esc(ARRET.client)+'…</div>';
  try{var r=await sb.rpc('roll_client',{p_client:ARRET.client});if(r.error)throw r.error;ARR=r.data;}
  catch(e){$('main').innerHTML='<div class="carte alerte">Pas de réseau ou erreur : '+esc(e.message||e)+'</div><button class="gros g" onclick="chargerArret()">Réessayer</button>';return;}
  if(!ARR.ok){$('main').innerHTML='<div class="carte alerte">'+esc(ARR.error)+'</div>';return;}
  INFO={personnes:ARR.personnes};
  if(MOI){var me=(ARR.personnes||[]).find(function(p){return p.id===MOI.id;});if(!me){MOI=null;try{localStorage.removeItem('roll_moi');}catch(e){}}else{MOI.role=me.role;MOI.nom=me.nom;ecrire('roll_moi',MOI);majMoi();}}
  if(!MOI)return choisirMoi(function(){chargerArret();});
  if(NOUVEL_ARRET&&aRole('chauffeur')){NOUVEL_ARRET=false;noterArret('arrivee',ARRET.client);}
  afficherArret(msg);
}
function afficherArret(msg){
  majMoi();
  var A=ARR,cam=A.a_decharger.filter(function(x){return x.etat==='chauffeur';}),quai=A.a_decharger.filter(function(x){return x.etat==='pret';});
  var fait=A.livres_auj.length,tot=fait+cam.length,h='';
  if(msg)h+='<div class="carte ok">'+msg+'</div>';
  h+='<div class="carte"><div class="s">📍 Vous êtes chez</div><div class="num" style="font-size:28px">'+esc(A.client)+'</div>'+
    '<div style="font-size:22px;font-weight:800;margin-top:10px;color:'+(cam.length?'var(--orange)':'var(--vert)')+'">'+(tot?'Déchargés : '+fait+' / '+tot:'Rien à décharger')+'</div>'+
    (cam.length?'<div style="margin-top:8px"><b>Encore dans le camion pour ce client :</b>'+cam.map(function(x){return '<div style="font-size:18px;padding:4px 0">🧺 '+esc(x.numero)+(x.note?' <span style="color:var(--bleu)">📦 '+esc(x.note)+'</span>':'')+'</div>';}).join('')+'</div>':'')+
    (quai.length?'<div class="alerte">⚠ '+quai.length+' chariot'+(quai.length>1?'s':'')+' prêt'+(quai.length>1?'s':'')+' pour ce client mais pas chargé'+(quai.length>1?'s':'')+' (resté'+(quai.length>1?'s':'')+' à la BdL) : '+quai.map(function(x){return esc(x.numero);}).join(', ')+'</div>':'')+
    '<div class="s" style="margin-top:10px">Chariots chez ce client : <b>'+A.chez.length+'</b>'+(A.chez.length?' ('+A.chez.map(function(x){return esc(x.numero);}).join(', ')+')':'')+'</div>'+
    '<div style="margin-top:12px;font-weight:600">➡ Scannez chaque chariot que vous déposez ou reprenez.</div></div>'+
    '<button class="gros g" onclick="chargerArret()">🔄 Actualiser</button><button class="gros r" id="fArr">🏁 Terminer ce client</button>';
  $('main').innerHTML=h;
  $('fArr').onclick=function(){
    if(cam.length&&!confirm('⚠ DÉCHARGEMENT INCOMPLET\n\nEncore dans le camion pour '+A.client+' : '+cam.map(function(x){return x.numero;}).join(', ')+'\n\nTerminer quand même ?'))return;
    noterArret('depart',A.client);ARRET=null;try{localStorage.removeItem('roll_arret');}catch(e){}majMoi();
    $('main').innerHTML='<div class="carte ok">✓ '+esc(A.client)+' terminé.<div class="s" style="margin-top:6px;color:var(--vert)">Au client suivant, scannez son QR code.</div></div>';
  };
}
function demanderNumero(garde){
  var h=(garde?$('main').innerHTML:'')+'<div class="carte"><label>Numéro du roll</label><input id="nNum" placeholder="ex. R-012" autocapitalize="characters"><button class="gros" onclick="var v=document.getElementById(\'nNum\').value.trim().toUpperCase();if(v){if(/^\\d+$/.test(v))v=\'R-\'+v.padStart(3,\'0\');location.search=\'?r=\'+encodeURIComponent(v);}">Ouvrir</button><div class="s">Le plus simple : scanner l\'étiquette du roll avec l\'appareil photo.</div></div>'+(MOI&&aRole('chauffeur')?'<button class="gros" onclick="jeSuisChez()">📍 Je suis chez un client…</button>':'');
  $('main').innerHTML=h;
}
function choisirMoi(suite){
  var ps=(INFO&&INFO.personnes)||[];
  $('main').innerHTML='<div class="carte"><b>Qui êtes-vous ?</b><div class="s">À faire une seule fois sur ce téléphone.</div><label style="display:block;margin-top:10px">Nom</label><select id="mP">'+ps.map(function(p){return '<option value="'+p.id+'">'+esc(p.nom)+' ('+esc(libRoles(p.role))+')</option>';}).join('')+'</select>'+
    '<label>Code à 4 chiffres</label><input id="mC" inputmode="numeric" maxlength="6" type="password"><button class="gros" id="mOk">Valider</button></div>';
  $('mOk').onclick=function(){var p=ps.find(function(x){return x.id===$('mP').value;}),c=$('mC').value.trim();if(!p||!c)return;MOI={id:p.id,nom:p.nom,role:p.role,code:c};ecrire('roll_moi',MOI);majMoi();if(suite)suite();else afficher();};
}
function changerMoi(){if(!INFO)return;if(MOI&&!confirm('Changer de personne sur ce téléphone ?'))return;MOI=null;try{localStorage.removeItem('roll_moi');}catch(e){}majMoi();choisirMoi();}

function afficher(msg){
  majMoi();
  var I=INFO,h='';
  if(ARRET&&aRole('chauffeur'))h+='<div class="carte" style="background:#1f2a35;color:#fff;padding:10px 16px">📍 Chez <b>'+esc(ARRET.client)+'</b> · <a href="?" style="color:#9cc3ff" onclick="location.search=\'\';return false">voir le déchargement</a></div>';
  if(msg)h+='<div class="carte ok">'+msg+'</div>';
  h+='<div class="carte"><div class="num">'+esc(I.numero)+'</div><span class="etat e-'+esc(I.etat)+'">'+esc(ETATS[I.etat]||I.etat)+'</span>'+
    (I.client?'<div class="client">'+esc(I.client)+'</div>':'')+(function(){var r=(I.derniers||[]).find(function(d){return d.etape==='rempli';});return r&&r.note&&I.etat!=='bdl'?'<div style="margin-top:6px;font-size:16px;color:var(--bleu);font-weight:600">📦 '+esc(r.note)+'</div>':'';})()+
    '<div class="s" style="margin-top:6px">Dernier scan : '+(I.personne?esc(I.personne)+' · ':'')+fmtQ(I.maj_le)+'</div></div>';
  h+='<div id="chg"></div><div id="acts"></div>';
  if(I.derniers&&I.derniers.length)h+='<div class="carte hist"><b>Derniers passages</b>'+I.derniers.map(function(d){return '<div>'+fmtQ(d.quand)+' · '+esc(LIB[d.etape]||d.etape)+(d.client?' · '+esc(d.client):'')+' · '+esc(d.personne||'')+(d.note?'<div style="color:var(--bleu);font-weight:600">📦 '+esc(d.note)+'</div>':'')+'</div>';}).join('')+'</div>';
  $('main').innerHTML=h;
  actions();
  if(MOI&&aRole('chauffeur')&&!ARRET&&I.client&&(I.etat==='pret'||I.etat==='chauffeur'))infoChargement(I.client).then(function(x){if($('chg'))$('chg').innerHTML=x;});
}
function bouton(txt,cls,fn){var b=document.createElement('button');b.className='gros '+(cls||'');b.textContent=txt;b.onclick=fn;$('acts').appendChild(b);}
// Une personne peut avoir plusieurs postes (ex. « atelier,laveur ») ; Bureau = tous les boutons.
function aRole(x){var l=String(MOI.role||'').split(',');return l.indexOf(x)>=0||l.indexOf('bureau')>=0;}
function libRoles(r){return String(r||'').split(',').map(function(x){return ROLES[x]||x;}).join(' + ');}
function actions(){
  var I=INFO;
  var rempliApres=aRole('chauffeur')&&I.etat==='pret';
  var bRempli=function(){bouton(I.etat==='pret'?'🧺 Changer le client (atelier)…':'🧺 Rempli pour un client…',I.etat==='pret'?'g':'',function(){choisirClient('Rempli pour quel client ?',function(c){scan('rempli',c);});});};
  if(aRole('atelier')&&!rempliApres)bRempli();
  if(aRole('chauffeur')&&ARRET){
    var pourAutre=I.client&&nrm(I.client)!==nrm(ARRET.client)&&(I.etat==='pret'||I.etat==='chauffeur');
    if(pourAutre){
      $('acts').insertAdjacentHTML('beforeend','<div class="alerte" style="font-size:20px;text-align:center">✗ STOP<br>Ce chariot est pour<br><span style="font-size:26px">« '+esc(I.client)+' »</span><br>Remettez-le dans le camion.</div>');
      if(navigator.vibrate)navigator.vibrate([300,150,300]);
      if(aRole('bureau'))bouton('Forcer : livré chez '+ARRET.client+' (bureau)','g',function(){if(confirm('Ce roll contient le linge de « '+I.client+' ». Le livrer quand même chez « '+ARRET.client+' » ?'))scan('livre',ARRET.client);});
    }else if(I.etat==='client'&&nrm(I.client)===nrm(ARRET.client)){
      bouton('↩ Reprendre ce chariot (vide)','o',function(){scan('repris',ARRET.client);});
    }else{
      bouton('✅ Déposer chez '+ARRET.client,'v',function(){scan('livre',ARRET.client);});
    }
    bouton('📍 Retour au déchargement de '+ARRET.client,'g',function(){location.search='';});
    bouton('Je ne suis plus chez ce client','g',function(){ARRET=null;try{localStorage.removeItem('roll_arret');}catch(e){}afficher();});
  }else if(aRole('chauffeur')){
    bouton('🚚 Chargé dans mon camion','o',function(){if(I.etat!=='pret'&&!confirm('Ce roll n\'est pas indiqué « rempli » ('+(ETATS[I.etat]||I.etat)+'). Le charger quand même ?'))return;scan('charge',null);});
    if(I.etat==='retour'||I.etat==='client')bouton('🏭 Déchargé à la BdL (linge sale)','o',function(){scan('rentre',null);});
    // Livrer / reprendre : d'abord dire OÙ il est (bouton 📍), ensuite scanner ses chariots
    $('acts').insertAdjacentHTML('beforeend','<div class="carte" style="text-align:center;font-size:17px">📍 Pour <b>livrer</b> ou <b>reprendre</b> :<br>indiquez d\'abord <b>chez quel client</b> vous êtes<br>(bouton <b>📍</b> en bas), puis scannez vos chariots.</div>');
    if(aRole('bureau')){
      bouton('Livré chez… (bureau, correction)','g',function(){choisirClient('Livré chez quel client ?',function(c){
        if(I.client&&nrm(c)!==nrm(I.client)&&!confirm('⚠ ATTENTION : ce roll contient le linge de « '+I.client+' ».\n\nVous allez le livrer chez « '+c+' ». Confirmer ?'))return;scan('livre',c);});});
      bouton('Repris chez… (bureau, correction)','g',function(){choisirClient('Repris chez quel client ?',function(c){scan('repris',c);});});
    }
  }
  if(aRole('atelier')&&rempliApres)bRempli();
  if(aRole('laveur'))bouton('🌀 Vidé au tunnel','v',function(){scan('vide',null);});
}
function choisirClient(titre,fn){
  var h='<div class="carte"><b>'+esc(titre)+'</b><input id="cQ" placeholder="Tapez quelques lettres…"><div class="liste" id="cL"></div><button class="gros g" onclick="afficher()">Annuler</button></div>';
  $('acts').innerHTML=h;
  function rendre(){var t=$('cQ').value.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
    var l=tousClients().filter(function(c){return c.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').indexOf(t)>=0;}).slice(0,80);
    $('cL').innerHTML=(l.length?l:[]).map(function(c,i){return '<div data-c="'+esc(c)+'">'+esc(c)+'</div>';}).join('')+(t&&!l.length?'<div data-c="'+esc($('cQ').value.trim())+'">➕ '+esc($('cQ').value.trim())+'</div>':'');}
  $('cQ').oninput=rendre;rendre();
  $('cL').onclick=async function(e){var d=e.target.closest('[data-c]');if(!d)return;var c=d.getAttribute('data-c');
    if(tousClients().some(function(x){return nrm(x)===nrm(c);}))return fn(c);
    if(!confirm('Créer le client « '+c+' » ?\n\nVérifiez qu\'il n\'existe pas déjà sous un autre nom.'))return;
    try{var r=await sb.rpc('roll_client_ajouter',{p_personne:MOI.id,p_code:MOI.code,p_nom:c});if(r.error||!r.data||!r.data.ok)throw new Error((r.data&&r.data.error)||(r.error&&r.error.message)||'refusé');
      c=r.data.nom;if(EXTRA.indexOf(c)<0){EXTRA.push(c);ecrire('roll_clients_extra',EXTRA);}}catch(x){alert('Création impossible : '+(x.message||x));return;}
    fn(c);};
}
// Étape déjà faite ? (deux personnes qui scannent le même chariot) : on prévient avant d'enregistrer
var ETAT_DE={vide:'bdl',rempli:'pret',charge:'chauffeur',livre:'client',repris:'retour',rentre:'sale'};
function hm(q){var d=new Date(q);return d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}
function dejaFait(etape,client){
  var I=INFO;if(!I||ETAT_DE[etape]!==I.etat)return true;
  var qui=(I.personne||'quelqu\'un')+' à '+hm(I.maj_le)+(new Date(I.maj_le).toDateString()!==new Date().toDateString()?' le '+new Date(I.maj_le).toLocaleDateString('fr-FR'):'');
  var moi=MOI&&I.personne===MOI.nom;
  if(etape==='rempli'&&client&&nrm(client)!==nrm(I.client))return confirm('⚠ Ce chariot est déjà marqué « rempli » pour « '+I.client+' » ('+qui+').\n\nLe changer pour « '+client+' » ?');
  if(etape==='livre'&&client&&nrm(client)!==nrm(I.client))return true;
  if(etape==='charge'&&!moi)return confirm('⚠ DÉJÀ FAIT : ce chariot est déjà chargé dans le camion de '+qui+'.\n\nLe passer dans votre camion ?');
  alert('✓ DÉJÀ FAIT : ce chariot est déjà « '+(LIB[etape]||etape)+' »'+(I.client&&etape!=='vide'?' ('+I.client+')':'')+' par '+qui+'.\n\nRien à faire.');
  return false;
}
async function scan(etape,client){
  if(!dejaFait(etape,client))return;
  $('acts').innerHTML='<div class="carte">Envoi…</div>';
  try{
    var r=await sb.rpc('roll_scan',{p_numero:INFO.numero,p_personne:MOI.id,p_code:MOI.code,p_etape:etape,p_client:client});
    if(r.error)throw r.error;
    if(!r.data.ok){if(/code/i.test(r.data.error)){alert('Code incorrect. Retapez votre code.');MOI=null;try{localStorage.removeItem('roll_moi');}catch(e){}majMoi();return choisirMoi();}throw new Error(r.data.error);}
    var i2=await sb.rpc('roll_info',{p_numero:INFO.numero});if(!i2.error&&i2.data&&i2.data.ok)INFO=i2.data;
    if(navigator.vibrate)navigator.vibrate(120);
    if(ARRET&&(etape==='livre'||etape==='repris')){numero='';history.replaceState(null,'',location.pathname);return chargerArret('✓ '+esc(INFO.numero)+' '+esc(LIB[etape])+'<div class="s" style="margin-top:6px;color:var(--vert)">Scannez le chariot suivant.</div>');}
    if(etape==='charge'){try{var cm=await sb.rpc('roll_camion',{p_personne:MOI.id,p_code:MOI.code});if(!cm.error&&cm.data&&cm.data.ok){var ic=INFO.client?await infoChargement(INFO.client,true):'';return afficher('✓ '+esc(INFO.numero)+' chargé'+ic+resumeCamion(cm.data));}}catch(x){}}
    afficher('✓ '+esc(INFO.numero)+' '+esc(LIB[etape]||etape)+(client?' · '+esc(client):'')+'<div class="s" style="margin-top:6px;color:var(--vert)">Scannez le roll suivant.</div>');
  }catch(e){$('acts').innerHTML='<div class="carte alerte">Non enregistré : '+esc(e.message||e)+'</div>';var b=document.createElement('button');b.className='gros';b.textContent='Réessayer';b.onclick=function(){scan(etape,client);};$('acts').appendChild(b);}
}
// Chargement d'un client : « Hôpital du Mont : 3 / 8 chargés » … « 8 / 8 — chargement complet »
async function infoChargement(client,apres){
  try{var r=await sb.rpc('roll_client',{p_client:client});if(r.error||!r.data||!r.data.ok)return '';
    var L=r.data.a_decharger,ch=L.filter(function(x){return x.etat==='chauffeur';}),re=L.filter(function(x){return x.etat==='pret';});
    var tot=ch.length+re.length;if(!tot)return '';
    if(!re.length)return '<div style="margin-top:10px;font-size:22px;font-weight:800;color:var(--vert);text-align:center">✓ '+esc(client)+' : '+ch.length+' / '+tot+'<br>CHARGEMENT COMPLET</div>';
    return '<div style="margin-top:10px;font-size:20px;font-weight:800;color:var(--orange);text-align:'+(apres?'center':'left')+'">'+(apres?'':'<div class="carte" style="margin:0">')+'🚚 '+esc(client)+' : '+ch.length+' / '+tot+' chargé'+(ch.length>1?'s':'')+
      '<div style="font-size:15px;font-weight:600;color:var(--txt)">Reste à charger : '+re.map(function(x){return esc(x.numero);}).join(', ')+'</div>'+(apres?'':'</div>')+'</div>';
  }catch(e){return '';}
}
function resumeCamion(d){
  var g={};d.camion.forEach(function(x){var c=x.client||'sans client';g[c]=(g[c]||0)+1;});
  var q={};d.a_quai.forEach(function(x){var c=x.client||'?';(q[c]=q[c]||[]).push(x.numero);});
  return '<div style="font-size:16px;color:var(--txt);font-weight:600;margin-top:10px;text-align:left">🚚 Mon camion : '+d.camion.length+' chariot'+(d.camion.length>1?'s':'')+'<br>'+Object.keys(g).sort().map(function(c){return esc(c)+' : '+g[c];}).join(' · ')+'</div>'+
    (d.a_quai.length?'<div style="font-size:15px;color:var(--rouge);font-weight:700;margin-top:8px;text-align:left">⚠ Prêts, pas encore chargés : '+Object.keys(q).sort().map(function(c){return esc(c)+' ('+q[c].join(', ')+')';}).join(' · ')+'</div>':'');
}
/* ---------- Scanner dans l'appli : codes-barres (tubes) et QR codes ---------- */
var LECTEUR=null;
/* Lecteur maison (ZXing) : lit les codes-barres dans les DEUX sens (collés dans la longueur d'un tube) + les QR */
var ZX=null,FLUX=null,BOUCLE=null;
function chargerScript(srcs){return new Promise(function(ok,ko){(function essai(i){if(i>=srcs.length)return ko(new Error('Lecteur indisponible (réseau)'));var sc=document.createElement('script');sc.src=srcs[i];sc.onload=ok;sc.onerror=function(){essai(i+1);};document.head.appendChild(sc);})(0);});}
async function ouvrirScanner(){
  $('scanFond').style.display='flex';
  try{
    if(!window.ZXing)await chargerScript(['https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js','https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js']);
    if(!ZX){ZX=new ZXing.MultiFormatReader();var h=new Map();h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.QR_CODE]);h.set(ZXing.DecodeHintType.TRY_HARDER,true);ZX.setHints(h);}
    FLUX=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});
    var v=document.createElement('video');v.setAttribute('playsinline','');v.muted=true;v.autoplay=true;v.srcObject=FLUX;v.style.cssText='width:100%;height:100%;object-fit:cover';
    $('lecteur').innerHTML='';$('lecteur').appendChild(v);
    $('lecteur').insertAdjacentHTML('beforeend','<div style="position:absolute;left:12%;right:12%;top:22%;bottom:22%;border:3px solid #fff8;border-radius:14px;pointer-events:none"></div>');
    $('lecteur').style.position='relative';
    await v.play();
    var c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true}),tour=0;
    BOUCLE=setInterval(function(){
      if(!v.videoWidth)return;
      // zone centrale de l'image, réduite à ~900 px (rapide), une fois droite, une fois tournée d'un quart de tour
      // 4 essais en alternance : image droite / tournée d'un quart de tour, zone large / zone centrale agrandie (petits codes)
      var m=tour++%4,rot=m%2===1,zoom=m>=2;
      var W=v.videoWidth,H=v.videoHeight,cw=W*(zoom?0.45:0.8),ch=H*(zoom?0.5:0.7),sx=(W-cw)/2,sy=(H-ch)/2,k=Math.min(zoom?2:1,900/Math.max(cw,ch));
      c.width=Math.round((rot?ch:cw)*k);c.height=Math.round((rot?cw:ch)*k);
      x.save();if(rot){x.translate(c.width,0);x.rotate(Math.PI/2);}
      x.drawImage(v,sx,sy,cw,ch,0,0,Math.round(cw*k),Math.round(ch*k));x.restore();
      try{var src=new ZXing.HTMLCanvasElementLuminanceSource(c),bm=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src));
        var r=ZX.decodeWithState(bm);if(r&&r.getText()){var t=r.getText();if(navigator.vibrate)navigator.vibrate(80);fermerScanner().then(function(){traiterCode(t);});}
      }catch(e){}
    },120);
  }catch(e){fermerScanner();alert('Caméra impossible : '+(e.message||e)+'\n\nAutorisez la caméra pour ce site dans Safari (aA → Réglages du site web).');}
}
async function fermerScanner(){$('scanFond').style.display='none';if(BOUCLE){clearInterval(BOUCLE);BOUCLE=null;}if(FLUX){FLUX.getTracks().forEach(function(t){t.stop();});FLUX=null;}$('lecteur').innerHTML='';}
/* ---------- Saisie du numéro au clavier (étiquette illisible, pas de caméra…) ---------- */
var NUMS='';
function ouvrirNumero(){NUMS='';majNum();$('numFond').style.display='flex';
  $('pave').innerHTML=['1','2','3','4','5','6','7','8','9','⌫','0','C'].map(function(k){return '<button data-k="'+k+'">'+k+'</button>';}).join('');
  $('pave').onclick=function(e){var b=e.target.closest('[data-k]');if(!b)return;var k=b.dataset.k;if(k==='⌫')NUMS=NUMS.slice(0,-1);else if(k==='C')NUMS='';else if(NUMS.length<4)NUMS+=k;majNum();};}
function majNum(){$('numAff').textContent='R-'+(NUMS?NUMS.padStart(3,'0'):'');}
function fermerNumero(){$('numFond').style.display='none';}
function validerNumero(){if(!NUMS)return;fermerNumero();traiterCode('R-'+NUMS);}
/* ---------- « Je suis chez… » : le chauffeur choisit le client (QR absent ou abîmé) ---------- */
async function jeSuisChez(suite){
  var cam=[];try{var r=await sb.rpc('roll_camion',{p_personne:MOI.id,p_code:MOI.code});if(!r.error&&r.data&&r.data.ok)cam=r.data.camion;}catch(e){}
  var g={};cam.forEach(function(x){if(x.client)g[x.client]=(g[x.client]||0)+1;});
  var dans=Object.keys(g).sort(function(a,b){return a.localeCompare(b,'fr');});
  var z=$('acts')||$('main');
  z.innerHTML='<div class="carte"><b>📍 Chez quel client êtes-vous ?</b><div class="s">Si le QR du client est là, scannez-le plutôt (📷) : c\'est la preuve que vous êtes sur place.</div>'+
    (dans.length?'<div style="margin-top:10px;font-weight:700">Dans votre camion :</div><div class="liste" id="jsC">'+dans.map(function(c){return '<div data-c="'+esc(c)+'">🚚 '+esc(c)+' <span class="s">('+g[c]+' chariot'+(g[c]>1?'s':'')+')</span></div>';}).join('')+'</div>':'')+
    '<div style="margin-top:10px;font-weight:700">Tous les clients :</div><input id="jsQ" placeholder="Tapez quelques lettres…"><div class="liste" id="jsL"></div><button class="gros g" onclick="afficherOuAccueil()">Annuler</button></div>';
  function choisir(c){var nv=!ARRET||nrm(ARRET.client)!==nrm(c);ARRET={client:c,t:Date.now(),src:'liste'};ecrire('roll_arret',ARRET);
    if(suite){if(nv)noterArret('arrivee',c);NOUVEL_ARRET=false;return suite(c);}
    NOUVEL_ARRET=true;numero='';history.replaceState(null,'','?');chargerArret();}
  function rendre(){var t=nrm($('jsQ').value);$('jsL').innerHTML=tousClients().filter(function(c){return !t||nrm(c).indexOf(t)>=0;}).slice(0,80).map(function(c){return '<div data-c="'+esc(c)+'">'+esc(c)+'</div>';}).join('');}
  $('jsQ').oninput=rendre;rendre();
  z.onclick=function(e){var d=e.target.closest('[data-c]');if(d)choisir(d.getAttribute('data-c'));};
}
function afficherOuAccueil(){if(INFO&&INFO.numero)afficher();else demanderNumero();}
function traiterCode(t){
  t=String(t||'').trim();
  var mc=t.match(/[?&]c=([^&#]+)/),mr=t.match(/[?&]r=([^&#]+)/),nu=t.match(/^R-?(\d{1,4})$/i);
  if(mc){var c=decodeURIComponent(mc[1].replace(/\+/g,' ')).trim();NOUVEL_ARRET=!ARRET||ARRET.client!==c||Date.now()-ARRET.t>4*3600e3;ARRET={client:c,t:Date.now()};ecrire('roll_arret',ARRET);
    numero='';history.replaceState(null,'','?c='+encodeURIComponent(c));return charger();}
  var n=mr?decodeURIComponent(mr[1]).trim().toUpperCase():(nu?'R-'+nu[1].padStart(3,'0'):'');
  if(!n){alert('Code non reconnu : '+t);return;}
  numero=n;history.replaceState(null,'','?r='+encodeURIComponent(n));charger();
}
charger();
